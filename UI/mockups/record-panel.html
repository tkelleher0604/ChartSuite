<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rboreal Record Panel</title>
<script>
  // Apply a chosen theme before first paint; "system" leaves it to the OS setting.
  try {
    const theme = JSON.parse(localStorage.getItem('rboreal.record-panel.prefs'))?.theme;
    if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
  } catch {}
</script>
<link rel="stylesheet" href="app/base.css">
<link rel="stylesheet" href="app/panel.css">
<style>
  .page { max-width: 760px; margin: 0 auto; padding: 24px 20px 48px; }
  .topbar { display: flex; align-items: center; gap: 8px; margin: 0 0 14px 2px; }
  .brand { font-size: 14px; font-weight: 650; letter-spacing: -.01em; }
  .brand-sub { color: var(--text-3); font-size: 13px; font-weight: 500; }
  .brand-link { margin-left: 10px; color: var(--accent); font-size: 13px; font-weight: 500; }
  .brand-link:hover { text-decoration: underline; text-underline-offset: 3px; }
  .prefs { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 6px 14px; margin-left: auto; font-size: 12px; color: var(--text-3); }
  .panel { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow-panel); }
  .foot { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 18px; margin-top: 12px; padding: 0 4px; font-size: 12.5px; color: var(--text-3); }
  .foot-hint { margin-left: auto; }
  .foot-hint.is-error { color: var(--danger); }
  @media (max-width: 600px) {
    .page { padding: 16px 12px 32px; }
  }
</style>
</head>
<body>
<div class="page">
  <header class="topbar">
    <span class="brand">Rboreal</span><span class="brand-sub">Record panel</span>
    <a class="brand-link" href="chart.html">Chart</a>
    <span class="prefs" id="prefs"></span>
  </header>
  <main class="panel" id="panel"></main>
  <div class="foot" id="foot"></div>
</div>

<script src="app/common.js"></script>
<script src="app/model.js"></script>
<script src="app/formulas.js"></script>
<script src="app/styles.js"></script>
<script src="app/panel.js"></script>
<script src="app/relate.js"></script>
<script>
function render() {
  renderPanel();
  document.getElementById('prefs').innerHTML = themeSwitch();
  document.getElementById('foot').innerHTML =
    `<button class="link-btn" data-action="undo"${undoStack.length ? '' : ' disabled'}>Undo <kbd>${undoKey}</kbd></button>
     <button class="link-btn" data-action="redo"${redoStack.length ? '' : ' disabled'}>Redo <kbd>${redoKey}</kbd></button>
     <button class="link-btn" data-action="reset">Reset sample data</button>
     ${ui.fullPaths ? '<button class="link-btn" data-action="full-paths">Shorten paths</button>' : ''}
     <span class="foot-hint${ui.notice ? ' is-error' : ''}">${esc(ui.notice ?? ui.info ?? `${currentView().id ? 'Drag a row’s handle to reorder it. ' : ''}Changes are saved in this browser.`)}</span>`;
  restoreFocus();
}

initState();
applyTheme();
render();
</script>
</body>
</html>

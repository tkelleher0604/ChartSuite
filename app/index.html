<script>
  // Before first paint: the theme, chosen or the system's; and the launch cover, once a tab, when Dendra is
  // opened in a new tab or window that's in front (not on a reload, a return, or a background tab).
  (() => {
    const root = document.documentElement;
    let theme = null;
    try { theme = localStorage.getItem('dendra.theme'); } catch {}
    root.dataset.theme = theme === 'light' || theme === 'dark' ? theme : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    try {
      const nav = performance.getEntriesByType('navigation')[0];
      const fresh = sessionStorage.getItem('dendra.launched') !== '1' && (!nav || nav.type === 'navigate') && document.visibilityState === 'visible';
      sessionStorage.setItem('dendra.launched', '1');
      if (fresh) root.dataset.splash = '';
    } catch {}
  })();
</script>

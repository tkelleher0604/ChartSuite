<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Demo library</title>
<script src="ui/prepaint.js"></script>
<link rel="stylesheet" href="css/base.css">
<style>
  /* The demo library's stand-in for SharePoint's file viewer: what a link to one of the demo's files opens
     (SharePoint.openUrl), at demo-file.html#<the file's link>. It isn't one of the app's pages, so it has no
     sidebar: it's the file, as SharePoint would show it. Tokens only. */
  body { display: flex; flex-direction: column; min-height: 100vh; }
  .df-bar { position: sticky; top: 0; z-index: 1; display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 8px 24px; border-bottom: 1px solid var(--border); background: var(--surface); }
  .df-glyph { display: grid; flex: none; place-items: center; width: 32px; height: 32px; border-radius: var(--radius-sm); background: var(--bg); color: var(--text-2); }
  .df-glyph svg { width: 22px; height: 22px; }
  .df-names { flex: 1; min-width: 0; }
  .df-name { overflow: hidden; font-size: 14px; font-weight: 600; text-overflow: ellipsis; white-space: nowrap; }
  .df-where { overflow: hidden; color: var(--text-3); font-size: 12px; text-overflow: ellipsis; white-space: nowrap; }
  .df-demo { flex: none; display: inline-flex; align-items: center; gap: 6px; color: var(--text-2); font-size: 12px; font-weight: 500; }
  .df-demo::before { content: ""; width: 6px; height: 6px; border-radius: 50%; box-shadow: inset 0 0 0 1.5px var(--text-3); }
  .df-main { display: flex; flex: 1; flex-direction: column; align-items: center; padding: 32px 24px 48px; }
  /* The file itself, where it was uploaded: filling the page under the bar. */
  .df-frame { flex: 1; width: 100%; min-height: 70vh; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); }
  .df-image { max-width: 100%; border: 1px solid var(--border); background: var(--surface); }
  .df-text { width: min(100%, 860px); margin: 0; padding: 32px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); font: 13px/20px ui-monospace, Consolas, monospace; white-space: pre-wrap; }
  /* A file the demo has only the details of: a sheet with what the library says about it. */
  .df-sheet { width: min(100%, 680px); padding: 48px 56px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); box-shadow: var(--shadow-panel); }
  .df-type { color: var(--text-3); font-size: 13px; font-weight: 500; }
  .df-title { margin: 6px 0 4px; font-size: 24px; font-weight: 600; line-height: 32px; letter-spacing: -.01em; }
  .df-entity { color: var(--text-2); font-size: 14px; }
  .df-props { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 10px 16px; margin: 32px 0 0; padding-top: 24px; border-top: 1px solid var(--border); font-size: 13px; }
  .df-props dt { color: var(--text-3); }
  .df-props dd { margin: 0; overflow-wrap: anywhere; }
  .tnum { font-variant-numeric: tabular-nums; }
  .df-note { margin: 28px 0 0; color: var(--text-3); font-size: 13px; }
  .df-empty { margin: auto; color: var(--text-2); text-align: center; }
  .df-empty p { margin: 6px 0 16px; color: var(--text-3); }
  @media (max-width: 640px) { .df-sheet { padding: 32px 24px; } .df-props { grid-template-columns: minmax(0, 1fr); gap: 2px; } .df-props dd { margin-bottom: 8px; } }
</style>
</head>
<body>
<header class="df-bar" id="bar"></header>
<main class="df-main" id="main"></main>
<script src="core/common.js"></script>
<script src="core/sharepoint.js"></script>
<script src="core/documents.js"></script>
<script>
(async () => {
  const demo = SharePoint.connector.demo;
  const link = readHash();
  const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  const day = iso => { const [y, m, d] = String(iso).slice(0, 10).split('-').map(Number); return y && m && d ? `${MONTHS[m - 1]} ${d}, ${y}` : ''; };
  const size = n => !n ? '' : n < 1024 ? `${n} B` : n < 1048576 ? `${Math.round(n / 1024)} KB` : `${(n / 1048576).toFixed(1)} MB`;
  const bar = document.getElementById('bar'), main = document.getElementById('main');

  let item = null;
  try { item = await demo.resolveShareUrl(link); } catch {}
  if (!item || item.isFolder) {
    bar.innerHTML = '<div class="df-names"><div class="df-name">Demo library</div></div><span class="df-demo">Contoso › Fund Legal</span>';
    main.innerHTML = `<div class="df-empty"><strong>This file isn’t in the demo library</strong><p>The link may lead somewhere else, or the demo library may have been cleared since.</p><a class="btn" href="documents.html">Go to Documents</a></div>`;
    return;
  }
  document.title = `${item.name} · Demo library`;
  const where = ['Documents', ...item.path.split('/').filter(Boolean)].join(' › ');
  // An uploaded file's content, where this browser kept it; waited for a few seconds at most.
  const blob = item.uploaded ? await Promise.race([demo.fileContent(item.id), new Promise(r => setTimeout(() => r(null), 3000))]) : null;
  const url = blob && URL.createObjectURL(blob);
  bar.innerHTML = `<span class="df-glyph" title="${esc(SharePoint.docIcon(item.kind).title)}">${SharePoint.docIcon(item.kind).svg}</span>
    <div class="df-names"><div class="df-name">${esc(item.name)}</div><div class="df-where">Contoso › Fund Legal › ${esc(where)}</div></div>
    <span class="df-demo">Demo library</span>${url ? `<a class="btn" href="${url}" download="${esc(item.name)}">Download</a>` : ''}`;

  // An uploaded file is shown as it is, where the browser can show it.
  const type = blob?.type || item.contentType || '';
  if (url && (type === 'application/pdf' || item.kind === 'pdf')) main.innerHTML = `<iframe class="df-frame" src="${url}" title="${esc(item.name)}"></iframe>`;
  else if (url && type.startsWith('image/')) main.innerHTML = `<img class="df-image" src="${url}" alt="${esc(item.name)}">`;
  else if (url && type.startsWith('text/')) main.innerHTML = `<pre class="df-text">${esc(await blob.text())}</pre>`;
  else {
    // Otherwise, what the library says about it, as a sheet.
    const f = item.fields ?? {};
    const prop = (label, value) => value ? `<dt>${esc(label)}</dt><dd>${value}</dd>` : '';
    const title = Documents.titleOf(item.name);
    const note = url ? 'This kind of file can’t be shown in the browser. Download it to open it.'
      : item.uploaded ? 'This file was uploaded to the demo library, but this browser didn’t keep its content, only its details.'
      : 'The demo library has each file’s details, not the file itself. Connected to your SharePoint, a document opens there.';
    main.innerHTML = `<article class="df-sheet">
      ${f.DocumentType ? `<div class="df-type">${esc(f.DocumentType)}</div>` : ''}
      <h1 class="df-title">${esc(title)}</h1>
      ${f.Entity ? `<div class="df-entity">${esc(f.Entity)}${f.EffectiveDate ? ` · <span class="tnum">${esc(day(f.EffectiveDate))}</span>` : ''}</div>` : ''}
      <dl class="df-props">
        ${prop('Folder', esc(where))}
        ${prop('File', esc(item.name))}
        ${prop('Version', item.version ? `<span class="tnum">${esc(item.version)}</span>` : '')}
        ${prop('Modified', item.lastModified ? `<span class="tnum">${esc(day(item.lastModified))}</span>${item.lastModifiedBy ? ` by ${esc(item.lastModifiedBy)}` : ''}` : '')}
        ${prop('Size', size(item.size) ? `<span class="tnum">${size(item.size)}</span>` : '')}
      </dl>
      <p class="df-note">${esc(note)}</p></article>`;
  }
})();
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SharePoint test</title>
<style>
  body { margin: 24px; font: 13px/1.5 ui-monospace, Consolas, monospace; background: #fff; color: #18181b; }
  .fail { color: #c0352b; font-weight: 600; }
</style>
<script>
  // Every error on the page counts against it, a clash between globals included.
  window.pageErrors = [];
  window.addEventListener('error', e => window.pageErrors.push(e.message));
  // A clean slate: the test's settings and demo saves shouldn't carry over from an earlier run.
  try { localStorage.removeItem('rboreal.sharepoint.config'); localStorage.removeItem('rboreal.sharepoint.demo'); } catch {}
</script>
</head>
<body>
<pre id="out">Running…</pre>
<!-- The app's scripts load first, as they will in the app, so a clash between globals shows. -->
<script src="../../vendor/msal/msal-browser.min.js"></script>
<script src="../core/common.js"></script>
<script src="../core/model.js"></script>
<script src="../core/sample.js"></script>
<script src="../core/formulas.js"></script>
<script src="../core/styles.js"></script>
<script src="../core/sharepoint.js"></script>
<script>
const out = [];
const check = (name, ok, detail = '') => out.push({ name, ok: !!ok, detail: typeof detail === 'string' ? detail : JSON.stringify(detail) });
const rejects = async (promise, type) => { try { await promise; return null; } catch (e) { return e instanceof type ? e : null; } };

// ---- parseDocUrl ----

const SP = 'https://contoso.sharepoint.com';
const URLS = [
  ['a modern link that spells out the path', `${SP}/:w:/r/sites/FundLegal/Shared%20Documents/Calder%20Ridge%20Fund%20III/Board%20Consents/Blocker%20Board%20Resolutions%20-%20Halvard%20Acquisition.docx?d=w1234&csf=1&web=1`,
    { isSharePoint: true, system: 'sharepoint', site: 'FundLegal', library: 'Shared Documents', folderPath: 'Calder Ridge Fund III/Board Consents', fileName: 'Blocker Board Resolutions - Halvard Acquisition.docx', kind: 'word', isSharingLink: false }],
  ['a sharing link to a PDF', `${SP}/:b:/s/FundLegal/EaBcD123xyz?e=AbC12`, { isSharePoint: true, site: 'FundLegal', fileName: null, kind: 'pdf', isSharingLink: true }],
  ['a sharing link to a folder', `${SP}/:f:/s/FundLegal/Ek9QxYz?e=1`, { isSharingLink: true, kind: 'folder', site: 'FundLegal' }],
  ['Word Online’s Doc.aspx', `${SP}/:x:/r/sites/FundLegal/_layouts/15/Doc.aspx?sourcedoc=%7B1234%7D&file=Close%20and%20Remote%20Affiliate%20Analysis.xlsx&action=default`,
    { site: 'FundLegal', library: null, fileName: 'Close and Remote Affiliate Analysis.xlsx', kind: 'excel', extension: 'xlsx' }],
  ['a direct path to a PDF', `${SP}/sites/FundLegal/Shared%20Documents/Calder%20Ridge%20Capital%20BDC/Regulatory/Form%20N-54A.pdf`,
    { site: 'FundLegal', library: 'Shared Documents', folderPath: 'Calder Ridge Capital BDC/Regulatory', fileName: 'Form N-54A.pdf', kind: 'pdf' }],
  ['a team site', `${SP}/teams/Deals/Documents/Project%20Halvard/SPA.docx`, { site: 'Deals', library: 'Documents', folderPath: 'Project Halvard', fileName: 'SPA.docx', kind: 'word' }],
  ['a library view of a folder', `${SP}/sites/FundLegal/Shared%20Documents/Forms/AllItems.aspx?id=%2Fsites%2FFundLegal%2FShared%20Documents%2FCalder%20Ridge%20Fund%20III%2FTax&viewid=abc`,
    { site: 'FundLegal', library: 'Shared Documents', folderPath: 'Calder Ridge Fund III/Tax', fileName: null, kind: 'folder' }],
  ['a library view of a file', `${SP}/sites/FundLegal/Shared%20Documents/Forms/AllItems.aspx?id=%2Fsites%2FFundLegal%2FShared%20Documents%2FSide%20Letters%2FMFN%20Election.docx&parent=%2Fsites`,
    { folderPath: 'Side Letters', fileName: 'MFN Election.docx', kind: 'word' }],
  ['a library’s root view', `${SP}/sites/FundLegal/Shared%20Documents/Forms/AllItems.aspx`, { library: 'Shared Documents', folderPath: '', fileName: null, kind: 'folder' }],
  ['the root site’s library', `${SP}/Shared%20Documents/Policies/Code%20of%20Ethics.pdf`, { site: null, library: 'Shared Documents', folderPath: 'Policies', fileName: 'Code of Ethics.pdf', kind: 'pdf' }],
  ['OneDrive for Business', 'https://contoso-my.sharepoint.com/personal/mchen_contoso_com/Documents/Drafts/Consent%20v3.docx',
    { system: 'onedrive', isSharePoint: true, site: 'mchen_contoso_com', library: 'Documents', folderPath: 'Drafts', kind: 'word' }],
  ['a OneDrive sharing link', 'https://contoso-my.sharepoint.com/:p:/g/personal/dokafor_contoso_com/EQxYz?e=1', { system: 'onedrive', kind: 'powerpoint', isSharingLink: true, site: 'dokafor_contoso_com' }],
  ['an email kept in a library', `${SP}/sites/FundLegal/Shared%20Documents/Correspondence/Officer%20Appointment.msg`, { kind: 'email', fileName: 'Officer Appointment.msg' }],
  ['an upper-case extension', `${SP}/sites/FundLegal/Shared%20Documents/Minutes.DOCX`, { kind: 'word', extension: 'docx' }],
  ['an EDGAR filing', 'https://www.sec.gov/Archives/edgar/data/1987654/000198765425000003/form-d.pdf', { isSharePoint: false, system: 'web', fileName: 'form-d.pdf', kind: 'pdf', site: null }],
  ['an EDGAR search page', 'https://www.sec.gov/cgi-bin/browse-edgar?action=getcompany&CIK=0001987654', { isSharePoint: false, fileName: null, kind: 'other' }],
  ['NetDocuments', 'https://vault.netvoyage.com/neWeb2/goid.aspx?id=4810-1234-5678', { system: 'netdocuments', isSharePoint: false, fileName: null, kind: 'other' }],
  ['iManage', 'iwl:dms=cloudimanage.com&&lib=Active&&num=1234567&&ver=2', { system: 'imanage', valid: true, isSharePoint: false }],
  ['a file share', '\\\\fileserver\\Legal\\Fund III\\LPA.pdf', { system: 'file', host: 'fileserver', folderPath: 'Legal/Fund III', fileName: 'LPA.pdf', kind: 'pdf' }],
  ['on-premises SharePoint', 'https://sp.lawfirm.local/sites/Funds/_layouts/15/Doc.aspx?sourcedoc={x}&file=Opinion.docx', { isSharePoint: true, host: 'sp.lawfirm.local', site: 'Funds', fileName: 'Opinion.docx', kind: 'word' }],
  ['not a URL', 'not a url', { valid: false, kind: 'other' }],
];
for (const [what, url, want] of URLS) {
  const got = SharePoint.parseDocUrl(url);
  const wrong = Object.entries(want).filter(([k, v]) => got[k] !== v);
  check(`parseDocUrl: ${what}`, !wrong.length, wrong.map(([k, v]) => `${k}: ${JSON.stringify(got[k])}, wanted ${JSON.stringify(v)}`).join('; '));
}

// ---- docIcon ----

for (const kind of ['word', 'pdf', 'excel', 'powerpoint', 'email', 'folder', 'other']) {
  const i = SharePoint.docIcon(kind);
  check(`docIcon: ${kind}`, i.svg.startsWith('<svg') && i.svg.includes('currentColor') && i.kind === kind && i.title, i);
}
check('docIcon: an unknown kind is a plain file', SharePoint.docIcon('nonsense').kind === 'other');

async function run() {
  const c = SharePoint.connector;

  // ---- Settings ----
  check('Settings: demo until configured', c.mode() === 'demo');
  c.configure({ mode: 'live' });
  check('Settings: still demo when live is chosen but nothing is configured', c.mode() === 'demo');
  c.configure({ mode: 'live', tenantId: 'tenant-1', clientId: 'client-1', siteUrl: 'https://contoso.sharepoint.com/sites/FundLegal', library: 'Documents' });
  check('Settings: live once tenant, app and site are given', c.mode() === 'live');
  check('Settings: kept in the browser under their own key', JSON.parse(localStorage.getItem('rboreal.sharepoint.config')).clientId === 'client-1');
  c.configure({ mode: 'demo' });
  check('Settings: back to demo on request', c.mode() === 'demo' && c.config().tenantId === 'tenant-1');
  check('Settings: a workbook’s path in the library', c.workbookPath('Calder Ridge Fund III: structure') === 'Rboreal/Calder Ridge Fund III- structure.rboreal.json', c.workbookPath('Calder Ridge Fund III: structure'));

  // ---- Demo: browsing and reading ----
  await c.signIn();
  check('Demo: signed in', await c.isSignedIn());
  check('Demo: who is signed in', (await c.whoAmI()).email === 'demo.user@contoso.com');
  const drives = await c.listDrives(SharePoint.DEMO.site);
  check('Demo: the site’s one library', drives.length === 1 && drives[0].name === 'Documents' && drives[0].webUrl === SharePoint.DEMO.library, drives);
  const top = await c.listChildren(drives[0].id);
  check('Demo: the library’s top folders', top.map(x => x.name).join('|') === 'Calder Ridge Capital BDC|Calder Ridge Capital Management|Calder Ridge Fund III|Calder Ridge Fund III AIV-1|Calder Ridge Fund III-A|Calder Ridge III Co-Invest|Rboreal'
    && top.every(x => x.isFolder), top.map(x => x.name));
  const fund = await c.listChildren(drives[0].id, top.find(x => x.name === 'Calder Ridge Fund III').id);
  check('Demo: a fund’s folders', fund.map(x => x.name).join('|') === 'Board Consents|Governing Documents|Regulatory|Side Letters|Tax', fund.map(x => x.name));
  const letters = await c.listChildren(drives[0].id, fund.find(x => x.name === 'Side Letters').id);
  check('Demo: documents in a folder, with their metadata', letters.length === 3 && letters.every(x => !x.isFolder && x.size > 0 && x.lastModifiedBy && x.version && x.fields.DocumentType), letters);
  const docs = c.demo.documents();
  check('Demo: 50 documents in all', docs.length === 50, docs.length);
  check('Demo: every document’s link reads back as its place in the library', docs.every(d => {
    const p = SharePoint.parseDocUrl(d.webUrl);
    return p.isSharePoint && p.site === 'FundLegal' && p.library === 'Shared Documents' && p.folderPath === d.path && p.fileName === d.name && p.kind === d.kind;
  }));
  const found = await c.search('side letter');
  check('Demo: search by words, in names, folders and columns', found.length === 3 && found.every(x => /side letter/i.test(`${x.name} ${x.path} ${x.fields.DocumentType}`)), found.map(x => x.name));
  check('Demo: search reaches the library’s columns', (await c.search('resolution halvard')).some(x => x.name.startsWith('Blocker Board Resolutions')));
  const minutes = docs.find(d => d.name.startsWith('Blocker Board Resolutions'));
  const item = await c.getItem(minutes.webUrl);
  check('Demo: an item by its URL', item.id === minutes.id && item.version === '2.0' && item.lastModifiedBy === 'David R. Okafor' && item.fields.DocumentType === 'Resolution' && item.kind === 'word', item);
  check('Demo: an item by drive and id', (await c.getItem({ driveId: item.driveId, itemId: item.id })).name === item.name);
  check('Demo: a sharing link resolves to its item', (await c.resolveShareUrl(minutes.shareUrl)).id === minutes.id, minutes.shareUrl);
  check('Demo: a sharing link reads as one', SharePoint.parseDocUrl(minutes.shareUrl).isSharingLink && SharePoint.parseDocUrl(minutes.shareUrl).kind === 'word');
  check('Demo: an unknown link is not found', await rejects(c.getItem(`${SharePoint.DEMO.library}/Nowhere.pdf`), SharePoint.NotFoundError));
  const versions = await c.listVersions(item.driveId, item.id);
  check('Demo: a document’s versions, newest first', versions.length === 2 && versions[0].id === '2.0', versions);

  // ---- Demo: the workbook in the library ----
  const path = c.workbookPath('Calder Ridge Fund III structure');
  check('Demo: no workbook before the first save', await rejects(c.loadWorkbook(path), SharePoint.NotFoundError));
  const first = await c.saveWorkbook(path, { charts: [1] });
  check('Demo: the first save creates it', first.eTag && first.item.version === '1.0' && first.item.lastModifiedBy === 'Demo User', first);
  check('Demo: a save without the eTag doesn’t overwrite it', await rejects(c.saveWorkbook(path, { charts: [] }), SharePoint.ConflictError));
  const loaded = await c.loadWorkbook(path);
  check('Demo: loading gives the text and the eTag', loaded.json === '{"charts":[1]}' && loaded.eTag === first.eTag, loaded);
  c.demo.touch(path, 'Margaret A. Chen');
  const conflict = await rejects(c.saveWorkbook(path, { charts: [2] }, loaded.eTag), SharePoint.ConflictError);
  check('Demo: saving over someone else’s save is a conflict', conflict && conflict.status === 412, conflict?.message);
  check('Demo: the conflict says who saved it', conflict?.current?.lastModifiedBy === 'Margaret A. Chen' && /Margaret A\. Chen/.test(conflict.message), conflict?.current);
  const fresh = await c.loadWorkbook(path);
  const third = await c.saveWorkbook(path, { charts: [3] }, fresh.eTag);
  check('Demo: a save with the current eTag goes through', third.item.version === '3.0' && (await c.loadWorkbook(path)).json === '{"charts":[3]}', third);
  const history = await c.listVersions(third.item.driveId, third.item.id);
  check('Demo: the workbook’s version history', history.map(v => `${v.id} ${v.lastModifiedBy}`).join(' | ') === '3.0 Demo User | 2.0 Margaret A. Chen | 1.0 Demo User', history);
  check('Demo: the workbook’s link resolves too', (await c.resolveShareUrl(third.item.webUrl)).eTag === third.eTag);
  check('Demo: saves are kept in the browser', JSON.parse(localStorage.getItem('rboreal.sharepoint.demo'))[path].n === 3);

  // ---- Live: the requests the Graph client makes, against a stand-in for Graph ----
  const calls = [];
  const routes = [];
  const respond = (status, body, headers = {}) => ({ ok: status >= 200 && status < 300, status, headers: { get: k => headers[k] ?? null },
    json: async () => body, text: async () => (typeof body === 'string' ? body : JSON.stringify(body)) });
  const fetchImpl = async (url, opts = {}) => {
    calls.push({ url, method: opts.method ?? 'GET', headers: opts.headers ?? {}, body: opts.body });
    const route = routes.find(r => r.test(url, opts));
    if (!route) return respond(404, { error: { code: 'itemNotFound', message: `No stand-in for ${url}` } });
    return route.reply(url, opts);
  };
  const tokens = [];
  const g = SharePoint.createGraphClient({
    fetchImpl, getToken: async (scopes, o) => { tokens.push({ scopes, interactive: o.interactive }); return o.interactive ? 'tok-again' : 'tok'; },
    config: () => ({ siteUrl: 'https://contoso.sharepoint.com/sites/FundLegal', library: 'Documents' }),
  });
  const G = 'https://graph.microsoft.com/v1.0';
  const route = (match, reply) => routes.push({ test: (u, o) => match(u, o), reply });
  route(u => u === `${G}/sites/contoso.sharepoint.com:/sites/FundLegal`, () => respond(200, { id: 'site-1' }));
  route(u => u.startsWith(`${G}/sites/site-1/drives`), () => respond(200, { value: [{ id: 'drv-1', name: 'Documents', webUrl: `${SP}/sites/FundLegal/Shared%20Documents`, driveType: 'documentLibrary' }] }));
  route(u => u.startsWith(`${G}/drives/drv-1/items/root/children?$expand`), () => respond(200, { value: [{ id: 'a', name: 'Calder Ridge Fund III', folder: { childCount: 5 }, parentReference: { driveId: 'drv-1', path: '/drives/drv-1/root:' } }],
    '@odata.nextLink': `${G}/drives/drv-1/items/root/children?$skiptoken=2` }));
  route(u => u === `${G}/drives/drv-1/items/root/children?$skiptoken=2`, () => respond(200, { value: [{ id: 'b', name: 'Rboreal', folder: { childCount: 1 }, parentReference: { driveId: 'drv-1', path: '/drives/drv-1/root:' } }] }));

  const children = await g.listChildren();
  check('Live: the site, then its library, then the folder, every page of it', children.map(x => x.name).join('|') === 'Calder Ridge Fund III|Rboreal' && children.every(x => x.isFolder)
    && calls.length === 4, calls.map(x => x.url));
  check('Live: every request carries a token, read-only by default', calls.every(x => x.headers.Authorization === 'Bearer tok') && tokens.every(t => t.scopes.includes('Files.Read.All') && !t.scopes.includes('Files.ReadWrite.All')));

  const docUrl = `${SP}/:b:/s/FundLegal/EaBcD123xyz?e=AbC12`;
  route(u => u.startsWith(`${G}/shares/`), () => respond(200, { id: 'pdf-1', name: 'Form D.pdf', size: 120000, webUrl: `${SP}/sites/FundLegal/Shared%20Documents/Regulatory/Form%20D.pdf`, eTag: '"{PDF1},3"',
    lastModifiedDateTime: '2024-06-28T16:30:00Z', lastModifiedBy: { user: { displayName: 'Jordan Alvarez' } }, createdBy: { user: { displayName: 'Jordan Alvarez' } },
    parentReference: { driveId: 'drv-1', path: '/drives/drv-1/root:/Calder%20Ridge%20Fund%20III/Regulatory' },
    listItem: { fields: { _UIVersionString: '3.0', DocumentType: 'Regulatory Filing', FileLeafRef: 'Form D.pdf', Modified: 'x', '@odata.etag': 'y' } } }));
  const resolved = await g.resolveShareUrl(docUrl);
  check('Live: a link resolves through /shares/{u!base64url}/driveItem', calls.at(-1).url.startsWith(`${G}/shares/u!aHR0cHM6Ly9jb250b3NvLnNoYXJlcG9pbnQuY29tLzpiOi9zL0Z1bmRMZWdhbC9FYUJjRDEyM3h5ej9lPUFiQzEy/driveItem`), calls.at(-1).url);
  check('Live: the share token is Microsoft’s documented encoding', SharePoint.shareToken('https://onedrive.live.com/redir?resid=1231244193912!12&authKey=1201919!12921!1')
    === 'u!aHR0cHM6Ly9vbmVkcml2ZS5saXZlLmNvbS9yZWRpcj9yZXNpZD0xMjMxMjQ0MTkzOTEyITEyJmF1dGhLZXk9MTIwMTkxOSExMjkyMSEx');
  check('Live: an item as the app holds it', resolved.name === 'Form D.pdf' && resolved.kind === 'pdf' && resolved.version === '3.0' && resolved.path === 'Calder Ridge Fund III/Regulatory'
    && resolved.lastModifiedBy === 'Jordan Alvarez' && resolved.fields.DocumentType === 'Regulatory Filing' && !('FileLeafRef' in resolved.fields) && !('Modified' in resolved.fields), resolved);

  route(u => u.includes('/root/search('), () => respond(200, { value: [] }));
  await g.search("O'Brien side letter");
  check('Live: search doubles single quotes, as Graph wants', calls.at(-1).url.includes("search(q='O''Brien%20side%20letter')"), calls.at(-1).url);

  // A token that has expired is fetched again, interactively; Graph asking to wait is waited out.
  let once = true;
  route(u => u.endsWith('/drives/drv-1/items/x-401?$expand=listItem($expand=fields)'), () => (once ? (once = false, respond(401, { error: { code: 'InvalidAuthenticationToken' } })) : respond(200, { id: 'x-401', name: 'A.pdf' })));
  check('Live: an expired token is renewed and the request repeated', (await g.getItem({ driveId: 'drv-1', itemId: 'x-401' })).name === 'A.pdf' && tokens.at(-1).interactive === true);
  let busy = true;
  route(u => u.endsWith('/items/x-429?$expand=listItem($expand=fields)'), () => (busy ? (busy = false, respond(429, {}, { 'Retry-After': '0' })) : respond(200, { id: 'x-429', name: 'B.pdf' })));
  check('Live: throttling is waited out', (await g.getItem({ driveId: 'drv-1', itemId: 'x-429' })).name === 'B.pdf');
  route(u => u.endsWith('/items/x-403?$expand=listItem($expand=fields)'), () => respond(403, { error: { code: 'accessDenied', message: 'Access denied' } }));
  check('Live: no access is an AuthError', await rejects(g.getItem({ driveId: 'drv-1', itemId: 'x-403' }), SharePoint.AuthError));
  check('Live: a missing item is a NotFoundError', await rejects(g.getItem({ driveId: 'drv-1', itemId: 'nope' }), SharePoint.NotFoundError));

  // The workbook: metadata, then the pre-authenticated download URL, which takes no token.
  const wbPath = 'Rboreal/Calder Ridge Fund III structure.rboreal.json';
  const metaUrl = `${G}/drives/drv-1/root:/Rboreal/Calder%20Ridge%20Fund%20III%20structure.rboreal.json`;
  let current = { eTag: '"{WB},4"', by: 'Margaret A. Chen' };
  route(u => u.startsWith(metaUrl) && !u.includes(':/content'), () => respond(200, { id: 'wb', name: 'Calder Ridge Fund III structure.rboreal.json', eTag: current.eTag,
    lastModifiedBy: { user: { displayName: current.by } }, parentReference: { driveId: 'drv-1', path: '/drives/drv-1/root:/Rboreal' }, '@microsoft.graph.downloadUrl': 'https://contoso.sharepoint.com/download?tempauth=abc' }));
  route(u => u === 'https://contoso.sharepoint.com/download?tempauth=abc', () => respond(200, '{"charts":[]}'));
  const wb = await g.loadWorkbook(wbPath);
  check('Live: loading the workbook gives its text and eTag', wb.json === '{"charts":[]}' && wb.eTag === '"{WB},4"' && wb.item.path === 'Rboreal', wb);
  check('Live: the download URL is fetched without the token', !calls.at(-1).headers.Authorization);
  route((u, o) => u === `${metaUrl}:/content` && o.method === 'PUT', (u, o) => (o.headers['If-Match'] && o.headers['If-Match'] !== current.eTag)
    ? respond(412, { error: { code: 'resourceModified', message: 'ETag mismatch' } })
    : respond(o.headers['If-None-Match'] ? 412 : 200, { id: 'wb', name: 'x.rboreal.json', eTag: '"{WB},5"', parentReference: { driveId: 'drv-1', path: '/drives/drv-1/root:/Rboreal' } }));
  const saved = await g.saveWorkbook(wbPath, { charts: [1] }, '"{WB},4"');
  const put = calls.filter(x => x.method === 'PUT').at(-1);
  check('Live: saving PUTs the content with If-Match and asks for write access', saved.eTag === '"{WB},5"' && put.headers['If-Match'] === '"{WB},4"'
    && put.headers['Content-Type'] === 'application/json' && put.body === '{"charts":[1]}' && tokens.at(-1).scopes.includes('Files.ReadWrite.All'), put);
  current = { eTag: '"{WB},6"', by: 'David R. Okafor' };
  const stale = await rejects(g.saveWorkbook(wbPath, { charts: [2] }, '"{WB},5"'), SharePoint.ConflictError);
  check('Live: a stale eTag is a ConflictError that says who saved since', stale && stale.current?.lastModifiedBy === 'David R. Okafor' && /David R\. Okafor/.test(stale.message), stale?.message);
  await rejects(g.saveWorkbook(wbPath, { charts: [3] }), SharePoint.ConflictError);
  check('Live: a first save won’t overwrite a file that exists', calls.filter(x => x.method === 'PUT').at(-1).headers['If-None-Match'] === '*');

  // ---- Live: signing in, against a stand-in for MSAL ----
  check('Auth: MSAL is loaded', typeof msal === 'object' && typeof msal.PublicClientApplication === 'function' && typeof msal.InteractionRequiredAuthError === 'function');
  const log = [];
  const blocked = () => Object.assign(new Error('The popup was blocked'), { errorCode: 'popup_window_error' });
  class InteractionRequired extends Error {}
  let behave = {};
  const fakeMsal = {
    InteractionRequiredAuthError: InteractionRequired,
    PublicClientApplication: class {
      constructor(cfg) { log.push(['new', cfg]); this.active = null; this.accounts = []; }
      async initialize() {}
      async handleRedirectPromise() { return null; }
      getActiveAccount() { return this.active; }
      getAllAccounts() { return this.accounts; }
      setActiveAccount(a) { this.active = a; }
      async loginPopup(r) { log.push(['loginPopup', r]); const account = { username: 'mchen@contoso.com' }; this.accounts = [account]; return { account }; }
      async loginRedirect(r) { log.push(['loginRedirect', r]); }
      async acquireTokenSilent(r) { log.push(['silent', r]); if (behave.silent) throw behave.silent; return { accessToken: 'quiet' }; }
      async acquireTokenPopup(r) { log.push(['popup', r]); if (behave.blocked) throw blocked(); return { accessToken: 'asked' }; }
      async acquireTokenRedirect(r) { log.push(['redirect', r]); }
      async logoutPopup(r) { log.push(['logoutPopup', r]); this.active = null; this.accounts = []; }
      async logoutRedirect(r) { log.push(['logoutRedirect', r]); }
    },
  };
  const authConfig = { tenantId: 'tenant-1', clientId: 'client-1', redirectUri: 'https://rboreal.contoso.com/chart.html' };
  const auth = SharePoint.createMsalAuth(() => authConfig, fakeMsal);
  check('Auth: signed out to begin with', !(await auth.isSignedIn()));
  const setup = log[0][1];
  check('Auth: MSAL set up for the tenant and the app, with tokens in session storage', setup.auth.clientId === 'client-1' && setup.auth.authority === 'https://login.microsoftonline.com/tenant-1'
    && setup.auth.redirectUri === authConfig.redirectUri && setup.cache.cacheLocation === 'sessionStorage', setup);
  check('Auth: no token before signing in', await rejects(auth.getToken(['Files.Read.All']), SharePoint.AuthError));
  const who = await auth.signIn();
  check('Auth: signing in by popup, asking only to read', who.username === 'mchen@contoso.com' && log.at(-1)[0] === 'loginPopup'
    && log.at(-1)[1].scopes.includes('Files.Read.All') && !log.at(-1)[1].scopes.includes('Files.ReadWrite.All') && await auth.isSignedIn());
  check('Auth: a token silently when MSAL has one', await auth.getToken(['Files.Read.All']) === 'quiet');
  behave.silent = new InteractionRequired('consent_required');
  check('Auth: a popup when MSAL needs the user, for the scopes asked', await auth.getToken(['Files.ReadWrite.All']) === 'asked' && log.at(-1)[0] === 'popup' && log.at(-1)[1].scopes.includes('Files.ReadWrite.All'));
  behave.silent = new Error('network down');
  check('Auth: any other failure is an AuthError', await rejects(auth.getToken(['Files.Read.All']), SharePoint.AuthError));
  behave = { blocked: true };
  const outcome = await Promise.race([auth.getToken(['Files.Read.All'], { interactive: true }).then(() => 'settled'), new Promise(r => setTimeout(() => r('left the page'), 50))]);
  check('Auth: a redirect when the browser blocks the popup', outcome === 'left the page' && log.at(-2)[0] === 'popup' && log.at(-1)[0] === 'redirect', log.slice(-2));
  behave = {};
  await auth.signOut();
  check('Auth: signing out', log.at(-1)[0] === 'logoutPopup' && !(await auth.isSignedIn()));
  check('Auth: no tenant, no sign-in', await rejects(SharePoint.createMsalAuth(() => ({ clientId: 'client-1' }), fakeMsal).signIn(), SharePoint.NotConfiguredError));

  // ---- Alongside the app ----
  setState(sampleCoreState());
  check('Alongside the app: the core of its sample still works out with this module loaded', Object.keys(records).filter(isComputed).length === 153);

  // The sample's documents are the demo library's files: each Document's Link is one of them, and resolves
  // to it, and every file is indexed but the three the sample leaves out on purpose.
  setState(sampleState());
  const sampleDocs = Object.keys(records).filter(id => isObject(records[id]) && records[id].kind === 'Document');
  const linkOf = id => records[entriesOf(id).find(e => same(records[e].edge, 'Link'))]?.value;
  const inLibrary = new Map(docs.map(d => [d.webUrl, d]));
  const strays = sampleDocs.filter(id => !inLibrary.has(linkOf(id)));
  check('Sample: every Document has a Link to a file in the demo library', sampleDocs.length === 47 && !strays.length, strays.map(id => objectName(id)).join(' | '));
  check('Sample: each Link is a document field that reads as its file’s name',
    sampleDocs.every(id => { const r = records[entriesOf(id).find(e => same(records[e].edge, 'Link'))]; return r.field === 'document' && displayValue(r) === inLibrary.get(r.value)?.name; }));
  const linked = await Promise.all(sampleDocs.map(id => c.resolveShareUrl(linkOf(id)).then(it => it.webUrl === linkOf(id), () => false)));
  check('Sample: every Link resolves through the connector', linked.every(Boolean), linked.filter(x => !x).length);
  const indexed = new Set(sampleDocs.map(linkOf));
  const unindexed = docs.filter(d => !indexed.has(d.webUrl)).map(d => d.name).sort();
  check('Sample: the library’s unindexed files are the three left out on purpose', unindexed.join(' | ') === ['Cayman GP Board Resolutions - Appointment of F. MacAllister.pdf',
    'Investor Presentation - Fund III Annual Meeting 2026.pptx', 'MFN Election Form - Fund III.docx'].join(' | '), unindexed.join(' | '));
  check('Sample: no two Documents link to the same file', indexed.size === sampleDocs.length);
  check('Alongside the app: no errors on the page, so no clashing globals', !window.pageErrors.length, window.pageErrors.join(' | '));
}

run().catch(e => check('The run itself', false, `${e.message}\n${e.stack}`)).finally(() => {
  const failed = out.filter(x => !x.ok).length;
  document.title = `sharepoint test: ${out.length - failed} pass, ${failed} fail`;
  document.getElementById('out').innerHTML = `${document.title}\n\n` + [...out.filter(x => !x.ok), ...out.filter(x => x.ok)].map(x =>
    `<span class="${x.ok ? '' : 'fail'}">${x.ok ? 'PASS' : 'FAIL'}  ${esc(x.name)}${x.detail && !x.ok ? `  [${esc(x.detail)}]` : ''}</span>`).join('\n');
});
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>perf test</title>
<style>
  body { margin: 24px; font: 13px/1.6 ui-monospace, Consolas, monospace; background: #fafafa; color: #222; }
  .fail { color: #b00; font-weight: 600; }
</style>
</head>
<body>
<pre id="out">running…</pre>
<script src="../../vendor/elkjs/elk.bundled.js"></script>
<script src="../core/tree.js"></script>
<script src="../core/notes.js"></script>
<script src="../core/log.js"></script>
<script src="../core/formulas.js"></script>
<script src="../core/layout.js"></script>
<script src="../core/scene.js"></script>
<script src="../sample/calder-ridge.js"></script>
<script src="grown.js"></script>
<script>
// How long the formulas take to work out as a chart grows: the sample as of a day, with its Formula notes,
// and with more of a fund complex added (see grown.js). `#n=200` (the default) sets the most entities added;
// the page works out the sample from nothing with none, a quarter, half and all of them, three times each,
// and keeps the best. The targets: the sample in under 50 ms, and 100 and 200 more entities in under 500.
// Then edits at the most, each worked out again from the working-out before, as the app does: each must
// agree with the same chart worked out from nothing, in every record, value, stage, row, error and ground,
// and one that reaches few formulas must take under 100 ms. Then scenes of it after edits, which must agree
// with scenes drawn afresh. Then the redline: one edit worked out and compared with the state before it, as
// the preview does on every keystroke, in under 50 ms on the sample.
const out = [];
const check = (name, ok, detail = '') => out.push({ name, ok: !!ok, detail: String(detail ?? '') });
const esc = s => String(s).replace(/[&<>]/g, c => `&#${c.charCodeAt(0)};`);
const { definitions: DEFS, names: NAMES } = SAMPLE_INPUTS;
const fresh = (recs, defs = DEFS) => Formulas.computeState(recs, defs, NAMES, null);

// The best of three workings-out from nothing, keeping only what's reported, so one run's records don't
// weigh on the next.
function timeIt(n) {
  const recs = grown(SAMPLE_INPUTS.recs, n);
  let best = null;
  for (let i = 0; i < 3; i++) {
    const R = fresh(recs);
    if (!best || R.ms < best.ms) best = { ms: R.ms, steps: R.steps, computed: Object.keys(R.computed).length };
  }
  return best;
}

// Where two workings-out differ, or null: their records in order, what's computed and covered, errors,
// rows, and the grounds of every 50th computed record.
function differ(A, B) {
  const j = R => JSON.stringify([Object.entries(R.records), R.computed, R.covered, R.errors, R.rows, R.keptAside]);
  if (j(A) !== j(B)) return 'records';
  for (const id of Object.keys(B.computed).filter((_, i) => i % 50 === 0))
    if (JSON.stringify(Formulas.ground(A, id)) !== JSON.stringify(Formulas.ground(B, id))) return `the ground of ${id}`;
  return null;
}

// Edits to the grown chart, one after another, each worked out from the one before and from nothing.
function edits(n) {
  let recs = grown(SAMPLE_INPUTS.recs, n), defs = DEFS, before = fresh(recs);
  const set = (r, id, change) => ({ ...r, [id]: { ...r[id], ...change } });
  const without = (r, ...ids) => Object.fromEntries(Object.entries(r).filter(([id]) => !ids.includes(id)));
  const steps = [
    ['a value no formula reads (an EIN)', true, r => set(r, 'fund_ein', { value: '92-0000000' })],
    ['an ownership percentage', false, r => set(r, 'x_own5_pct', { value: 0.5 })],
    ['a ruling-out of presumed control', false, r => ({ ...r, x_rebut: { args: [{ edge: 'Controller', at: 'okafor' }, { edge: 'Controlled', at: 'gp' }], tag: false } })],
    ['a name', false, r => set(r, 'fund_name', { value: 'Calder Ridge Capital Partners III-A, L.P.' })],
    ['an entity type', false, r => set(r, 'x_e7_type', { choice: 'Limited Liability Company' })],
    ['a good standing', false, r => set(r, 'fund_good', { tag: false })],
    ['an ownership removed', false, r => without(r, 'x_own9', 'x_own9_pct')],
    ['an entity added, owned by the fund', false, r => ({ ...r, x_new: { kind: 'Entity' }, x_new_name: { at: 'x_new', edge: 'Name', field: 'text', value: 'Added Holdings LLC' },
      x_new_own: { args: [{ edge: 'Owner', at: 'fund' }, { edge: 'Owned', at: 'x_new' }], tag: true }, x_new_own_pct: { at: 'x_new_own', edge: 'Percentage', field: 'percent', value: 1 } })],
    ['a definition’s row', false, r => { defs = defs.map(d => d.id === 'def_control' ? { ...d, rows: d.rows.map((x, i) => i === 2 ? { ...x, formula: x.formula.replace('25%', '35%') } : x) } : d); return r; }],
    ['the EIN again', true, r => set(r, 'fund_ein', { value: '92-0000001' })],
  ];
  const lines = [];
  for (const [what, quick, edit] of steps) {
    recs = edit(recs);
    const t = performance.now(), again = Formulas.computeState(recs, defs, NAMES, before), ms = performance.now() - t;
    const whole = fresh(recs, defs), d = differ(again, whole);
    const kept = again.steps.filter(s => s.kept).length;
    check(`At +${n}, ${what}, worked out again, agrees with the chart worked out from nothing`, !d, d ?? `${kept} of ${again.steps.length} groups kept`);
    if (quick) check(`At +${n}, ${what} is worked out again in under 100 ms`, ms < 100, `${ms.toFixed(0)} ms, against ${whole.ms.toFixed(0)} from nothing`);
    lines.push(`+${n}, ${what}: ${ms.toFixed(0)} ms again (${kept} of ${again.steps.length} groups kept), ${whole.ms.toFixed(0)} ms from nothing`);
    before = again;
  }
  return lines;
}

// The chart grown by n, in a workbook, drawn after each of three edits as the app draws it, from the scene
// before (keeping what it worked out from records that stand), and drawn afresh from the log reopened: the
// two must agree, and the scene after an edit to a value take under 200 ms.
function scenes(n) {
  const wb = Log.open(SAMPLE), C = CHART, V = 'view_main';
  const edit = f => { const tx = wb.edit({ chart: C, who: 'perf' }); f(tx); const c = tx.commit(); if (typeof c === 'string') throw new Error(c); };
  const work = (w, from) => { const S = w.schema(C), N = w.notes(C); return Formulas.computeState(w.asOf(C, DAY), N.definitions(S), { relations: N.relations(S) }, from); };
  const draw = (w, R) => Scene.of(w, C, V, DAY, { state: R.records, computed: R });
  const drawn = s => JSON.stringify({ page: s.page, marks: s.marks, styles: s.styles });
  edit(tx => { for (const [id, r] of Object.entries(grown({}, n))) if (id.startsWith('x_')) tx.add('record', r, id); });
  let R = work(wb, null);
  draw(wb, R);
  const lines = [];
  for (const [what, f] of [['a value (an EIN)', tx => tx.update('fund_ein', { value: '92-1111111' })],
    ['a name', tx => tx.update('feeder_name', { value: 'Calder Ridge Capital Partners III (Cayman Islands), L.P.' })],
    ['a good standing', tx => tx.update('fund_good', { tag: false })]]) {
    edit(f);
    R = work(wb, R);
    const t = performance.now(), kept = draw(wb, R), ms = performance.now() - t;
    const again = Log.open(JSON.stringify(wb)), fresh = draw(again, work(again, null));
    check(`At +${n}, the scene after ${what} agrees with one drawn afresh`, drawn(kept) === drawn(fresh), `${kept.marks.length} marks`);
    if (what.startsWith('a value')) check(`At +${n}, the scene after ${what} is drawn in under 200 ms`, ms < 200, `${ms.toFixed(0)} ms`);
    lines.push(`+${n}, the scene after ${what}: ${ms.toFixed(0)} ms`);
  }
  return lines;
}

// Ruling out Okafor's presumed control of GP III, worked out and diffed against the sample as it was.
function redline() {
  const before = workOut();
  const edited = { ...SAMPLE_INPUTS.recs, x_rebut: { args: [{ edge: 'Controller', at: 'okafor' }, { edge: 'Controlled', at: 'gp' }], tag: false } };
  let best = Infinity, d = null;
  for (let i = 0; i < 3; i++) {
    const t = performance.now();
    d = Formulas.diff(before, Formulas.computeState(edited, DEFS, NAMES, before));
    best = Math.min(best, performance.now() - t);
  }
  return { ms: best, d };
}

function run() {
  const n = Number(new URLSearchParams(location.hash.slice(1)).get('n') ?? 200);
  const lines = [];
  const times = new Map();
  for (const size of [...new Set([0, Math.round(n / 4), Math.round(n / 2), n])]) {
    const t = timeIt(size);
    times.set(size, t.ms);
    const slow = [...t.steps].sort((a, b) => b.ms - a.ms).slice(0, 4)
      .map(s => `${s.defs.join('+')} ${s.ms.toFixed(0)}ms/${s.rounds}r/${s.tried}c/${s.evals}e`).join(', ');
    lines.push(`+${size} entities: ${t.ms.toFixed(0)} ms, ${t.computed} computed records; slowest steps (rounds, candidates, evaluations): ${slow}`);
  }
  for (const [size, target, what] of [[0, 50, 'the sample'], [100, 500, '100 more entities'], [200, 500, '200 more entities']])
    if (times.has(size)) check(`Works out ${what} in under ${target} ms`, times.get(size) < target, `${times.get(size).toFixed(0)} ms`);
  lines.push('', ...edits(n), '', ...scenes(n));
  const r = redline();
  check('Previews a ruling-out on the sample, worked out and compared, in under 50 ms', r.ms < 50,
    `${r.ms.toFixed(1)} ms: ${r.d.appear.length} appear, ${r.d.go.length} go, ${r.d.change.length} change`);
  const failed = out.filter(x => !x.ok).length;
  document.title = `perf test: ${out.length - failed} pass, ${failed} fail`;
  document.getElementById('out').innerHTML = `${document.title}\n\n${lines.map(esc).join('\n')}\n\n` + out.map(x =>
    `<span class="${x.ok ? '' : 'fail'}">${x.ok ? 'PASS' : 'FAIL'}  ${esc(x.name)}${x.detail ? `  [${esc(x.detail)}]` : ''}</span>`).join('\n');
}

try { run(); } catch (e) { document.getElementById('out').textContent = `${e.message}\n${e.stack}`; }
</script>
</body>
</html>

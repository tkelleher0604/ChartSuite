<script>
  try { localStorage.setItem('dendra.toured', '1'); } catch {}
  document.documentElement.dataset.theme = new URLSearchParams(location.search).get('theme') || 'light';
  // What went wrong, where a screenshot run can read it.
  const ERRS = [];
  addEventListener('error', e => ERRS.push(`${e.message} @${e.filename?.split('/').pop()}:${e.lineno}`));
  addEventListener('unhandledrejection', e => ERRS.push(`${e.reason?.message ?? e.reason}`));
</script>

<body>
<div id="app"></div>
<!-- The window, with the canvas and the format bar in it beside the other parts, on the sample kept in
     memory; and gestures it plays for screenshots:
     canvas-harness.html?v=view_40act&do=select:fund,drag:fund:60:0&dress&tidy  -->
<script src="../../vendor/preact/preact.min.umd.js"></script>
<script src="../../vendor/preact/hooks.umd.js"></script>
<script src="../../vendor/htm/htm.umd.js"></script>
<script src="../../vendor/signals/signals-core.min.js"></script>
<script src="../../vendor/signals/signals.min.js"></script>

<script src="../../vendor/floating-ui/floating-ui.dom.umd.min.js"></script>

<script src="../core/sharepoint.js"></script>

<script>
  // The store, in memory: each visit opens the sample afresh, and nothing is kept.
  const Store = { open: async ({ sample }) => Log.open(sample), who: () => '', status: () => ({ text: '' }), subscribe: () => () => {}, books: async () => [], where: () => null,
    openFile: async () => null, saveAs: async () => null, download() {}, fix() {} };
</script>
<script src="../ui/shell.js"></script>
<script src="../ui/app.js"></script>
<script src="../core/layout.js"></script>
<script src="../core/scene.js"></script>
<script src="../ui/canvas.js"></script>
<script src="../ui/formatbar.js"></script>
<script src="../ui/inspector.js"></script>
<script src="../ui/table.js"></script>
<script src="../ui/time.js"></script>
<script src="../ui/formulabar.js"></script>
<script>
const H = (() => {
  const q = new URLSearchParams(location.search);
  if (q.get('v')) location.hash = 'v=' + q.get('v');
  // ELK's options, to try others: &elk=elk.spacing.nodeNode:40;elk.layered.nodePlacement.strategy:NETWORK_SIMPLEX
  for (const kv of (q.get('elk') || '').split(';').filter(Boolean)) { const i = kv.lastIndexOf(':'); Layout.OPTIONS[kv.slice(0, i)] = kv.slice(i + 1); }
  // ---- Gestures, played for screenshots ----
  const wait = ms => new Promise(r => setTimeout(r, ms));
  const cv = () => Canvas.active.peek();
  // A mark's middle on screen, brought into view first if it isn't.
  const center = id => {
    const g = cv().graph, m = cv().scene().byId.get(id);
    let p = g.localToClient(m.x + m.w / 2, m.y + m.h / 2);
    const r = cv().root.getBoundingClientRect();
    if (p.x < r.left + 20 || p.x > r.right - 20 || p.y < r.top + 20 || p.y > r.bottom - 20) { g.centerPoint(m.x + m.w / 2, m.y + m.h / 2); p = g.localToClient(m.x + m.w / 2, m.y + m.h / 2); }
    return [p.x, p.y];
  };
  const at = (x, y) => document.elementFromPoint(x, y);
  const mouse = (type, x, y, el = at(x, y), o = {}) => el.dispatchEvent(new MouseEvent(type, { bubbles: true, cancelable: true, clientX: x, clientY: y, button: 0, buttons: type === 'mouseup' ? 0 : 1, view: window, ...o }));
  async function drag(x0, y0, x1, y1, o = {}) {
    const el = at(x0, y0);
    mouse('mousedown', x0, y0, el, o);
    for (let i = 1; i <= 8; i++) { const x = x0 + (x1 - x0) * i / 8, y = y0 + (y1 - y0) * i / 8; mouse('mousemove', x, y, at(x, y) ?? document.body, o); await wait(16); }
    mouse('mouseup', x1, y1, at(x1, y1) ?? document.body, { ...o, buttons: 0 });
    await wait(60);
  }
  async function click(x, y, o = {}) { mouse('mousedown', x, y, undefined, o); mouse('mouseup', x, y, undefined, o); mouse('click', x, y, undefined, o); await wait(60); }
  const STEPS = {
    select: async id => { const [x, y] = center(id); await click(x, y); },
    shift: async id => { const [x, y] = center(id); await click(x, y, { shiftKey: true }); },
    marquee: async (a, b) => { const [x0, y0] = a.split('x').map(Number), [x1, y1] = b.split('x').map(Number); await drag(x0, y0, x1, y1); },
    drag: async (id, dx, dy) => { const [x, y] = center(id); await drag(x, y, x + +dx, y + +dy); },
    hold: async (id, dx, dy) => { const [x, y] = center(id); mouse('mousedown', x, y, at(x, y)); for (let i = 1; i <= 6; i++) { const p = [x + dx * i / 6, y + dy * i / 6]; mouse('mousemove', p[0], p[1], at(...p) ?? document.body); await wait(16); } },
    insert: async g => { cv().insert(g); await wait(80); },
    type: async t => { let ed; for (let i = 0; i < 20 && !(ed = document.querySelector('.dc-edit')); i++) await wait(25); if (ed) { ed.textContent = t.replace(/_/g, ' '); ed.dispatchEvent(new KeyboardEvent('keydown', { key: 'Enter', bubbles: true })); } await wait(60); },
    row: async n => { const lg = cv().scene().marks.find(m => m.geometry === 'legend'); const r = lg?.rows[+n || 0]; if (!r) return; const g = cv().graph, p = g.localToClient(lg.x + r.x + 30, lg.y + r.y + r.h / 2); await click(p.x, p.y); await click(p.x, p.y); },
    zoom: async k => cv().zoom(k === 'fit' ? 'fit' : +k),
    at: async (k, x, y) => { cv().zoom(+k); cv().graph.centerPoint(+x, +y); await wait(60); },
    tidy: async () => { cv().tidy(); await wait(100); },
    fmt: async (label, value) => { FormatBar.apply(label, value === 'true' ? true : value === 'false' ? false : isNaN(+value) ? value.replace(/_/g, ' ') : +value); await wait(60); },
    open: async which => { document.querySelector(`.fb [data-fb="${which}"]`)?.click(); await wait(120); },
    wait: async ms => wait(+ms),
    // Range Finder: these records outlined in these hues, the rest dimmed; hidden ones drawn for a while.
    // As the formula bar asks, through the shell's part: hl:fund=1:own_us_fund=2 — an id's hue; a name in
    // front of =, with *, is a witness; with ~, a deeper reason; with !, pulsing.
    hl: async (...pairs) => {
      const colors = {}, strong = [], deep = [], pulse = [];
      for (const p of pairs) { const [k, n] = p.split('='), id = k.replace(/^[*~!]/, ''); colors[id] = `var(--rf-${n})`; ({ '*': strong, '~': deep, '!': pulse })[k[0]]?.push(id); }
      Shell.parts.peek().canvas.highlight(colors, { dim: true, strong, deep, pulse });
      await wait(80);
    },
    // A pending change, redlined as the formula bar asks: a percentage changed, a line gone, one appearing.
    red: async () => {
      const now = App.state.peek(), then = { ...now };
      then.own_us_fund_pct = { ...now.own_us_fund_pct, value: 0.65 };
      delete then.own_fund_blkr; delete then.own_fund_blkr_pct;
      then.own_x = { args: [{ edge: 'Owner', at: 'inv_nonus' }, { edge: 'Owned', at: 'fund' }], tag: true };
      then.own_x_pct = { at: 'own_x', edge: 'Percentage', field: 'percent', value: 0.069 };
      Shell.parts.peek().canvas.redline({ appear: ['own_x', 'own_x_pct'], go: ['own_fund_blkr', 'own_fund_blkr_pct'], changed: { own_us_fund_pct: { before: '71.6%', after: '65%' } }, records: then });
      await wait(80);
    },
    point: async on => { Shell.emit('point-mode', on !== 'off'); await wait(30); },
    // Drag the selection's bottom-right handle by dx, dy.
    resize: async (dx, dy) => { const h = document.querySelector('.x6-widget-transform-resize[data-position="bottom-right"]'), r = h.getBoundingClientRect(); await drag(r.left + 3, r.top + 3, r.left + 3 + +dx, r.top + 3 + +dy); },
    undo: async () => { Shell.parts.peek().undo.undo(); await wait(80); },
    // Any of the canvas's commands: cmd:align:left, cmd:copy, cmd:paste.
    cmd: async (name, arg) => { cv()[name](arg); await wait(80); },
    key: async (k, mods = '') => { const o = { key: k, code: k.length === 1 ? `Key${k.toUpperCase()}` : k, bubbles: true, ctrlKey: mods.includes('c'), shiftKey: mods.includes('s') }; cv().root.focus(); cv().root.dispatchEvent(new KeyboardEvent('keydown', o)); await wait(60); },
    dbl: async id => { const [x, y] = center(id); mouse('dblclick', x, y); await wait(80); },
    // Drag from a box's handle to another box; with `hold`, stop short of letting go.
    relate: async (from, to, hold) => {
      await STEPS.select(from);
      const h = document.querySelector('.dc-handle.s'), r = h.getBoundingClientRect(), p0 = [r.left + r.width / 2, r.top + r.height / 2];
      const m = cv().scene().byId.get(to), q = cv().graph.localToClient(m.x + m.w / 2, m.y + m.h / 2);
      h.dispatchEvent(new PointerEvent('pointerdown', { bubbles: true, clientX: p0[0], clientY: p0[1], button: 0 }));
      for (let i = 1; i <= 6; i++) { dispatchEvent(new PointerEvent('pointermove', { clientX: p0[0] + (q.x - p0[0]) * i / 6, clientY: p0[1] + (q.y - p0[1]) * i / 6 })); await wait(16); }
      if (!hold) dispatchEvent(new PointerEvent('pointerup', { clientX: q.x, clientY: q.y }));
      await wait(60);
    },
    hover: async id => { const [x, y] = center(id); mouse('mouseover', x, y); mouse('mouseenter', x, y); mouse('mousemove', x, y); await wait(60); },
  };
  // A view dressed as a board would see it: a title, and a key.
  function dress() {
    const sc = cv().scene(), view = sc.view;
    if (sc.marks.some(m => m.type === 'shape')) return;
    const name = App.notes.peek().nameOf(App.entered.peek(), view);
    const top = Math.min(...sc.marks.filter(m => m.type === 'box').map(m => m.y));
    App.change(tx => {
    tx.add('shape', { view, geometry: 'text', x: 40, y: Math.max(16, top - 74), w: 640, h: 30, text: 'Calder Ridge Capital Partners III, L.P.', format: { Size: 20, Bold: true } });
    tx.add('shape', { view, geometry: 'text', x: 40, y: Math.max(42, top - 46), w: 640, h: 20, text: `${name} · as of October 26, 2026`, format: { Size: 11, Color: '#404040' } });
    const bottom = Math.max(...sc.marks.filter(m => m.type === 'box').map(m => m.y + m.h));
    tx.add('shape', { view, geometry: 'legend', x: 48, y: bottom + 32, w: 520, title: 'Key', columns: 2 });
    });
  }
  // Frames from styles: Cayman Islands boxed as Offshore, and the investor groups bracketed as Investors.
  function frames() {
    const view = cv().scene().view;
    const cayman = { out: { choice: 'Cayman Islands' }, args: [{ edge: 'Jurisdiction', loc: {} }] }, investors = { kind: 'Investor Group' };
    App.change(tx => {
      tx.note('Frame', cayman, 'dashed', { view });
      tx.note('Caption', cayman, 'Offshore', { view });
      tx.note('Frame', investors, 'bracket', { view });
      tx.note('Caption', investors, 'Investors', { view });
    });
  }
  async function run() {
    for (let i = 0; i < 100 && !cv()?.scene(); i++) await wait(50);
    await wait(200);
    if (q.has('frames')) { frames(); await wait(150); }
    if (q.has('tidy')) await STEPS.tidy();
    if (q.has('dress')) { dress(); await wait(120); }
    await wait(120);
    cv().zoom('fit');
    for (const s of (q.get('do') || '').split(',').filter(Boolean)) { const [name, ...args] = s.split(':'); await STEPS[name]?.(...args); }
    report();
  }
  // What the canvas said on the bus.
  const said = [];
  for (const name of ['relate-open', 'why-open']) Shell.on(name, d => said.push([name, d]));
  let mounts = 0;
  preactSignals.effect(() => { if (Canvas.active.value) mounts++; else if (mounts) ERRS.push('canvas destroyed: ' + new Error().stack.split('\n').slice(2, 12).join(' | ')); });
  function report() {
    const sc = cv()?.scene(), d = document.createElement('pre');
    d.id = 'report'; d.hidden = true;
    d.textContent = JSON.stringify({ errors: ERRS, view: sc?.view, marks: sc?.marks.length, ms: sc?.ms, selection: Shell.selection.peek(), page: sc?.page, mounts, said });
    document.body.appendChild(d);
    document.title = ERRS.length ? 'errors' : 'ready';
  }
  Shell.ready.then(() => run().catch(e => { ERRS.push(e.message + ' ' + e.stack); report(); }));
  return { STEPS, dress };
})();
</script>

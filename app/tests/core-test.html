<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dendra core test</title>
<style>
  body { margin: 0; padding: 20px; background: #fafafa; color: #18181b; font: 13px/1.5 ui-monospace, Consolas, monospace; }
  .fail { color: #b42318; }
  @media (prefers-color-scheme: dark) { body { background: #111113; color: #e4e4e7; } .fail { color: #f97066; } }
</style>
</head>
<body>
<pre id="out">Running…</pre>
<script src="../core/tree.js"></script>
<script src="../core/notes.js"></script>
<script src="../core/log.js"></script>
<script src="../sample/calder-ridge.js"></script>
<script>
// Checks of the core (tree.js, notes.js, log.js) on the sample, app/sample/calder-ridge.js. Nothing is saved.
const out = [];
const check = (name, ok, detail = '') => out.push({ name, ok: !!ok, detail: String(detail ?? '') });
const C = 'calder-ridge', TODAY = '2026-10-26', WHO = 'Dana Jordan';
const j = x => JSON.stringify(x);

function run(json) {
  const fresh = () => Log.open(json);
  const wb = fresh(), S = wb.schema(C), N = wb.notes(C), now = wb.asOf(C, TODAY);
  const tree = (id, st = now) => Tree.treeOf(st, id);
  const edit = (w, opts = {}) => w.edit({ chart: C, who: WHO, ...opts });
  const commit = (w, f, opts) => { const tx = edit(w, opts); f(tx); return tx.commit(); };

  // ---- data-model.md, on the sample ----
  for (const d of ['2023-01-01', '2023-12-31', '2024-07-01', '2025-06-30', '2026-06-01', TODAY]) {
    const st = wb.asOf(C, d), ids = Object.keys(st), seen = new Map();
    check(`as of ${d}: every location of every record is in the chart`, ids.every(id => Tree.argsOf(st[id]).every(a => st[a.at])));
    const twins = ids.filter(id => !Tree.isObject(st[id])).filter(id => {
      const k = Tree.argsOf(st[id]).map(a => j([Tree.norm(a.edge), a.at])).sort().join();
      return seen.has(k) || !seen.set(k, id);
    });
    check(`as of ${d}: no two records share an argumentation`, !twins.length, twins.join(' '));
    check(`as of ${d}: every record's specification is in the schema`, ids.every(id => S[Tree.key(Tree.specOf(tree(id, st)))]));
  }
  check('the schema holds every location of its specifications', Object.values(S).every(t => !t.args || t.args.every(a => S[Tree.key(a.loc)])));
  check('the schema meets its conditions', Tree.schemaError(S) === null);
  check('a node of a specification is a kind just where it is a leaf', Object.values(S).every(function leafy(t) {
    return t.args ? !('kind' in t) && t.out && t.args.every(a => leafy(a.loc) && !('field' in (a.loc.out ?? {}))) : t.kind !== undefined;
  }));
  // 136 changes, each the legal team's own, the last its revisions after a general counsel's review in October
  // 2026: what the app's building changed is folded into the rows it fixed. Each entity's formation document and
  // governing agreement is among its 55 documents, and each Delaware annual tax paid is at the tax year it settled.
  const docs = Object.values(now).filter(r => r.kind === 'Document').length;
  check('the sample is as big as it should be', Object.keys(now).length === 965 && docs === 55 && wb.changes().length === 136,
    `${Object.keys(now).length} records, ${docs} documents, ${wb.changes().length} changes`);
  const hourIn = new Intl.DateTimeFormat('en-US', { timeZone: 'America/New_York', hour: 'numeric', hourCycle: 'h23' });
  const late = wb.changes().filter(c => { const h = +hourIn.formatToParts(new Date(c.when)).find(p => p.type === 'hour').value; return h < 9 || h >= 17; });
  check('each of its changes is stamped in working hours, New York time', !late.length, late.map(c => `${c.id} ${c.when}`).join(' '));
  {
    const ever = wb.changes().flatMap(c => c.adds), added = new Map(ever.map(r => [r.id, r])), say = ({ id, ...r }) => j(r);
    check('the sample’s log never held a placeholder address, a Fiscal Year End but as a day of the year, or a name since renamed',
      ever.filter(r => r.edge === 'Email').every(r => /@calderridge\.com$/.test(r.value)) && ever.filter(r => r.edge === 'Fiscal Year End').every(r => r.field === 'yearly')
      && !ever.some(r => /Fund Owned|"(Affiliates|Affiliated With|Clients|LLCs|Look-Through Investments|Delaware Annual Tax)"|BDC\.Affiliates\b/.test(say(r))));
    const echoes = wb.changes().filter(c => c.removes.some(id => c.adds.some(r => Log.typeOf(r) === Log.typeOf(added.get(id)) && r[Log.typeOf(r)] === added.get(id)[Log.typeOf(r)] && say(r) === say(added.get(id)))));
    check('no change in the sample puts back a row word for word, as a rename made elsewhere does', !echoes.length, echoes.map(c => c.id).join(' '));
  }

  // ---- Patterns ----
  const tax = tree('fund_tax'), spec = Tree.specOf(tax), param = Tree.bare(spec);
  const tc = type => ({ args: [{ edge: 'Tax Classification', loc: { ...(type && { out: { choice: type } }), args: [{ edge: 'Entity Type', loc: { kind: 'Entity' } }] } }] });
  check('a record fits its specification, its parameterization and wider patterns', [tax, spec, param, tc(), tc('Limited Partnership')].every(p => Tree.narrower(tax, p)));
  check('a record fits no pattern with another label in it', !Tree.narrower(tax, tc('Corporation')) && !Tree.narrower(tax, { args: [{ edge: 'Tax Classification', loc: { kind: 'Entity' } }] }));
  check('narrower is reflexive and antisymmetric', Tree.narrower(spec, spec) && Tree.narrower(spec, param) && !Tree.narrower(param, spec));
  check('narrower is transitive', Tree.narrower(tax, spec) && Tree.narrower(spec, tc()) && Tree.narrower(tax, tc()));
  check('an object fits itself, its kind and any object, and no other', Tree.narrower(tree('fund'), { kind: 'entity' })
    && Tree.narrower(tree('fund'), {}) && !Tree.narrower(tree('fund'), tree('gp')) && !Tree.narrower({ kind: 'Entity' }, tree('fund')));
  check('a value fits its datatype', Tree.narrower(tree('fund_formed'), { out: { field: 'date' }, args: [{ edge: 'formation date', loc: {} }] })
    && !Tree.narrower(tree('fund_formed'), { out: { field: 'text' }, args: [{ edge: 'Formation Date', loc: {} }] }));
  const ownedFirst = { args: [{ edge: 'Owned', loc: { kind: 'Entity' } }, { edge: 'Owner', loc: { id: 'fund', kind: 'Entity' } }] };
  check('a relation fits in whatever order its edges are written', Tree.narrower(tree('own_fund_blkr'), ownedFirst)
    && Tree.key(Tree.bare(Tree.specOf(tree('own_fund_blkr')))) === Tree.key(Tree.specOf(ownedFirst)));
  check('specification and parameterization keys are those formulas.js reads', Tree.key(Tree.specOf(tree('fund'))) === 'kind:entity'
    && Tree.parameterization(now, 'fund_formed') === '["[\\"formation date\\",\\"kind:entity\\"]"]'
    && Tree.key(Tree.specOf(tree('fund_type'))) === '["choice:limited partnership","[\\"entity type\\",\\"kind:entity\\"]"]');
  check('a narrower pattern weighs more', Tree.weight(tax) > Tree.weight(spec) && Tree.weight(spec) > Tree.weight(param) && Tree.weight(param) > Tree.weight(tc()));

  // ---- Notes: the narrowest decides ----
  const own = tree('own_fund_blkr');
  check('a relation is named, and so are its lists', N.name(own) === 'Ownership' && N.listName(own, 'Owner') === 'Owners'
    && N.listName(own, 'Owned') === 'Holdings' && j(N.edges(own)) === j(['Owner', 'Owned']), `${N.name(own)} ${N.edges(own)}`);
  check('an entry goes by its label and a kind by itself without a Name', N.name(tree('fund_ein')) === 'EIN' && N.name(tree('fund')) === 'Entity');
  check('Required reaches every option of a position', ['pos_chen_bdc_title', 'pos_okfr_bdc_start', 'pos_lind_mgmt_title', 'fund_formed'].every(id => N.required(tree(id)))
    && !N.required(tree('fund_ein')) && !N.required(tree('pos_raman_bdc_title')) === false);
  check('entries are ordered, Name first', N.order(tree('fund_name')) === 0 && N.order(tree('fund_short')) < N.order(tree('fund_formed')) && N.order(tree('fund_target')) === undefined);
  check('start and end entries', N.isStart(tree('fund_formed')) && N.isStart(tree('gp_admitted')) && N.isStart(tree('pos_chen_bdc_start'))
    && N.isEnd(Tree.treeOf(wb.asOf(C, '2024-01-01'), 'gp_of_feeder_withdrawn')) && !N.isStart(tree('doc_lpa3_date')));
  check('a description reaches what its formula covers', /^How the entity is taxed/.test(N.description(tax)));
  check('a style decides in its view and not elsewhere', N.formats(tree('chen'), 'view_main').Shape?.value === 'oval'
    && !N.formats(tree('chen')).Shape && N.formats(tree('fund_vehicle'), 'view_main').Fill?.value === '#dae3f3');
  check('a hidden box is hidden in its view only', N.shown(tree('raman'), 'view_main') === false && N.shown(tree('raman'), 'view_fund3') === false
    && N.resolve('Shown', tree('raman'), 'view_40act')?.note.pattern.id === undefined && N.shown(tree('chen'), 'view_main') === undefined);
  check('a note at a style pattern reaches every option', N.formats(tree('fund_juris'), 'view_main').Color?.value === '#595959'
    && N.formats(tree('pos_chen_bdc'), 'view_main').Shown?.value === false);
  check('a box has its own position in each view', N.position(tree('bdc'), 'view_40act').w === 220 && N.position(tree('bdc'), 'view_40act').x === 56 && N.position(tree('bdc'), 'view_main').x === 1362,
    j([N.position(tree('bdc'), 'view_40act'), N.position(tree('bdc'), 'view_main')]));
  {
    const w = fresh();
    commit(w, tx => {
      tx.add('note', { label: 'Fill', pattern: { id: 'fund', kind: 'Entity' }, value: 'red' });
      tx.add('note', { label: 'Fill', pattern: { kind: 'Entity' }, view: 'view_main', value: 'blue' });
      tx.add('note', { label: 'Fill', pattern: { id: 'gp', kind: 'Entity' }, view: 'view_main', value: 'green' });
    });
    const M = w.notes(C), fill = (id, v) => M.resolve('Fill', tree(id), v);
    check('in a view, its note decides over one in no view', fill('fund', 'view_main').value === 'blue' && fill('fund', 'view_40act').value === 'red');
    check('among notes in one view, the narrowest decides', fill('gp', 'view_main').value === 'green' && fill('mgmt', 'view_main').value === 'blue');
    check('resolving says which note decided', fill('gp', 'view_main').note.view === 'view_main' && fill('fund').note.pattern.id === 'fund');
  }
  const styles = N.styles('view_main'), fortyAct = N.styles('view_40act');
  check('a view’s styles come in its order, each with its outputs', styles[0].key === '*' && styles.length === 12
    && styles.find(s => s.pattern.args?.[0].edge === 'Vehicle Type').outputs.some(o => o.pattern.out?.choice === 'Main Fund' && o.formats.Fill === '#dae3f3'),
    styles.map(s => s.order).join());
  check('the 40 Act filter is a tag, shown by its outputs', fortyAct.at(-1).pattern.args[0].edge === 'BDC Affiliate'
    && fortyAct.at(-1).outputs[0].formats.Shown === true && fortyAct[0].outputs.some(o => o.pattern.kind === undefined && o.formats.Shown === false));

  // ---- What formulas.js takes ----
  const defs = N.definitions(S), def = id => defs.find(d => d.id === id);
  check('every definition covers what it covered', defs.length === 30 && defs.every(d => d.covers.length && d.rows.length),
    defs.filter(d => !d.covers.length).map(d => d.id).join(' '));
  check('a definition’s covers, type and rows', def('def_tax').covers.length === 3 && def('def_tax').type === 'choice' && def('def_tax').options.includes('Partnership')
    && def('def_formation_on_file').covers.length === 5 && def('def_close').rows.length === 5 && def('def_look_through').datatype === 'percent');
  check('a relation’s definition has its name and edges in order', def('def_control').name === 'Control' && j(def('def_control').edges) === j(['Controller', 'Controlled'])
    && def('def_private_fund').name === 'Private Fund');
  const rels = N.relations(S), ownership = rels.find(r => r.name === 'Ownership');
  check('relation names as formulas.js takes them', rels.length === 17 && ownership.lists.Owned.Owner === 'Owners' && ownership.lists.Owner.Owned === 'Holdings' && ownership.type === 'tag');
  // The formula bar says a relation by its first side's list of the second where that reads as a predicate, and
  // a tag described as "A …" as a noun: an investor in, a member of, a BDC affiliate.
  const listOf = name => rels.find(r => r.name === name).lists;
  check('lists as a lawyer writes them', listOf('Look-Through Ownership').Investor.Investment === 'Look-Through Investor In' && listOf('Membership').Member.LLC === 'Member Of'
    && listOf('Investment Adviser').Adviser.Client === 'Adviser To' && /^A person that /.test(N.description({ args: [{ edge: 'BDC Affiliate', loc: tree('fund') }] })),
    j([listOf('Look-Through Ownership').Investor, listOf('Membership').Member]));
  // A check is a definition whose ruled-out records are problems: a Check note at its pattern says so.
  const patternOf = id => N.notes('Formula').find(n => n.note === id).pattern, checked = defs.filter(d => N.check(patternOf(d.id))).map(d => d.id).sort();
  check('the sample’s checks are the definitions with a Check note', j(checked) === j(['def_adds_up', 'def_capacity_held', 'def_formation_on_file', 'def_governing_on_file', 'def_in_range'])
    && N.check({ out: { tag: false }, args: [{ edge: 'Ownership Adds Up', loc: tree('gp') }] }) && !N.check(tree('fund_good')) && !N.check(patternOf('def_remote')), j(checked));

  // ---- Time: as of a day ----
  const on = (d, id) => !!wb.asOf(C, d)[id];
  check('before the GP was replaced, GP III is the feeder’s GP', on('2023-12-31', 'gp_of_feeder') && !on('2023-12-31', 'gp_cay_fdr') && on('2023-12-31', 'sign_chen_fdr'));
  check('after, the Cayman GP is, from the day the notice of the change was filed', !on(TODAY, 'gp_of_feeder') && on(TODAY, 'gp_cay_fdr') && !on(TODAY, 'sign_chen_fdr') && on(TODAY, 'sign_chen_fdr_cay')
    && on('2024-07-08', 'gp_of_feeder') && !on('2024-07-08', 'gp_cay_fdr') && !on('2024-07-09', 'gp_of_feeder') && on('2024-07-09', 'gp_cay_fdr') && on('2024-07-09', 'sign_chen_fdr_cay'));
  const pct = (d, id) => wb.asOf(C, d)[id]?.value;
  check('a closing changes a percentage from its day', pct('2026-06-14', 'own_fund_corvane_pct') === 0.56 && pct('2026-06-15', 'own_fund_corvane_pct') === 0.49
    && pct('2026-06-14', 'own_3a_corvane_pct') === 0.08 && !on('2026-06-14', 'own_coinv_corvane') && pct('2026-07-01', 'own_coinv_corvane_pct') === 0.125);
  check('a fund is absent before its Formation Date, with all that’s at it, and its investors before its first sale', !on('2024-09-15', 'fund3a') && !on('2024-09-15', 'fund3a_name')
    && !on('2024-09-15', 'own_inv3a_3a') && !on('2024-09-15', 'gp_of_3a') && on('2024-09-16', 'fund3a') && !on('2024-09-16', 'own_inv3a_3a') && on('2024-11-15', 'own_inv3a_3a'));
  check('the Blocker was in good standing from its formation', wb.asOf(C, '2023-12-31').blocker_good?.tag === true && wb.asOf(C, TODAY).blocker_good?.tag === true);
  check('a filing date renews on the day it names', pct('2026-02-23', 'blocker_juris_frtax') === '2025-02-26' && pct('2026-02-24', 'blocker_juris_frtax') === '2026-02-24');
  // A tax year's payment is at that year, from the day it was made; the jurisdiction keeps none.
  check('a payment holds at its tax year from the day it was made', !on('2025-05-27', 'tax_fund_2024_paid') && pct('2025-05-28', 'tax_fund_2024_paid') === '2025-05-28'
    && pct(TODAY, 'tax_fund_2023_paid') === '2024-05-29' && pct(TODAY, 'tax_fund_2025_paid') === '2026-05-27' && N.segmentOf(now, 'tax_fund_2025') === 'Fund III, tax year 2025'
    && N.placeOf(now, 'tax_fund_2025_paid') === 'Fund III, tax year 2025 › Annual Tax Paid' && !Object.values(now).some(r => r.edge === 'Annual Tax Paid' && !now[r.at]?.args), N.placeOf(now, 'tax_fund_2025_paid'));
  // ---- The chart's words, and a view's own notes ----
  check('an object reads by its Name, or its Short Name where room is short', N.nameOf(now, 'fund') === 'Calder Ridge Capital Partners III, L.P.' && N.shortOf(now, 'fund') === 'Fund III');
  check('a view reads by its Name note, and an unnamed object as its kind', N.nameOf(now, 'view_40act') === '40 Act' && Tree.isView(now.view_40act)
    && N.nameOf({ ...now, x: { kind: 'Entity' } }, 'x') === 'Entity');
  check('a record’s place, step by step', N.placeOf(now, 'fund_tax') === 'Fund III › Entity Type: Limited Partnership › Tax Classification: Partnership', N.placeOf(now, 'fund_tax'));
  check('a relation by its name, its sides in its edges’ order', N.nameOf(now, 'own_fund_blkr') === 'Ownership' && N.segmentOf(now, 'own_fund_blkr').startsWith('Fund III → '), N.segmentOf(now, 'own_fund_blkr'));
  check('… two as their line joins them, three as their sentence says them', N.segmentOf(now, 'sign_okfr_fund') === 'David R. Okafor for Fund III, via GP III'
    && j(N.placed(now, 'sign_okfr_fund').map(s => s.join)) === j(['', ' for ', ', via ']) && N.placed(now, null, now.own_fund_blkr.args.slice().reverse()).map(s => s.join + s.text).join('') === N.segmentOf(now, 'own_fund_blkr'),
    N.segmentOf(now, 'sign_okfr_fund'));
  check('a view’s layout is a note at its View object', j(N.value('Layout', { id: 'mvp9abrp01co8c', kind: 'View' })) === j({ rows: { kind: 'Entity' } }) && N.value('Layout', { id: 'view_main', kind: 'View' }) === undefined);
  {
    const w = fresh(), p = { id: 'view_40act', kind: 'View' };
    commit(w, tx => tx.note('As Of', p, '2025-01-01'));
    commit(w, tx => tx.note('Description', { args: [{ edge: 'EIN', loc: { id: 'fund', kind: 'Entity' } }] }, 'Its own'));
    const M = w.notes(C);
    check('tx.note writes at exactly its pattern', M.value('As Of', p) === '2025-01-01' && M.description(Tree.treeOf(w.asOf(C, TODAY), 'fund_ein')) === 'Its own'
      && M.description(Tree.treeOf(w.asOf(C, TODAY), 'gp_ein')) === N.description(tree('gp_ein')));
    commit(w, tx => tx.note('As Of', p, undefined));
    check('… and removes it when given nothing', w.notes(C).value('As Of', p) === undefined);
    commit(w, tx => tx.update('fund_ein', { value: '99-9999999' }), { day: '2025-01-01' });
    check('tx.update changes the version in force, from the day shown', w.asOf(C, TODAY).fund_ein.value === '99-9999999' && w.asOf(C, '2024-12-31').fund_ein.value === '92-4810337');
  }
  const moment = '2024-06-20T00:00:00Z', then = wb.at(moment);
  check('the log as it stood keeps the changes made by then', then.changes().length === wb.changes().filter(c => c.when <= moment).length
    && then.changes().every(c => c.when <= moment) && !then.asOf(C, TODAY).caygp && then.asOf(C, TODAY).fund_agent && !wb.asOf(C, TODAY).fund_agent);

  // ---- Editing with a day shown: splitting validity ----
  {
    const w = fresh(), r = now.own_us_fund_pct;
    const c = commit(w, tx => tx.set('own_us_fund_pct', { ...r, value: 0.673 }), { day: '2023-09-01' });
    const rows = w.item(C, 'own_us_fund_pct');
    check('setting a value with a day shown splits its validity there', rows.length === 2 && rows[0].value === 0.716 && rows[0].before === '2023-09-01'
      && rows[1].value === 0.673 && rows[1].since === '2023-09-01' && c.removes.length === 1 && c.adds.length === 2, j(rows));
    check('so the chart differs either side of the day', w.asOf(C, '2023-08-31').own_us_fund_pct.value === 0.716 && w.asOf(C, '2023-09-01').own_us_fund_pct.value === 0.673);
    commit(w, tx => tx.set('own_us_fund_pct', { ...r, value: 0.674 }));
    const fixed = w.item(C, 'own_us_fund_pct');
    check('Today corrects the value in force, and keeps its period', fixed.length === 2 && fixed[0].value === 0.716 && fixed[1].value === 0.674 && fixed[1].since === '2023-09-01');
    commit(w, tx => tx.remove('own_okfr_mgmt'), { day: '2025-01-01' });
    check('removing with a day shown ends a record there, with what’s at it', w.asOf(C, '2024-12-31').own_okfr_mgmt_pct && !w.asOf(C, '2025-01-01').own_okfr_mgmt
      && !w.asOf(C, '2025-01-01').own_okfr_mgmt_pct && !w.deleted(C).some(d => d.item === 'own_okfr_mgmt'));
    const id = commit(w, tx => tx.add('record', { args: [{ edge: 'Owner', at: 'pension' }, { edge: 'Owned', at: 'fund' }], tag: true }, 'own_halcyon'), { day: '2023-09-01' });
    check('a record added with a day shown starts on it', id && !w.asOf(C, '2023-08-31').own_halcyon && w.asOf(C, '2023-09-01').own_halcyon);
  }

  // ---- Reversing, which Undo, Redo and Restore do ----
  {
    const w = fresh(), target = () => w.asOf(C, TODAY).fund_target.value, back = c => w.reverse(c.id, WHO);
    const c0 = commit(w, tx => tx.set('fund_target', { ...now.fund_target, value: 800000000 }));
    const u0 = back(c0), undone = target(), r0 = back(u0), redone = target();
    back(r0);
    check('a reverse takes a change back, and its own reverse puts it back', undone === 750000000 && redone === 800000000 && target() === 750000000 && u0.reverses === c0.id);
    const steps = [], made = [1, 2, 3].map(n => commit(w, tx => tx.set('fund_target', { ...now.fund_target, value: n })));
    const undos = [...made].reverse().map(c => { const u = back(c); steps.push(target()); return u; });
    const redos = [...undos].reverse().map(u => { const r = back(u); steps.push(target()); return r; });
    [...redos].reverse().forEach(back);
    check('reverses step through several changes to one record, and back', j(steps) === j([2, 1, 750000000, 1, 2, 3]) && target() === 750000000, j(steps));
    const mine = commit(w, tx => tx.set('fund_name', { ...now.fund_name, value: 'Fund III' }));
    commit(w, tx => tx.set('fund_name', { ...now.fund_name, value: 'Fund 3' }), { who: 'Ann Lee' });
    check('a change can’t be reversed once it has changed since', typeof back(mine) === 'string' && !w.canReverse(mine.id) && w.asOf(C, TODAY).fund_name.value === 'Fund 3');
    const del = w.deleted(C).find(d => d.item === 'fund_agent');
    // The registered agents once kept as text, the per-entity Annual Tax Due, Amount and Paid, now one for each
    // tax year, and the positions views no longer draw.
    const PER_ENTITY = ['fund_agent', 'gp_agent', 's1b', 'sq', 'fund_juris_tax', 'gp_juris_tax', 'mgmt_juris_tax', 'holdco_juris_tax', 'fund3a_juris_tax'];
    const dropped = w.deleted(C), others = dropped.filter(d => !PER_ENTITY.includes(d.item));
    check('deleted items are read off the log', dropped.length - others.length === 9 && others.every(d => d.rows.every(r => r.label === 'Position')) && del.rows[0].value === 'The Corporation Trust Company',
      j(dropped.map(d => d.item).sort()));
    w.reverse(del.change, WHO);
    check('restoring an older change brings it back', w.asOf(C, TODAY).fund_agent?.value === 'The Corporation Trust Company' && !w.deleted(C).some(d => d.item === 'fund_agent'));
    const rows = w.rows(C).length;
    const removal = commit(w, tx => tx.remove('northpine'));
    const gone = w.asOf(C, TODAY);
    check('removing takes what depends on it, its notes too', !gone.northpine && !gone.northpine_name && !gone.own_fund_npine_pct && !gone.pos_chen_npine
      && !w.notes(C).position(tree('northpine'), 'view_main'));
    back(removal);
    check('one reverse brings all of it back', w.rows(C).length === rows && w.asOf(C, TODAY).own_fund_npine_pct?.value === 0.64 && w.notes(C).position(tree('northpine'), 'view_main'));
  }

  // ---- Restoring an item deleted: it, and what was at it, and nothing else its deletion did ----
  {
    const w = fresh(), years = () => Object.values(w.asOf(C, TODAY)).filter(r => r.kind === 'Tax Year').length, live = () => w.rows(C).length;
    const paid = w.deleted(C).find(d => d.item === 'fund_juris_tax'), revision = w.changes().find(c => c.id === paid.change);
    const y0 = years(), n0 = live(), r = w.restore(C, 'fund_juris_tax', WHO);
    check('restoring one payment a revision removed brings back that payment, every version of it, and nothing more', typeof r === 'object' && !r.removes.length && r.restores === revision.id
      && r.adds.length === paid.rows.length && r.adds.every(x => x.record === 'fund_juris_tax' && !paid.rows.some(p => p.id === x.id)) && live() === n0 + paid.rows.length
      && w.asOf(C, TODAY).fund_juris_tax?.value === '2026-05-27' && w.asOf(C, '2025-01-01').fund_juris_tax?.value === '2024-05-29', j(r).slice(0, 200));
    check('… the rest of the revision stands: its tax years, and the other payments it removed', years() === y0 && y0 > 0 && ['gp_juris_tax', 'mgmt_juris_tax', 'holdco_juris_tax', 'fund3a_juris_tax'].every(id => w.deleted(C).some(d => d.item === id)));
    check('an item not deleted isn’t restored', w.restore(C, 'fund', WHO) === null && w.restore(C, 'fund_juris_tax', WHO) === null);
    const n1 = live();
    commit(w, tx => tx.remove('northpine'));
    const npine = w.restore(C, 'northpine', WHO);
    check('an entity restored comes back with what was at it: its entries, relations and notes', live() === n1 && npine.restores && w.asOf(C, TODAY).own_fund_npine_pct?.value === 0.64
      && w.asOf(C, TODAY).northpine_name && w.notes(C).position(tree('northpine'), 'view_main'));
    w.reverse(npine.id, WHO);
    check('… its undoing deletes it again, as the restore’s reverse', !w.asOf(C, TODAY).northpine && w.deleted(C).find(d => d.item === 'northpine')?.change === w.changes().at(-1).id);
    w.restore(C, 'northpine', WHO);
    // A relation at two things deleted apart: it went with the first, and can come back once both are there.
    const chen = commit(w, tx => tx.remove('chen'));
    commit(w, tx => tx.remove('northpine'));
    w.restore(C, 'chen', WHO);
    check('what was at it and at something still deleted stays deleted', w.asOf(C, TODAY).chen && !w.asOf(C, TODAY).pos_chen_npine && w.deleted(C).find(d => d.item === 'pos_chen_npine')?.change === chen.id);
    w.restore(C, 'northpine', WHO);
    check('… and once both are there, comes back by itself', w.asOf(C, TODAY).northpine && !w.asOf(C, TODAY).pos_chen_npine && w.restore(C, 'pos_chen_npine', WHO)?.restores === chen.id && w.asOf(C, TODAY).pos_chen_npine);
    // An entry deleted before what it's at can't come back without it.
    commit(w, tx => tx.remove('fund_file'));
    commit(w, tx => tx.remove('fund_juris'));
    const m = w.changes().length, alone = w.restore(C, 'fund_file', WHO);
    check('an item whose place is gone can’t come back alone, and nothing is changed', alone === 'Something it’s at no longer exists.' && w.changes().length === m, alone);
    w.restore(C, 'fund_juris', WHO);
    check('… until its place is back', !w.asOf(C, TODAY).fund_file && w.restore(C, 'fund_file', WHO)?.restores && w.asOf(C, TODAY).fund_file?.value === '7351234');
  }

  // ---- Checks on a change ----
  {
    const w = fresh(), add = r => commit(w, tx => tx.add('record', r));
    check('two records can’t share an argumentation', add({ at: 'fund', edge: 'formation date', field: 'date', value: '2023-01-01' }) === 'formation date is already recorded here.');
    check('the schema’s conditions hold', add({ at: 'bdc', edge: 'EIN', field: 'number', value: 5 }) === 'EIN can’t be both text and a number.');
    check('an entry needs what it’s at', add({ at: 'nothing', edge: 'EIN', field: 'text', value: '1' }) === 'Something it’s at no longer exists.');
    check('a change that removes what isn’t live is refused', w.apply({ id: 'x', who: WHO, when: TODAY, chart: C, removes: ['nope'], adds: [] }) === 'It has changed since.');
    check('a change with nothing in it is none', w.edit({ chart: C, who: WHO }).commit() === null);
  }

  // ---- Renaming and moving ----
  {
    const w = fresh(), ownForm = { args: [{ edge: 'Owner', loc: {} }, { edge: 'Owned', loc: {} }] }, first = w.changes().length;
    // The latest changes taken back, the latest first.
    const back = n => w.changes().slice(-n).reverse().forEach(c => w.reverse(c.id, WHO));
    commit(w, tx => tx.rename({ args: [{ edge: 'Percentage', loc: ownForm }] }, 'Percentage', 'Interest'));
    const st = w.asOf(C, TODAY), M = w.notes(C), S2 = w.schema(C);
    check('renaming relabels every record like it, every version', st.own_fund_blkr_pct.edge === 'Interest' && w.item(C, 'own_fund_corvane_pct').every(r => r.edge === 'Interest'));
    check('… the schema', Object.values(S2).some(t => t.args?.[0].edge === 'Interest') && !Object.values(S2).some(t => t.args?.[0].edge === 'Percentage'));
    check('… and the notes, so styles still reach it', M.formats(Tree.treeOf(st, 'own_fund_blkr_pct'), 'view_main').Shown?.value === true);
    commit(w, tx => tx.rename({ kind: 'Investor Group' }, 'Investor Group', 'Investor Class'));
    const st2 = w.asOf(C, TODAY), M2 = w.notes(C);
    check('renaming a kind', st2.inv_us.kind === 'Investor Class' && M2.formats(Tree.treeOf(st2, 'inv_us'), 'view_main').Fill?.value === '#e2f0d9'
      && M2.listName(Tree.treeOf(st2, 'own_us_fund'), 'Owner') === 'Owners');
    commit(w, tx => tx.rename({ out: { choice: 'Limited Partnership' }, args: [{ edge: 'Entity Type', loc: {} }] }, 'Limited Partnership', 'LP'));
    const st3 = w.asOf(C, TODAY), M3 = w.notes(C);
    check('renaming an option', st3.fund_type.choice === 'LP' && M3.formats(Tree.treeOf(st3, 'fund_type'), 'view_main').Shape?.value === 'triangle'
      && M3.definitions(w.schema(C)).find(d => d.id === 'def_tax').covers.some(k => k.includes('choice:lp')));
    commit(w, tx => tx.rename({ args: [{ edge: 'Owner', loc: {} }, { edge: 'Owned', loc: {} }] }, 'Owner', 'Holder'));
    const M4 = w.notes(C), o = Tree.treeOf(w.asOf(C, TODAY), 'own_us_fund');
    check('renaming an edge of a relation, its list name and order following', o.args.some(a => a.edge === 'Holder') && M4.name(o) === 'Ownership'
      && M4.listName(o, 'Holder') === 'Owners' && j(M4.edges(o)) === j(['Holder', 'Owned']));
    back(w.changes().length - first);
    const canon = st => j(Object.keys(st).sort().map(k => [k, st[k]]));
    const notesOf = x => canon(Object.fromEntries(x.rows(C).filter(r => 'note' in r).map(r => [r.note, [r.pattern, r.param]])));
    const recDiff = Object.keys(now).filter(k => j(w.asOf(C, TODAY)[k]) !== j(now[k]));
    const specDiff = Object.keys(w.schema(C)).filter(k => !S[k]);
    check('undoing the renames restores everything', !recDiff.length && !specDiff.length && notesOf(w) === notesOf(wb), `${recDiff.slice(0, 3)} ${specDiff.slice(0, 2)}`);

    const p = Tree.bare(Tree.specOf(tree('mgmt_managed')));
    commit(w, tx => tx.add('note', { label: 'Description', pattern: p, value: 'Run by its managers.' }));
    commit(w, tx => tx.moveUp(p));
    const st4 = w.asOf(C, TODAY), moved = Tree.treeOf(st4, 'mgmt_managed');
    check('moving an entry up a level moves it, its specification and its notes', st4.mgmt_managed.at === 'mgmt' && w.schema(C)[Tree.key(Tree.specOf(moved))]
      && !w.schema(C)[Tree.key(Tree.specOf(tree('mgmt_managed')))] && w.notes(C).description(moved) === 'Run by its managers.');
    back(1);
    check('and undoing it moves them back', w.asOf(C, TODAY).mgmt_managed.at === 'mgmt_type' && w.notes(C).description(tree('mgmt_managed')) === 'Run by its managers.');
  }

  // ---- The union of logs ----
  {
    const a = fresh(), b = fresh(), c = fresh();
    commit(a, tx => tx.set('fund_ein', { ...now.fund_ein, value: '11-1111111' }), { who: 'Ann Lee' });
    commit(a, tx => tx.remove('own_fund_npine'), { who: 'Ann Lee' });
    commit(b, tx => tx.set('own_fund_npine_pct', { ...now.own_fund_npine_pct, value: 0.65 }), { who: 'Bob Diaz' });
    commit(c, tx => tx.set('gp_ein', { ...now.gp_ein, value: '33-3333333' }), { who: 'Cy Park' });
    const U = (x, y) => Log.open(x).merge(y);
    check('union is commutative', j(U(a, b)) === j(U(b, a)));
    check('union is associative', j(U(U(a, b), c)) === j(U(a, U(b, c))));
    check('union is idempotent', j(U(a, a)) === j(a) && j(U(U(a, b), b)) === j(U(a, b)));
    const m = U(U(a, b), c), st = m.asOf(C, TODAY);
    check('the union keeps everyone’s changes', st.fund_ein.value === '11-1111111' && st.gp_ein.value === '33-3333333' && !st.own_fund_npine);
    check('a value set at something another deleted is kept aside, and back with it', m.item(C, 'own_fund_npine_pct')[0]?.value === 0.65 && !st.own_fund_npine_pct
      && m.reverse(m.deleted(C).find(d => d.item === 'own_fund_npine').change, 'Ann Lee') && m.asOf(C, TODAY).own_fund_npine_pct?.value === 0.65);
    let heard = 0;
    const stop = a.subscribe(cs => heard += cs.length);
    a.merge(b); a.merge(b);
    stop();
    a.merge(c);
    check('subscribers hear of changes once', heard === 1 && j(a) === j(U(U(fresh(), b), U(c, a))));
  }

  // ---- Disagreements, settled by keeping one ----
  {
    const ann = fresh(), bob = fresh();
    commit(ann, tx => tx.update('own_fund_npine_pct', { value: 0.7 }), { who: 'Ann Lee' });
    commit(bob, tx => tx.update('own_fund_npine_pct', { value: 0.65 }), { who: 'Bob Diaz' });
    const m = Log.open(ann).merge(bob), ds = m.disagreements(C);
    check('two people changing one value at once disagree', fresh().disagreements(C).length === 0 && ds.length === 1 && ds[0].rows.map(r => r.who).sort().join() === 'Ann Lee,Bob Diaz', j(ds.map(d => d.rows.map(r => r.who))));
    const keep = ds[0].rows.find(r => r.who === 'Bob Diaz').row.id;
    commit(m, tx => tx.keep(keep));
    check('… and keeping one settles it, as a change', !m.disagreements(C).length && m.asOf(C, TODAY).own_fund_npine_pct.value === 0.65);
  }

  // ---- JSON ----
  {
    const text = j(wb), back = Log.open(JSON.parse(text));
    check('the log round-trips through JSON', j(back) === text && Log.open(text).changes().length === wb.changes().length
      && j(back.asOf(C, '2024-07-01')) === j(wb.asOf(C, '2024-07-01')) && j(back.notes(C).styles('view_40act')) === j(fortyAct));
    check('the sample file is the log as it saves itself', j(json) === text);
  }

  // ---- Values ----
  check('dates parse as typed and read in full, short, or by month', Tree.parseDate('3/4/19') === '2019-03-04' && Tree.parseDate('Sept. 1, 2023') === '2023-09-01'
    && Tree.parseDate('2023-02-30') === null && Tree.formatDate('2023-02-14') === 'February 14, 2023' && Tree.formatDate('2023-02-14', 'short') === 'Feb 14, 2023'
    && Tree.formatDate('2023-02-14', 'month') === 'February 2023' && Tree.isoOf(new Date(2024, 1, 29, 23, 30)) === '2024-02-29' && Log.today() === Tree.isoOf(new Date()));
  check('values parse and read by datatype', Tree.parse('percent', '71.6') === 0.716 && Tree.parse('money', '$1,000') === 1000 && Tree.parse('number', '5%') === undefined
    && Tree.format('percent', 0.716) === '71.6%' && Tree.format('percent', 0.26696) === '26.696%' && Tree.format('money', 750000000) === '$750,000,000'
    && Tree.format('document', 'https://x/a%20b.pdf') === 'a b.pdf' && Tree.format('document', 'https://contoso.sharepoint.com/:b:/s/FundLegal/EaBcD123xyz?e=AbC12') === 'PDF in SharePoint');
  check('an output reads as its value, its option, or Yes and No', Tree.outputText(now.fund_good) === 'Yes' && Tree.outputText(now.fund_erisa) === 'No'
    && Tree.outputText(now.fund_juris) === 'Delaware' && Tree.outputText(now.fund_target) === '$750,000,000');
  check('a day of the year is typed with its month’s name or as a date, kept as ISO’s --MM-DD, and read without a year', Tree.parse('yearly', 'December 31') === '--12-31'
    && Tree.parse('yearly', 'Dec. 31') === '--12-31' && Tree.parse('yearly', '31 December') === '--12-31' && Tree.parse('yearly', '12/31') === '--12-31' && Tree.parse('yearly', '2023-12-31') === '--12-31'
    && Tree.parse('yearly', 'Feb 29') === '--02-29' && Tree.parse('yearly', 'June 31') === undefined && Tree.parseDate('12/31') === null && Tree.format('yearly', '--12-31') === 'December 31'
    && Tree.formatDate('--06-30', 'short') === 'Jun 30' && Tree.classify('June 30') === 'yearly' && Tree.classify('6/30') === 'text');
  check('what’s typed is classified', ['text', 'number', 'percent', 'money', 'date', 'document'].join() === ['Delaware', '1,000', '12.5%', '$5', 'March 1, 2024', 'https://x/y'].map(Tree.classify).join()
    && Tree.classify('0803456789') === 'text');
}

Promise.resolve().then(() => run(SAMPLE))
  .catch(e => check('runs', false, e.stack ?? e))
  .finally(() => {
    const failed = out.filter(c => !c.ok);
    const line = c => `${c.ok ? 'pass' : 'FAIL'}  ${c.name}${c.detail ? `  (${c.detail})` : ''}`;
    document.getElementById('out').innerHTML = [`${out.length - failed.length} passed, ${failed.length} failed`, '',
      ...failed.map(c => `<span class="fail">${line(c).replace(/</g, '&lt;')}</span>`), ...(failed.length ? [''] : []),
      ...out.filter(c => c.ok).map(line).map(s => s.replace(/</g, '&lt;'))].join('\n');
  });
</script>
</body>

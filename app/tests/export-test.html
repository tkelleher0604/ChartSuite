<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dendra export test</title>
<style>
  body { margin: 0; padding: 20px; background: #fafafa; color: #18181b; font: 13px/1.5 ui-monospace, Consolas, monospace; }
  .fail { color: #b42318; }
  @media (prefers-color-scheme: dark) { body { background: #111113; color: #e4e4e7; } .fail { color: #f97066; } }
</style>
</head>
<body>
<pre id="out">Running…</pre>
<script src="../../vendor/elkjs/elk.bundled.js"></script>
<script src="../core/tree.js"></script>
<script src="../core/notes.js"></script>
<script src="../core/log.js"></script>
<script src="../core/formulas.js"></script>
<script src="../core/layout.js"></script>
<script src="../core/scene.js"></script>
<script src="../sample/calder-ridge.js"></script>
<script src="../ui/export.js"></script>
<script>
// Checks of the exports (export.js) on the sample, dressed with a frame, a bracket, a title and a key: each
// file is taken through Export.onFile instead of being downloaded, and read back. A deck is unzipped with
// the JSZip PptxGenJS brings, a PDF's streams inflated, a calendar read line by line. Nothing is saved.
const out = [];
const check = (name, ok, detail = '') => out.push({ name, ok: !!ok, detail: String(detail ?? '') });
const C = 'calder-ridge', DAY = '2026-10-26', WHO = 'Dana Jordan', EMU = 9525;
const PNG = 'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNkYPhfDwAChwGA60e6kgAAAABJRU5ErkJggg==';
const j = x => JSON.stringify(x);

function writeNote(tx, N, label, pattern, view, value) {
  const k = Tree.key(pattern), old = N.notes(label).find(n => (n.view ?? null) === (view ?? null) && !n.param && Tree.key(n.pattern) === k);
  const row = { label, pattern, ...(view && { view }), value };
  if (old) tx.set(old.note, row); else tx.add('note', row);
}
const xml = s => new DOMParser().parseFromString(s, 'application/xml');
// How much smaller a page is drawn on its sheet.
const fitOf = page => Math.min(page.sheet.w / page.w, page.sheet.h / page.h);
const tags = (el, name) => [...el.getElementsByTagName(name)];
const inflate = async bytes => new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate'))).arrayBuffer());

async function run() {
  // ---- The sample, dressed ----
  const wb = Log.open(SAMPLE);
  const worked = () => { const N = wb.notes(C), S = wb.schema(C); return Formulas.computeState(wb.asOf(C, DAY), N.definitions(S), { relations: N.relations(S) }); };
  let st = worked().records;
  const views = Object.keys(st).filter(id => Tree.isView(st[id]) && !wb.notes(C).value('Layout', { id, kind: 'View' })?.rows)
    .sort((a, b) => (wb.notes(C).order({ id: a, kind: 'View' }) ?? 99) - (wb.notes(C).order({ id: b, kind: 'View' }) ?? 99));
  {
    const tx = wb.edit({ chart: C, who: WHO }), N = wb.notes(C);
    for (const view of views) {
      const cayman = { out: { choice: 'Cayman Islands' }, args: [{ edge: 'Jurisdiction', loc: {} }] }, investors = { kind: 'Investor Group' };
      writeNote(tx, N, 'Frame', cayman, view, 'dashed');
      writeNote(tx, N, 'Caption', cayman, view, 'Offshore');
      writeNote(tx, N, 'Frame', investors, view, 'bracket');
      writeNote(tx, N, 'Caption', investors, view, 'Investors');
      tx.add('shape', { view, geometry: 'legend', x: 48, y: 1200, w: 520, title: 'Key', columns: 2 });
      tx.add('shape', { view, geometry: 'text', x: 640, y: 1200, w: 640, h: 30, text: 'Calder Ridge Capital Partners III, L.P.', format: { Size: 20, Bold: true } });
    }
    // A picture, and an arrow drawn by hand.
    tx.add('shape', { view: views[0], geometry: 'picture', x: 1300, y: 1200, w: 60, h: 40, src: `data:image/png;base64,${PNG}` });
    tx.add('shape', { view: views[0], geometry: 'line', points: [[1400, 1220], [1500, 1220], [1500, 1260]], format: { Arrow: 'end' } });
    // A document known by its address, dated: the calendar names it by its file alone.
    const doc = tx.add('record', { kind: 'Document' });
    tx.add('record', { at: doc, edge: 'Name', field: 'text', value: '\\\\fs01\\Legal\\Calder Ridge\\Side Letter - Halcyon.pdf' });
    tx.add('record', { at: doc, edge: 'Document Date', field: 'date', value: '2026-03-02' });
    const c = tx.commit();
    if (typeof c === 'string') throw new Error(c);
  }
  const R = worked();
  st = R.records;
  const scenes = views.map(v => ({ ...Scene.of(wb, C, v, DAY, { state: st }), name: wb.notes(C).nameOf(st, v) }));
  const main = scenes[0], boxes = s => s.marks.filter(m => m.type === 'box'), lines = s => s.marks.filter(m => m.type === 'line');
  const files = [];
  Export.onFile = (blob, name) => files.push({ blob, name });

  check('the libraries aren’t loaded before an export needs them', typeof PptxGenJS === 'undefined' && typeof window.jspdf === 'undefined');

  // ---- PowerPoint ----
  {
    const t0 = performance.now();
    const blob = await Export.write('pptx', scenes, 'Calder Ridge Fund III structure', { author: WHO, R, N: wb.notes(C) });
    const ms = performance.now() - t0;
    check('a deck of every view is written through the hook, not downloaded', files.at(-1)?.blob === blob && files.at(-1).name === 'Calder Ridge Fund III structure.pptx', files.at(-1)?.name);
    check('a deck of four views in under 2 s, libraries loaded on first use', ms < 2000 && typeof PptxGenJS === 'function', `${ms.toFixed(0)} ms`);
    const zip = await JSZip.loadAsync(blob);
    const slides = Object.keys(zip.files).filter(f => /^ppt\/slides\/slide\d+\.xml$/.test(f));
    check('one slide for each view', slides.length === scenes.length, slides.length);
    const pres = xml(await zip.file('ppt/presentation.xml').async('string')), sz = tags(pres, 'p:sldSz')[0];
    const W = Math.max(...scenes.map(s => s.page.sheet.w)), H = Math.max(...scenes.map(s => s.page.sheet.h));
    check('the slides are 13.33 × 7.5 in, the sheet of every page', W === 1280 && H === 720 && Math.abs(+sz.getAttribute('cx') - W * EMU) < 2 && Math.abs(+sz.getAttribute('cy') - H * EMU) < 2, `${sz.getAttribute('cx')} × ${sz.getAttribute('cy')}`);
    // Each page is drawn on its sheet smaller by its scale, and every size with it.
    const k = fitOf(main.page);
    check('a page grown to hold its chart is drawn at its scale', main.page.w > 1280 && Math.abs(k - main.page.scale) < 0.002, `${main.page.w} × ${main.page.h} at ${k.toFixed(4)}`);

    const doc = xml(await zip.file('ppt/slides/slide1.xml').async('string'));
    check('the slide is well-formed XML', !tags(doc, 'parsererror').length);
    const sps = tags(doc, 'p:sp'), cxns = tags(doc, 'p:cxnSp');
    const name = el => el.getElementsByTagName('p:cNvPr')[0].getAttribute('name'), idOf = el => el.getElementsByTagName('p:cNvPr')[0].getAttribute('id');
    // A paragraph's text, its lines where they're written one by one joined as they were typed; spaces as spaces.
    const textOf = el => tags(el, 'a:p').map(p => tags(p, 'a:t').map(t => t.textContent).join(tags(p, 'a:br').length ? ' ' : '').replace(/\s/g, ' ')).filter(Boolean);
    const shapeOf = b => sps.find(sp => name(sp) === b.texts[0]?.text && j(textOf(sp)) === j(b.texts.map(it => it.text.replace(/\s/g, ' '))));
    const PRESET = { rect: 'rect', rounded: 'roundRect', oval: 'ellipse', triangle: 'triangle' };
    const missing = boxes(main).filter(b => { const sp = shapeOf(b); return !sp || tags(sp, 'a:prstGeom')[0]?.getAttribute('prst') !== PRESET[b.shape]; });
    check('every box is a shape of its preset geometry, holding its texts as paragraphs', !missing.length, missing.map(b => b.id).join(', '));
    const fund = shapeOf(main.byId.get('fund')), run = tags(fund, 'a:rPr')[0], latin = tags(fund, 'a:latin')[0];
    check('a text keeps its font, weight and color, at the size it has on the slide, 1 pt at least', latin.getAttribute('typeface') === 'Arial' && run.getAttribute('sz') === String(Math.max(100, Math.round(1000 * k))) && run.getAttribute('b') === '1'
      && tags(run, 'a:srgbClr')[0].getAttribute('val') === '000000', run.outerHTML.slice(0, 120));
    const xf = tags(fund, 'a:xfrm')[0], off = tags(xf, 'a:off')[0], ext = tags(xf, 'a:ext')[0], f = main.byId.get('fund'), ox = (W - main.page.w * k) / 2, oy = (H - main.page.h * k) / 2;
    check('a box sits where the scene places it, its page on the middle of its slide', Math.abs(+off.getAttribute('x') - (ox + f.x * k) * EMU) < 2 && Math.abs(+off.getAttribute('y') - (oy + f.y * k) * EMU) < 2
      && Math.abs(+ext.getAttribute('cx') - f.w * k * EMU) < 2, `${off.getAttribute('x')}, ${off.getAttribute('y')}`);

    // Lines break where the scene breaks them, and PowerPoint never wraps them again: each paragraph's lines
    // are the scene's, one to each line break, written with plain spaces, as typed.
    const plain = s => s.replace(/\u00a0/g, ' ');
    const lined = sp => tags(sp, 'a:p').flatMap(p => { const ls = [''];
      for (const el of p.children) if (el.localName === 'br') ls.push(''); else if (el.localName === 'r') ls[ls.length - 1] += tags(el, 'a:t')[0].textContent;
      return ls; }).filter((l, i, all) => l || all.length === 1);
    const wrong = boxes(main).filter(b => { const sp = shapeOf(b); return tags(sp, 'a:bodyPr')[0].getAttribute('wrap') !== 'none' || j(lined(sp)) !== j(b.texts.flatMap(it => it.lines.map(l => plain(l.text)))); });
    check('PowerPoint never wraps a box’s text again: it doesn’t wrap, and its lines are the scene’s, each ended by a line break', !wrong.length,
      wrong.map(b => `${b.id}: ${j(lined(shapeOf(b)))}`).join('; '));
    const all = await Promise.all(slides.map(f => zip.file(f).async('string').then(xml)));
    const texted = all.flatMap(d => tags(d, 'p:txBody')).filter(b => tags(b, 'a:t').length);
    check('… nor any other text, on any slide', texted.length > 100 && texted.every(b => tags(b, 'a:bodyPr')[0].getAttribute('wrap') === 'none'), `${texted.length} texts`);
    const nbsp = all.flatMap(d => tags(d, 'a:t')).filter(t => /\u00a0/.test(t.textContent));
    check('its spaces are plain, so PowerPoint’s Find finds a name as it’s typed', !nbsp.length && all.flatMap(d => tags(d, 'a:t')).some(t => t.textContent === 'GP III, LLC' || /GP III, LLC/.test(t.textContent)),
      nbsp.slice(0, 3).map(t => j(t.textContent)).join(' '));
    // One margin for every shape: the chart's text inset 0.1 in at its scale all round, as the scene insets a
    // box's; the page's own shapes PowerPoint's own, written as nothing.
    const insets = d => [...new Set(tags(d, 'a:bodyPr').map(b => ['lIns', 'tIns', 'rIns', 'bIns'].map(a => b.getAttribute(a) ?? '').join(' ')))];
    const marginOf = s => Array(4).fill(String(Math.round(0.1 * fitOf(s.page) * 914400))).join(' '), chart = marginOf(main);
    check('every shape has one margin: the chart’s 0.1 in at its scale, all round, or PowerPoint’s own', all.every((d, i) => insets(d).every(s => s === '   ' || s === marginOf(scenes[i])))
      && boxes(main).every(b => insets(shapeOf(b))[0] === chart), all.map(insets).map(s => s.join(' / ')).join(' | '));
    // Paragraphs as the schema orders them: a paragraph's properties once, first; then its runs and breaks.
    const unordered = all.flatMap(d => tags(d, 'a:p')).filter(p => !/^(pPr,)?((r|br|fld),)*(endParaRPr,)?$/.test([...p.children].map(el => el.localName + ',').join('')));
    check('every paragraph is in the schema’s order: its properties once and first, then its runs and line breaks, its end last', !unordered.length,
      unordered.slice(0, 2).map(p => [...p.children].map(el => el.localName).join(' ')).join(' | '));
    const kerns = (await Promise.all(['ppt/presentation.xml', 'ppt/slideMasters/slideMaster1.xml'].map(f => zip.file(f).async('string')))).join('').match(/kern="\d+"/g);
    check('… its type kerned at every size, as the scene measures it, not only from 12 pt', kerns.length > 9 && kerns.every(x => x === 'kern="100"'), [...new Set(kerns)].join(' '));
    {
      // Set at its base, where the scene sets it 7 pt up, by the chart's margin.
      const body = tags(fund, 'a:bodyPr')[0], f = main.byId.get('fund'), { bottom } = (its => ({ bottom: its[0].lines[0].y - its[0].look.Size * Scene.PT * 0.93 + its.reduce((h, it) => h + it.lines.length * it.look.Size * Scene.PT * 1.2, 0) }))(f.texts);
      const lift = +body.getAttribute('bIns') / EMU / k;
      check('a triangle’s text is set at its base, lifted as the scene lifts it, by the margin every shape has', body.getAttribute('anchor') === 'b' && Math.abs(f.h - bottom - lift) < 0.5,
        `${(f.h - bottom).toFixed(2)} in the scene, ${lift.toFixed(2)} in PowerPoint`);
    }

    const byId = new Map(sps.map(sp => [idOf(sp), sp]));
    // A connector glued where a line starts and where it ends: one, or the first and last of its pieces, in one group.
    const at = (c, end) => name(byId.get(tags(c, end)[0]?.getAttribute('id')) ?? c);
    const together = (a, b) => a === b || (a.parentNode === b.parentNode && a.parentNode.localName === 'grpSp');
    const glued = lines(main).filter(l => cxns.some(a => tags(a, 'a:stCxn')[0] && at(a, 'a:stCxn') === main.byId.get(l.from).texts[0].text
      && cxns.some(b => tags(b, 'a:endCxn')[0] && at(b, 'a:endCxn') === main.byId.get(l.to).texts[0].text && together(a, b))));
    check('every line is a connector glued to the shapes of the boxes it joins', glued.length === lines(main).length && cxns.length >= lines(main).length, `${glued.length} of ${lines(main).length}`);
    const sizes = [...new Set(tags(doc, 'a:rPr').map(r => +r.getAttribute('sz')))];
    check('every size in the deck is a whole or half point, and none under 1 pt, which PowerPoint won’t open, however small the chart is drawn', sizes.every(z => z % 50 === 0 && z >= 100)
      && k * 10 < 1, `${sizes.join(' ')} at ${k}`);
    const prsts = new Set(cxns.map(c => tags(c, 'a:prstGeom')[0].getAttribute('prst')));
    const elbows = cxns.filter(c => tags(c, 'a:stCxn').length).map(c => tags(c, 'a:prstGeom')[0].getAttribute('prst'));
    check('lines are elbow connectors, as the scene’s Connector says; the key’s swatches straight', elbows.every(p => /^bentConnector[234]$/.test(p))
      && cxns.filter(c => !tags(c, 'a:stCxn').length && name(c) !== 'Line').every(c => tags(c, 'a:prstGeom')[0].getAttribute('prst') === 'straightConnector1'), [...prsts].join(' '));
    const gp = cxns.find(c => name(c) === 'General partner');
    check('a dashed line stays dashed, at its weight on the slide, the sheet’s 0.75 pt however small the chart is drawn', tags(gp, 'a:prstDash')[0].getAttribute('val') === 'dash' && tags(gp, 'a:ln')[0].getAttribute('w') === String(Math.round(0.75 * 12700)));
    const labels = lines(main).filter(l => l.labelAt && l.texts.length).flatMap(l => l.texts.map(it => it.text));
    const textBox = sp => tags(sp, 'p:cNvSpPr')[0].getAttribute('txBox') === '1';
    check('each line’s label is a text box beside it', labels.every(t => sps.some(sp => textOf(sp).includes(t) && textBox(sp))), labels.length);
    const groups = tags(doc, 'p:grpSp').filter(g => tags(g, 'p:cxnSp').length && name(g) !== 'Key');
    check('a line and its label are one group, so they move together', groups.length >= lines(main).filter(l => l.labelAt && l.texts.length).length
      && groups.every(g => tags(g, 'p:sp').length <= 1 && tags(g, 'p:cxnSp').every(c => name(c) === name(g))), `${groups.length} groups`);
    // Named as the two-box panel says its relation, both its sides by their short names; its label keeps its text.
    const st0 = R.records, short = id => wb.notes(C).shortOf(st0, main.byId.get(id).record).toLowerCase();
    const unsaid = lines(main).filter(l => !cxns.some(c => name(c).toLowerCase().includes(short(l.from)) && name(c).toLowerCase().includes(short(l.to)) && / is (an? |not )/.test(name(c))));
    const owner = groups.find(g => name(g) === 'U.S. Investors is an owner of Fund III'), its = owner && tags(owner, 'p:sp')[0];
    check('… named as the two-box panel says its relation, not by its label, which keeps its own text', !unsaid.length && !groups.some(g => /^[\d.]+%$/.test(name(g)))
      && its && name(its) === textOf(its)[0] && /^[\d.]+%$/.test(textOf(its)[0]), unsaid.map(l => l.id).join(', ') || groups.slice(0, 4).map(name).join(' | '));
    // A frame: its outline and its caption, one group behind its members; a bracket's outline its path.
    const top = [...tags(doc, 'p:spTree')[0].children].filter(el => /^(sp|grpSp|cxnSp|pic)$/.test(el.localName)).map(name);
    const frame = n => tags(doc, 'p:grpSp').find(g => name(g) === n);
    const framed = n => { const k = frame(n) && [...frame(n).children].filter(el => el.localName === 'sp'); return k?.length === 2 && !textOf(k[0]).length && name(k[0]) === n && textOf(k[1])[0] === n && textBox(k[1]); };
    check('a frame is its outline and its caption, one group behind its members', framed('Offshore') && framed('Investors') && tags(frame('Investors'), 'a:custGeom').length === 1
      && top.indexOf('Offshore') > -1 && top.indexOf('Offshore') < top.indexOf('Calder Ridge Capital Partners III (Cayman), L.P.'), top.slice(0, 6).join(' | '));
    const legend = main.marks.find(m => m.geometry === 'legend');
    check('the legend is shapes: its frame and title, a swatch and a caption for each row', sps.some(sp => name(sp) === 'Key' && textOf(sp)[0] === 'Key')
      && legend.rows.every(r => sps.some(sp => textOf(sp)[0] === r.caption.text)) && legend.rows.length > 4, legend.rows.length);
    // As a person would make it: one group, moved as one, its frame and title, each row's swatch and caption
    // named for the row.
    const legends = main.marks.filter(m => m.geometry === 'legend'), keys = tags(doc, 'p:grpSp').filter(g => name(g) === 'Key');
    const kids = g => [...g.children].filter(el => el.localName === 'sp' || el.localName === 'cxnSp');
    const whole = m => keys.find(g => { const k = kids(g); return k.length === 2 + 2 * m.rows.length && name(k[0]) === 'Key' && !textOf(k[0]).length && name(k[1]) === 'Key' && textOf(k[1])[0] === 'Key'
      && m.rows.every(r => k.filter(el => name(el) === r.caption.text).length === 2 && k.some(el => name(el) === r.caption.text && textOf(el)[0] === r.caption.text)); });
    const rect = el => [tags(el, 'a:off')[0], tags(el, 'a:ext')[0]].flatMap(x => [...x.attributes].map(a => +a.value));
    check('the Key is one group named Key, framed as its frame is, its swatches and captions named for their rows', legends.length && keys.length === legends.length
      && legends.every(whole) && keys.every(g => rect(g).every((v, i) => Math.abs(v - rect(kids(g)[0])[i]) <= 2)), `${keys.length} groups for ${legends.length} keys`);
    check('no shape goes by PptxGenJS’s name for it, and no stand-in the deck is finished from is left', !sps.some(sp => /^Text \d+$/.test(name(sp)))
      && !(await Promise.all(slides.map(f => zip.file(f).async('string')))).some(x => x.includes('·')), sps.filter(sp => /^Text \d+$/.test(name(sp))).map(name).join(', '));
    check('a free text shape is itself', sps.some(sp => textOf(sp)[0] === 'Calder Ridge Capital Partners III, L.P.' && tags(sp, 'a:rPr')[0].getAttribute('sz') === String(Math.round(2000 * k))));
    const arrow = cxns.find(c => name(c) === 'Line');
    check('a free line is a connector, its arrowhead at its end; a picture is a picture', arrow && tags(arrow, 'a:tailEnd').length && !tags(arrow, 'a:stCxn').length
      && tags(arrow, 'a:prstGeom')[0].getAttribute('prst') === 'bentConnector2' && tags(doc, 'p:pic').length === 1 && Object.keys(zip.files).some(f => /^ppt\/media\/.+\.png$/.test(f)));
    const core = await zip.file('docProps/core.xml').async('string');
    check('the deck is titled for the chart, by whoever exported it', core.includes('<dc:title>Calder Ridge Fund III structure</dc:title>') && core.includes(`<dc:creator>${WHO}</dc:creator>`));

    // Each slide's title is its title placeholder, as PowerPoint's Outline and Accessibility Checker find it,
    // on a layout as a person would set one up.
    const docs = await Promise.all(slides.map(f => zip.file(f).async('string').then(xml))), said = s => s.replace(/\s+/g, ' ').trim();
    const heads = docs.map(d => tags(d, 'p:ph').filter(ph => ph.getAttribute('type') === 'title').map(ph => ph.parentNode.parentNode.parentNode));
    const titles = scenes.map(s => said(Scene.bind(s.marks.find(m => m.role === 'title').texts.map(it => it.text).join(' '))));
    check('each slide’s title is its title placeholder, named Title, holding the title', docs.every(d => !tags(d, 'parsererror').length)
      && heads.every((h, i) => h.length === 1 && name(h[0]) === 'Title' && said(textOf(h[0]).join(' ')) === titles[i]), heads.map(h => h.length).join(' '));
    const layout = xml(await zip.file('ppt/slideLayouts/slideLayout1.xml').async('string')), lsp = tags(layout, 'p:ph')[0]?.parentNode.parentNode.parentNode;
    const def = lsp && tags(lsp, 'a:defRPr')[0], first = tags(heads[0][0], 'a:rPr')[0];
    check('… on PowerPoint’s Title Only layout, its title placeholder where the first slide’s title is, in its look', !tags(layout, 'parsererror').length
      && tags(layout, 'p:cSld')[0].getAttribute('name') === 'Title Only' && tags(lsp, 'p:ph')[0].getAttribute('type') === 'title' && j(rect(lsp)) === j(rect(heads[0][0]))
      && def.getAttribute('sz') === first.getAttribute('sz') && def.getAttribute('b') === '1' && tags(def, 'a:latin')[0].getAttribute('typeface') === 'Arial'
      && j(textOf(lsp)) === j(['Click to edit Master title style']), lsp && lsp.outerHTML.slice(0, 160));
    const app = xml(await zip.file('docProps/app.xml').async('string')), parts = tags(app, 'vt:lpstr').map(e => said(e.textContent));
    check('its properties are PowerPoint’s: no subject and no PptxGenJS, its fonts, its slides’ titles, its words, widescreen', !tags(app, 'parsererror').length
      && !/PptxGenJS/i.test(core + await zip.file('docProps/app.xml').async('string')) && !tags(xml(core), 'dc:subject')[0]?.textContent
      && j(parts.slice(-scenes.length)) === j(titles) && parts.includes('Arial') && !parts.includes('Calibri') && tags(app, 'PresentationFormat')[0].textContent === 'Widescreen'
      && +tags(app, 'Words')[0].textContent > 300 && +tags(app, 'Paragraphs')[0].textContent > 100, parts.join(' | '));
  }

  // ---- PDF ----
  {
    const t0 = performance.now();
    const blob = await Export.write('pdf', scenes, 'Calder Ridge Fund III structure');
    const ms = performance.now() - t0;
    check('a PDF of every view is written through the hook', files.at(-1)?.blob === blob && files.at(-1).name === 'Calder Ridge Fund III structure.pdf');
    check('in under 3 s, compressed: a few kilobytes a page', ms < 3000 && blob.size > 4000 && blob.size < 60000 * scenes.length, `${ms.toFixed(0)} ms, ${(blob.size / 1024).toFixed(1)} KB`);
    const bytes = new Uint8Array(await blob.arrayBuffer()), raw = new TextDecoder('latin1').decode(bytes);
    check('a page for each view', (raw.match(/\/Type \/Page\b(?!s)/g) ?? []).length === scenes.length, (raw.match(/\/Type \/Page\b(?!s)/g) ?? []).length);
    const box = /\/MediaBox \[([^\]]+)\]/.exec(raw)[1].trim().split(/\s+/).map(Number);
    check('each page is its view’s sheet, 13.33 × 7.5 in at 72 points an inch', Math.abs(box[2] - 960) < 0.1 && Math.abs(box[3] - 540) < 0.1, box.join(' '));
    check('its streams are compressed', /\/FlateDecode/.test(raw));
    const titled = scenes.map(s => s.marks.find(m => m.role === 'title').texts.map(it => it.text).join(' ').replace(/\s+/g, ' ').trim());
    check('it has a bookmark for each page, by the page’s title, as the deck’s outline has', /\/Outlines/.test(raw) && titled.every(t => raw.includes(`/Title (${t.replace(/[()\\]/g, c => `\\${c}`)})`))
      && !scenes.some(s => raw.includes(`/Title (${s.name})`)), titled.join(' | '));
    check('its properties name no generator: Dendra produced it, and created it', /\/Producer \(Dendra\)/.test(raw) && /\/Creator \(Dendra\)/.test(raw) && !/jsPDF|svg2pdf/i.test(raw),
      /\/Producer \([^)]*\)/.exec(raw)?.[0]);
    let text = '';
    for (const m of raw.matchAll(/\/Length (\d+)\s*\/Filter \/FlateDecode\s*>>\s*stream\r?\n/g)) {
      const start = m.index + m[0].length;
      text += new TextDecoder('latin1').decode(await inflate(bytes.subarray(start, start + +m[1])));
    }
    const shown = [...text.matchAll(/\(((?:\\.|[^\\)])*)\)\s*Tj/g)].map(m => m[1].replace(/\\([0-7]{1,3}|.)/g, (_, c) => /^[0-7]+$/.test(c) ? String.fromCharCode(parseInt(c, 8)) : c));
    const drawn = m => m.type === 'line' ? (m.labelAt ? m.texts : []) : [...(m.texts ?? []), ...(m.caption ? [m.caption] : []), ...(m.rows ?? []).map(r => r.caption)];
    const want = scenes.flatMap(s => s.marks.flatMap(drawn)).flatMap(it => it.lines.map(l => l.text));
    const absent = want.filter(t => !shown.includes(t));   // WinAnsi, which TextDecoder's latin1 reads
    check('every line of text is in it, as the scene breaks it', !absent.length && shown.length >= want.length, absent.slice(0, 5).join(' | ') || `${shown.length} lines`);
    check('in the standard fonts, Helvetica for Arial', /\/BaseFont \/Helvetica-Bold/.test(raw) && !/\/FontFile/.test(raw));
    check('a picture is in it', /\/Subtype \/Image/.test(raw));
  }

  // ---- The calendar ----
  {
    // The dates from the day shown on, as a calendar is for what's coming.
    const blob = Export.calendar(R, wb.notes(C), C, 'Calder Ridge Fund III structure', DAY);
    check('the calendar is written through the hook, as .ics', files.at(-1)?.blob === blob && files.at(-1).name === 'Calder Ridge Fund III structure.ics' && blob.type === 'text/calendar');
    const ics = await blob.text(), rows = ics.split('\r\n');
    const dates = Object.values(st).filter(r => r.field === 'date'), coming = dates.filter(r => r.value >= DAY);
    const starts = [...ics.matchAll(/DTSTART;VALUE=DATE:(\d{8})/g)].map(m => m[1]);
    check('one event for each date in the chart as worked out, from the day shown on, in order', (ics.match(/BEGIN:VEVENT/g) ?? []).length === coming.length && coming.length < dates.length / 2
      && starts.every((d, i) => d >= DAY.replace(/-/g, '') && (!i || d >= starts[i - 1])) && rows[0] === 'BEGIN:VCALENDAR' && rows.at(-2) === 'END:VCALENDAR', `${coming.length} of ${dates.length}`);
    check('lines end in CRLF and are folded within 75 octets', !/[^\r]\n/.test(ics) && rows.every(r => new TextEncoder().encode(r).length <= 75));
    const unfolded = ics.replace(/\r\n /g, ''), events = unfolded.split('BEGIN:VEVENT').slice(1);
    const computed = Object.entries(st).filter(([, r]) => r.field === 'date' && r.computed && r.value >= DAY);
    const unesc = s => s.replace(/\\([\\;,])/g, '$1');
    const described = computed.filter(([id]) => events.some(e => e.includes(`UID:${C}.${id}@`) && unesc(/DESCRIPTION:(.*)/.exec(e)?.[1] ?? '') === Formulas.groundText(R, id)));
    check('a worked-out date’s description is its ground on one line', computed.length > 5 && described.length === computed.length, `${described.length} of ${computed.length}`);
    const tax = events.find(e => e.includes('Annual Tax Due'));
    const summaries = text => [...text.replace(/\r\n /g, '').matchAll(/^SUMMARY:(.*)\r$/gm)].map(m => unesc(m[1]));
    check('an event says what falls due first, then whose: an object by its name in full, without the way down to it', summaries(ics).includes('Annual Return Due: Calder Ridge Capital Partners III (Cayman), L.P.')
      && !summaries(ics).some(s => s.includes('›')), summaries(ics).find(s => s.startsWith('Annual Return Due')));
    const year = Object.keys(st).find(id => st[id].args && wb.notes(C).segmentOf(st, id) === 'Fund III, tax year 2026');
    check('… a tax year as the place rule says it, one way everywhere', year && summaries(ics).includes(`Annual Tax Due: ${wb.notes(C).segmentOf(st, year)}`),
      summaries(ics).filter(s => /Tax/.test(s)).join(' | '));
    // Every date there is, for what's said of each: a relation's, as the two-box panel says it, in the formula
    // bar's words where it's there, and each side once, so one who signs for the Manager via the Manager
    // signs for the Manager.
    const plainly = summaries(await Export.calendar(R, wb.notes(C), C, 'Every date', '').text());
    window.FormulaBar = { phrase: (t, a, b, { choice } = {}) => a === 'Signatory' && !choice ? [a, ' signs for ', b] : null };
    const worded = summaries(await Export.calendar(R, wb.notes(C), C, 'Words', '').text());
    delete window.FormulaBar;
    check('… and every date there is, from no day', plainly.length === dates.length, plainly.length);
    check('… a tax paid at the year it settled, said as the place rule says it', plainly.includes('Annual Tax Paid: Fund III, tax year 2025') && plainly.includes('Annual Tax Paid: Fund III-A, tax year 2024')
      && !plainly.some(s => /^Annual Tax Paid: /.test(s) && !/, tax year \d{4}$/.test(s)), plainly.filter(s => /^Annual Tax Paid/.test(s)).join(' | '));
    const want = ['Start Date: Margaret A. Chen is a signatory of the Manager', 'Start Date: Margaret A. Chen is a signatory of Fund III, via GP III', 'Start Date: Thomas K. Lindqvist is an employee of the Manager'];
    check('… a relation’s, as the two-box panel says it, each side once: the role its first side has, the second, and any other not already said', want.every(w => plainly.includes(w))
      && !plainly.some(s => /signatory of the Manager, via/.test(s)), want.filter(w => !plainly.includes(w)).join(' | ') || plainly.filter(s => /Margaret/.test(s)).join(' | '));
    check('… in the formula bar’s words where they’re to be had', worded.includes('Start Date: Margaret A. Chen signs for the Manager') && worded.includes('Start Date: Margaret A. Chen signs for Fund III, via GP III')
      && worded.includes(want[2]), worded.filter(s => /Margaret/.test(s)).join(' | '));
    // Where two dates would read alike, the way down to each is said as well.
    const alike = plainly.filter((s, i) => plainly.indexOf(s) !== i);
    check('… no two alike: where two would read alike, each says the way down to it', !alike.length, alike.slice(0, 3).join(' | '));
    check('an all-day event, on its day', /DTSTART;VALUE=DATE:\d{8}/.test(tax) && /DTEND;VALUE=DATE:\d{8}/.test(tax) && +/DTEND;VALUE=DATE:(\d{8})/.exec(tax)[1] > +/DTSTART;VALUE=DATE:(\d{8})/.exec(tax)[1]);
    const said = [...(await files.at(-2).blob.text()).replace(/\r\n /g, '').matchAll(/^(?:SUMMARY|DESCRIPTION):(.*)$/gm)].map(m => unesc(m[1].replace(/\r$/, '')));
    const leaks = said.filter(s => /[=←]|\b[A-Z]{2,}\(|\\|:\/\//.test(s));
    check('no formula text and no file paths: a document known by its address goes by its file’s name', !leaks.length && said.includes('Document Date: Side Letter - Halcyon.pdf'), leaks.slice(0, 3).join(' | '));
  }

  // ---- One view ----
  {
    const blob = await Export.write('pptx', [scenes[3]], `Calder Ridge Fund III structure - ${scenes[3].name}`);
    const zip = await JSZip.loadAsync(blob), sz = tags(xml(await zip.file('ppt/presentation.xml').async('string')), 'p:sldSz')[0];
    check('one view is a slide of its own sheet’s size', Object.keys(zip.files).filter(f => /^ppt\/slides\/slide\d+\.xml$/.test(f)).length === 1
      && Math.abs(+sz.getAttribute('cx') - scenes[3].page.sheet.w * EMU) < 2 && files.at(-1).name === `Calder Ridge Fund III structure - ${scenes[3].name}.pptx`, files.at(-1).name);
  }

  // ---- The sample as it is, on its slides ----
  const sample = Log.open(SAMPLE), R2 = (() => { const N = sample.notes(C), S = sample.schema(C); return Formulas.computeState(sample.asOf(C, DAY), N.definitions(S), { relations: N.relations(S) }); })();
  {
    const slides = views.map(v => ({ ...Scene.of(sample, C, v, DAY, { state: R2.records, computed: R2 }), name: sample.notes(C).nameOf(R2.records, v) }));
    const zip = await JSZip.loadAsync(await Export.write('pptx', slides, 'Sample', WHO));
    const docs = await Promise.all(slides.map((_, i) => zip.file(`ppt/slides/slide${i + 1}.xml`).async('string').then(xml)));
    const named = (d, n) => tags(d, 'p:sp').find(sp => sp.getElementsByTagName('p:cNvPr')[0].getAttribute('name') === n && tags(sp, 'a:rPr').length);
    const sz = sp => sp && +tags(sp, 'a:rPr')[0].getAttribute('sz');
    const sizes = [...new Set(docs.flatMap(d => tags(d, 'a:rPr').map(r => +r.getAttribute('sz'))))].sort((a, b) => a - b);
    check('every size in the sample’s deck is a whole or half point; its title, date and Key 20, 11 and 8 pt on every slide', sizes.every(z => z % 50 === 0)
      && docs.every(d => sz(named(d, 'Title')) === 2000 && sz(named(d, 'Date')) === 1100 && sz(named(d, 'Key')) === 800), sizes.join(' '));
    const main = slides[0], jumped = main.marks.filter(m => m.type === 'line' && m.runs);
    const grouped = tags(docs[0], 'p:grpSp').filter(g => tags(g, 'p:cxnSp').length > 1 && g.getElementsByTagName('p:cNvPr')[0].getAttribute('name') !== 'Key');
    check('a line broken where another crosses it is its pieces, grouped and named as the line, its arrowheads at its ends', jumped.length >= 2 && grouped.length === jumped.length
      && grouped.every(g => { const cs = tags(g, 'p:cxnSp'); return cs.every(c => c.getElementsByTagName('p:cNvPr')[0].getAttribute('name') === g.getElementsByTagName('p:cNvPr')[0].getAttribute('name'))
        && cs.every((c, i) => !tags(c, 'a:tailEnd').length || i === cs.length - 1) && cs.every((c, i) => !tags(c, 'a:headEnd').length || i === 0); }),
      `${jumped.length} broken, ${grouped.length} groups of pieces`);
  }

  // ---- On Letter: each view drawn for the paper ----
  {
    const R = R2;
    const letter = views.map(v => ({ ...Scene.of(sample, C, v, DAY, { state: R.records, computed: R, paper: 'letter' }), name: sample.notes(C).nameOf(R.records, v) }));
    const main = letter[0];
    const raw = new TextDecoder('latin1').decode(await (await Export.write('pdf', [main], 'Letter', WHO)).arrayBuffer());
    const box = /\/MediaBox \[([^\]]+)\]/.exec(raw)[1].trim().split(/\s+/).map(Number);
    check('on Letter, a PDF page is 11 × 8.5 in, so it prints without shrinking', Math.abs(box[2] - 792) < 0.1 && Math.abs(box[3] - 612) < 0.1, box.join(' '));
    const smallest = s => Math.min(...s.marks.filter(m => m.type === 'box').map(b => Scene.toSlide(s.page, b.texts[0].look.Size)));
    const names = letter.map(smallest), shrunk = views.map(v => smallest(Scene.of(sample, C, v, DAY, { state: R.records, computed: R })) * Math.min(1056 / 1280, 816 / 720));
    check('… laid out for the paper, not shrunk to it: every view’s names print larger than its slide’s would, none under 7 pt', names.every((p, i) => p > shrunk[i] && p >= 7),
      `${names.join(', ')} against ${shrunk.map(p => p.toFixed(2)).join(', ')}`);
    const zip = await JSZip.loadAsync(await Export.write('pptx', [main], 'Letter', WHO)), sz = tags(xml(await zip.file('ppt/presentation.xml').async('string')), 'p:sldSz')[0];
    const doc = xml(await zip.file('ppt/slides/slide1.xml').async('string')), k = main.page.scale;
    const title = tags(doc, 'p:sp').find(sp => sp.getElementsByTagName('p:cNvPr')[0].getAttribute('name') === 'Title'), off = title && tags(title, 'a:off')[0];
    check('… a slide on Letter is the page, its title named so, top left at the half-inch margins', Math.abs(+sz.getAttribute('cx') - 1056 * EMU) < 2 && Math.abs(+sz.getAttribute('cy') - 816 * EMU) < 2
      && Math.abs(main.page.w * k - 1056) < 0.01 && off && Math.abs(+off.getAttribute('x') / EMU + 9.6 - 48) < 0.5 && Math.abs(+off.getAttribute('y') / EMU + 9.6 - 48) < 0.5,
      `${sz.getAttribute('cx')} × ${sz.getAttribute('cy')}, title at ${off && [+off.getAttribute('x') / EMU, +off.getAttribute('y') / EMU]}`);
    check('… and a PDF of every view on Letter has a page for each', (new TextDecoder('latin1').decode(await (await Export.write('pdf', letter, 'Letter', WHO)).arrayBuffer()).match(/\/Type \/Page\b(?!s)/g) ?? []).length === letter.length);
  }
}

Promise.resolve().then(run)
  .catch(e => check('runs', false, e.stack ?? e))
  .finally(() => {
    const failed = out.filter(c => !c.ok);
    const line = c => `${c.ok ? 'pass' : 'FAIL'}  ${c.name}${c.detail ? `  (${c.detail})` : ''}`;
    document.title = `export test: ${out.length - failed.length} pass, ${failed.length} fail`;
    document.getElementById('out').innerHTML = [`${out.length - failed.length} passed, ${failed.length} failed`, '',
      ...failed.map(c => `<span class="fail">${line(c).replace(/</g, '&lt;')}</span>`), ...(failed.length ? [''] : []),
      ...out.filter(c => c.ok).map(line).map(s => s.replace(/</g, '&lt;'))].join('\n');
  });
</script>
</body>
</html>

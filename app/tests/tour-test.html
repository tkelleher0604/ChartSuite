<title>Dendra tour test</title>
<script>
  // A very first launch: never toured, so the tour runs by itself once the window is drawn.
  try { sessionStorage.setItem('dendra.launched', '1'); localStorage.clear(); } catch {}

<script>
// The workbook opened at once, in memory: nothing is kept.
const Store = { open: async ({ sample }) => Log.open(sample), who: () => localStorage.getItem('dendra.name') || 'Dana Jordan', status: () => ({ text: '' }), subscribe: () => () => {},
  books: async () => [], where: () => null, openFile: async () => null, saveAs: async () => null, download() {}, fix() {} };
</script>
<script src="../sample/calder-ridge.js"></script>

<script src="../ui/tour.js"></script>

<script src="../ui/formatbar.js"></script>

<script>
// Checks of the tour (tour.js) on a very first launch, in the whole window, each step done as a person would
// do it: a step is done only by doing what it teaches, never by what another part announces, and the tour
// ends on the view as the person left it, with nothing it chose still chosen and nothing in the record changed.
const out = [];
const check = (name, ok, detail = '') => out.push({ name, ok: !!ok, detail: String(detail ?? '') });
const tick = (ms = 40) => new Promise(r => setTimeout(r, ms));
const until = async (f, ms = 4000) => { for (let t = 0; t < ms; t += 25) { if (f()) return true; await tick(25); } return false; };
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const txt = el => (el?.textContent ?? '').replace(/\s+/g, ' ').trim();
// The step the card shows ("3 / 7"), 'last' on the last card, or null with no card.
const step = () => $('.tour-card') ? txt($('.tour-card .step')) || 'last' : null;
const N = () => App.wb.changes().length;
const shown = el => { const r = el.getBoundingClientRect(); return r.width > 0 && document.elementsFromPoint(r.left + r.width / 2, r.top + r.height / 2).includes(el); };
const visible = sel => $$(sel).find(shown);
const hole = () => $('.tour-hole').getBoundingClientRect();
const around = el => { const r = el.getBoundingClientRect(), h = hole(); return Math.abs(h.left - (r.left - 4)) < 2 && Math.abs(h.top - (r.top - 4)) < 2 && Math.abs(h.width - (r.width + 8)) < 2; };
const press = (key, el = document.activeElement || document.body) => el.dispatchEvent(new KeyboardEvent('keydown', { key, bubbles: true, cancelable: true }));
// The card beside the cutout: clear of it, within 24 px of one of its sides, and level with it there.
const card = () => { const c = $('.tour-card').getBoundingClientRect(), h = hole(); return { x: Math.max(h.left - c.right, c.left - h.right), y: Math.max(h.top - c.bottom, c.top - h.bottom) }; };
const beside = () => { const { x, y } = card(); return (x >= 0 && x <= 24 && y < 0) || (y >= 0 && y <= 24 && x < 0); };

async function run() {
  await until(() => App.views.peek().length && App.scene.peek() && Canvas.active.peek(), 15000);
  await until(() => step() === '1 / 7', 8000);
  check('On the very first launch the tour starts by itself, at its first step', step() === '1 / 7', step());
  check('… and it’s kept as toured', localStorage.getItem('dendra.toured') === '1');
  const n0 = N(), began = Shell.selection.peek().join();

  // 1. Select a box.
  await until(() => !$('.tour-hole').classList.contains('none'));
  const box = visible('[data-tour="box"]');
  check('Step 1 points at a box on the chart', !!box && around(box), box && JSON.stringify(box.getBoundingClientRect()));
  await until(beside, 1000);
  check('… its card beside it', beside(), JSON.stringify(card()));
  Shell.select(['fund']); await tick(150);
  check('Clicking a box does step 1', step() === '2 / 7', step());
  await until(beside, 1000);
  check('Step 2’s card is beside the box it points at too, the one selected', beside() && around($('[data-cell-id="fund"] [data-tour="box"]')), JSON.stringify(card()));

  // 2. Double-click a name: it's typed in place, the record's, and left as it was once the next step is done.
  const fundName = Object.keys(App.state.peek()).find(id => App.state.peek()[id].at === 'fund' && Tree.same(App.state.peek()[id].edge ?? '', 'Name'));
  const nameEl = $(`[data-text="${fundName}"]`), at = nameEl.getBoundingClientRect();
  nameEl.dispatchEvent(new MouseEvent('dblclick', { bubbles: true, clientX: at.left + at.width / 2, clientY: at.top + at.height / 2 })); await tick(200);
  check('Double-clicking a box’s name types in it, and does step 2', step() === '3 / 7' && !!$('.dc-edit'), `${step()} ${!!$('.dc-edit')}`);

  // 3. All like it: the bar's other part, which lights the boxes like the one selected.
  await until(() => !!visible('[data-tour="like"]') && around(visible('[data-tour="like"]')));
  const like = visible('[data-tour="like"]');
  check('Step 3 points at all like it, above the chart', !!like && around(like) && /^All \d+ /.test(txt(like)), like && txt(like));
  like.click(); await tick(200);
  check('Clicking it does step 3, and the name typed in is left as it was', step() === '4 / 7' && !$('.dc-edit') && N() === n0, `${step()} ${!!$('.dc-edit')} ${N() - n0}`);

  // 4. Drag to another: the canvas asks for the two boxes' relations.
  Shell.emit('relate-open', ['fund', 'blocker']); await tick(300);
  check('Dragging from one box to another does step 4', step() === '5 / 7', step());
  check('… and all like it, chosen for step 3, is given back: a change goes to the selection again', $('[data-fb="like"]')?.getAttribute('aria-pressed') !== 'true', $('[data-fb="like"]')?.outerHTML.slice(0, 80));

  // 5. What the drag made: the two boxes' panel, shown, pointed at, before anything takes its place.
  await until(() => !!visible('[data-tour="pair"]') && around(visible('[data-tour="pair"]')));
  const pair = visible('[data-tour="pair"]');
  check('Step 5 points at the two boxes’ panel the drag made, the selection still the two', !!pair && around(pair) && Shell.selection.peek().join() === 'fund,blocker' && /\band\b/.test(txt(pair.querySelector('.ih'))),
    `${!!pair} ${Shell.selection.peek().join()} ${pair && txt(pair.querySelector('.ih'))}`);
  pair.dispatchEvent(new PointerEvent('pointerover', { bubbles: true })); await tick(650);
  pair.dispatchEvent(new PointerEvent('pointerout', { bubbles: true, relatedTarget: document.body })); await tick(200);
  check('… done once the pointer has rested on it and left', step() === '6 / 7', step());

  // 6. Click an italic value: what the two boxes show, and any part asking a reason, don't do it.
  await tick(800);
  check('Step 6 waits to be done: the two boxes’ relations, shown with their reasons, don’t do it', step() === '6 / 7', step());
  const computed = Object.keys(App.computed.peek().computed).find(id => !('tag' in App.state.peek()[id]));
  Shell.emit('why-open', computed); await tick(150);
  check('… nor does a reason asked anywhere but on what it points at', step() === '6 / 7', step());
  await until(() => !!visible('[data-tour="computed"]') && around(visible('[data-tour="computed"]')));
  const italic = visible('[data-tour="computed"]');
  check('Step 6 points at an italic value, a formula’s', !!italic && around(italic) && getComputedStyle(italic).fontStyle === 'italic', italic?.outerHTML.slice(0, 160));
  await until(beside, 1000);
  check('… its card beside it', beside(), JSON.stringify(card()));
  const asked = [], off = Shell.on('why-open', id => asked.push(id));
  italic.focus(); italic.click(); await tick(200);
  off();
  check('Clicking it does step 6', step() === '7 / 7', step());
  check('… and the click goes on: the value is asked about, so the formula bar says why', document.activeElement === italic && asked.length > 0, `${document.activeElement?.outerHTML.slice(0, 80)} ${asked.join()}`);

  // 7. Switch view.
  await until(() => !!visible('[data-tour="sheet"]') && around(visible('[data-tour="sheet"]')));
  const sheet = visible('[data-tour="sheet"]');
  check('Step 7 points at another view’s tab', !!sheet && around(sheet), sheet && `${JSON.stringify(sheet.getBoundingClientRect())} ${JSON.stringify(hole())}`);
  await until(beside, 1000);
  check('… its card beside it', beside(), JSON.stringify(card()));
  const other = App.views.peek().find(v => v.layout === 'chart' && v.id !== Shell.view.peek());
  Shell.show(other.id); await tick(400);
  check('Switching view does step 7, and the last card shows', step() === 'last' && !!$('.tour-card input'), step());
  check('With the steps done, the selection is the one the tour began on', Shell.selection.peek().join() === began, Shell.selection.peek().join());
  check('… so the view it ends on is whole, not greyed out', !$$('.dc-dim').length, `${$$('.dc-dim').length} dimmed`);

  // The last card: a name, and Keep this chart.
  const name = $('.tour-card input');
  check('The last card asks for a name, its field focused', document.activeElement === name);
  name.value = 'Pat Example'; name.dispatchEvent(new Event('input', { bubbles: true })); await tick();
  $('.tour-card .btn.primary').click(); await tick(150);
  check('Keep this chart ends the tour, keeping the name', step() === null && localStorage.getItem('dendra.name') === 'Pat Example');
  check('The tour changed nothing in the record', N() === n0, `${N() - n0} changes`);
  check('… and the view it ended on is the one switched to, whole', Shell.view.peek() === other.id && !$$('.dc-dim').length);

  // Again, from the chart menu, with a box selected: Skip goes to the last card, and Esc ends it, as it found it.
  Shell.select(['gp']); await tick(100);
  Shell.parts.peek().action.find(a => a.id === 'tour').run(); await tick(200);
  check('Tour, from the chart menu, starts it again', step() === '1 / 7', step());
  Shell.select(['fund']); await tick(150);
  check('… its first step done by a box clicked', step() === '2 / 7', step());
  $('.tour-card .skip').click(); await tick(150);
  check('Skip goes to the last card, with the selection the tour began on', step() === 'last' && Shell.selection.peek().join() === 'gp', `${step()} ${Shell.selection.peek().join()}`);
  press('Escape', $('.tour-card input')); await tick(150);
  check('Esc ends it', step() === null);
  // In a step, Esc is the window's: it leaves what's being done (here, the selection), and the tour goes on; on the
  // tour's own card, it ends it, with the selection it began on.
  Shell.parts.peek().action.find(a => a.id === 'tour').run(); await tick(200);
  Shell.select(['blocker']); await tick(150);
  // (Each Esc leaves one thing: what's open over the view first, then the selection.)
  for (let i = 0; i < 4 && Shell.selection.peek().length; i++) { document.body.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', code: 'Escape', bubbles: true, cancelable: true })); await tick(150); }
  check('Esc in a step leaves what’s being done, not the tour', step() === '2 / 7' && !Shell.selection.peek().length, `${step()} ${Shell.selection.peek().join()}`);
  press('Escape', $('.tour-card .skip')); await tick(150);
  check('… and Esc on the tour’s card ends it, with the selection it began on', step() === null && Shell.selection.peek().join() === 'gp', `${step()} ${Shell.selection.peek().join()}`);
  check('Nothing threw', !errors.length, errors.join(' / '));
}

const errors = [];
window.onerror = (m, s, l) => { errors.push(`${m} (${(s || '').split('/').pop()}:${l})`); };
addEventListener('unhandledrejection', e => errors.push(String(e.reason?.stack ?? e.reason)));
Shell.ready.then(() => run())
  .catch(e => check('runs', false, e.stack ?? e))
  .finally(() => {
    const failed = out.filter(c => !c.ok);
    const line = c => `${c.ok ? 'pass' : 'FAIL'}  ${c.name}${c.detail && !c.ok ? `  (${c.detail})` : ''}`;
    document.title = `tour test: ${out.length - failed.length} pass, ${failed.length} fail`;
    $('#out').innerHTML = [`${out.length - failed.length} passed, ${failed.length} failed`, '',
      ...failed.map(c => `<span class="fail">${line(c).replace(/</g, '&lt;')}</span>`), ...(failed.length ? [''] : []),
      ...out.filter(c => c.ok).map(line).map(s => s.replace(/</g, '&lt;'))].join('\n');
  });
</script>

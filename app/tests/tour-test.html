<script>
// Checks of the tour (tour.js) on a very first launch, in the whole window, each step done as a person would
// do it: a step is done only by doing what it teaches, never by what another part announces, and the tour
// ends on the view as the person left it, with nothing it chose still chosen and nothing in the record changed.
const out = [];
const check = (name, ok, detail = '') => out.push({ name, ok: !!ok, detail: String(detail ?? '') });
const tick = (ms = 40) => new Promise(r => setTimeout(r, ms));
const until = async (f, ms = 4000) => { for (let t = 0; t < ms; t += 25) { if (f()) return true; await tick(25); } return false; };
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const txt = el => (el?.textContent ?? '').replace(/\s+/g, ' ').trim();
// The step the card shows ("3 / 7"), 'last' on the last card, or null with no card.
const step = () => $('.tour-card') ? txt($('.tour-card .step')) || 'last' : null;
const N = () => App.wb.changes().length;
const shown = el => { const r = el.getBoundingClientRect(); return r.width > 0 && document.elementsFromPoint(r.left + r.width / 2, r.top + r.height / 2).includes(el); };
const visible = sel => $$(sel).find(shown);
const hole = () => $('.tour-hole').getBoundingClientRect();
const around = el => { const r = el.getBoundingClientRect(), h = hole(); return Math.abs(h.left - (r.left - 4)) < 2 && Math.abs(h.top - (r.top - 4)) < 2 && Math.abs(h.width - (r.width + 8)) < 2; };
const press = (key, el = document.activeElement || document.body) => el.dispatchEvent(new KeyboardEvent('keydown', { key, bubbles: true, cancelable: true }));
// The card beside the cutout: clear of it, within 24 px of one of its sides, and level with it there.
const card = () => { const c = $('.tour-card').getBoundingClientRect(), h = hole(); return { x: Math.max(h.left - c.right, c.left - h.right), y: Math.max(h.top - c.bottom, c.top - h.bottom) }; };
const beside = () => { const { x, y } = card(); return (x >= 0 && x <= 24 && y < 0) || (y >= 0 && y <= 24 && x < 0); };

async function run() {
  await until(() => App.views.peek().length && App.scene.peek() && Canvas.active.peek(), 15000);
  await until(() => step() === '1 / 7', 8000);
  check('On the very first launch the tour starts by itself, at its first step', step() === '1 / 7', step());
  check('… and it’s kept as toured', localStorage.getItem('dendra.toured') === '1');
  const n0 = N(), began = Shell.selection.peek().join();

  // 1. Select a box.
  await until(() => !$('.tour-hole').classList.contains('none'));
  const box = visible('[data-tour="box"]');
  check('Step 1 points at a box on the chart', !!box && around(box), box && JSON.stringify(box.getBoundingClientRect()));
  await until(beside, 1000);
  check('… its card beside it', beside(), JSON.stringify(card()));
  Shell.select(['fund']); await tick(150);
  check('Clicking a box does step 1', step() === '2 / 7', step());
  await until(beside, 1000);
  check('Step 2’s card is beside the box it points at too, the one selected', beside() && around($('[data-cell-id="fund"] [data-tour="box"]')), JSON.stringify(card()));

  // 2. Double-click a name: it's typed in place, the record's, and left as it was once the next step is done.
  const fundName = Object.keys(App.state.peek()).find(id => App.state.peek()[id].at === 'fund' && Tree.same(App.state.peek()[id].edge ?? '', 'Name'));
  const nameEl = $(`[data-text="${fundName}"]`), at = nameEl.getBoundingClientRect();
  nameEl.dispatchEvent(new MouseEvent('dblclick', { bubbles: true, clientX: at.left + at.width / 2, clientY: at.top + at.height / 2 })); await tick(200);
  check('Double-clicking a box’s name types in it, and does step 2', step() === '3 / 7' && !!$('.dc-edit'), `${step()} ${!!$('.dc-edit')}`);

  // 3. All like it: the bar's other part, which lights the boxes like the one selected.
  await until(() => !!visible('[data-tour="scope"]') && around(visible('[data-tour="scope"]')));
  const like = visible('[data-tour="scope"]'), own = like.querySelector('[data-fb="own"]');
  check('Step 3 points at the scope, both its parts, above the chart', !!like && around(like) && !!own && !!like.querySelector('[data-fb="like"]'), like && txt(like));
  check('… its card clear of the bars under what it points at', $('.tour-card').getBoundingClientRect().top >= ($('#view .formulabar')?.getBoundingClientRect().bottom ?? like.getBoundingClientRect().bottom), JSON.stringify(card()));
  own.click(); await tick(200);
  check('Either part does step 3, “This box” as well as what’s beside it, and the name typed in is left as it was', step() === '4 / 7' && !$('.dc-edit') && N() === n0, `${step()} ${!!$('.dc-edit')} ${N() - n0}`);
  check('Step 4’s dots stand on the box it points at', !!$('.tour-dots:not([hidden]) i'), $('.tour-dots')?.outerHTML.slice(0, 60));

  // 4. Drag to another: the canvas asks for the two boxes' relations.
  Shell.emit('relate-open', ['fund', 'blocker']); await tick(300);
  check('Dragging from one box to another does step 4', step() === '5 / 7', step());
  check('… and the pen, moved for step 3, is given back: it goes by itself', FormatBar.pen.level.peek() === null, $('[data-fb="like"]')?.outerHTML.slice(0, 80));

  // 5. What the drag made: the two boxes' panel, shown, pointed at, before anything takes its place.
  await until(() => !!visible('[data-tour="pair"]') && around(visible('[data-tour="pair"]')));
  const pair = visible('[data-tour="pair"]');
  check('Step 5 points at the two boxes’ panel the drag made, the selection still the two', !!pair && around(pair) && Shell.selection.peek().join() === 'fund,blocker' && /\band\b/.test(txt(pair.querySelector('.ih'))),
    `${!!pair} ${Shell.selection.peek().join()} ${pair && txt(pair.querySelector('.ih'))}`);
  pair.dispatchEvent(new PointerEvent('pointerover', { bubbles: true })); await tick(650);
  pair.dispatchEvent(new PointerEvent('pointerout', { bubbles: true, relatedTarget: document.body })); await tick(200);
  check('… done once the pointer has rested on it and left', step() === '6 / 7', step());

  // 6. Click an italic value: what the two boxes show, and any part asking a reason, don't do it.
  await tick(800);
  check('Step 6 waits to be done: the two boxes’ relations, shown with their reasons, don’t do it', step() === '6 / 7', step());
  const computed = Object.keys(App.computed.peek().computed).find(id => !('tag' in App.state.peek()[id]));
  Shell.emit('why-open', computed); await tick(150);
  check('… nor does a reason asked anywhere but on what it points at', step() === '6 / 7', step());
  await until(() => !!visible('[data-tour="computed"]') && around(visible('[data-tour="computed"]')));
  const italic = visible('[data-tour="computed"]');
  check('Step 6 points at an italic value, a formula’s', !!italic && around(italic) && getComputedStyle(italic).fontStyle === 'italic', italic?.outerHTML.slice(0, 160));
  await tick(300);
  check('… its card beside the panel, so the row it means can be read', $('.tour-card').getBoundingClientRect().right <= italic.closest('[data-region="inspector"]').getBoundingClientRect().left + 1, JSON.stringify(card()));
  const asked = [], off = Shell.on('why-open', id => asked.push(id));
  italic.focus(); italic.click(); await tick(200);
  off();
  check('Clicking it does step 6', step() === '7 / 7', step());
  check('… and the click goes on: the value is asked about, so the formula bar says why', document.activeElement === italic && asked.length > 0, `${document.activeElement?.outerHTML.slice(0, 80)} ${asked.join()}`);

  // 7. Switch view.
  await until(() => !!visible('[data-tour="sheet"]') && around(visible('[data-tour="sheet"]')));
  const sheet = visible('[data-tour="sheet"]');
  check('Step 7 points at another view’s tab', !!sheet && around(sheet), sheet && `${JSON.stringify(sheet.getBoundingClientRect())} ${JSON.stringify(hole())}`);
  await until(beside, 1000);
  check('… its card beside it', beside(), JSON.stringify(card()));
  const other = App.views.peek().find(v => v.layout === 'chart' && v.id !== Shell.view.peek());
  Shell.show(other.id); await tick(400);
  check('Switching view does step 7, and the last card shows', step() === 'last' && !!$('.tour-card .btn.primary'), step());
  check('With the steps done, the selection is the one the tour began on', Shell.selection.peek().join() === began, Shell.selection.peek().join());
  check('… so the view it ends on is whole, not greyed out', !$$('.dc-dim').length, `${$$('.dc-dim').length} dimmed`);

  // The last card: Keep this chart, or a new one; a name's asked for when History first has one to sign.
  check('The last card asks for no name, Keep this chart focused', !$('.tour-card input') && document.activeElement === $('.tour-card .btn.primary'), document.activeElement?.outerHTML?.slice(0, 80));
  $('.tour-card .btn.primary').click(); await tick(150);
  check('Keep this chart ends the tour', step() === null);
  check('The tour changed nothing in the record', N() === n0, `${N() - n0} changes`);
  check('… and the view it ended on is the one switched to, whole', Shell.view.peek() === other.id && !$$('.dc-dim').length);

  // Again, from the chart menu, with a box selected: Skip goes to the last card, and Esc ends it, as it found it.
  Shell.select(['gp']); await tick(100);
  Shell.parts.peek().action.find(a => a.id === 'tour').run(); await tick(200);
  check('Tour, from the chart menu, starts it again', step() === '1 / 7', step());
  Shell.select(['fund']); await tick(150);
  check('… its first step done by a box clicked', step() === '2 / 7', step());
  $('.tour-card .next').click(); await tick(150);
  const passed = step();
  $('.tour-card .back').click(); await tick(150);
  check('Next passes a step over and Back goes to the one before, so no one’s stuck with Skip the only way on', passed === '3 / 7' && step() === '2 / 7', `${passed} ${step()}`);
  $('.tour-card .skip').click(); await tick(150);
  check('Skip ends it, with the selection the tour began on', step() === null && Shell.selection.peek().join() === 'gp', `${step()} ${Shell.selection.peek().join()}`);
  // In a step, Esc first leaves what's being done (a menu open, what's typed), and then ends the tour, with the selection it began on,
  // the chart having the keys; on the tour's own card too.
  Shell.parts.peek().action.find(a => a.id === 'tour').run(); await tick(200);
  Shell.select(['blocker']); await tick(150);
  Shell.menu({ x: 200, y: 200 }, [{ label: 'One', run: () => {} }]); await tick(80);
  document.body.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', code: 'Escape', bubbles: true, cancelable: true })); await tick(150);
  check('Esc in a step leaves what’s being done first, not the tour', step() === '2 / 7' && !document.querySelector('.float .menu'), `${step()}`);
  document.body.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', code: 'Escape', bubbles: true, cancelable: true })); await tick(150);
  check('… and with nothing else to leave, it ends the tour, with the selection it began on', step() === null && Shell.selection.peek().join() === 'gp', `${step()} ${Shell.selection.peek().join()}`);
  Shell.parts.peek().action.find(a => a.id === 'tour').run(); await tick(200);
  press('Escape', $('.tour-card .skip')); await tick(150);
  check('… and Esc on the tour’s card ends it too', step() === null && Shell.selection.peek().join() === 'gp', `${step()} ${Shell.selection.peek().join()}`);
  // A menu by the keys: on its first item as it opens; Esc from a submenu goes on in the menu it opened from; a row of choices on the arrows' path.
  {
    let ran = '';
    const kd = (k, o = {}) => document.activeElement.dispatchEvent(new KeyboardEvent('keydown', { key: k, code: k, bubbles: true, cancelable: true, ...o }));
    kd('PageDown'); // (the keys, last)
    let picked = 'Light';
    Shell.menu({ x: 200, y: 200 }, () => [{ label: 'Open', items: [{ label: 'Inner', run: () => { ran = 'inner'; } }] }, { label: 'After', run: () => { ran = 'after'; } }, { seg: ['Light', 'Dark'].map(l => ({ label: l, pressed: picked === l, run: () => { picked = l; } })) }]); await tick(80);
    check('A menu the keys open is on its first item', $('.float .menu-item.on')?.textContent.includes('Open'), $('.float .menu')?.textContent);
    kd('ArrowRight'); await tick(80);
    check('… ArrowRight opens its submenu, on its first', $$('.float .menu').length === 2 && $$('.float .menu')[1].querySelector('.menu-item.on')?.textContent.includes('Inner'));
    document.body.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', code: 'Escape', bubbles: true, cancelable: true })); await tick(80);
    check('… Esc closes the submenu alone, and the keys go on in the menu it opened from', $$('.float .menu').length === 1 && document.activeElement?.closest('.float') != null, document.activeElement?.className);
    kd('ArrowDown'); await tick(40);
    check('… the arrows still move', $('.float .menu-item.on')?.textContent.includes('After'));
    kd('ArrowDown'); await tick(40);
    check('… onto a row of choices', !!$('.float .menu-seg.on'));
    kd('ArrowRight'); await tick(40);
    check('… whose own arrows go across it', picked === 'Dark', picked);
    kd('ArrowUp'); await tick(40); kd('Enter'); await tick(80);
    check('… and Enter runs the item it’s on', ran === 'after' && !$('.float .menu'), ran);
  }
  // Where the keys go when nothing's said: back where they were, with nothing written; Esc from a pane to the view; Relate on to the panel; a message a stop of F6.
  {
    const kd = (k, el = document.activeElement) => el.dispatchEvent(new KeyboardEvent('keydown', { key: k, code: k, bubbles: true, cancelable: true }));
    const pane = () => document.activeElement?.closest?.('[data-region]')?.dataset.region ?? null, cv = Canvas.active.peek();
    kd('PageDown');
    Shell.show(App.views.peek().find(v => v.layout === 'chart').id); await tick(200);
    Shell.select(['gp']); await tick(120);
    Shell.enter('tabs'); await tick(40);
    kd('Escape'); await tick(80);
    check('Esc from a pane that isn’t the view takes the keys to the view, what’s selected staying', pane() === 'view' && Shell.selection.peek().join() === 'gp', `${pane()} ${Shell.selection.peek().join()}`);
    kd('Escape'); await tick(80);
    check('… and there, Esc lets go of it', !Shell.selection.peek().length, Shell.selection.peek().join());
    Shell.select(['gp']); await tick(120);
    Shell.enter('inspector'); await tick(40);
    check('(the keys in the panel)', pane() === 'inspector', pane());
    document.activeElement.blur(); await tick(60);
    check('What had the keys letting go of them, they go back to the pane they were in', pane() === 'inspector', pane());
    const n1 = N();
    document.activeElement.blur();
    document.body.dispatchEvent(new KeyboardEvent('keydown', { key: 'x', code: 'KeyX', bubbles: true, cancelable: true })); await tick(80);
    check('… at the latest with the next key, which is spent finding them: nothing typed anywhere', pane() === 'inspector' && !$('.dc-edit') && N() === n1, `${pane()} ${!!$('.dc-edit')} ${N() - n1}`);
    Shell.enter('view'); await tick(40);
    document.activeElement.blur();
    document.body.dispatchEvent(new KeyboardEvent('keydown', { key: 'x', code: 'KeyX', bubbles: true, cancelable: true })); await tick(80);
    check('… on a chart too: a box selected isn’t typed over by a key meant for something gone', pane() === 'view' && !$('.dc-edit') && N() === n1, `${pane()} ${!!$('.dc-edit')} ${N() - n1}`);
    document.activeElement.blur();
    document.body.dispatchEvent(new KeyboardEvent('keydown', { key: '?', code: 'Slash', shiftKey: true, bubbles: true, cancelable: true })); await tick(80);
    check('… but what’s the window’s own goes on to it: ? opens the list of keys', !!$('.menu.findpal'), document.activeElement?.className);
    Shell.closeAll(); await tick(60);
    // Relate… by the keys goes on to the two's relations; With… asks for a box and makes none.
    Shell.select(['gp']); await tick(120);
    cv.root.focus(); await tick(40);
    cv.relate(); await tick(60);
    kd('Tab', cv.root); await tick(80);
    kd('Enter', cv.root); await tick(250);
    check('Relate… by the keys takes the keys on to the two’s first relation, to tick', !!document.activeElement?.closest('.insp[data-tour="pair"] .relate .rr') && document.activeElement.matches('button.tag, button.sel, input'), document.activeElement?.outerHTML.slice(0, 80));
    Shell.select(['gp']); await tick(120);
    cv.root.focus(); await tick(40);
    cv.withAnother(); await tick(60);
    kd('x', cv.root); await tick(80);
    check('With… by the keys: a name typed makes no box, as With… asks for one that’s there', cv.root.classList.contains('relating') && !$('.dc-edit'), `${cv.root.classList.contains('relating')} ${!!$('.dc-edit')}`);
    document.body.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', code: 'Escape', bubbles: true, cancelable: true })); await tick(80);
    // The panel put away is no stop of F6: the keys go on past it to the tabs, and Esc brings them back with what's selected.
    Shell.select(['gp']); await tick(120);
    Shell.enter('view'); await tick(40);
    const panelAct = () => Shell.parts.peek().action.find(a => a.id === 'panel');
    panelAct().run(); await tick(250);
    Shell.parts.peek().action.find(a => a.id === 'pane.next').run(); await tick(60);
    check('The panel put away is no stop of F6: the keys go on past it to the tabs', pane() === 'tabs', pane());
    kd('Escape'); await tick(80);
    check('… and Esc brings them back to the view, what’s selected staying', pane() === 'view' && Shell.selection.peek().join() === 'gp', `${pane()} ${Shell.selection.peek().join()}`);
    panelAct().run(); await tick(250);
    // Esc on a checkbox in a dialog closes the dialog, and leaves what's selected behind it alone.
    Shell.select(['gp']); await tick(120);
    let closed = false;
    Shell.dialog({ title: 'A dialog', body: Shell.html`<label><input type="checkbox" id="esc-box" /> A choice</label>` }).then(() => { closed = true; }); await tick(80);
    $('#esc-box').focus();
    kd('Escape', $('#esc-box')); await tick(80);
    check('Esc on a checkbox in a dialog closes the dialog, what’s selected behind it staying', closed && !$('dialog[open]') && Shell.selection.peek().join() === 'gp', `${closed} ${!!$('dialog[open]')} ${Shell.selection.peek().join()}`);
    // A message with something to do is a stop of F6; it stays while the keys are on it; pressed, the keys go to the view.
    let undone = false;
    Shell.select(['gp']); await tick(120);
    Shell.enter('view'); await tick(40);
    Shell.toast('Something', { undo: () => { undone = true; } }); await tick(60);
    Shell.parts.peek().action.find(a => a.id === 'pane.next').run(); await tick(60);
    check('A message with something to do is a stop of F6, on what it offers', pane() === 'toast' && document.activeElement.matches('.toast button'), `${pane()} ${document.activeElement?.className}`);
    document.activeElement.click(); await tick(80);
    check('… pressed, it’s done and gone, and the keys go to the view', undone && !$('.toast') && pane() === 'view', `${undone} ${!!$('.toast')} ${pane()}`);
  }
  // A chart by the keys, last, so what it moves disturbs no check above: a nudge keeps a box's size; Ctrl+Alt+arrow goes box to box; Esc keeps the place; Relate… by Tab and Enter.
  {
    const cv = Canvas.active.peek(), sc = () => cv.scene(), key = (k, o = {}) => cv.root.dispatchEvent(new KeyboardEvent('keydown', { key: k, code: k, bubbles: true, cancelable: true, ...o }));
    Shell.show(App.views.peek().find(v => v.layout === 'chart').id); Shell.select([]); await tick(200);
    const reading = (() => { const rows = []; for (const b of sc().marks.filter(m => m.type === 'box').sort((a, b) => a.y - b.y)) { const r = rows.at(-1); if (r && b.y < r[0].y + r[0].h / 2) r.push(b); else rows.push([b]); } return rows.flatMap(r => r.sort((a, b) => a.x - b.x)).map(b => b.id); })();
    // (A move leaves the size as it's drawn, where its height is what its rank or the triangles of its width share; and it's said as moved.)
    const all = sc().marks.filter(m => m.type === 'box'), tall = all.find(m => m.shape === 'triangle') ?? all[0], h0 = tall.h, y0 = tall.y, n0 = N(), step = 8 / sc().page.scale;

    // A box put in joins; out, leaves; the frame stays as it stands.
    const atIn = rect(fm());
    cv().put(ids.dee, { x: atIn.x + atIn.w / 2 - m('dee').w / 2, y: atIn.y + atIn.h / 2 - m('dee').h / 2 }); await tick(250);
    check('A box dropped in joins', rowOfFrame(f).holds.includes(ids.dee), JSON.stringify(rowOfFrame(f).holds));
    check('… the frame as it stood', Math.abs(fm().x - atIn.x) < 1 && Math.abs(fm().w - atIn.w) < 1, `${JSON.stringify(rect(fm()))} ${JSON.stringify(atIn)}`);
    cv().put(ids.dee, { x: atIn.x + atIn.w + 80, y: atIn.y }); await tick(250);
    check('… dragged out, leaves', !rowOfFrame(f).holds.includes(ids.dee) && Math.abs(fm().w - atIn.w) < 1, `${JSON.stringify(rowOfFrame(f).holds)} ${fm().w} ${atIn.w}`);
    // Past its edge but its middle in: it grows round it.
    cv().put(ids.eli, { x: fm().x + fm().w - m('eli').w / 2 - 2, y: m('eli').y }); await tick(250);
    check('A box still in it, past its edge: the frame grows round it', rowOfFrame(f).holds.includes(ids.eli) && m('eli').x + m('eli').w <= fm().x + fm().w, `${m('eli').x + m('eli').w} ${fm().x + fm().w}`);
    // A free shape is carried too.
    cv().insert('text', { x: fm().x + 30, y: fm().y + fm().h - 40, w: 80, h: 20, text: 'Note' }); await tick(200);
    const note = sc().marks.find(q => q.geometry === 'text' && q.texts[0]?.text === 'Note');
    cv().put(note.id, { x: fm().x + 30, y: fm().y + fm().h - 40 }); await tick(200);
    check('A free shape put in it is held too', rowOfFrame(f).holds.includes(note.id), JSON.stringify(rowOfFrame(f).holds));
    { const n0 = rect(sc().byId.get(note.id)), a = rect(fm()); cv().put(f, { x: a.x, y: a.y + 12 }); await tick(250);
      check('… and goes with it', Math.abs(sc().byId.get(note.id).y - n0.y - 12) < 1, `${sc().byId.get(note.id).y} ${n0.y}`); }
    // Tidy lays out what it holds together.
    cv().tidy(); await tick(500);
    { const h = rowOfFrame(f).holds.map(id => sc().byId.get(id)).filter(q => q?.type === 'box'), out = sc().marks.filter(q => q.type === 'box' && !h.includes(q)), box = fm();
      check('Tidy keeps what it holds in it, and nothing else', h.length === 2 && h.every(q => q.x >= box.x && q.x + q.w <= box.x + box.w && q.y >= box.y && q.y + q.h <= box.y + box.h) && !out.some(q => q.x + q.w / 2 > box.x && q.x + q.w / 2 < box.x + box.w && q.y + q.h / 2 > box.y && q.y + q.h / 2 < box.y + box.h), `${JSON.stringify(rect(box))} held ${h.map(q => `${q.texts[0].text} ${q.x},${q.y},${q.w}`).join(' ')} out ${out.map(q => `${q.texts[0].text} ${q.x},${q.y},${q.w}`).join(' ')} ${JSON.stringify(rowOfFrame(f).pad)} lines ${sc().marks.filter(q => q.type === 'line').map(l => `${sc().byId.get(l.from)?.texts[0].text}>${sc().byId.get(l.to)?.texts[0].text}`).join(' ')}`); }
    // An empty frame takes what's dropped in it; it's still drawn on export.
    Shell.select([]); await tick(100);
    const e = cv().insert('frame', { x: 20, y: 20, w: 300, h: 160, text: 'Empty' }); await tick(200);
    check('A frame with nothing selected holds nothing yet', !(rowOfFrame(e).holds ?? []).length, JSON.stringify(rowOfFrame(e)));
    const pdf = Export.svg(sc(), {}), deckNames = sc().marks.filter(q => q.geometry === 'frame').length;
    check('… and the PDF draws each', deckNames === 2 && /Empty/.test(pdf), `${deckNames}`);
    // A view copied: its frame holds its boxes there too.
    const copied = App.addView('Frames', undefined, page); await on(copied);
    const fr = sc().marks.find(q => q.geometry === 'frame' && q.texts[0]?.text === 'Frame');
    check('A page copied: its frame holds what it held, its own copy of the note among them', fr && fr.holds.length === 3 && fr.holds.includes(ids.bea) && !fr.holds.includes(note.id) && fr.holds.some(id => sc().byId.get(id)?.geometry === 'text'), JSON.stringify(fr?.holds));
  }
}


const errors = [];
window.onerror = (m, s, l) => { errors.push(`${m} (${(s || '').split('/').pop()}:${l})`); };
addEventListener('unhandledrejection', e => errors.push(String(e.reason?.stack ?? e.reason)));
Shell.ready.then(() => run())
  .catch(e => check('runs', false, e.stack ?? e))
  .finally(() => {
    const failed = out.filter(c => !c.ok);
    const line = c => `${c.ok ? 'pass' : 'FAIL'}  ${c.name}${c.detail && !c.ok ? `  (${c.detail})` : ''}`;
    document.title = `tour test: ${out.length - failed.length} pass, ${failed.length} fail`;
    $('#out').innerHTML = [`${out.length - failed.length} passed, ${failed.length} failed`, '',
      ...failed.map(c => `<span class="fail">${line(c).replace(/</g, '&lt;')}</span>`), ...(failed.length ? [''] : []),
      ...out.filter(c => c.ok).map(line).map(s => s.replace(/</g, '&lt;'))].join('\n');
  });
</script>

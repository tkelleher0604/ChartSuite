<script>
// The workbook opened at once, in memory: Store keeps it in IndexedDB, which this page leaves alone.
const Store = { open: () => Promise.resolve(Log.open(SAMPLE)), who: () => localStorage.getItem('dendra.name'), status: () => ({ text: '' }), subscribe: () => () => {},

<script>
const results = [], check = (name, ok, detail = '') => results.push({ name, ok: !!ok, detail: String(detail ?? '') });
const tick = (ms = 40) => new Promise(r => setTimeout(r, ms));
// Until ok() holds, or ms pass. A change previewed is worked out at once, or on a slow chart after a 300 ms
// pause (FormulaBar.preview), so what the redline shows is checked once the preview is there.
const until = async (ok, ms = 3000) => { for (const t0 = performance.now(); !ok() && performance.now() - t0 < ms;) await tick(20); };
const previewed = async () => { await until(() => !!FormulaBar.pending.peek()); await tick(100); };
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const C = () => App.chart.peek(), st = () => App.state.peek(), last = () => App.wb.changes().at(-1);
const N = () => App.wb.changes().length;
const views = () => Shell.parts.peek().views.list();
const undo = () => Shell.parts.peek().undo.undo();
const named = name => Object.keys(st()).find(id => Tree.isObject(st()[id]) && App.notes.peek().nameOf(st(), id) === name);
const item = (label, root = document) => [...root.querySelectorAll('.menu-item')].find(x => x.textContent.trim() === label);
const hover = el => el.dispatchEvent(new PointerEvent('pointermove', { bubbles: true }));
const column = title => Table.grid.getColumns().find(c => c.getDefinition().title === title);
const rowOf = id => Table.grid.getRow(id);
// The + menu, as a person picks from it: a submenu's item, or one at the top. Says whether the new tab's name
// was then being typed into, and leaves it as it is.
async function addTable(sub, label, few = false) {
  $('.foot > .btn.icon[aria-label="New view"]').click(); await tick();
  if (sub) { hover(item(sub)); await tick(); }
  item(label).click(); await tick(150);
  const typing = !!$('.sheets .sheet input');
  document.activeElement?.blur?.(); await tick();
  // What a new table hid as it opened is taken back (unless it's what's being checked), so these checks read its columns as they'd stand by default.
  if (!few && label !== 'Chart') { const view = Shell.view.peek(), hidden = App.notes.peek().notes('Shown').filter(n => n.view === view && n.value === false);
    if (hidden.length) { App.change(tx => hidden.forEach(n => tx.note('Shown', n.pattern, undefined, { view, param: n.param })), { dated: false }); await tick(150); } }
  return typing;
}
function paste(text, target = Table.grid.rowManager.element) {
  const dt = new DataTransfer(); dt.setData('text/plain', text);
  const e = new ClipboardEvent('paste', { clipboardData: dt, bubbles: true, cancelable: true });
  target.dispatchEvent(e);
  return e;
}
const press = (key, el = document.activeElement || document.body) => el.dispatchEvent(new KeyboardEvent('keydown', { key, bubbles: true, cancelable: true }));
// Import's dialog, answered: each column it has left out set to the option with this label, then Import.
async function answer(...labels) {
  for (const l of labels) {
    const sel = $$('dialog.dlg .imp-grid select').find(s => !s.value), o = [...sel.options].find(x => x.textContent === l);
    sel.value = o.value; sel.dispatchEvent(new Event('change', { bubbles: true }));
    await tick();
  }
  $('dialog.dlg .btn.primary').click(); await tick(200);
}
const errors = [];
addEventListener('error', e => errors.push(e.message));
const pct = (owner, owned, day) => {
  const s = App.wb.asOf(C(), day), o = Object.keys(s).find(id => s[id].args && s[id].args.some(a => a.edge === 'Owner' && App.notes.peek().nameOf(s, Tree.objectOf(s, a.at)) === owner) && s[id].args.some(a => a.edge === 'Owned' && App.notes.peek().nameOf(s, a.at) === owned));
  const p = o && Object.keys(s).find(x => s[x].at === o && s[x].edge === 'Percentage');
  return p ? s[p].value : null;
};

// History, undo and trust (dendra.md, Time; the title bar): the chart's History against a record's own; what an entry holds;
// what a change did to the status; an undo's bar and its words; the past looking past; Viewing; Undo's list; the status list.
async function historyChecks(ours, fund) {
  const rows = () => $$('.hist-row'), whats = () => $$('.hist-row .what').map(x => x.textContent), historyAction = Shell.parts.peek().action.find(a => a.id === 'history');
  const openOf = (c, el = rows().find(x => x.querySelector('.what').textContent === Time.describe(c))) => el;
  const esc = () => document.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', bubbles: true, cancelable: true }));
  // ---- The chart's is the chart's: what's selected filters nothing, and a filter is said at the top ----
  const all = rows().length;
  Shell.select([fund]); await tick(80);
  check('With a record selected, the chart’s History still lists everything, and says no filter', rows().length === all && !$('.hist-filter .of') && !$('.hist-filter .every'), `${rows().length} of ${all}`);
  const only = $('.hist-filter .only');
  check('… offering to narrow to it, a choice in it', /^Only /.test(only?.textContent ?? ''), only?.textContent);
  only?.click(); await tick(80);
  check('… which says so at the top in words, with All changes', rows().length > 0 && rows().length < all && /^Changes to Calder Ridge Capital Partners III, L\.P\.$/.test($('.hist-filter .of')?.textContent ?? '') && $('.hist-filter .every')?.textContent === 'All changes', $('.hist-filter')?.textContent);
  $('.hist-filter .every').click(); await tick(80);
  check('All changes takes it away', rows().length === all && !$('.hist-filter .of'), rows().length);
  Shell.select([]); await tick(60);
  // A record's own begins on its records, and a filter by kind is its own choice.
  const kindPick = async label => { $('.hist-filter .dd').click(); await tick(40); item(label).click(); await tick(80); };
  await kindPick('Rules');
  const ruled = whats();
  check('Filtered by Rules, it lists changes to what things are, saying so', ruled.length > 0 && ruled.length < all && ruled.some(x => /formula of Ownership Adds Up/.test(x)) && !ruled.some(x => /^Tidied|^Moved /.test(x)) && $('.hist-filter .dd').textContent === 'Rules' && !!$('.hist-filter .every'), ruled.slice(0, 3).join(' / '));
  await kindPick('Looks and layout');
  const looked = whats();
  check('… by Looks and layout, how a view draws them', looked.length > 0 && looked.some(x => /Caption|Showed|Hid/.test(x)) && !looked.some(x => /formula of Ownership Adds Up/.test(x)), looked.slice(0, 3).join(' / '));
  await kindPick('Records');
  check('… by Records, the facts', whats().some(x => /^Changed Percentage of Fund III → Corvane/.test(x)) && !whats().some(x => /^Showed |^Hid /.test(x)), whats().slice(0, 3).join(' / '));
  $('.hist-filter .every').click(); await tick(80);

  // ---- An entry opens: everything it holds, one line each; a formula before and after, a value from and to ----
  const ruleChange = ours.find(c => c.adds.some(r => r.label === 'Formula') && c.removes.length && /Ownership Adds Up/.test(Time.describe(c)));
  const ruleRow = () => openOf(ruleChange);
  ruleRow().querySelector('.what .more').click(); await tick(120);
  const held = ruleRow().querySelectorAll('.hist-more .ln');
  check('“and 1 more” opens: what it holds, one line each, in the same words', /, and 1 more$/.test(ruleRow().querySelector('.what').textContent) && [...held].length >= 2 && held[0].textContent === 'Changed the formula of Ownership Adds Up', [...held].map(x => x.textContent).join(' / '));
  const rule = ruleRow().querySelector('.hist-rule');
  check('A changed formula shows before and after, the words that changed marked', !!rule?.querySelector('.was .del') && !!rule?.querySelector('.now .add') && /Before/.test(rule.textContent) && /After/.test(rule.textContent) && /COUNT/.test(rule.querySelector('.was .del').textContent), rule?.textContent);
  check('… and the chevron closes it again', (() => { const b = ruleRow().querySelector('.hist-chev'); return b?.getAttribute('aria-expanded') === 'true'; })());
  const percent = ours.find(c => /^Changed Percentage of Fund III → Corvane/.test(Time.describe(c))), percentRow = () => openOf(percent);
  percentRow().querySelector('.hist-chev').click(); await tick(120);
  check('A value shows from and to', /^From .* to .*$/.test(percentRow().querySelector('.hist-val')?.textContent ?? '') && !!percentRow().querySelector('.hist-val .del') && !!percentRow().querySelector('.hist-val .add'), percentRow().querySelector('.hist-val')?.textContent);

  // ---- Effect on the status: worked out after the panel is drawn, a rule's change first ----
  await until(() => !!ruleRow().querySelector('.effect'), 8000);
  const effect = ruleRow().querySelector('.effect')?.textContent ?? '', [, was, now] = /errors (\d+) → (\d+)/.exec(effect) ?? [];
  check('A change that moves the status says so', +was > +now, effect);
  const cleared = [...ruleRow().querySelectorAll('.hist-more .st')].find(x => x.textContent === 'Cleared');
  let n = 0;
  for (let x = cleared?.nextElementSibling; x?.matches('.ln'); x = x.nextElementSibling) n++;
  check('… opened, which cleared', n === +was - +now && /^Ownership Adds Up · /.test(cleared?.nextElementSibling.textContent ?? ''), `${n}: ${cleared?.nextElementSibling.textContent}`);
  check('… with its figure', / not 100%|%, not /.test(cleared?.nextElementSibling.querySelector('.fig')?.textContent ?? ''), cleared?.nextElementSibling.textContent);
  ruleRow().querySelector('.hist-chev').click(); await tick(60);
  check('The chevron closes it', !ruleRow().querySelector('.hist-more'));

  // ---- An entry's words never change with the day or the moment shown ----
  const words = () => ours.map(c => Time.describe(c)).join('|'), w0 = words();
  Shell.at({ asOf: '2023-07-01' }); await tick(120);
  const w1 = words();
  const early = ours.find(c => c.when.startsWith('2026-05')) ?? ours[3];
  Shell.at({ stood: early.id, at: early.when }); await tick(150);
  const w2 = words();
  check('An entry’s words don’t change with the day or moment shown', w1 === w0 && w2 === w0, [w0, w1, w2].map(w => w.length).join());

  // ---- The past looks past ----
  check('Viewing a past moment, a band says the moment, with Back to now', /^As it stood on \w+ \d+, /.test($('.pastband span')?.textContent ?? '') && $('.pastband .btn')?.textContent === 'Back to now', $('.pastband')?.textContent);
  $('.pastband .btn').click(); await tick(120);
  check('… which comes back to now', Shell.time.peek() === null && !$('.pastband'));
  {
    // Back at now, a view gone to while the past was shown stays; one the past took away comes back, and a grid built as the
    // window left it is fitted to its rows once it shows.
    const named_ = name => views().find(v => v.name === name).id, entities = named_('Entities'), older = () => $$('.hist-row').find(r => !r.classList.contains('undone') && !/Made later/.test(r.textContent));
    if (!$('.hist-row')) { historyAction.run(); await tick(150); }
    Shell.show(named_('Ownership')); await tick(150);
    older().click(); await tick(200);
    Shell.show(entities); await tick(250);
    $('.pastband .btn').click(); await tick(250);
    check('Back at now, a view gone to while the past was shown stays', Shell.view.peek() === entities, Shell.view.peek());
    const later = App.addView('Made later', { kind: 'Entity' }); await tick(250);
    Shell.show(later); await tick(250);
    older().click(); await tick(250);
    const took = Shell.view.peek() !== later;
    $('.pastband .btn').click(); await tick(300);
    check('… and one the past took away comes back', took && Shell.view.peek() === later, `${took} ${Shell.view.peek()}`);
    Shell.show(entities); await tick(300);
    const nameWide = Table.grid.getColumns().find(c => c.getField() && c.getDefinition().title === 'Name')?.getWidth();
    check('… and the grid left as it went is fitted to its rows', nameWide > 200, nameWide);
    undo(); await tick(200);
  }

  // ---- A record's own: its changes, as itself, each with when it held and when it was typed ----
  const holding = Object.keys(st()).find(id => st()[id].args?.some(a => a.edge === 'Owned' && App.notes.peek().nameOf(st(), a.at) === 'Corvane Specialty Chemicals Holdings, LLC') && st()[id].args.some(a => App.notes.peek().nameOf(st(), a.at) === 'Calder Ridge Capital Partners III, L.P.'));
  Time.of([holding]); await tick(120);
  const ownRows = whats(), meta = $$('.hist-row .meta').map(x => x.textContent);
  check('A record’s own History says whose it is, begins on its records, and has All changes', /^Changes to Ownership: Fund III → Corvane/.test($('.hist-filter .of')?.textContent ?? '') && $('.hist-filter .dd').textContent === 'Records' && !!$('.hist-filter .every'), $('.hist-filter')?.textContent);
  check('… each said as itself: when it holds from', ownRows.some(x => /^Fund III’s stake in Corvane .* was set to 49% from Jun 15, 2026$/.test(x)), ownRows.join(' / '));
  check('… and when it was typed, by whom', meta.every(x => /^typed \w+ \d+, \d{4}, /.test(x)), meta.join(' / '));
  check('… never a bulk entry under another record’s name', ownRows.every(x => /Fund III|Corvane/.test(x)) && !ownRows.some(x => /, and \d+ more$/.test(x) && !/Corvane/.test(x)), ownRows.join(' / '));
  historyAction.run(); await tick(120);
  check('The chart menu’s History, with a record’s own open, goes to everything', !$('.hist-filter .of') && $('.hist-filter .dd').textContent === 'All kinds' && !!$('.inspector .hist'), $('.hist-filter')?.textContent);

  // ---- A rename says from when ----
  const fundName = Object.keys(st()).find(id => st()[id].at === fund && st()[id].edge === 'Name');
  Shell.at({ asOf: '2037-03-01' }); await tick(80);
  const fundWas = st()[fundName].value, renamed = App.change(tx => tx.update(fundName, { value: 'Calder Ridge Fund III, L.P.' })); await tick(80);
  check('A rename says from when', / to Calder Ridge Fund III, L\.P\. from Mar 1, 2037$/.test(Time.describe(renamed)), Time.describe(renamed));
  // What's typed before names it as it was then; and it says what it was called, as of a day after.
  const earlier = App.wb.changes().filter(c => c.when < renamed.when && c.chart === App.chart.peek()).map(c => Time.describe(c));
  const shortId = Tree.entryAt(st(), fund, 'Short Name'), shortened = App.change(tx => tx.update(shortId, { value: 'Fund Three' })); await tick(80);
  const saying = App.wb.changes().filter(c => c.when < renamed.when && c.chart === App.chart.peek()).map(c => Time.describe(c));
  check('An entry names a record as it was named then, whatever it’s been renamed since', saying.some(x => /\bFund III\b/.test(x)) && !saying.some(x => /Fund Three/.test(x)) && !earlier.some(x => x.includes('Calder Ridge Fund III, L.P.')), saying.filter(x => /Fund (III|Three)\b/.test(x)).slice(0, 2).join(' / '));
  undo(); await tick(60);
  check('… and a record says what it was called, and until when', App.formerNames(fund, '2037-06-01')[0]?.name === fundWas && App.formerNames(fund, '2037-06-01')[0]?.until === '2037-03-01' && !App.formerNames(fund, '2037-01-01', App.wb.asOf(App.chart.peek(), '2037-01-01')).length, JSON.stringify(App.formerNames(fund, '2037-06-01')));
  undo(); await tick(60);
  Shell.at(null); await tick(80);

  // ---- Undo this change: the bar first, what it reverses and every later change it takes with it ----
  const a = named('Fund III Blocker') ?? Object.keys(st()).find(id => App.notes.peek().shortOf(st(), id) === 'Fund III Blocker'), b = named('Northpine Software, LLC');
  Shell.at({ asOf: '2037-01-01' }); await tick(60);
  let rel = null;
  const added = App.change(tx => { rel = tx.add('record', { args: [{ edge: 'Owner', at: a }, { edge: 'Owned', at: b }], tag: true }); }); await tick(60);
  const later = App.change(tx => tx.add('record', { at: rel, edge: 'Percentage', field: 'percent', value: 0.05 })); await tick(60);
  Shell.at(null); await tick(120);
  const c0 = N(), addedRow = () => openOf(added);
  addedRow().click(); await tick(150);
  rows().find(x => x.getAttribute('aria-selected') === 'true').querySelector('.acts .btn').click(); await tick(200);
  const bar = $('.pendbar');
  check('Undo this change opens the bar first: nothing is undone yet, and it’s back at now', N() === c0 && !!bar && Shell.time.peek() === null, bar?.textContent);
  check('… saying what it reverses, and every later change it takes with it, by name', bar?.textContent.includes(Time.describe(added)) && /Takes with it: .*stake in Northpine.* 5% .*\(Dana Jordan, /.test(bar?.textContent ?? ''), bar?.textContent);
  check('… its row marked', !!addedRow()?.matches('.asked'));
  esc(); await tick(150);
  check('Esc takes it back, saying so, with History still open', N() === c0 && !$('.pendbar') && !!$('.inspector .hist') && /^Discarded undoing /.test($('.toast span')?.textContent ?? ''), $('.toast span')?.textContent);
  addedRow().click(); await tick(150);
  rows().find(x => x.getAttribute('aria-selected') === 'true').querySelector('.acts .btn').click(); await tick(200);
  [...$$('.pendbar .btn')].find(x => x.textContent === 'Undo').click(); await tick(200);
  check('Its verb makes it, as one change, and what’s at it goes with it', N() === c0 + 1 && App.wb.asOf(C(), '2037-02-01')[rel] === undefined && App.wb.asOf(C(), '2037-02-01')[later.adds[0].record] === undefined);
  check('… and the later one says so', /gone with what it’s at/.test(openOf(later)?.querySelector('.meta').textContent ?? ''), openOf(later)?.textContent);
  undo(); await tick(120);
  // Another's change undone says whose.
  await tick(60);
  const ch0 = N(), ruleLater = ours.find(c => c.who !== App.who() && !c.reverses && App.wb.canReverse(c.id) && c.adds.some(r => r.label === 'Formula') && c.removes.length), first = ruleLater.who.split(' ')[0];
  openOf(ruleLater).click(); await tick(150);
  rows().find(x => x.getAttribute('aria-selected') === 'true').querySelector('.acts .btn').click(); await tick(200);
  [...$$('.pendbar .btn')].find(x => x.textContent === 'Undo').click(); await tick(200);
  const undid = `Undid ${first}’s change: ${Time.describe(ruleLater)}`;
  check('An undo says it’s an undo, in the toast and in History: whose, and what', N() === ch0 + 1 && $('.toast span')?.textContent === undid && whats().includes(undid), `${$('.toast span')?.textContent} / ${whats()[0]}`);
  check('… hers struck, saying who undid it', /undone by /.test(openOf(ruleLater)?.querySelector('.meta').textContent ?? '') && openOf(ruleLater)?.matches('.undone'), openOf(ruleLater)?.textContent);
  rows().find(x => x.querySelector('.what').textContent === undid).querySelector('.what .lk').click(); await tick(150);
  check('… linked to the change it undid', Shell.time.peek()?.stood === ruleLater.id, JSON.stringify(Shell.time.peek()));
  $('.pastband .btn').click(); await tick(100);
  undo(); await tick(120);
  check('Undone in turn, it says it put hers back, and the two fold away', $('.toast span')?.textContent === `Redid ${first}’s change: ${Time.describe(ruleLater)}` && !openOf(ruleLater)?.matches('.undone'), $('.toast span')?.textContent);

  // ---- Viewing or Editing: nothing writes, but the session's columns; said in the title bar and the chart menu ----
  const switchBtn = () => $('.titlebar .mode .btn');
  check('The title bar says Editing', switchBtn()?.textContent === 'Editing');
  switchBtn().click(); await tick(60);
  item('Viewing').click(); await tick(120);
  const v0 = N();
  check('Viewing: said in the title bar, filled', switchBtn()?.textContent === 'Viewing' && !!$('.titlebar .mode.viewing') && App.readOnly.peek());
  const refused = App.change(tx => tx.update('fund_ein', { value: '92-5555555' })); await tick(60);
  check('… and nothing writes: a change, saying why', refused === null && N() === v0 && /^Viewing/.test($('.toast span')?.textContent ?? ''), $('.toast span')?.textContent);
  App.stage({ verb: 'Add', what: 'x', make: () => {} });
  const whatIf = App.commit(); await tick(80);
  check('… one pending is a what-if: it’s redlined, and its commit makes nothing, saying what would', !!App.pending.peek() && whatIf === null && N() === v0 && $$('.toast span').some(t => /switch to Editing to make this/i.test(t.textContent)), $$('.toast span').map(t => t.textContent).join(' / '));
  App.discard({ quiet: true });
  check('… Undo', (undo(), N() === v0));
  check('… and the rest of History', (App.reverse(ours[3].id), App.restore('gp_agent'), N() === v0));
  $('.titlebar .chartmenu').click(); await tick(60);
  check('The title bar’s switch is its one place, and the chart menu has no row of choices', !$$('.float .menu-seg').length, $$('.float .menu-seg')[0]?.textContent);
  check('… and New chart waits', [...$$('.float .menu-item')].find(x => x.querySelector('.label')?.textContent.trim() === 'New chart')?.getAttribute('aria-disabled') === 'true');
  Shell.closeAll(); await tick(40);
  // A table's columns, for the session.
  const own = views().find(v => v.name === 'Ownership')?.id ?? views().find(v => v.layout === 'table').id, wasView = Shell.view.peek();
  Shell.show(own); await tick(250);
  const hiddenRow = () => [...$$('.cols .colrow.mv')].find(x => /Percentages In Range/.test(x.textContent));
  const col = () => column('Percentages In Range'), listing = async () => { if (!$('.cols')) { $$('.tbar .btn').find(x => x.textContent === 'Columns').click(); await tick(60); } };
  await listing();
  hiddenRow()?.querySelector('input').click(); await tick(250);

function report() {
  const failed = results.filter(x => !x.ok).length;
  document.title = `table test: ${results.length - failed} pass, ${failed} fail`;
  const esc = s => s.replace(/[&<>]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[ch]);
  const el = document.createElement('div');
  el.className = 'results';
  el.innerHTML = `<b>${esc(document.title)}</b>\n\n`.replace(/\n/g, '<br>') + [...results.filter(x => !x.ok), ...results.filter(x => x.ok)]
    .map(x => `<div class="${x.ok ? '' : 'fail'}">${x.ok ? 'PASS' : 'FAIL'}  ${esc(x.name)}${x.detail && !x.ok ? `  [${esc(x.detail)}]` : ''}</div>`).join('');
  document.body.appendChild(el);
}
Shell.ready.then(async () => {

  try { await run(); } catch (e) { check('The checks ran to the end', false, `${e.message} ${e.stack.split('\n')[1]}`); }

});

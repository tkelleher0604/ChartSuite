<script>
  // Checks of the table views (ui/table.js) and the time (ui/time.js), driven as a person would drive them,
  // then read off the log. The sample is opened in memory and nothing is saved. ?theme=dark or light.
  const Q = new URLSearchParams(location.search);
  document.documentElement.dataset.theme = Q.get('theme') || 'light';
  try { localStorage.clear(); localStorage.setItem('dendra.toured', '1'); localStorage.setItem('dendra.name', 'Dana Jordan'); } catch {}
</script>

  .results .fail { color: var(--no); }
  .results b { color: var(--ink); font-weight: 500; }

<script>
// The workbook opened at once, in memory: Store keeps it in IndexedDB, which this page leaves alone.
const Store = { open: () => Promise.resolve(Log.open(SAMPLE)), who: () => localStorage.getItem('dendra.name'), status: () => ({ text: '' }), subscribe: () => () => {},
  books: () => Promise.resolve([]), where: () => null };

<script src="../sample/calder-ridge.js"></script>

<script>
const results = [], check = (name, ok, detail = '') => results.push({ name, ok: !!ok, detail: String(detail ?? '') });
const tick = (ms = 40) => new Promise(r => setTimeout(r, ms));
// Until ok() holds, or ms pass. A change previewed is worked out at once, or on a slow chart after a 300 ms
// pause (FormulaBar.preview), so what the redline shows is checked once the preview is there.
const until = async (ok, ms = 3000) => { for (const t0 = performance.now(); !ok() && performance.now() - t0 < ms;) await tick(20); };
const previewed = async () => { await until(() => !!FormulaBar.pending.peek()); await tick(100); };
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const C = () => App.chart.peek(), st = () => App.state.peek(), last = () => App.wb.changes().at(-1);
const N = () => App.wb.changes().length;
const views = () => Shell.parts.peek().views.list();
const undo = () => Shell.parts.peek().undo.undo();
const named = name => Object.keys(st()).find(id => Tree.isObject(st()[id]) && App.notes.peek().nameOf(st(), id) === name);
const item = (label, root = document) => [...root.querySelectorAll('.menu-item')].find(x => x.textContent.trim() === label);
const hover = el => el.dispatchEvent(new PointerEvent('pointermove', { bubbles: true }));
const column = title => Table.grid.getColumns().find(c => c.getDefinition().title === title);
const rowOf = id => Table.grid.getRow(id);
// The + menu, as a person picks from it: a submenu's item, or one at the top. Says whether the new tab's name
// was then being typed into, and leaves it as it is.
async function addTable(sub, label) {
  $('.foot > .btn.icon[aria-label="New view"]').click(); await tick();
  if (sub) { hover(item(sub)); await tick(); }
  item(label).click(); await tick(150);
  const typing = !!$('.sheets .sheet input');
  document.activeElement?.blur?.(); await tick();
  return typing;
}
function paste(text, target = Table.grid.rowManager.element) {
  const dt = new DataTransfer(); dt.setData('text/plain', text);
  const e = new ClipboardEvent('paste', { clipboardData: dt, bubbles: true, cancelable: true });
  target.dispatchEvent(e);
  return e;
}
const press = (key, el = document.activeElement || document.body) => el.dispatchEvent(new KeyboardEvent('keydown', { key, bubbles: true, cancelable: true }));
// The dialog that asks what headings are, answered: each select set to the option with this label.
async function answer(...labels) {
  const sels = $$('dialog.dlg select');
  labels.forEach((l, i) => { const o = [...sels[i].options].find(x => x.textContent === l); sels[i].value = o.value; sels[i].dispatchEvent(new Event('change', { bubbles: true })); });
  await tick();
  $('dialog.dlg .btn.primary').click(); await tick(200);
}
const errors = [];
addEventListener('error', e => errors.push(e.message));
const pct = (owner, owned, day) => {
  const s = App.wb.asOf(C(), day), o = Object.keys(s).find(id => s[id].args && s[id].args.some(a => a.edge === 'Owner' && App.notes.peek().nameOf(s, Tree.objectOf(s, a.at)) === owner) && s[id].args.some(a => a.edge === 'Owned' && App.notes.peek().nameOf(s, a.at) === owned));
  const p = o && Object.keys(s).find(x => s[x].at === o && s[x].edge === 'Percentage');
  return p ? s[p].value : null;
};

async function run() {
  // ---- The sheet tabs are the View objects, in their Order ----
  check('The tabs are the chart’s views, in their order', views().map(v => v.name).join() === 'Structure,40 Act,Fund III,Management and control,Entities,Ownership,Dates,Documents', views().map(v => v.name).join());
  check('A view without a Layout note is a chart', views().slice(0, 4).every(v => v.layout === 'chart') && views().slice(4).every(v => v.layout === 'table'));
  // In a narrow window the tabs run on past the edge, which fades, the wheel turns them across, and every view
  // is a click away in a list.
  const strip = () => $('.sheets'), start = Shell.view.peek();
  Object.assign($('.shell').style, { right: 'auto', width: '720px' });
  Shell.show(views()[1].id); await tick(80);
  check('Tabs that run on past the edge fade into it, and every view is listed beside them', strip().dataset.more === 'right' && !!$('.foot .btn.views'), `${strip().dataset.more} ${!!$('.foot .btn.views')}`);
  strip().dispatchEvent(new WheelEvent('wheel', { deltaY: 100, bubbles: true, cancelable: true })); await tick(40);
  check('… the wheel turns them across', strip().scrollLeft > 0, strip().scrollLeft);
  $('.foot .btn.views').click(); await tick(80);
  const listed = $$('.float .menu-item').map(e => (e.getAttribute('aria-checked') === 'true' ? '✓' : '') + e.textContent.trim());
  item('Documents').click(); await tick(80);
  check('… the list names every view, the one shown checked, and shows the one chosen', listed.join() === views().map((v, i) => (i === 1 ? '✓' : '') + v.name).join() && views().find(v => v.id === Shell.view.peek())?.name === 'Documents', listed.join());
  // Narrower still, the chart's name is cut in the title bar, and shown whole on hover.
  $('.shell').style.width = '440px'; await tick(40);
  const titled = $('.titlebar .chartmenu'), cutName = titled.querySelector('.name');
  titled.dispatchEvent(new PointerEvent('pointerover', { bubbles: true })); await tick();
  check('A chart’s name cut short in the title bar is shown whole on hover', cutName.scrollWidth > cutName.clientWidth && titled.dataset.tip === cutName.textContent, `${cutName.scrollWidth} in ${cutName.clientWidth}: ${titled.dataset.tip}`);
  Object.assign($('.shell').style, { right: '', width: '' });
  Shell.show(start); await tick(80);
  check('With room for them all, no list', !$('.foot .btn.views') && !strip().dataset.more, `${strip().dataset.more}`);

  // ---- Adding a table view from the + menu ----
  let n0 = N();
  const typing = await addTable('Records', 'Entities');
  const ent = Shell.view.peek(), ev = st()[ent];
  const layout = App.notes.peek().value('Layout', { id: ent, kind: 'View' });
  check('The + menu makes a View object, as one change, never dated', ev?.kind === 'View' && N() === n0 + 1 && last().adds.every(r => !r.since));
  check('Its layout is a note at it: a table of the kind’s rows', JSON.stringify(layout) === JSON.stringify({ rows: { kind: 'Entity' } }), JSON.stringify(layout));
  check('Its tab comes last, named for its rows, and shows', views().at(-1).name === 'Entities 2' && views().at(-1).layout === 'table');
  check('Its name is being typed into, as a new tab’s is', typing);
  await tick(100);

  // ---- The Entities table ----
  const ents = Tree.index(st()).kinds.get('entity').length;
  check('Its rows are the records of the kind', Table.grid.getRows().length === ents, `${Table.grid.getRows().length} of ${ents}`);
  const titles = Table.grid.getColumns().map(c => c.getDefinition().title).filter(Boolean);
  check('Its columns are what’s located at the rows, Name first, in the entries’ order', titles.slice(0, 6).join() === 'Name,Short Name,Vehicle Type,Entity Type,Jurisdiction,Formation Date', titles.slice(0, 8).join());
  check('Entries below entries are columns too, hidden at first', Table.model(ent).cols.some(c => c.path?.join('›') === 'Jurisdiction›File Number' && !c.shown));
  check('Computed cells are italic', $$('.grid .tabulator-cell.fx').length > 0 && $$('.grid .tabulator-cell.fx').every(el => getComputedStyle(el).fontStyle === 'italic'), $$('.grid .tabulator-cell.fx').length);
  check('Tags are checkboxes, green attested and red ruled out', $$('.grid .c-tag .tag.yes').length > 0 && $$('.grid .c-tag .tag.no').length > 0);
  check('A choice edits as a dropdown of its options', column('Vehicle Type').getDefinition().editor === 'list' && column('Vehicle Type').getDefinition().editorParams.values.includes('Feeder Fund'));
  // A heading's filter, opened from its menu: its values, each a checkbox row.
  const offered = title => column(title).getDefinition().editorParams.values;
  const filterOf = async title => {
    column(title).getElement().querySelector('.col-menu').click(); await tick();
    item('Filter…').click(); await tick(80);
    const got = { values: $$('.tfilter .tf-row:not(.all) .v').map(x => x.textContent), find: !!$('.tfilter .tf-find'), all: !!$('.tfilter .tf-row.all input[type=checkbox]') };
    Shell.closeAll(); await tick();
    return got;
  };
  const vt = await filterOf('Vehicle Type');
  check('… in their order, as the inspector lists them, then by name; and so in its heading’s filter, Blank last', offered('Vehicle Type').slice(0, 3).join() === 'Main Fund,Parallel Fund,Feeder Fund' && offered('Entity Type')[0] === 'Limited Partnership'
    && vt.values.filter(x => x !== 'Blank').join() === offered('Vehicle Type').filter(o => vt.values.includes(o)).join() && vt.values.at(-1) === 'Blank', `${offered('Vehicle Type').join()} / ${offered('Entity Type').join()} / ${vt.values.join()}`);
  check('A heading’s filter is Excel’s: Find, Select all and a checkbox for each value; no field in the heading', vt.find && vt.all && !$$('.grid .tabulator-header-filter').length);

  // Show/Hide on a column writes a Shown note in the view.
  n0 = N();
  const jur = Table.model(ent).cols.find(c => c.title === 'Jurisdiction');
  Table.grid.getColumns().find(c => c.getDefinition().title === 'Jurisdiction').getElement().dispatchEvent(new MouseEvent('contextmenu', { bubbles: true, cancelable: true, clientX: 600, clientY: 60 }));
  await tick();
  check('A heading’s menu sorts, hides, and lists the columns with ticks', !!item('Sort A to Z') && !!item('Hide column') && !!item('Columns'));
  item('Hide column').click(); await tick(100);
  const shown = App.notes.peek().resolve('Shown', jur.pattern, ent);
  check('Hide writes a Shown note in the view, as one change', N() === n0 + 1 && shown?.note.view === ent && shown.value === false);
  check('The column goes', !column('Jurisdiction'));
  undo(); await tick(100);
  check('Undo brings it back', !!column('Jurisdiction'));

  // Editing in place, each edit one change.
  const halvard = named('Halvard Logistics Holdings, Inc.');
  n0 = N();
  const cell = rowOf(halvard).getCells().find(c => c.getColumn().getDefinition().title === 'Short Name');
  cell.edit(true); await tick();
  const input = cell.getElement().querySelector('input');
  input.value = 'Halvard';
  input.dispatchEvent(new KeyboardEvent('keydown', { key: 'Enter', bubbles: true, cancelable: true })); await tick(100);
  const sn = (Tree.index(st()).entries.get(halvard) ?? []).find(e => st()[e].edge === 'Short Name');
  check('Typing in a cell enters the value, as one change', N() === n0 + 1 && st()[sn]?.value === 'Halvard');
  check('The cell shows it', rowOf(halvard).getCells().find(c => c.getColumn().getDefinition().title === 'Short Name').getValue() === 'Halvard');
  const bad = rowOf(halvard).getCells().find(c => c.getColumn().getDefinition().title === 'Formation Date');
  bad.edit(true); await tick();
  const bi = bad.getElement().querySelector('input'); bi.value = 'next Tuesday';
  bi.dispatchEvent(new KeyboardEvent('keydown', { key: 'Enter', bubbles: true, cancelable: true })); await tick();
  check('What can’t be read stays in the cell, marked, and changes nothing', bi.classList.contains('bad') && N() === n0 + 1);
  bi.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', bubbles: true, cancelable: true })); await tick();
  undo(); await tick(100);
  check('Undo takes the value back', !(Tree.index(st()).entries.get(halvard) ?? []).some(e => st()[e].edge === 'Short Name'));

  // A tag's box flips: attested, ruled out, blank.
  const good = rowOf(halvard).getCells().find(c => c.getColumn().getDefinition().title === 'Good Standing');
  n0 = N();
  good.getElement().querySelector('.tag').dispatchEvent(new MouseEvent('click', { bubbles: true })); await tick(100);
  const gs = () => (Tree.index(st()).entries.get(halvard) ?? []).map(e => st()[e]).find(r => r.edge === 'Good Standing');
  check('Clicking a blank tag attests it', gs()?.tag === true && N() === n0 + 1);
  rowOf(halvard).getCells().find(c => c.getColumn().getDefinition().title === 'Good Standing').getElement().querySelector('.tag').dispatchEvent(new MouseEvent('click', { bubbles: true })); await tick(100);
  check('Clicking an attested tag rules it out', gs()?.tag === false);
  undo(); await tick(60); undo(); await tick(100);

  // Selection: a row selected is the record selected, and the other way round.
  const fund = named('Calder Ridge Capital Partners III, L.P.');
  Table.grid.addRange(rowOf(fund).getCells()[1]); await tick(60);
  check('Selecting a row selects its record', Shell.selection.peek().join() === fund, Shell.selection.peek().join());
  Shell.select([halvard]); await tick(60);
  check('Selecting a record elsewhere marks its row', rowOf(halvard).getElement().classList.contains('picked') && !rowOf(fund).getElement().classList.contains('picked'));
  Shell.select([]); await tick();

  // A heading the table hasn't got is asked about: here, a new entry; a name it hasn't got is a new row.
  n0 = N();
  paste('Name\tFund Counsel\tFormation Date\r\nCalder Ridge III Blocker, Inc.\tKirkland & Ellis LLP\t\r\nHollis Bay Holdings, LLC\tSimpson Thacher\t3/2/2026\r\n'); await tick(150);
  check('A heading nothing matches is asked about, and nothing is pasted yet', $('dialog.dlg')?.textContent.includes('Fund Counsel') && N() === n0);
  await answer('New column'); await previewed();
  check('The paste is redlined first: its new row in blue, its new column, and a bar saying what it does', $$('.grid .tabulator-row.red-add').length === 1 && !!column('Fund Counsel')
    && /^1 value·1 new entity/.test($('.pendbar .what')?.textContent) && N() === n0, $('.pendbar')?.textContent);
  check('A pending paste can’t be edited over', !column('Name').getDefinition().editable(rowOf(halvard).getCells()[1]));
  press('Enter'); await tick(150);
  const blocker = named('Calder Ridge III Blocker, Inc.'), hollis = named('Hollis Bay Holdings, LLC');
  const at = (id, edge) => (Tree.index(st()).entries.get(id) ?? []).map(e => st()[e]).find(r => r.edge === edge);
  check('Pasting a new heading adds an entry, and a new name a row, in one change', N() === n0 + 1 && at(blocker, 'Fund Counsel')?.value === 'Kirkland & Ellis LLP'
    && st()[hollis]?.kind === 'Entity' && at(hollis, 'Formation Date')?.value === '2026-03-02' && !!column('Fund Counsel'));
  check('Enter makes it, and the redline goes', !$('.pendbar') && !$$('.grid .tabulator-row.red-add').length && !$$('.grid .tabulator-cell .del, .grid .tabulator-cell .add').length);
  undo(); await tick(150);
  check('Undo takes the new entry and the new row back', !named('Hollis Bay Holdings, LLC') && !column('Fund Counsel'));

  // A link pasted onto a row isn't written over a cell: it goes on, to link a document to the row's record.
  n0 = N();
  Table.grid.addRange(rowOf(halvard).getCells().find(c => c.getColumn().getDefinition().title === 'Name')); await tick(60);
  const linked = paste('https://contoso.sharepoint.com/sites/FundLegal/Shared%20Documents/Halvard%20LLC%20Agreement.pdf'); await tick(100);
  check('A link pasted onto a row goes on to link a document, and never overwrites the Name', !linked.defaultPrevented && N() === n0 && !$('.pendbar')
    && Shell.selection.peek().join() === halvard && rowOf(halvard).getData()['f:name'] === 'Halvard Logistics Holdings, Inc.');

  // The keys: one stop in the tab order, and an arrow with no cell active makes one.
  const holder = Table.grid.rowManager.element;
  Table.grid.modules.selectRange.resetRanges?.(); Table.grid.modules.selectRange.activeRange = undefined;
  holder.focus(); errors.length = 0;
  press('ArrowDown', holder); await tick(60);
  check('An arrow with no cell active makes one, and throws nothing', !errors.length && !!Table.grid.modules.selectRange.activeRange, errors.join());
  check('The headings and their filters are out of the tab order', $$('.grid .tabulator-header-filter input').every(x => x.tabIndex === -1) && $$('.grid .tabulator-cell').slice(0, 20).every(x => x.tabIndex === -1));
  const sc = rowOf(halvard).getCells().find(c => c.getColumn().getDefinition().title === 'Short Name');
  sc.edit(true); await tick();
  const si = sc.getElement().querySelector('input'); si.value = 'Halvard';
  si.dispatchEvent(new KeyboardEvent('keydown', { key: 'Enter', bubbles: true, cancelable: true })); await tick(150);
  check('After an edit the grid keeps the keys', $('.grid .cells').contains(document.activeElement), document.activeElement?.className);
  undo(); await tick(100);

  // Moving a column writes Order notes in the view.
  Table.grid.addRange(Table.grid.getRows()[0].getCells()[1]); await tick();   // as pressing the heading would
  n0 = N();
  Table.grid.moveColumn(column('Jurisdiction').getField(), column('Name').getField(), true); await tick(150);
  const order = Table.model(ent).cols.filter(x => x.shown).map(x => x.title);
  check('Moving a column places it, as Order notes in the view, one change', N() === n0 + 1 && order[1] === 'Jurisdiction' && App.notes.peek().resolve('Order', jur.pattern, ent)?.note.view === ent, order.slice(0, 3).join());
  undo(); await tick(150);

  // ---- Excel-grade: a heading dragged, its menu, the bar above the grid, a column inserted, fills, the new row ----
  // How one person looks at a table (sort, filters, grouping, frozen columns, widths) is kept per view in this browser,
  // and is no change.
  {
    const nStart = N(), titlesOf = () => Table.grid.getColumns().map(c => c.getDefinition().title).filter(Boolean);
    const menuOf = async title => { column(title).getElement().querySelector('.col-menu').click(); await tick(); };
    const keyIn = (key, o = {}, el = Table.grid.rowManager.element) => { const e = new KeyboardEvent('keydown', { key, code: key, bubbles: true, cancelable: true, ...o }); el.dispatchEvent(e); return e; };
    const tool = label => $$('.tbar .btn').find(b => b.textContent === label);
    const again = async () => { Shell.show(views()[0].id); await tick(100); Shell.show(ent); await until(() => !!Table.grid && $$('.grid .tabulator-row').length > 0); await tick(200); };
    // A heading dragged moves its column at once.
    const g0 = Table.grid, from = column('Jurisdiction').getElement().getBoundingClientRect(), to = column('Short Name').getElement().getBoundingClientRect();
    const pe = (type, el, x) => el.dispatchEvent(new PointerEvent(type, { bubbles: true, cancelable: true, clientX: x, clientY: from.top + 10, button: 0, buttons: 1, pointerId: 7 }));
    let n1 = N();
    pe('pointerdown', column('Jurisdiction').getElement().querySelector('.tabulator-col-title'), from.left + 20);
    pe('pointermove', window, from.left - 40); pe('pointermove', window, to.left + 4);
    const ghosted = !!$('.col-ghost') && !!$('.grid .col-drop') && !$('.grid .col-drop').hidden;
    pe('pointerup', window, to.left + 4); await tick(200);
    check('A heading dragged moves its column at once: a ghost under the pointer, a bar where it drops, and dropped, one change, the column moved in the grid rather than the grid built again',
      ghosted && titlesOf().slice(0, 3).join() === 'Name,Jurisdiction,Short Name' && N() === n1 + 1 && Table.grid === g0 && !$('.col-ghost'), titlesOf().slice(0, 4).join());
    undo(); await tick(200);
    check('… Undo moves it back', titlesOf().slice(0, 6).join() === 'Name,Short Name,Vehicle Type,Entity Type,Jurisdiction,Formation Date' && Table.grid === g0, titlesOf().slice(0, 6).join());

    // Sorted by what it holds: a date oldest first, the blank last; kept, no change, built again as it was.
    n1 = N();
    await menuOf('Formation Date');
    const sorts = $$('.float .menu-item').map(x => x.textContent.trim());
    item('Sort oldest to newest').click(); await tick(150);
    const days = () => Table.grid.getRows('active').map(r => r.getData()['f:formation date']);
    const sortedOk = () => { const ds = days(), set = ds.filter(Boolean); return set.join() === [...set].sort().join() && ds.indexOf(null) >= set.length; };
    check('A date column sorts oldest to newest, as Excel says it; sorted, the blank last, the view keeping it, which is no change', sorts.includes('Sort oldest to newest') && sortedOk()
      && JSON.stringify(Table.look(ent).sort) === '{"key":"formation date","dir":"asc"}' && N() === n1 && /Sorted by Formation Date/.test($('.tbar').textContent), `${sorts.slice(0, 3).join()} / ${days().join()}`);
    await again();
    check('… and the grid built again is sorted so', sortedOk() && Table.grid.getSorters()[0]?.field === 'f:formation date', days().join());
    tool('Sorted by Formation Date').click(); await tick(); item('Clear sort').click(); await tick(100);
    check('… till the bar’s Sort clears it', !Table.look(ent).sort && !Table.grid.getSorters().length);

    // Filtered as Excel filters: Select all off, a value on.
    await menuOf('Jurisdiction'); item('Filter…').click(); await tick(80);
    const fRow = label => $$('.tfilter .tf-row').find(r => r.querySelector('.v').textContent === label);
    fRow('Select all').querySelector('input').click(); await tick(60);
    fRow('Cayman Islands').querySelector('input').click(); await tick(60);
    Shell.closeAll(); await tick();
    const cayman = Table.model(ent).data.filter(r => r['f:jurisdiction'] === 'Cayman Islands').length, active = () => Table.grid.getDataCount('active');
    check('A column filtered as Excel filters it, Select all off and Cayman Islands on, shows just its rows; its heading shows a funnel, and the bar says so, with Clear filters, and how many of how many',
      JSON.stringify(Table.look(ent).filters) === '{"jurisdiction":["Cayman Islands"]}' && cayman > 0 && active() === cayman && column('Jurisdiction').getElement().classList.contains('filtered')
      && !!tool('Filtered by Jurisdiction') && !!tool('Clear filters') && $('.tbar .tcount').textContent.startsWith(`${cayman} of `), `${JSON.stringify(Table.look(ent).filters)} ${active()} ${$('.tbar').textContent}`);
    await again();
    check('… kept, and so after the grid is built again', active() === cayman && column('Jurisdiction').getElement().classList.contains('filtered'), active());

  const paid = { id: 'xp', who: 'Dana Jordan', when: new Date().toISOString(), chart: C(), removes: [], adds: [{ id: 'xpy', record: 'xpt', args: st()[owed].args, tag: true },
    { id: 'xpr', record: 'xpc', at: 'xpt', edge: 'Annual Tax Paid', field: 'date', value: '2026-10-26' }] };
  check('… and a payment at the tax year it settles, as the place rule says it', Time.describe(paid) === 'Set Annual Tax Paid of AIV-1, tax year 2025 to Oct 26, 2026', Time.describe(paid));
  const pos = App.wb.rows(C()).filter(r => r.label === 'Position').slice(0, 3), stamp = { who: 'Dana Jordan', when: new Date().toISOString(), chart: C() };
  const tidied = { ...stamp, id: 'xt', removes: pos.map(r => r.id), adds: [] }, untidied = { ...stamp, id: 'xu', reverses: 'xt', removes: [], adds: pos }, retidied = { ...stamp, id: 'xr', reverses: 'xu', removes: pos.map(r => r.id), adds: [] };
  check('Tidy, its undoing and its redoing are each said so', [tidied, untidied, retidied].map(Time.describe).join() === 'Tidied the layout,Restored the layout,Tidied the layout', [tidied, untidied, retidied].map(Time.describe).join(' / '));
  const npine = named('Northpine Software, LLC'), boxOf = { id: npine, kind: 'Entity' };
  // Boxes and lines hidden in a view are said as the chart's Delete says them, so its toast and its Undo agree.
  const ownIds = Object.keys(st()).filter(id => st()[id].args?.some(a => a.edge === 'Owner')).slice(0, 2), owns = ownIds.map(id => Tree.treeOf(st(), id)), place = App.notes.peek().segmentOf(st(), ownIds[0]);
  const hiding = ps => ({ ...stamp, id: 'xh', removes: [], adds: ps.map((p, i) => ({ id: 'xh' + i, note: 'xhn' + i, label: 'Shown', pattern: p, view: 'view_main', value: false })) });
  const hidings = [hiding([owns[0]]), hiding([boxOf]), hiding(owns)].map(Time.describe).join(' / ');
  check('A line or a box hidden in a view is said as the chart’s Delete says it, a line by the place rule as the formula bar says it, and several counted', hidings === `Hid Ownership: ${place} in Structure / Hid Northpine Software, LLC in Structure / Hid 2 lines in Structure`, hidings);
  // A line's own look is said as that line's, not its style's.
  const weighed = { ...stamp, id: 'xw', removes: [], adds: [{ id: 'xw0', note: 'xwn', label: 'Weight', pattern: owns[0], view: 'view_main', value: 2 }] };
  check('A line formatted alone is said as that line, not its style', Time.describe(weighed) === `Changed Weight of Ownership: ${place} in Structure`, Time.describe(weighed));
  App.change(tx => tx.note('Fill', boxOf, '#fff2cc', { view: 'view_main' }), { dated: false });
  App.change(tx => tx.note('Fill', boxOf, undefined, { view: 'view_main' }), { dated: false });
  const cleared = Time.describe(last());
  undo(); await tick(60);
  check('A look a box kept of its own, cleared, is said so, and so is its Undo', cleared === 'Cleared Northpine Software, LLC’s own Fill in Structure' && $('.toast span')?.textContent === `Undid: ${cleared}`, `${cleared} / ${$('.toast span')?.textContent}`);
  undo(); await tick(60);
  const before = st();
  const pick =[...$$('.hist-row')].find(x => x.textContent.includes('Changed Percentage of Fund III → Corvane'));
  pick.click(); await tick(150);
  const corvane = named('Corvane Specialty Chemicals Holdings, LLC');
  check('Picking a change shows the chart as it stood just after it', Shell.time.peek()?.stood && pct('Calder Ridge Capital Partners III, L.P.', 'Corvane Specialty Chemicals Holdings, LLC', Log.today()) === 0.49
    && App.state.peek() !== before && Object.values(App.state.peek()).some(x => x.at && st()[x.at]?.args?.some(a => a.at === corvane)));
  check('As it stood, the table can’t be edited', Table.grid.getRows()[0].getCells().every(x => !x.getColumn().getDefinition().editable || !x.getColumn().getDefinition().editable(x)));
  check('The change picked can be undone, by name', $('.hist-row[aria-selected="true"] .btn')?.textContent === 'Undo this change');
  check('As it stood, the title bar’s date says when, filled, with its × back to now', /^As it stood \w+ \d+, \d{4}, \d+:\d\d [AP]M$/.test($('.titlebar .asof.past .dd')?.textContent ?? '')
    && !!$('.titlebar .asof.past [aria-label="Today"]'), $('.titlebar .asof')?.textContent);
  document.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', bubbles: true, cancelable: true })); await tick(60);
  check('Esc comes back to now, keeping History open', Shell.time.peek() === null && !!$('.inspector .hist'));
  Shell.select([fund]); await tick(60);
  const touching = $$('.hist-row').length;
  check('With a selection, History narrows to it', touching > 0 && touching < ours.length && !!$('.hist-focus'), `${touching} of ${ours.length}`);
  Shell.select([]); await tick(60);
  $$('.hist-head .menu-seg button')[1].click(); await tick(60);
  // The sample deleted two registered agents; what this test added and undid was never there.
  const gone = () => $$('.hist-row.gone').map(x => x.querySelector('.what').textContent);
  check('Deleted lists what was deleted and not restored', ['Registered Agent · GP III', 'Registered Agent · Fund III'].every(x => gone().includes(x)) && !gone().some(x => /^Name/.test(x)), gone().join());
  check('An addition undone isn’t listed as deleted', !gone().includes('Halcyon University Endowment') && !gone().includes('Hollis Bay Holdings, LLC'), gone().join());
  n0 = N();
  const k = gone().length;
  $$('.hist-row.gone').find(x => x.textContent.includes('Registered Agent · GP III')).querySelector('.btn').click(); await tick(100);
  check('Restore brings it back, as one change', N() === n0 + 1 && gone().length === k - 1 && !!st().gp_agent);
  undo(); await tick(60);
  check('Undo takes the restore back, and says it undid a restore', !st().gp_agent && /^Undid: Restored /.test($('.toast span')?.textContent ?? ''), $('.toast span')?.textContent);
  await tick(60);
  check('… and it’s listed as deleted again', gone().includes('Registered Agent · GP III'), gone().join());
  // One payment a revision removed: restored, it comes back alone, and the revision's tax years stand.
  const years = () => Object.values(st()).filter(r => r.kind === 'Tax Year').length, y0 = years();
  n0 = N();
  $$('.hist-row.gone').find(x => x.querySelector('.what').textContent === 'Annual Tax Paid · Fund III').querySelector('.btn').click(); await tick(150);
  check('Restoring one payment a revision removed brings back that payment alone, and says so', N() === n0 + 1 && !last().removes.length && years() === y0 && y0 > 0
    && $('.toast span')?.textContent === 'Restored Annual Tax Paid of Fund III' && !gone().includes('Annual Tax Paid · Fund III') && gone().includes('Annual Tax Paid · GP III'), $('.toast span')?.textContent);
  undo(); await tick(100);
  document.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', bubbles: true, cancelable: true })); await tick(60);
  check('Esc then closes History', !$('.inspector .hist'));

  // ---- A new chart: made, not an edit to undo ----
  const C0 = C(), charts0 = App.wb.charts().length;
  Shell.parts.peek().action.find(a => a.id === 'chart.new').run(); await tick(200);
  const C1 = C(), name1 = App.wb.charts().find(c => c.chart === C1)?.name;
  check('New chart makes a chart, and shows it', C1 !== C0 && App.wb.charts().length === charts0 + 1 && name1 === 'Untitled');
  check('… with nothing to undo', !Shell.parts.peek().undo.canUndo());
  undo(); await tick(100);
  check('… so Undo straight after leaves it whole', C() === C1 && App.wb.charts().some(c => c.chart === C1) && views().length > 0 && /Nothing to undo/.test($('.toast')?.textContent ?? ''), $('.toast')?.textContent);
  const kept = views().map(v => v.name), chart1 = views().find(v => v.layout === 'chart');
  check('It keeps the views named for what they show, and one chart, Chart; none of the old chart’s own pages', ['Chart', 'Entities', 'Ownership', 'Dates', 'Documents'].every(n => kept.includes(n))
    && !['Structure', '40 Act', 'Fund III', 'Management and control', 'Entities 2'].some(n => kept.includes(n)) && views().filter(v => v.layout === 'chart').length === 1, kept.join());
  check('… its chart with the styles and Shown of the old chart’s first', chart1 && App.notes.peek().resolve('Shown', { kind: 'Document' }, chart1.id)?.note.view === chart1.id);
  const pages = views().filter(v => v.layout === 'chart'), furniture = v => App.wb.rows(C1).filter(r => 'shape' in r && r.view === v.id);
  check('Each of its pages has a title, its name, an as-of line and a Key', pages.length > 0 && pages.every(v => furniture(v).some(s => s.role === 'title' && s.text === name1)
    && furniture(v).some(s => s.role === 'date' && /^="As of " & TEXT\(@AsOf/.test(s.text)) && furniture(v).some(s => s.geometry === 'legend')),
    pages.map(v => `${v.name}: ${furniture(v).map(s => s.text ?? s.title).join(' | ')}`).join(' / '));
  // Named in place in the title bar, as a sheet is: as it begins, from the chart menu, or by a double-click.
  const naming = () => $('.titlebar .chartmenu.naming input'), type = (el, text) => { el.value = text; el.dispatchEvent(new Event('input', { bubbles: true })); };
  const pageTitles = () => App.wb.rows(C1).filter(r => 'shape' in r && r.role === 'title').map(r => r.text).sort().join(' | ');
  check('A new chart begins with its name being typed over, in the title bar', naming()?.value === 'Untitled' && document.activeElement === naming(), naming()?.outerHTML);
  type(naming(), 'Harbor Point Fund I'); press('Enter', naming()); await tick(100);
  const chartName1 = () => App.wb.charts().find(c => c.chart === C1)?.name;
  check('Enter names it: the chart, the title bar, the window and its page’s title, so its exports are named so', chartName1() === 'Harbor Point Fund I' && !naming()
    && $('.titlebar .chartmenu .name').textContent === 'Harbor Point Fund I' && document.title === 'Harbor Point Fund I – Dendra' && pageTitles() === 'Harbor Point Fund I', `${chartName1()} / ${pageTitles()}`);
  check('… as one change, said so, that one Undo takes back', Time.describe(last()) === 'Renamed Untitled to Harbor Point Fund I' && Shell.parts.peek().undo.canUndo(), Time.describe(last()));
  // A page whose title was changed by hand keeps it.
  const second = App.addView('Closing'); await tick(60);
  const byHand = App.wb.rows(C1).find(r => 'shape' in r && r.view === second && r.role === 'title');
  App.change(tx => tx.update(byHand.shape, { text: 'Closing structure' }), { dated: false }); await tick(60);
  $('.titlebar .chartmenu').click(); await tick(60);
  item('Rename').click(); await tick(60);
  check('The chart menu’s Rename types over the name in place', naming()?.value === 'Harbor Point Fund I' && document.activeElement === naming());
  type(naming(), 'Harbor Point Fund I, L.P.'); press('Enter', naming()); await tick(100);
  check('… and a page’s title changed by hand keeps what it says', chartName1() === 'Harbor Point Fund I, L.P.' && pageTitles() === 'Closing structure | Harbor Point Fund I, L.P.', pageTitles());
  $('.titlebar .chartmenu').dispatchEvent(new MouseEvent('dblclick', { bubbles: true })); await tick(60);
  type(naming(), 'Something else'); press('Escape', naming()); await tick(60);
  check('A double-click on it types over it too, and Esc puts it back, the keys on it again', chartName1() === 'Harbor Point Fund I, L.P.' && !naming() && document.activeElement === $('.titlebar .chartmenu'), document.activeElement?.outerHTML.slice(0, 60));
  App.change(tx => tx.note('Name', { id: views()[0].id, kind: 'View' }, 'Overview'), { dated: false }); await tick(60);
  check('Its own edits undo as ever', Shell.parts.peek().undo.canUndo() && (undo(), views()[0].name === 'Chart'));
  // Its chart draws what it records, though the chart it was begun from leaves that out: a managing member, which
  // Structure doesn't draw, joined to its LLC; what Structure rules out (not an owner) and what a formula gives, not.
  const rels = {};
  App.change(tx => {
    const named = (kind, name) => { const o = tx.add('record', { kind }); tx.add('record', { at: o, edge: 'Name', field: 'text', value: name }); return o; };
    const gp = named('Entity', 'Larkspur Credit GP II, LLC'), type = tx.add('record', { at: gp, edge: 'Entity Type', choice: 'Limited Liability Company' });
    const elena = named('Individual', 'Elena V. Sorensen'), fund = named('Entity', 'Larkspur Credit Fund II, L.P.');
    rels.member = tx.add('record', { args: [{ edge: 'Member', at: elena }, { edge: 'LLC', at: type }], choice: 'Managing Member' });
    rels.notOwner = tx.add('record', { args: [{ edge: 'Owner', at: elena }, { edge: 'Owned', at: fund }], tag: false });
  }); await tick(200);
  const worked = App.computed.peek(), chartView = views().find(v => v.name === 'Chart').id, drawsIt = id => App.notes.peek().value('Shown', Tree.treeOf(worked.records, id), chartView) === true;
  rels.control = Object.keys(worked.computed).find(id => worked.records[id]?.args?.length === 2);
  check('… and draws what it records: a managing member, which Structure leaves out, joined to its LLC; not what Structure rules out, nor what a formula gives', drawsIt(rels.member)
    && !drawsIt(rels.notOwner) && !!rels.control && !drawsIt(rels.control), Object.entries(rels).map(([k, id]) => `${k} ${drawsIt(id)}`).join(', '));
  undo(); await tick(100);
  const onC1 = Shell.view.peek(), among = vs => vs.some(v => v.id === Shell.view.peek());
  Shell.parts.peek().workbook.open(C0); await tick(200);
  check('Back on the first chart, its Undo is its own', C() === C0 && Shell.parts.peek().undo.canUndo());
  // The address names the view, and the view its chart: so Back, a link and a reload open the chart it's of.
  const atC0 = Shell.view.peek();
  Shell.back(); await until(() => Shell.view.peek() === onC1); await tick(100);
  check('Opening another chart is a step: Back comes back to the chart it was on, at its view', C() === C1 && Shell.view.peek() === onC1 && among(views()), `${C() === C1} ${Shell.view.peek()}`);
  location.hash = `#v=${encodeURIComponent(atC0)}`; await until(() => Shell.view.peek() === atC0); await tick(100);
  check('A link to a view of another chart opens that chart at it', C() === C0 && Shell.view.peek() === atC0 && among(views()), `${C() === C0} ${Shell.view.peek()}`);
  check('Nothing threw along the way, the ruler measuring itself included', !errors.length, errors.join(' / '));
}

function report() {
  const failed = results.filter(x => !x.ok).length;
  document.title = `table test: ${results.length - failed} pass, ${failed} fail`;
  const esc = s => s.replace(/[&<>]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[ch]);
  const el = document.createElement('div');
  el.className = 'results';
  el.innerHTML = `<b>${esc(document.title)}</b>\n\n`.replace(/\n/g, '<br>') + [...results.filter(x => !x.ok), ...results.filter(x => x.ok)]
    .map(x => `<div class="${x.ok ? '' : 'fail'}">${x.ok ? 'PASS' : 'FAIL'}  ${esc(x.name)}${x.detail && !x.ok ? `  [${esc(x.detail)}]` : ''}</div>`).join('');
  document.body.appendChild(el);
}
Shell.ready.then(async () => {
  while (!App.chart.peek() || !views().length) await tick();
  await tick(200);
  try { await run(); } catch (e) { check('The checks ran to the end', false, `${e.message} ${e.stack.split('\n')[1]}`); }
  report();
});
</script>

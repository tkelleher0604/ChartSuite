<script>

  document.documentElement.dataset.theme = Q.get('theme') || 'light';
  try { localStorage.clear(); localStorage.setItem('dendra.toured', '1'); localStorage.setItem('dendra.name', 'Dana Jordan'); } catch {}

<script>
// The workbook opened at once, in memory: Store keeps it in IndexedDB, which this page leaves alone.
const Store = { open: () => Promise.resolve(Log.open(SAMPLE)), who: () => localStorage.getItem('dendra.name'), status: () => ({ text: '' }), subscribe: () => () => {},
  books: () => Promise.resolve([]), where: () => null };

<script src="../sample/calder-ridge.js"></script>
<script src="../ui/shell.js"></script>
<script src="../ui/app.js"></script>
<script src="../ui/table.js"></script>
<script src="../ui/time.js"></script>
<script src="../ui/formulabar.js"></script>
<script>
const results = [], check = (name, ok, detail = '') => results.push({ name, ok: !!ok, detail: String(detail ?? '') });
const tick = (ms = 40) => new Promise(r => setTimeout(r, ms));
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const C = () => App.chart.peek(), st = () => App.state.peek(), last = () => App.wb.changes().at(-1);
const N = () => App.wb.changes().length;
const views = () => Shell.parts.peek().views.list();
const undo = () => Shell.parts.peek().undo.undo();
const named = name => Object.keys(st()).find(id => Tree.isObject(st()[id]) && App.notes.peek().nameOf(st(), id) === name);
const item = (label, root = document) => [...root.querySelectorAll('.menu-item')].find(x => x.textContent.trim() === label);
const hover = el => el.dispatchEvent(new PointerEvent('pointermove', { bubbles: true }));
const column = title => Table.grid.getColumns().find(c => c.getDefinition().title === title);
const rowOf = id => Table.grid.getRow(id);
// The + menu, as a person picks from it: a submenu's item, or one at the top. Says whether the new tab's name
// was then being typed into, and leaves it as it is.
async function addTable(sub, label) {
  $('.foot > .btn.icon[aria-label="New view"]').click(); await tick();
  if (sub) { hover(item(sub)); await tick(); }
  item(label).click(); await tick(150);
  const typing = !!$('.sheets .sheet input');
  document.activeElement?.blur?.(); await tick();
  return typing;
}
function paste(text, target = Table.grid.rowManager.element) {
  const dt = new DataTransfer(); dt.setData('text/plain', text);
  const e = new ClipboardEvent('paste', { clipboardData: dt, bubbles: true, cancelable: true });
  target.dispatchEvent(e);
  return e;
}
const press = (key, el = document.activeElement || document.body) => el.dispatchEvent(new KeyboardEvent('keydown', { key, bubbles: true, cancelable: true }));
// The dialog that asks what headings are, answered: each select set to the option with this label.
async function answer(...labels) {
  const sels = $$('dialog.dlg select');
  labels.forEach((l, i) => { const o = [...sels[i].options].find(x => x.textContent === l); sels[i].value = o.value; sels[i].dispatchEvent(new Event('change', { bubbles: true })); });
  await tick();
  $('dialog.dlg .btn.primary').click(); await tick(200);
}
const errors = [];
addEventListener('error', e => errors.push(e.message));
const pct = (owner, owned, day) => {
  const s = App.wb.asOf(C(), day), o = Object.keys(s).find(id => s[id].args && s[id].args.some(a => a.edge === 'Owner' && App.notes.peek().nameOf(s, Tree.objectOf(s, a.at)) === owner) && s[id].args.some(a => a.edge === 'Owned' && App.notes.peek().nameOf(s, a.at) === owned));
  const p = o && Object.keys(s).find(x => s[x].at === o && s[x].edge === 'Percentage');
  return p ? s[p].value : null;
};

async function run() {
  // ---- The sheet tabs are the View objects, in their Order ----
  check('The tabs are the chart’s views, in their order', views().map(v => v.name).join() === 'Structure,40 Act,Fund III,Management and control,Entities,Ownership,Dates,Documents', views().map(v => v.name).join());
  check('A view without a Layout note is a chart', views().slice(0, 4).every(v => v.layout === 'chart') && views().slice(4).every(v => v.layout === 'table'));

  // ---- Adding a table view from the + menu ----
  let n0 = N();
  const typing = await addTable('Records', 'Entities');
  const ent = Shell.view.peek(), ev = st()[ent];
  const layout = App.notes.peek().value('Layout', { id: ent, kind: 'View' });
  check('The + menu makes a View object, as one change, never dated', ev?.kind === 'View' && N() === n0 + 1 && last().adds.every(r => !r.since));
  check('Its layout is a note at it: a table of the kind’s rows', JSON.stringify(layout) === JSON.stringify({ rows: { kind: 'Entity' } }), JSON.stringify(layout));
  check('Its tab comes last, named for its rows, and shows', views().at(-1).name === 'Entities 2' && views().at(-1).layout === 'table');
  check('Its name is being typed into, as a new tab’s is', typing);
  await tick(100);

  // ---- The Entities table ----
  const ents = Tree.index(st()).kinds.get('entity').length;
  check('Its rows are the records of the kind', Table.grid.getRows().length === ents, `${Table.grid.getRows().length} of ${ents}`);
  const titles = Table.grid.getColumns().map(c => c.getDefinition().title).filter(Boolean);
  check('Its columns are what’s located at the rows, Name first, in the entries’ order', titles.slice(0, 6).join() === 'Name,Short Name,Vehicle Type,Entity Type,Jurisdiction,Formation Date', titles.slice(0, 8).join());
  check('Entries below entries are columns too, hidden at first', Table.model(ent).cols.some(c => c.path?.join('›') === 'Jurisdiction›File Number' && !c.shown));
  check('Computed cells are italic', $$('.grid .tabulator-cell.fx').length > 0 && $$('.grid .tabulator-cell.fx').every(el => getComputedStyle(el).fontStyle === 'italic'), $$('.grid .tabulator-cell.fx').length);
  check('Tags are checkboxes, green attested and red ruled out', $$('.grid .c-tag .tag.yes').length > 0 && $$('.grid .c-tag .tag.no').length > 0);
  check('A choice edits as a dropdown of its options', column('Vehicle Type').getDefinition().editor === 'list' && column('Vehicle Type').getDefinition().editorParams.values.includes('Feeder Fund'));
  check('Header filters are dropdowns', column('Jurisdiction').getDefinition().headerFilter === 'list');

  // Show/Hide on a column writes a Shown note in the view.
  n0 = N();
  const jur = Table.model(ent).cols.find(c => c.title === 'Jurisdiction');
  Table.grid.getColumns().find(c => c.getDefinition().title === 'Jurisdiction').getElement().dispatchEvent(new MouseEvent('contextmenu', { bubbles: true, cancelable: true, clientX: 600, clientY: 60 }));
  await tick();
  check('A heading’s menu sorts, hides, and lists the columns with ticks', !!item('Sort A to Z') && !!item('Hide') && !!item('Columns'));
  item('Hide').click(); await tick(100);
  const shown = App.notes.peek().resolve('Shown', jur.pattern, ent);
  check('Hide writes a Shown note in the view, as one change', N() === n0 + 1 && shown?.note.view === ent && shown.value === false);
  check('The column goes', !column('Jurisdiction'));
  undo(); await tick(100);
  check('Undo brings it back', !!column('Jurisdiction'));

  // Editing in place, each edit one change.
  const halvard = named('Halvard Logistics Holdings, Inc.');
  n0 = N();
  const cell = rowOf(halvard).getCells().find(c => c.getColumn().getDefinition().title === 'Short Name');
  cell.edit(true); await tick();
  const input = cell.getElement().querySelector('input');
  input.value = 'Halvard';
  input.dispatchEvent(new KeyboardEvent('keydown', { key: 'Enter', bubbles: true, cancelable: true })); await tick(100);
  const sn = (Tree.index(st()).entries.get(halvard) ?? []).find(e => st()[e].edge === 'Short Name');
  check('Typing in a cell enters the value, as one change', N() === n0 + 1 && st()[sn]?.value === 'Halvard');
  check('The cell shows it', rowOf(halvard).getCells().find(c => c.getColumn().getDefinition().title === 'Short Name').getValue() === 'Halvard');
  const bad = rowOf(halvard).getCells().find(c => c.getColumn().getDefinition().title === 'Formation Date');
  bad.edit(true); await tick();
  const bi = bad.getElement().querySelector('input'); bi.value = 'next Tuesday';
  bi.dispatchEvent(new KeyboardEvent('keydown', { key: 'Enter', bubbles: true, cancelable: true })); await tick();
  check('What can’t be read stays in the cell, marked, and changes nothing', bi.classList.contains('bad') && N() === n0 + 1);
  bi.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', bubbles: true, cancelable: true })); await tick();
  undo(); await tick(100);
  check('Undo takes the value back', !(Tree.index(st()).entries.get(halvard) ?? []).some(e => st()[e].edge === 'Short Name'));

  // A tag's box flips: attested, ruled out, blank.
  const good = rowOf(halvard).getCells().find(c => c.getColumn().getDefinition().title === 'Good Standing');
  n0 = N();
  good.getElement().querySelector('.tag').dispatchEvent(new MouseEvent('click', { bubbles: true })); await tick(100);
  const gs = () => (Tree.index(st()).entries.get(halvard) ?? []).map(e => st()[e]).find(r => r.edge === 'Good Standing');
  check('Clicking a blank tag attests it', gs()?.tag === true && N() === n0 + 1);
  rowOf(halvard).getCells().find(c => c.getColumn().getDefinition().title === 'Good Standing').getElement().querySelector('.tag').dispatchEvent(new MouseEvent('click', { bubbles: true })); await tick(100);
  check('Clicking an attested tag rules it out', gs()?.tag === false);
  undo(); await tick(60); undo(); await tick(100);

  // Selection: a row selected is the record selected, and the other way round.
  const fund = named('Calder Ridge Capital Partners III, L.P.');
  Table.grid.addRange(rowOf(fund).getCells()[1]); await tick(60);
  check('Selecting a row selects its record', Shell.selection.peek().join() === fund, Shell.selection.peek().join());
  Shell.select([halvard]); await tick(60);
  check('Selecting a record elsewhere marks its row', rowOf(halvard).getElement().classList.contains('picked') && !rowOf(fund).getElement().classList.contains('picked'));
  Shell.select([]); await tick();

  // A heading the table hasn't got is asked about: here, a new entry; a name it hasn't got is a new row.
  n0 = N();
  paste('Name\tFund Counsel\tFormation Date\r\nCalder Ridge III Blocker, Inc.\tKirkland & Ellis LLP\t\r\nHollis Bay Holdings, LLC\tSimpson Thacher\t3/2/2026\r\n'); await tick(150);
  check('A heading nothing matches is asked about, and nothing is pasted yet', $('dialog.dlg')?.textContent.includes('Fund Counsel') && N() === n0);
  await answer('New column');
  check('The paste is redlined first: its new row in blue, its new column, and a bar saying what it does', $$('.grid .tabulator-row.red-add').length === 1 && !!column('Fund Counsel')
    && /3 values.*1 new entity/.test($('.pastebar')?.textContent) && N() === n0, $('.pastebar')?.textContent);
  check('A pending paste can’t be edited over', !column('Name').getDefinition().editable(rowOf(halvard).getCells()[1]));
  press('Enter'); await tick(150);
  const blocker = named('Calder Ridge III Blocker, Inc.'), hollis = named('Hollis Bay Holdings, LLC');
  const at = (id, edge) => (Tree.index(st()).entries.get(id) ?? []).map(e => st()[e]).find(r => r.edge === edge);
  check('Pasting a new heading adds an entry, and a new name a row, in one change', N() === n0 + 1 && at(blocker, 'Fund Counsel')?.value === 'Kirkland & Ellis LLP'
    && st()[hollis]?.kind === 'Entity' && at(hollis, 'Formation Date')?.value === '2026-03-02' && !!column('Fund Counsel'));
  check('Enter makes it, and the redline goes', !$('.pastebar') && !$$('.grid .tabulator-row.red-add').length && !$$('.grid .tabulator-cell .del, .grid .tabulator-cell .add').length);
  undo(); await tick(150);
  check('Undo takes the new entry and the new row back', !named('Hollis Bay Holdings, LLC') && !column('Fund Counsel'));

  // A link pasted onto a row isn't written over a cell: it goes on, to link a document to the row's record.
  n0 = N();
  Table.grid.addRange(rowOf(halvard).getCells().find(c => c.getColumn().getDefinition().title === 'Name')); await tick(60);
  const linked = paste('https://contoso.sharepoint.com/sites/FundLegal/Shared%20Documents/Halvard%20LLC%20Agreement.pdf'); await tick(100);
  check('A link pasted onto a row goes on to link a document, and never overwrites the Name', !linked.defaultPrevented && N() === n0 && !$('.pastebar')
    && Shell.selection.peek().join() === halvard && rowOf(halvard).getData().f0 === 'Halvard Logistics Holdings, Inc.');

  // The keys: one stop in the tab order, and an arrow with no cell active makes one.
  const holder = Table.grid.rowManager.element;
  Table.grid.modules.selectRange.resetRanges?.(); Table.grid.modules.selectRange.activeRange = undefined;
  holder.focus(); errors.length = 0;
  press('ArrowDown', holder); await tick(60);
  check('An arrow with no cell active makes one, and throws nothing', !errors.length && !!Table.grid.modules.selectRange.activeRange, errors.join());
  check('The headings and their filters are out of the tab order', $$('.grid .tabulator-header-filter input').every(x => x.tabIndex === -1) && $$('.grid .tabulator-cell').slice(0, 20).every(x => x.tabIndex === -1));
  const sc = rowOf(halvard).getCells().find(c => c.getColumn().getDefinition().title === 'Short Name');
  sc.edit(true); await tick();
  const si = sc.getElement().querySelector('input'); si.value = 'Halvard';
  si.dispatchEvent(new KeyboardEvent('keydown', { key: 'Enter', bubbles: true, cancelable: true })); await tick(150);
  check('After an edit the grid keeps the keys', $('.grid .cells').contains(document.activeElement), document.activeElement?.className);
  undo(); await tick(100);

  // Moving a column writes Order notes in the view.
  Table.grid.addRange(Table.grid.getRows()[0].getCells()[1]); await tick();   // as pressing the heading would
  n0 = N();
  Table.grid.moveColumn(column('Jurisdiction').getField(), column('Name').getField(), true); await tick(150);
  const order = Table.model(ent).cols.filter(x => x.shown).map(x => x.title);
  check('Moving a column places it, as Order notes in the view, one change', N() === n0 + 1 && order[1] === 'Jurisdiction' && App.notes.peek().resolve('Order', jur.pattern, ent)?.note.view === ent, order.slice(0, 3).join());
  undo(); await tick(150);

  // The tabs: renamed, moved, duplicated and deleted, each one change.
  const tabs = Shell.parts.peek().views;
  n0 = N();
  tabs.rename(ent, 'Entity register'); await tick(60);
  check('Renaming a tab renames its view', views().find(v => v.id === ent).name === 'Entity register' && N() === n0 + 1);
  tabs.move(ent, 0); await tick(60);
  check('Dragging a tab reorders the views by their Order notes', views()[0].id === ent && N() === n0 + 2);
  tabs.menu(ent).find(x => x.label === 'Duplicate').run(); await tick(150);
  const copy = Shell.view.peek();
  check('Duplicate copies the view, its layout and its notes, next to it', copy !== ent && views()[1].id === copy && views()[1].layout === 'table' && Table.model(copy)?.rows.kind === 'Entity');
  tabs.menu(copy).find(x => x.label === 'Delete').run(); await tick(150);
  check('Delete deletes the view, and shows another', !views().some(v => v.id === copy) && Shell.view.peek() !== copy);
  for (let i = 0; i < 4; i++) { undo(); await tick(60); }
  check('Undo puts the tabs back as they were', views().map(v => v.name).join() === 'Structure,40 Act,Fund III,Management and control,Entities,Ownership,Dates,Documents,Entities 2', views().map(v => v.name).join());
  Shell.show(ent); await tick(100);

  // CSV, through the Export menu, while a table shows.
  let csv = null;
  const make = URL.createObjectURL;
  URL.createObjectURL = blob => { blob.text().then(t => { csv = t; }); return 'blob:none'; };
  const stop = e => { if (e.target.closest?.('a[download]')) e.preventDefault(); };
  document.addEventListener('click', stop, true);
  const exp = Shell.parts.peek().export.find(x => x.name === 'CSV');
  exp?.run(); await tick(100);
  URL.createObjectURL = make; document.removeEventListener('click', stop, true);
  const lines = (csv ?? '').replace(/^﻿/, '').split(/\r?\n/);
  check('Export offers CSV while a table shows', !!exp);
  check('The CSV is what the table shows, headings first, tags as Yes and No', lines[0]?.startsWith('"Name","Short Name"') && lines.some(l => l.includes('"Calder Ridge Capital Partners III, L.P."') && l.includes('"Yes"')), lines.slice(0, 2).join(' / '));

  // ---- The Ownership table, and a closing schedule pasted from Excel ----
  await addTable('Relations', 'Ownership');
  const own = Shell.view.peek(), ownRows = Object.keys(st()).filter(id => st()[id].args?.some(a => a.edge === 'Owner')).length;
  check('A relation’s table: a row for each, its sides first, then what’s at it', Table.grid.getRows().length === ownRows && Table.grid.getColumns().map(c => c.getDefinition().title).filter(Boolean).join() === 'Owner,Owned,Percentage,Voting Percentage');
  Shell.at({ asOf: '2026-11-02' }); await tick(100);
  n0 = N();
  const rows0 = Table.grid.getRows().length;
  paste('Owner\tOwned\tPercentage\r\nU.S. Investors\tFund III\t67.3%\r\nOffshore Feeder\tFund III\t26.7%\r\nHalcyon University Endowment\tFund III\t6%\r\n'); await tick(150);
  const bar = $('.pastebar')?.textContent ?? '';
  check('Pasting into a relation says what it creates, and from what day', /3 values/.test(bar) && /1 new ownership/.test(bar) && /new Entity\s*Halcyon University Endowment/.test(bar) && /From Nov 2, 2026/.test(bar) && N() === n0, bar);
  check('A value it would change shows the old struck and the new in blue', $$('.grid .tabulator-cell .del').some(x => x.textContent === '71.6%') && $$('.grid .tabulator-cell .add').some(x => x.textContent === '67.3%'));
  press('Enter'); await tick(150);
  const c = last();
  check('Pasting is one change', N() === n0 + 1, N() - n0);
  check('Columns match by heading and rows by name, Short Name included', pct('U.S. Investors', 'Calder Ridge Capital Partners III, L.P.', '2026-11-02') === 0.673 && pct('Calder Ridge Capital Partners III (Cayman), L.P.', 'Calder Ridge Capital Partners III, L.P.', '2026-11-02') === 0.267);
  check('With a day shown, a value pasted takes effect from it', pct('U.S. Investors', 'Calder Ridge Capital Partners III, L.P.', '2026-11-01') === 0.716);
  check('A row that’s new is added, with its new owner', pct('Halcyon University Endowment', 'Calder Ridge Capital Partners III, L.P.', '2026-11-02') === 0.06 && Table.grid.getRows().length === rows0 + 1);
  check('A name finds an entity, never a view of that name', c.adds.some(r => r.args?.some(a => a.edge === 'Owned' && a.at === fund)));
  check('The toast says what was done, with Undo', /^Pasted 3 values, added 1 ownership/.test($('.toast')?.textContent ?? ''), $('.toast')?.textContent);
  check('History says it in the chart’s words', Time.describe(c) === 'Changed Percentage of U.S. Investors → Fund III from 71.6% to 67.3% as of Nov 2, 2026, and 2 more', Time.describe(c));
  undo(); await tick(150);
  check('One Undo takes the whole paste back', pct('U.S. Investors', 'Calder Ridge Capital Partners III, L.P.', '2026-11-02') === 0.716 && pct('Halcyon University Endowment', 'Calder Ridge Capital Partners III, L.P.', '2026-11-02') === null && Table.grid.getRows().length === rows0);
  // Without headings, cells fill the grid from the active cell.
  Shell.at(null); await tick(100);
  const us = Table.grid.getRows().find(r => r.getData().f0 === 'U.S. Investors');
  Table.grid.addRange(us.getCells().find(x => x.getColumn().getDefinition().title === 'Percentage')); await tick(40);
  n0 = N();
  paste('70%'); await tick(150);
  press('Enter'); await tick(150);
  check('Without headings, a paste fills from the active cell', pct('U.S. Investors', 'Calder Ridge Capital Partners III, L.P.', Log.today()) === 0.7 && N() === n0 + 1);
  undo(); await tick(100);
  // A schedule whose headings don't match is never pasted by place: it's asked about, and matched by name.
  const first = Table.grid.getRows()[0], firstPct = first.getData().f2;
  Table.grid.addRange(first.getCells()[1]); await tick(40);
  n0 = N();
  paste('Investor\tFund\tPercentage\r\nU.S. Investors\tFund III\t50%\r\n'); await tick(150);
  check('Headings that don’t match are asked about, never pasted by place', !!$('dialog.dlg') && N() === n0 && Table.grid.getRows()[0].getData().f2 === firstPct);
  await answer('Owner', 'Owned');
  check('Matched, the row is found by its names', $$('.grid .tabulator-cell .del').some(x => x.textContent === '71.6%') && $$('.grid .tabulator-cell .add').some(x => x.textContent === '50%') && !$$('.grid .tabulator-row.red-add').length);
  press('Escape'); await tick(150);
  Table.grid.addRange(first.getCells()[1]); await tick(40);
  paste('U.S. Investors\tFund III\t50%\r\n'); await tick(150);
  check('Without headings, a row that gives its names finds its row by them, not by place', $$('.grid .tabulator-cell .del').some(x => x.textContent === '71.6%') && Table.grid.getRows()[0].getData().f2 === firstPct);
  press('Escape'); await tick(150);
  check('Esc leaves it unmade',!$('.pastebar') && N() === n0 && !$$('.grid .tabulator-cell .add').length && pct('U.S. Investors', 'Calder Ridge Capital Partners III, L.P.', Log.today()) === 0.716);

  // A relation ruled out: a red ✗ in the margin, its words intact.
  await addTable('Relations', 'Signing Authority');
  const ruled = $('.grid .tabulator-row.ruled');
  check('A row ruled out is marked in the margin, not struck through', !!ruled && [...ruled.querySelectorAll('.tabulator-cell:not(.rn)')].every(x => !getComputedStyle(x).textDecorationLine.includes('line-through'))
    && getComputedStyle(ruled.querySelector('.rn'), '::before').content !== 'none');
  Shell.show(own); await tick(100);
  // Any change pending, whoever previews it, is redlined in the grid.
  const goes = Table.grid.getRows()[1].getData().id;
  FormulaBar.preview({ records: { [goes]: null } }); await tick(100);
  check('A change pending elsewhere is redlined in the grid: a row that would go is struck in red', rowOf(goes).getElement().classList.contains('red-go') && !$('.pastebar'));
  FormulaBar.preview(null); await tick(100);
  check('Without it, the grid is as it was', !$$('.grid .tabulator-row.red-go').length && Table.grid.getRows().length === rows0);

  // ---- Dates and Documents ----
  await addTable(null, 'Dates');
  const dates = Table.model(Shell.view.peek());
  check('Dates has every date in the chart, entered or computed', dates.data.length === Object.values(st()).filter(r => r.field === 'date').length && dates.data.some(r => r._m.f0.fx));
  check('Overdue comes first, then month by month', dates.groups[0] === 'overdue' && dates.groups.slice(1).every(g => /^\d{4}-\d\d$/.test(g)));
  const overdue = dates.data.filter(r => r._g === 'overdue');
  check('What’s overdue is a date a formula gives, before today', overdue.length > 0 && overdue.every(r => r.f0 < Log.today() && (r._m.f0.fx || r._m.f0.over)), overdue.map(r => r.f0).join());
  check('Overdue reads red', $$('.grid .tabulator-cell.due').length === overdue.length);
  await addTable(null, 'Documents');
  const docs = Table.model(Shell.view.peek());
  check('Documents has every document link, with the Document’s own entries beside it', docs.data.length === Object.values(st()).filter(r => r.field === 'document').length
    && docs.cols.filter(x => x.shown).map(x => x.title).slice(0, 4).join() === 'Document,Name,Document Type,Document Date', docs.cols.filter(x => x.shown).map(x => x.title).join());

  // ---- The time: the chart's days, the date control, the strip, a view keeping a date ----
  const days = Time.events.peek().map(e => e.day), dated = App.wb.rows(C()).flatMap(r => [r.since, r.before]).filter(Boolean);
  check('The days on which something starts or ends: every version’s, and every start and end date, in order', dated.every(d => days.includes(d))
    && ['2024-07-09', '2024-09-16', '2026-06-15', '2023-02-14'].every(d => days.includes(d)) && days.every((d, i) => !i || days[i - 1] < d), days.length);
  const jul9 = Time.events.peek().find(e => e.day === '2024-07-09');
  check('Each day is said in the chart’s words', jul9?.items.some(x => x.what === 'Admission Date' && x.of === 'Cayman GP → Offshore Feeder'), JSON.stringify(jul9?.items));
  $('.titlebar .asof').click(); await tick(100);
  check('The date control opens a calendar beside the chart’s days', !!$('.date-pop .cal-grid') && $$('.date-pop .dayrow').length >= Time.events.peek().length);
  const list = [...$('.date-pop .date-days').children], y2024 = list.findIndex(x => x.classList.contains('yr') && x.textContent === '2024');
  list.slice(y2024).find(b => b.querySelector?.('.d')?.textContent === 'Jul 1').click(); await tick(100);
  check('Picking one of them shows the chart as of that day', Shell.time.peek()?.asOf === '2024-07-01' && $('.titlebar .asof').textContent.includes('Jul 1, 2024'));
  check('While another day shows, a band over the view says which', $('.view > .strip > .band')?.textContent === 'As of July 1, 2024Today', $('.view > .strip > .band')?.textContent);
  check('The strip shows under the view, a tick for each day', $$('.scrub > i').length === new Set([...Time.events.peek().map(e => e.day), Log.today()]).size);
  [...$$('.date-pop .cal-grid .d')].find(b => b.textContent === '15' && !b.classList.contains('out')).click(); await tick(100);
  check('Or any day from the calendar', Shell.time.peek()?.asOf === '2024-07-15');
  Shell.closeAll(); await tick();
  const s = $('.scrub'), r = s.getBoundingClientRect();
  s.dispatchEvent(new PointerEvent('pointerdown', { bubbles: true, clientX: r.left + 18, clientY: r.top + 10, pointerId: 1, button: 0 }));
  s.dispatchEvent(new PointerEvent('pointerup', { bubbles: true, clientX: r.left + 18, clientY: r.top + 10, pointerId: 1 }));
  await tick(60);
  check('Pressing the strip scrubs to the nearest day', Shell.time.peek()?.asOf === Time.events.peek()[0].day, JSON.stringify(Shell.time.peek()));
  Shell.show(own); Shell.at({ asOf: '2024-07-01' }); await tick(60);
  Time.keep(own, '2024-07-01'); await tick(60);
  check('A view keeps a date as an As Of note on its View object', App.notes.peek().resolve('As Of', { id: own, kind: 'View' })?.value === '2024-07-01');
  Shell.show(ent); await tick(60);
  check('Leaving it for a view that keeps none comes back to today', Shell.time.peek() === null);
  Shell.show(own); await tick(60);
  check('Coming back to it shows its day', Shell.time.peek()?.asOf === '2024-07-01');
  Time.keep(own, null); await tick(60);
  $('.view > .strip > .band .btn').click(); await tick(60);
  check('Its Today comes back to today, and the band goes', Shell.time.peek() === null && !$('.band'));

  // ---- History ----
  Shell.select([]);
  Shell.parts.peek().action.find(a => a.id === 'history').run(); await tick(100);
  const ours = App.wb.changes().filter(x => x.chart === C());
  check('History opens in the inspector’s place, from the chart menu', !!$('.inspector .hist') && Shell.parts.peek().action.some(a => a.id === 'history' && a.menu === 'chart'));
  check('It lists every change, newest first', $$('.hist-row').length === ours.length && $$('.hist-row .what')[0].textContent === Time.describe(ours.at(-1)), `${$$('.hist-row').length} of ${ours.length}: ${$$('.hist-row .what').slice(0, 3).map(x => x.textContent).join(' / ')} ${$('.inspector')?.innerHTML.slice(0, 300)}`);
  check('Each says who, when, and what, in the chart’s words', $$('.hist-row').some(x => x.textContent.includes('Ruled out Good Standing of AIV-1 as of Jul 15, 2026') && x.textContent.includes('Jordan Alvarez')), $$('.hist-row').filter(x => /AIV-1|Corvane/.test(x.textContent)).slice(0, 6).map(x => x.textContent).join(' / '));
  const okafor = named('David R. Okafor'), manager = named('Calder Ridge Capital Management, LLC');
  const ruling = { id: 'x', who: 'Dana Jordan', when: new Date().toISOString(), chart: C(), removes: [], adds: [{ id: 'xr', record: 'xc', args: [{ edge: 'Controller', at: okafor }, { edge: 'Controlled', at: manager }], tag: false }] };
  check('A presumption ruled out says so', Time.describe(ruling) === 'Ruled out Control: David R. Okafor → The Manager', Time.describe(ruling));
  const before = st();
  const pick =[...$$('.hist-row')].find(x => x.textContent.includes('Changed Percentage of Fund III → Corvane'));
  pick.click(); await tick(150);
  const corvane = named('Corvane Specialty Chemicals Holdings, LLC');
  check('Picking a change shows the chart as it stood just after it', Shell.time.peek()?.stood && pct('Calder Ridge Capital Partners III, L.P.', 'Corvane Specialty Chemicals Holdings, LLC', Log.today()) === 0.49
    && App.state.peek() !== before && Object.values(App.state.peek()).some(x => x.at && st()[x.at]?.args?.some(a => a.at === corvane)));
  check('As it stood, the table can’t be edited', Table.grid.getRows()[0].getCells().every(x => !x.getColumn().getDefinition().editable || !x.getColumn().getDefinition().editable(x)));
  check('The change picked can be undone, by name', $('.hist-row[aria-selected="true"] .btn')?.textContent === 'Undo this change');
  check('As it stood, the band says when', /^As it stood \w+ \d+, \d{4}, \d+:\d\d [AP]MToday$/.test($('.view > .strip > .band')?.textContent ?? ''), $('.view > .strip > .band')?.textContent);
  document.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', bubbles: true, cancelable: true })); await tick(60);
  check('Esc comes back to now, keeping History open', Shell.time.peek() === null && !!$('.inspector .hist'));
  Shell.select([fund]); await tick(60);
  const touching = $$('.hist-row').length;
  check('With a selection, History narrows to it', touching > 0 && touching < ours.length && !!$('.hist-focus'), `${touching} of ${ours.length}`);
  Shell.select([]); await tick(60);
  $$('.hist-head .menu-seg button')[1].click(); await tick(60);
  // The sample deleted two registered agents; what this test added and undid was never there.
  const gone = () => $$('.hist-row.gone').map(x => x.querySelector('.what').textContent);
  check('Deleted lists what was deleted and not restored', ['Registered Agent · GP III › Jurisdiction: Delaware', 'Registered Agent · Fund III › Jurisdiction: Delaware'].every(x => gone().includes(x)) && !gone().some(x => /^Name/.test(x)), gone().join());
  check('An addition undone isn’t listed as deleted', !gone().includes('Halcyon University Endowment') && !gone().includes('Hollis Bay Holdings, LLC'), gone().join());
  n0 = N();
  const k = gone().length;
  $$('.hist-row.gone').find(x => x.textContent.includes('Registered Agent · GP III')).querySelector('.btn').click(); await tick(100);
  check('Restore brings it back, as one change', N() === n0 + 1 && gone().length === k - 1 && !!st().gp_agent);
  undo(); await tick(60);
  document.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', bubbles: true, cancelable: true })); await tick(60);
  check('Esc then closes History', !$('.inspector .hist'));
}

function report() {
  const failed = results.filter(x => !x.ok).length;
  document.title = `table test: ${results.length - failed} pass, ${failed} fail`;
  const esc = s => s.replace(/[&<>]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[ch]);
  const el = document.createElement('div');
  el.className = 'results';
  el.innerHTML = `<b>${esc(document.title)}</b>\n\n`.replace(/\n/g, '<br>') + [...results.filter(x => !x.ok), ...results.filter(x => x.ok)]
    .map(x => `<div class="${x.ok ? '' : 'fail'}">${x.ok ? 'PASS' : 'FAIL'}  ${esc(x.name)}${x.detail && !x.ok ? `  [${esc(x.detail)}]` : ''}</div>`).join('');
  document.body.appendChild(el);
}
Shell.ready.then(async () => {
  while (!App.chart.peek() || !views().length) await tick();
  await tick(200);
  try { await run(); } catch (e) { check('The checks ran to the end', false, `${e.message} ${e.stack.split('\n')[1]}`); }
  report();
});
</script>

<script>
  // Isolate preferences as well as workbook storage; opening this test must not clear app settings.
  const memoryStorage = () => {
    const data = new Map();
    return { getItem: k => data.get(String(k)) ?? null, setItem: (k, v) => data.set(String(k), String(v)),
      removeItem: k => data.delete(String(k)), clear: () => data.clear(), key: i => [...data.keys()][i] ?? null, get length() { return data.size; } };
  };
  Object.defineProperty(window, 'localStorage', { value: memoryStorage() });
  Object.defineProperty(window, 'sessionStorage', { value: memoryStorage() });
  sessionStorage.setItem('dendra.launched', '1'); localStorage.setItem('dendra.toured', '1');
  localStorage.setItem('dendra.theme', new URLSearchParams(location.search).get('theme') || 'light');
  document.documentElement.dataset.theme = localStorage.getItem('dendra.theme');
</script>

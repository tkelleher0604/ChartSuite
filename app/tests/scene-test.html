<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dendra scene test</title>
<style>
  body { margin: 0; padding: 20px; background: #fafafa; color: #18181b; font: 13px/1.5 ui-monospace, Consolas, monospace; }
  .fail { color: #b42318; }
  @media (prefers-color-scheme: dark) { body { background: #111113; color: #e4e4e7; } .fail { color: #f97066; } }
</style>
</head>
<body>
<pre id="out">Running…</pre>
<script src="../../vendor/elkjs/elk.bundled.js"></script>
<script src="../core/tree.js"></script>
<script src="../core/notes.js"></script>
<script src="../core/log.js"></script>
<script src="../core/formulas.js"></script>
<script src="../core/layout.js"></script>
<script src="../core/scene.js"></script>
<script src="../sample/calder-ridge.js"></script>
<script>
// Checks of the scene (scene.js) and the layout (layout.js) on the sample: which note decides a setting,
// what's drawn, the legend, frames, positions entered and laid out, how long it takes, and that what a scene
// keeps from the one before never makes it other than drawn from nothing. Nothing is saved.
const out = [];
const check = (name, ok, detail = '') => out.push({ name, ok: !!ok, detail: String(detail ?? '') });
const C = 'calder-ridge', DAY = '2026-10-26', WHO = 'Dana Jordan', MAIN = 'view_main';
const j = x => JSON.stringify(x);
const median = xs => [...xs].sort((a, b) => a - b)[Math.floor(xs.length / 2)];

function run() {
  const fresh = () => Log.open(SAMPLE);
  // The chart worked out, as App works it out.
  const computed = wb => {
    const N = wb.notes(C), S = wb.schema(C);
    return Formulas.computeState(wb.asOf(C, DAY), N.definitions(S), { relations: N.relations(S) });
  };
  const worked = wb => computed(wb).records;
  const scene = (wb, view = MAIN, opts = {}) => { const R = computed(wb); return Scene.of(wb, C, view, DAY, { state: R.records, computed: R, ...opts }); };
  const edit = (wb, f) => { const tx = wb.edit({ chart: C, who: WHO }); f(tx, wb.notes(C)); const c = tx.commit(); if (typeof c === 'string') throw new Error(c); return c; };
  const note = (tx, N, label, pattern, view, value) => Canvas_writeNote(tx, N, { label, pattern, view }, value);
  const tree = (wb, id) => Tree.treeOf(wb.asOf(C, DAY), id);
  const VT = o => ({ out: { choice: o }, args: [{ edge: 'Vehicle Type', loc: {} }] });
  // A new chart, as App.startChart begins one from Structure (its schema, its styles and its page: title, date and Key),
  // with the records `make` adds. → { wb, c, view, s }, s its scene on `paper`.
  const newChart = (make, paper = null, key = true) => {
    const wb = fresh(), c = 'new', tx = wb.edit({ chart: c, who: WHO });
    tx.add('chart', { name: 'Untitled' }, c);
    for (const tree of Object.values(wb.schema(C))) tx.add('spec', { tree });
    const view = tx.add('record', { kind: 'View' }), moved = t => t.args ? { ...t, args: t.args.map(a => ({ ...a, loc: moved(a.loc) })) } : t.id === MAIN ? { ...t, id: view } : t;
    for (const r of wb.rows(C)) if ('note' in r && (!r.view || r.view === MAIN) && [...Tree.idsIn(r.pattern)].every(id => id === MAIN))
      tx.note(r.label, moved(r.pattern), r.label === 'Name' && r.pattern.id === MAIN ? 'Chart' : r.value, { view: r.view && view, param: r.param });
    tx.add('shape', { view, geometry: 'text', role: 'title', text: 'Untitled' });
    tx.add('shape', { view, geometry: 'text', role: 'date', text: '="As of " & TEXT(@AsOf, "mmmm d, yyyy")' });
    if (key) tx.add('shape', { view, geometry: 'legend', title: 'Key', columns: 2 });
    if (typeof tx.commit() === 'string') throw new Error('no new chart');
    if (make) { const t2 = wb.edit({ chart: c, who: WHO }); make(t2, view); if (typeof t2.commit() === 'string') throw new Error('no records'); }
    const N = wb.notes(c), S = wb.schema(c), R = Formulas.computeState(wb.asOf(c, DAY), N.definitions(S), { relations: N.relations(S) });
    return { wb, c, view, s: Scene.of(wb, c, view, DAY, { state: R.records, computed: R, paper }) };
  };
  const entity = (tx, name, type, more = {}) => {
    const e = tx.add('record', { kind: 'Entity' });
    tx.add('record', { at: e, edge: 'Name', field: 'text', value: name });
    for (const [edge, choice] of Object.entries(more)) tx.add('record', { at: e, edge, choice });
    return [e, tx.add('record', { at: e, edge: 'Entity Type', choice: type })];
  };
  const group = (tx, name) => { const i = tx.add('record', { kind: 'Investor Group' }); tx.add('record', { at: i, edge: 'Name', field: 'text', value: name }); return i; };
  const owns = (tx, a, b, value) => { const o = tx.add('record', { args: [{ edge: 'Owner', at: a }, { edge: 'Owned', at: b }], tag: true }); if (value != null) tx.add('record', { at: o, edge: 'Percentage', field: 'percent', value }); };
  const gpOf = (tx, g, type) => tx.add('record', { args: [{ edge: 'GP', at: g }, { edge: 'Partnership', at: type }], tag: true });
  // The simplest new fund charts: firstlook9's M3, a fund, its GP and its investors at 100%; regress9's, the investors at
  // 99% and the GP at 1%; and as the window builds one (regress10 2, firstlook10 m4): the GP's relation made first and
  // the investors' percentage not yet typed, and its boxes placed on the chart, with a person placed beside them whom
  // no line joins.
  const larkspur = (tx, pct) => {
    const [f, type] = entity(tx, 'Larkspur Credit Fund II, L.P.', 'Limited Partnership', { Jurisdiction: 'Delaware' }), [g] = entity(tx, 'Larkspur Credit GP II, LLC', 'Limited Liability Company');
    const i = group(tx, 'Larkspur Credit Fund II Investors');
    gpOf(tx, g, type); owns(tx, i, f, pct);
    return { f, g, i };
  };
  const NEW_FUNDS = {
    'a new fund, its GP and its investors': tx => { larkspur(tx, 1); },
    'a new fund, its investors at 99% and its GP at 1%': tx => {
      const [f, type] = entity(tx, 'Harbor Point Capital Partners I, L.P.', 'Limited Partnership', { 'Vehicle Type': 'Main Fund' }), [g] = entity(tx, 'Harbor Point GP I, LLC', 'Limited Liability Company');
      const i = group(tx, 'Harbor Point Investors');
      gpOf(tx, g, type); owns(tx, i, f, 0.99); owns(tx, g, f, 0.01);
    },
    'a new fund, its GP and its investors, their percentage not yet typed': tx => { larkspur(tx, null); },
    'a new fund, its GP and its investors placed on the chart, and a person placed beside them, the percentage not yet typed': (tx, view) => {
      const { f, g, i } = larkspur(tx, null), p = tx.add('record', { kind: 'Individual' });
      tx.add('record', { at: p, edge: 'Name', field: 'text', value: 'Elena V. Sorensen' });
      for (const [id, kind, x, y] of [[f, 'Entity', 300, 300], [g, 'Entity', 200, 100], [i, 'Investor Group', 400, 100], [p, 'Individual', 60, 100]]) tx.note('Position', { id, kind }, { x, y, loose: true }, { view });
    },
  };

  // ---- The narrowest decides ----
  {
    const wb = fresh(), s = scene(wb), fund = s.byId.get('fund');
    check('a style’s format lands on the box: Main Fund fills the fund’s', fund.settings.Fill.value === '#dae3f3' && fund.settings.Fill.note.note === 'n3u',
      j(fund.settings.Fill));
    check('a triangle comes from Entity Type, a choice in the box', fund.shape === 'triangle' && fund.settings.Shape.note.pattern.out.choice === 'Limited Partnership');
    check('a setting nothing in the chart gives is the default, with no note', fund.settings.Outline.value === '#000000' && fund.settings.Outline.note === null);
    edit(wb, (tx, N) => {
      note(tx, N, 'Fill', tree(wb, 'fund'), MAIN, '#fdf3e1');
      note(tx, N, 'Fill', { kind: 'Entity' }, undefined, '#f5f0e6');
      note(tx, N, 'Fill', { out: { tag: false }, args: [{ edge: 'Good Standing', loc: {} }] }, MAIN, '#fbe9e7');
    });
    const t = scene(wb);
    check('one record’s own note in the view wins over every style', t.byId.get('fund').settings.Fill.value === '#fdf3e1' && Tree.idsIn(t.byId.get('fund').settings.Fill.note.pattern).has('fund'));
    check('a note in no view is the default where no style says', t.byId.get('gp').settings.Fill.value === '#f5f0e6' && !t.byId.get('gp').settings.Fill.note.view,
      j(t.byId.get('gp').settings.Fill));
    check('a note in the view beats one in none', t.byId.get('feeder').settings.Fill.value === '#dae3f3');
    check('where notes reach one box through two records, the later style wins', t.byId.get('aiv').settings.Fill.value === '#fbe9e7'
      && t.byId.get('aiv').settings.Fill.note.pattern.args[0].edge === 'Good Standing', j(t.byId.get('aiv').settings.Fill.value));
    check('a text takes its own style’s properties, and its box’s where none', (() => {
      const juris = t.byId.get('fund').texts.find(x => x.id === 'fund_juris'), name = t.byId.get('fund').texts.find(x => x.id === 'fund_name');
      return juris.settings.Size.value === 8 && juris.text === '(Delaware)' && name.look.Bold === true && name.look.Font === 'Arial';
    })());
  }

  // ---- Shown, reaching through locations ----
  {
    const wb = fresh(), s = scene(wb);
    const drawn = id => s.byId.has(id);
    check('boxes are drawn unless a style hides them: no documents, no service providers', drawn('fund') && !Object.keys(wb.asOf(C, DAY)).some(id => wb.asOf(C, DAY)[id].kind === 'Document' && drawn(id)));
    check('one record hidden in the view stays hidden', !drawn('raman') && !drawn('ferraro'));
    check('a line is drawn only where both its boxes are', s.marks.filter(m => m.type === 'line').every(l => drawn(l.from) && drawn(l.to)));
    check('a text on a line is drawn where its line is', drawn('own_us_fund_pct') && s.byId.get('own_us_fund').texts.some(x => x.text === '71.6%'));
    edit(wb, (tx, N) => note(tx, N, 'Shown', tree(wb, 'inv_us'), MAIN, false));
    const t = scene(wb);
    check('hiding a box hides its texts, its lines and what is on them', !t.byId.has('inv_us') && !t.byId.has('inv_us_name') && !t.byId.has('own_us_fund') && !t.byId.has('own_us_fund_pct'));
    const r = scene(wb, MAIN, { reveal: ['own_us_fund_pct'] });
    check('a hidden record can be drawn for a while, with what it sits in', r.byId.has('own_us_fund_pct') && r.byId.get('inv_us').revealed && !r.byId.get('fund').revealed);
    const forty = scene(wb, 'view_40act'), st = worked(wb);
    const affiliates = Object.values(st).filter(x => x.edge === 'BDC Affiliate' && x.tag === true).map(x => x.at);
    const boxes = forty.marks.filter(m => m.type === 'box').map(m => m.id);
    check('a style showing by a tag’s output is the view’s filter: 40 Act draws the BDC affiliates', boxes.length > 10 && j([...boxes].sort()) === j([...new Set(affiliates)].sort()),
      `${boxes.length} drawn, ${new Set(affiliates).size} affiliates`);
    const fund3 = scene(wb, 'view_fund3');
    check('a filter by Vehicle Type: Fund III draws the funds, not the manager', fund3.byId.has('fund') && fund3.byId.has('blocker') && !fund3.byId.has('mgmt') && !fund3.byId.has('chen'));
    check('a filter shows boxes, not the filtering text', !fund3.byId.get('fund').texts.some(x => x.id === 'fund_vehicle'));
  }

  // ---- Text ----
  {
    const wb = fresh(), s = scene(wb);
    const fits = s.marks.filter(m => m.type === 'box').every(b => b.texts.every(it => it.lines.every(l => l.w <= b.w)));
    check('every box’s text is broken into lines that fit it', fits);
    const fund = s.byId.get('fund'), name = fund.texts[0];
    check('a box’s texts go in their entries’ order, the name first', name.id === 'fund_name' && name.lines.length > 1 && fund.texts[1].id === 'fund_juris');
    const forty = scene(wb, 'view_40act');
    check('a computed record is marked, for the canvas to set it in italics', forty.marks.some(m => m.type === 'line' && m.computed) && !s.byId.get('own_us_fund').computed);
    const tier = sc => sc.marks.filter(m => m.shape === 'triangle' && m.id !== 'feeder').map(m => m.h);
    edit(wb, tx => tx.set('feeder_name', { ...wb.asOf(C, DAY).feeder_name, value: 'Calder Ridge Beteiligungsverwaltungsgesellschaft mbH' }));
    const long = scene(wb), feeder = long.byId.get('feeder'), ls = feeder.texts[0].lines;
    check('a word wider than its box is hyphenated, and its box doesn’t stretch the others in its tier', ls.some(l => l.cut && l.text.endsWith('-')) && ls.every(l => l.w <= feeder.w)
      && j(tier(long)) === j(tier(s)), j(ls.map(l => l.text)));
    const below = sc => sc.marks.filter(m => m.type === 'box' && s.byId.get(m.id).y > s.byId.get('feeder').y + s.byId.get('feeder').h);
    const full = 'Calder Ridge Capital Partners III (Cayman), L.P., a Cayman Islands exempted limited partnership acting by its general partner Calder Ridge Capital GP III (Cayman), Ltd., a Cayman Islands exempted company';
    edit(wb, tx => tx.set('feeder_name', { ...wb.asOf(C, DAY).feeder_name, value: full }));
    const grown = scene(wb), big = grown.byId.get('feeder'), all = big.texts[0].lines;
    check('a text too long for its box is never cut: every word is drawn', all.map(l => l.text).join(' ').replace(/ /g, ' ') === full && !all.some(l => l.cut || /…$/.test(l.text)), j(all.map(l => l.text)));
    const clash = grown.marks.filter(m => m.type === 'box').flatMap((a, i, bs) => bs.slice(i + 1).filter(b => a.x < b.x + b.w && b.x < a.x + a.w && a.y < b.y + b.h && b.y < a.y + a.h).map(b => [a.id, b.id]));
    const drops = below(grown).map(b => [Math.round(s.byId.get(b.id).y / 4), b.y - s.byId.get(b.id).y]), level = [...new Set(drops.map(([r]) => r))].every(r => new Set(drops.filter(d => d[0] === r).map(d => Math.round(d[1]))).size === 1);
    check('… its box grows, and the ranks below it move down, each level, so that no box overlaps another', big.h > s.byId.get('feeder').h && !clash.length
      && drops.length > 3 && drops.every(([, d]) => d > 0) && level, j({ clash, drops: drops.map(([r, d]) => [r, Math.round(d)]) }));
    const k = grown.page.scale, date = grown.marks.find(m => m.role === 'date'), chartTop = Math.min(...grown.marks.filter(m => m.type === 'box').map(m => m.y)) * k;
    check('… the other triangles keep their size, and the chart, drawn smaller, moves down under the title and date', j(tier(grown)) === j(tier(s))
      && k < s.page.scale && chartTop >= (date.y + date.h) * k - 4.8 + 32 - 0.5, j({ scale: k, chartTop, under: (date.y + date.h) * k - 4.8 + 32 }));
    const others = grown.marks.filter(m => m.type === 'box' && m.id !== 'feeder');
    check('… a long name widens its box, to twice its width, before it grows tall, the boxes beside it moving aside, so the chart is drawn no smaller than 0.7', big.w > 176 && big.w <= 352
      && k >= 0.7 && !others.some(b => b.x < big.x + big.w && big.x < b.x + b.w && b.y < big.y + big.h && big.y < b.y + b.h), j({ w: big.w, h: big.h, scale: k }));
    const balanced = s.byId.get('blocker').texts[0].lines.map(l => l.text.replace(/\s/g, ' '));
    check('a suffix keeps to the word before it, and a numeral too, and a name’s lines are balanced', j(balanced) === j(['Calder Ridge III', 'Blocker, Inc.'])
      && s.marks.filter(m => m.type === 'box').every(b => !b.texts.some(it => it.lines.some(l => /^(Inc\.|LLC|L\.P\.|Ltd\.)$/.test(l.text)))), j(balanced));
  }

  // ---- The legend ----
  {
    const wb = fresh();
    let key;
    edit(wb, tx => { key = tx.add('shape', { view: MAIN, geometry: 'legend', x: 40, y: 700, w: 300, title: 'Key' }); });
    const s = scene(wb), lg = s.byId.get(key);
    // A row by an output it stands for.
    const row = (lg, f) => lg.rows.find(r => r.outputs.some(f));
    const choice = c => o => o.out?.choice === c, owns = o => !!o.args?.some(a => a.edge === 'Owner');
    check('the legend has a row for each output a drawn mark takes its look from', !!row(lg, choice('Main Fund')) && !!row(lg, choice('Limited Partnership')) && !!row(lg, owns) && !!row(lg, choice('Portfolio Company')),
      lg.rows.map(r => r.caption.text).join(' | '));
    check('outputs that look alike share a row', row(lg, choice('Main Fund')) === row(lg, choice('Feeder Fund')));
    const groups = Scene.groupsOf(wb.notes(C), MAIN), funds = groups.find(g => g.outputs.some(choice('Main Fund')));
    check('Styles, the Key and the scope group by one rule: a style’s outputs that look alike, the Key’s rows those of them drawn', funds.outputs.length === 6 && funds.caption === 'Funds'
      && lg.rows.every(r => groups.some(g => g.style === r.style && j({ ...g.swatch, Weight: 0 }) === j({ ...r.swatch, Weight: 0 }) && r.outputs.every(o => g.outputs.some(p => Tree.key(p) === Tree.key(o))))),
      j(groups.map(g => [g.caption, g.outputs.length])));
    check('no row for a look nothing drawn takes', !row(lg, choice('Business Development Company')) || s.marks.some(m => m.type === 'box' && m.settings.Fill.note?.pattern.out?.choice === 'Business Development Company'));
    check('a row’s swatch is drawn in its output’s format', row(lg, choice('Main Fund')).swatch.Fill === '#dae3f3' && row(lg, choice('Limited Partnership')).swatch.Shape === 'triangle'
      && row(lg, owns).swatch.kind === 'line');
    check('a row is captioned in the chart’s words, by its Caption notes', row(lg, choice('Main Fund')).caption.text === 'Funds' && row(lg, o => o.out?.tag === false).caption.text === 'Not in good standing',
      lg.rows.map(r => r.caption.text).join(' | '));
    const FUNDS = ['Main Fund', 'Business Development Company', 'Feeder Fund', 'Parallel Fund', 'AIV', 'Co-Investment Vehicle'];
    edit(wb, (tx, N) => {
      for (const v of FUNDS) note(tx, N, 'Caption', VT(v), MAIN, 'Fund vehicle');
      note(tx, N, 'Shown', VT('Portfolio Company'), MAIN, false);
    });
    const t = scene(wb), lt = t.byId.get(key);
    check('a Caption note captions a row', lt.rows.some(r => r.caption.text === 'Fund vehicle'));
    check('rows follow the outputs in use: hide every portfolio company and its row goes', !row(lt, choice('Portfolio Company')) && lt.rows.length === lg.rows.length - 1,
      `${lg.rows.length} then ${lt.rows.length}`);
    check('the legend is a shape: placed where it was put on the page, sized and formatted as one, and where it would fall off the page’s foot, brought back onto it',
      lt.x === 40 && (lt.y === 700 || Math.abs(lt.y + lt.h - t.page.h) < 0.5) && lt.y <= 700 && lt.w === 300 && lt.h > 40 && lt.look.Outline === '#7f7f7f', `${lt.x}, ${lt.y}, ${lt.w} × ${lt.h} on ${t.page.h}`);
    edit(wb, (tx, N) => { for (const v of FUNDS) note(tx, N, 'Caption', VT(v), MAIN, undefined); });
    const u = scene(wb).byId.get(key), plain = row(u, choice('Main Fund')), listed = xs => xs.length < 3 ? xs.join(' and ') : `${xs.slice(0, -1).join(', ')} and ${xs.at(-1)}`;
    check('outputs of one look with no caption are called by their outputs, those drawn, never by the style’s name', plain.outputs.length > 2
      && plain.caption.text === listed(plain.outputs.map(p => Scene.outputName(wb.notes(C), p))), plain.caption.text);
    const sample = fresh();
    const exhibits = ['view_main', 'view_40act', 'view_fund3', 'view_control'].map(v => {
      const sh = scene(sample, v).marks.filter(m => m.type === 'shape'), text = m => sample.item(C, m.id)[0]?.text ?? '';
      const asOf = sh.find(m => /^="As of " & TEXT\(@AsOf/.test(text(m)));
      return { title: sh.some(m => m.geometry === 'text' && m.look.Bold && m.look.Size >= 16), asOf: asOf?.texts[0]?.text, key: sh.some(m => m.geometry === 'legend' && m.columns === 2) };
    });
    check('every sample chart view is an exhibit: a title, its date and a Key', exhibits.every(e => e.title && e.asOf && e.key), j(exhibits));
    check('… its date worked out as of the view’s day', exhibits.every(e => e.asOf === 'As of October 26, 2026'), j(exhibits.map(e => e.asOf)));
    // A new chart's page has a Key, which isn't drawn while nothing is keyed, the page as it would be without it.
    const page = s => j({ page: s.page, marks: s.marks.map(m => [m.type, m.geometry, m.x, m.y, m.w, m.h]) }), blank = newChart(null).s, keyed = newChart(Object.values(NEW_FUNDS)[0]).s;
    check('a new chart’s Key isn’t drawn while nothing is keyed, the page as it would be without one, and is drawn once something is',
      !blank.marks.some(m => m.geometry === 'legend') && page(blank) === page(newChart(null, null, false).s) && keyed.marks.some(m => m.geometry === 'legend' && m.rows.length > 0),
      j(blank.marks.map(m => m.geometry ?? m.type)));
  }

  // ---- One rule for groups and their captions: the Key, Styles and the scope ----
  {
    const wb = fresh(), R = computed(wb), st = R.records, CONTROL = 'view_control';
    const own = (N, v, p) => { const c = N.resolve('Caption', p, v); return c && Tree.key(c.note.pattern) === Tree.key(p) ? c.value : null; };
    const show = (v, id, value) => edit(wb, (tx, N) => note(tx, N, 'Shown', Tree.treeOf(st, id), v, value));
    const keyOf = v => Scene.of(wb, C, v, DAY, { state: st, computed: R }).legend, holding = (rows, c) => rows.find(r => r.outputs.some(p => p.out?.choice === c));
    // Management and control's Key with the Cayman feeder and AIV-1 shown: the BDC's caption is the BDC's alone.
    show(CONTROL, 'feeder', true); show(CONTROL, 'aiv', true);
    const mc = keyOf(CONTROL), bdc = holding(mc, 'Business Development Company');
    check('Management and control, the feeder and the AIV shown: the Key calls the BDC alone a business development company, the feeder and the AIV funds',
      bdc?.caption === 'Business development company' && bdc.outputs.length === 1 && ['Feeder Fund', 'AIV'].every(c => holding(mc, c)?.caption === 'Funds'), j(mc.map(r => [r.caption, r.outputs.length])));
    edit(wb, (tx, N) => { for (const c of ['Feeder Fund', 'Parallel Fund', 'AIV', 'Co-Investment Vehicle']) note(tx, N, 'Caption', VT(c), CONTROL, undefined); });
    const plain = holding(keyOf(CONTROL), 'Feeder Fund'), styled = Scene.groupsOf(wb.notes(C), CONTROL).find(g => g.outputs.some(p => p.out?.choice === 'Feeder Fund'));
    check('… and uncaptioned, a row of their own called by what it holds: “Feeder Fund and AIV” in the Key, all four in Styles', plain?.caption === 'Feeder Fund and AIV'
      && styled?.caption === 'Parallel Fund, Feeder Fund, AIV and Co-Investment Vehicle' && holding(keyOf(CONTROL), 'Business Development Company')?.outputs.length === 1, `${plain?.caption} | ${styled?.caption}`);
    const names = Scene.groupsOf(wb.notes(C), MAIN).find(g => g.swatch.kind === 'text' && g.outputs.some(p => p.args?.[0].edge === 'Name'));
    check('a text style uncaptioned is called by the texts it sets, Names, and is its style alone, listed under no name', names?.caption === 'Names' && names.name === null, j(names && [names.caption, names.name]));
    // Every view, with every entity, person or group of a kind the views draw shown in turn where it doesn't draw

// Canvas.writeNote, without the canvas: a note at exactly this pattern, label and view.
function Canvas_writeNote(tx, N, { label, pattern, view }, value) {
  const k = Tree.key(pattern), old = N.notes(label).find(n => (n.view ?? null) === (view ?? null) && !n.param && Tree.key(n.pattern) === k);
  const row = { label, pattern, ...(view && { view }), value };
  if (value === undefined) { if (old) tx.remove(old.note); } else if (old) tx.set(old.note, row); else tx.add('note', row);
}

// JSON }]
function drawAll(wb, before = null) {
  const N = wb.notes(C), S = wb.schema(C), defs = N.definitions(S), names = { relations: N.relations(S), schema: S }, entered = wb.asOf(C, DAY);
  const R = Formulas.computeState(entered, defs, names, before), st = R.records, out = {};
  const said = ({ page, marks, styles, legend }) => JSON.stringify({ page, marks, styles, legend });
  for (const v of (Tree.index(st).kinds.get('view') ?? []).filter(v => !N.value('Layout', { id: v, kind: 'View' })).sort())
    out[v] = said(Scene.of(wb, C, v, DAY, { state: st, computed: R }));
  const main = Scene.of(wb, C, MAIN, DAY, { state: st, computed: R }), own = Object.keys(entered).sort().find(id => entered[id].tag && entered[id].args?.some(a => a.edge === 'Owner'));
  if (own) {
    const R2 = Formulas.computeState({ ...entered, [own]: { ...entered[own], tag: false } }, defs, names, before && R);
    // A redline is the scene the change, made, draws, laid out ahead (the canvas inks it).
    out.redlined = said(Scene.of(wb, C, MAIN, DAY, { state: R2.records, computed: R2, ahead: true }));
  }
  const hidden = Object.keys(st).filter(id => (Tree.isObject(st[id]) || st[id].args?.length === 2) && !Tree.isView(st[id]) && !main.byId.has(id)).sort();
  out.revealed = said(Scene.of(wb, C, MAIN, DAY, { state: st, computed: R, reveal: hidden.filter((_, i) => i % 7 === 0).slice(0, 4) }));
  return [R, out];
}
// The same drawn in a page that has kept nothing: this one, opened afresh, the log saved and opened there.
const drawnAfresh = json => new Promise((done, fail) => {
  const f = document.createElement('iframe');
  f.src = `${location.pathname.split('/').pop()}?fresh`;
  f.style.display = 'none';
  f.onload = () => { try { done(f.contentWindow.drawFresh(json)); } catch (e) { fail(e); } finally { f.remove(); } };
  document.body.appendChild(f);
});

// Edits of every kind to the sample, chosen at random (from a fixed seed), one after another, each with the
// views drawn after it as the app draws them, from the working-out before and what every scene before kept:
// each must be the same as drawn from nothing, in a page that has kept nothing.
async function drawnAgain() {
  let seed = 7, k = 0;
  const rand = () => (seed = (seed * 1103515245 + 12345) % 2147483648) / 2147483648;
  const pick = xs => xs[Math.floor(rand() * xs.length)], ids = (r, f) => Object.keys(r).filter(x => f(r[x])).sort();
  const pct = () => Math.round(rand() * 100) / 100, entity = st => pick(ids(st, x => x.kind === 'Entity'));
  const VIEWS = ['view_main', 'view_40act', 'view_fund3', 'view_control'];
  const kinds = [
    ['a percentage', (tx, st) => { const id = pick(ids(st, x => x.edge === 'Percentage')); if (id) tx.update(id, { value: pct() }); }],
    ['a name', (tx, st) => { const id = pick(ids(st, x => x.edge === 'Name' && st[x.at]?.kind === 'Entity')); if (id) tx.update(id, { value: `${st[id].value} II` }); }],
    ['a tag', (tx, st) => { const id = pick(ids(st, x => 'tag' in x)); if (id) tx.update(id, { tag: !st[id].tag }); }],
    ['an entity type', (tx, st) => { const id = pick(ids(st, x => x.edge === 'Entity Type')); if (id) tx.update(id, { choice: pick(['Limited Partnership', 'Limited Liability Company', 'Corporation']) }); }],
    ['an ownership added', (tx, st) => { const a = entity(st), b = entity(st); if (a === b) return;
      const o = tx.add('record', { args: [{ edge: 'Owner', at: a }, { edge: 'Owned', at: b }], tag: true }); tx.add('record', { at: o, edge: 'Percentage', field: 'percent', value: pct() }); }],
    ['an ownership removed', (tx, st) => { const id = pick(ids(st, x => x.args?.some(a => a.edge === 'Owner'))); if (id) tx.remove(id); }],
    ['an entity added', (tx, st) => { const e = tx.add('record', { kind: 'Entity' });
      tx.add('record', { at: e, edge: 'Name', field: 'text', value: `Random Holdings ${k}, LLC` });
      tx.add('record', { args: [{ edge: 'Owner', at: entity(st) }, { edge: 'Owned', at: e }], tag: true }); }],
    ['an entity removed', (tx, st) => { const id = entity(st); if (id) tx.remove(id); }],
    ['a style', tx => tx.note('Fill', { out: { choice: pick(['Limited Partnership', 'Limited Liability Company']) }, args: [{ edge: 'Entity Type', loc: {} }] }, pick(['#e2f0d9', '#fbe5d6', undefined]), { view: pick(VIEWS) })],
    ['a box hidden', (tx, st) => { const id = entity(st); if (id) tx.note('Shown', Tree.treeOf(st, id), false, { view: pick(VIEWS) }); }],
    ['a box moved', (tx, st) => { const id = entity(st); if (id) tx.note('Position', Tree.treeOf(st, id), { x: Math.round(rand() * 900), y: Math.round(rand() * 500), w: 132 }, { view: MAIN }); }],
    ['a position taken away', (tx, st, N) => { const n = pick(N.notes('Position')); if (n) tx.remove(n.note); }],
    ['a text box', tx => tx.add('shape', { view: pick(VIEWS), geometry: 'text', text: `Note ${k}`, x: Math.round(rand() * 900), y: Math.round(rand() * 500) })],
  ];
  const wb = Log.open(SAMPLE), differ = [];
  let [R] = drawAll(wb), edits = 0;
  for (; k < 30; k++) {
    const [what, f] = pick(kinds), tx = wb.edit({ chart: C, who: WHO });
    f(tx, wb.asOf(C, DAY), wb.notes(C));
    const c = tx.commit();
    if (!c || typeof c === 'string') continue;
    edits++;
    const [R2, now] = drawAll(wb, R), fresh = await drawnAfresh(JSON.stringify(wb));
    const bad = Object.keys(fresh).filter(x => now[x] !== fresh[x]);
    if (bad.length || Object.keys(now).length !== Object.keys(fresh).length) differ.push(`${what} (${k}): ${bad.join(', ')}`);
    R = R2;
  }
  check('Random edits to the sample, each view drawn after each as the app draws it, are drawn as from nothing, redlined and revealed too',
    edits >= 20 && !differ.length, `${edits} edits${differ.length ? `; ${differ.join('; ')}` : ', none differ'}`);
}

if (location.search.includes('fresh')) window.drawFresh = json => drawAll(Log.open(json))[1];
else Promise.resolve().then(run).then(drawnAgain)
  .catch(e => check('runs', false, e.stack ?? e))
  .finally(() => {
    const failed = out.filter(c => !c.ok);
    const line = c => `${c.ok ? 'pass' : 'FAIL'}  ${c.name}${c.detail ? `  (${c.detail})` : ''}`;
    document.title = `scene test: ${out.length - failed.length} pass, ${failed.length} fail`;
    document.getElementById('out').innerHTML = [`${out.length - failed.length} passed, ${failed.length} failed`, '',
      ...failed.map(c => `<span class="fail">${line(c).replace(/</g, '&lt;')}</span>`), ...(failed.length ? [''] : []),
      ...out.filter(c => c.ok).map(line).map(s => s.replace(/</g, '&lt;'))].join('\n');
  });
</script>
</body>

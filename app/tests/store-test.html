<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Store test</title>
<style>
  body { margin: 24px; font: 13px/1.5 ui-monospace, Consolas, monospace; background: #fff; color: #18181b; }
  .fail { color: #c0352b; font-weight: 600; }
  @media (prefers-color-scheme: dark) { body { background: #111113; color: #e4e4e7; } .fail { color: #f97066; } }
</style>
<script>
  // Every error on the page counts against it. The keys the test writes are set aside first and put back at
  // the end, so running it in a browser leaves that browser's workbook as it was.
  window.pageErrors = [];
  window.addEventListener('error', e => window.pageErrors.push(e.message));
  const KEPT = ['rboreal.workbook.v2', 'rboreal.store', 'rboreal.sharepoint.config', 'rboreal.sharepoint.demo', 'rboreal.user'];
  const kept = Object.fromEntries(KEPT.map(k => [k, localStorage.getItem(k)]));
  for (const k of KEPT) localStorage.removeItem(k);
  sessionStorage.clear();
</script>
</head>
<body>
<pre id="out">Running…</pre>
<script src="../core/common.js"></script>
<script src="../core/model.js"></script>
<script src="../core/sample.js"></script>
<script src="../core/formulas.js"></script>
<script src="../core/styles.js"></script>
<script src="../../vendor/msal/msal-browser.min.js"></script>
<script src="../core/sharepoint.js"></script>
<script src="../core/store.js"></script>
<script>
// Checks store.js: where the workbook is kept, and how the working copy in this browser syncs with a file
// or a SharePoint library. The library is the connector's demo tenant; the file is a stand-in for a File
// System Access handle. Failures are listed first.
const out = [];
const check = (name, ok, detail = '') => {
  out.push({ name, ok: !!ok, detail: typeof detail === 'string' ? detail : JSON.stringify(detail) });
  document.getElementById('out').textContent = `Running… ${out.length} checks so far, the last: ${name}`;
};
const sp = SharePoint.connector;
const working = () => JSON.parse(localStorage.getItem(WORKBOOK_KEY));
// The entity the test renames, fixed once, since renaming it moves it in the list.
let target = null;
const firstEntity = () => target ??= objectsOfKind('Entity')[0];
const rename = name => saveFieldValue(nameRecordOf(firstEntity()), name);
const nameHere = () => objectName(firstEntity());
const nameIn = text => { const wb = JSON.parse(text); const s = wb.charts.find(c => c.id === workbook.chartId).state; return objectName(firstEntity(), s.records); };
const failsWith = async (promise, pattern) => { try { await promise; return null; } catch (e) { return pattern.test(e.message) ? e : null; } };
const remote = () => sp.loadWorkbook(Store.place().path);
// Someone else saving the library's copy, as from their own computer, with a change of their own.
async function colleagueSaves(name) {
  const now = await remote();
  const wb = JSON.parse(now.json);
  const c = wb.charts.find(x => x.id === workbook.chartId);
  c.state.records[nameRecordOf(firstEntity())] = { ...c.state.records[nameRecordOf(firstEntity())], value: name };
  sp.demo.setUser({ name: 'Margaret A. Chen' });
  await sp.saveWorkbook(Store.place().path, JSON.stringify(wb), now.eTag);
  sp.demo.setUser({ name: 'Demo User' });
}
// A stand-in for a File System Access handle: a file in memory, which another computer can change too.
function fakeFile(name) {
  let content = '', modified = Date.now();
  return {
    name, kind: 'file', permission: 'granted',
    async getFile() { const text = content; return { name, lastModified: modified, text: async () => text }; },
    async createWritable() { let buf = ''; return { write: async t => { buf += t; }, close: async () => { content = buf; modified += 1000; } }; },
    async queryPermission() { return this.permission; },
    async requestPermission() { return (this.permission = 'granted'); },
    elsewhere(text) { content = text; modified += 60000; },
    get content() { return content; },
  };
}

async function run() {
  initState();
  await Store.sync();

  // ---- This browser ----
  check('Browser: where it starts', Store.place().place === 'browser' && Store.status().text === 'Saved in this browser', Store.status());
  check('Browser: the untouched sample has nothing to lose', Store.atRisk() === null);
  rename('Calder Ridge Capital Partners III, L.P. (renamed)');
  check('Browser: once changed, the workbook is at risk', Store.atRisk() === 'workbook');

  // ---- A SharePoint library ----
  check('Library: signing in is needed', await failsWith(Store.saveLibraryAs('Test workbook'), /Sign in/));
  await Store.signIn();
  check('Library: the demo sign-in is kept for the tab, as MSAL keeps a real one', sessionStorage.getItem('rboreal.sharepoint.demoSession') === '1');
  check('Library: saving it there', await Store.saveLibraryAs('Test workbook') === 'Test workbook' && Store.place().place === 'sharepoint' && Store.place().path === 'Rboreal/Test workbook.rboreal.json');
  check('Library: the status says where, and when', Store.status().text === 'Saved to Fund Legal › Rboreal · just now' && Store.status().tone === '', Store.status());
  let there = await remote();
  check('Library: the library has the working copy, without the session', nameIn(there.json) === nameHere() && !('chartId' in JSON.parse(there.json))
    && JSON.parse(there.json).charts.every(c => !('viewId' in c.state)));
  check('Library: nothing unsaved after saving', !Store.unsaved() && Store.atRisk() === null);
  check('Library: saving as a name already there is refused', await failsWith(Store.saveLibraryAs('Test workbook'), /already a workbook called Test workbook/));

  rename('Renamed again');
  check('Library: a change is unsaved until saved', Store.unsaved() && Store.atRisk() === 'changes');
  await Store.sync();
  there = await remote();
  check('Library: a change is saved there, as a new version', nameIn(there.json) === 'Renamed again' && there.item.version === '2.0', there.item.version);

  switchView(views.find(v => v.id !== viewId).id);
  check('Library: switching views changes nothing to save', !Store.unsaved());
  await Store.sync();
  check('Library: and saves nothing', (await remote()).item.version === '2.0');
  const viewHere = viewId;

  // Someone else saves; this browser, with nothing unsaved, takes theirs when it looks.
  await colleagueSaves('Their name');
  await Store.sync({ look: true });
  check('Library: a newer copy there is taken, with nothing unsaved here', nameHere() === 'Their name' && Store.place().by === 'Margaret A. Chen' && !Store.unsaved(), nameHere());
  check('Library: taking it keeps the view this browser had open', viewId === viewHere);

  // Both change: a conflict, and both copies kept.
  await colleagueSaves('Theirs, again');
  rename('Mine, meanwhile');
  await Store.sync();
  let p = Store.place();
  check('Conflict: saving over a newer copy is refused, and says who saved it', p.conflict?.by === 'Margaret A. Chen' && Store.status().tone === 'error'
    && Store.status().text === 'Not saved: Margaret A. Chen saved a newer version', Store.status());
  check('Conflict: mine is kept here', nameHere() === 'Mine, meanwhile' && nameIn(localStorage.getItem(WORKBOOK_KEY)) === 'Mine, meanwhile');
  check('Conflict: theirs is kept there', nameIn((await remote()).json) === 'Theirs, again');
  rename('Mine, still');
  await Store.sync();
  check('Conflict: nothing more is saved until someone chooses', nameIn((await remote()).json) === 'Theirs, again');
  await Store.keepMine();
  check('Conflict: keeping mine saves it over theirs', nameIn((await remote()).json) === 'Mine, still' && !Store.place().conflict && !Store.unsaved());

  await colleagueSaves('Theirs, a third time');
  rename('Mine, a third time');
  await Store.sync();
  await Store.takeTheirs();
  check('Conflict: taking theirs makes it the working copy', nameHere() === 'Theirs, a third time' && !Store.place().conflict && !Store.unsaved());

  await colleagueSaves('Theirs, a fourth time');
  rename('Mine, a fourth time');
  await Store.sync();
  await Store.saveMineAs('Test workbook (mine)');
  p = Store.place();
  const original = await sp.loadWorkbook('Rboreal/Test workbook.rboreal.json');
  check('Conflict: saving mine as a copy keeps it there from then on, and leaves theirs', p.path === 'Rboreal/Test workbook (mine).rboreal.json' && !p.conflict
    && nameIn((await remote()).json) === 'Mine, a fourth time' && nameIn(original.json) === 'Theirs, a fourth time');

  // Opening another workbook from the library.
  check('Library: opening a name that isn’t there says so', await failsWith(Store.openLibrary('Nowhere'), /no workbook called Nowhere/));
  check('Library: opening is asked first, and can be declined', await Store.openLibrary('Test workbook', { confirm: async () => false }) === null && Store.place().name === 'Test workbook (mine)');
  let asked = null;
  await Store.openLibrary('Test workbook', { confirm: async info => { asked = info; return true; } });
  check('Library: opening another makes it the working copy, and the place', Store.place().name === 'Test workbook' && nameHere() === 'Theirs, a fourth time' && asked?.by === 'Margaret A. Chen');

  // Signed out, and offline: the working copy keeps the change.
  await Store.signOut();
  rename('Made while signed out');
  await Store.sync();
  check('Signed out: said so, and kept here', Store.status().tone === 'busy' && /Signed out of SharePoint/.test(Store.status().text) && Store.status().fix === 'sign-in' && Store.unsaved(), Store.status());
  await Store.signIn();
  await Store.sync();
  check('Signed out: signing in saves what was kept', nameIn((await remote()).json) === 'Made while signed out' && !Store.unsaved());
  Object.defineProperty(navigator, 'onLine', { get: () => false, configurable: true });
  rename('Made offline');
  await Store.sync();
  check('Offline: said so, and kept here', /^Offline/.test(Store.status().text) && Store.status().tone === 'busy' && Store.unsaved(), Store.status());
  delete navigator.onLine;
  await Store.sync();
  check('Offline: back online, it’s saved', nameIn((await remote()).json) === 'Made offline');

  check('Library: pointing the connector at another library keeps the workbook in this browser', (() => {
    Store.configure({ workbookFolder: 'Elsewhere' });
    const moved = Store.place().place === 'browser';
    Store.configure({ workbookFolder: 'Rboreal' });
    return moved;
  })());

  // ---- A file ----
  const file = fakeFile('Fund.rboreal.json');
  window.showSaveFilePicker = async () => file;
  window.showOpenFilePicker = async () => [file];
  check('File: saving it to a file', await Store.saveFileAs() === 'Fund.rboreal.json' && Store.place().place === 'file' && nameIn(file.content) === nameHere());
  check('File: the status names the file', Store.status().text === 'Saved to Fund.rboreal.json · just now', Store.status());
  rename('Saved to the file');
  await Store.sync();
  check('File: a change is saved to it', nameIn(file.content) === 'Saved to the file' && !Store.unsaved());
  const changedThere = JSON.parse(file.content);
  changedThere.charts.find(c => c.id === workbook.chartId).state.records[nameRecordOf(firstEntity())].value = 'From another computer';
  file.elsewhere(JSON.stringify(changedThere));
  await Store.sync({ look: true });
  check('File: a change made to it elsewhere is taken, with nothing unsaved here', nameHere() === 'From another computer');
  file.elsewhere(file.content);
  rename('Mine, in the file');
  await Store.sync();
  check('File: a change elsewhere meets mine as a conflict', Store.place().conflict && Store.place().conflict.by === null && nameIn(file.content) === 'From another computer');
  await Store.keepMine();
  check('File: keeping mine writes it over', nameIn(file.content) === 'Mine, in the file' && !Store.place().conflict);
  file.permission = 'prompt';
  rename('Waiting for leave');
  await Store.sync();
  check('File: without leave to write, it says so and keeps the change', Store.status().fix === 'allow' && Store.unsaved(), Store.status());
  await Store.allowFile();
  check('File: once allowed, it’s saved', nameIn(file.content) === 'Waiting for leave' && !Store.unsaved());
  check('File: opening one makes it the working copy', await Store.openFile() === 'Fund.rboreal.json' && Store.place().place === 'file' && nameHere() === 'Waiting for leave');

  // ---- Export and import ----
  let exported = null;
  const make = URL.createObjectURL, click = HTMLAnchorElement.prototype.click;
  URL.createObjectURL = blob => { exported = blob; return make.call(URL, blob); };
  HTMLAnchorElement.prototype.click = function () { exported.name = this.download; };
  const name = Store.exportWorkbook();
  URL.createObjectURL = make;
  HTMLAnchorElement.prototype.click = click;
  const text = await exported.text();
  check('Export: the whole workbook, named for where it’s kept and when', /^Fund \d{4}-\d{2}-\d{2}\.rboreal\.json$/.test(name) && exported.name === name && JSON.parse(text).charts.length === workbook.charts.length, name);
  check('Export: read back, it’s a workbook', (await Store.readFile(new File([text], name))).workbook.charts.length === workbook.charts.length);
  check('Import: a file that isn’t a workbook is refused, saying why', await failsWith(Store.readFile(new File(['{"x":1}'], 'Notes.json')), /isn’t a Rboreal workbook/));

  const incoming = JSON.parse(text);
  const mineNow = incoming.charts[0];
  mineNow.state.records[nameRecordOf(firstEntity())].value = 'Imported name';
  mineNow.state.history = [{ id: 'h_from_file', when: '2020-01-01T00:00:00.000Z', who: 'Jordan Alvarez', summary: 'A change made elsewhere', changes: [] }, ...mineNow.state.history];
  incoming.charts.push({ ...structuredClone(mineNow), id: 'chart_other', name: 'Halvard Holdings' });
  const before = workbook.charts.length, current = workbook.chartId, undos = undoStack.length;
  const result = Store.importWorkbook(incoming, { source: 'Fund.rboreal.json' });
  check('Import: a chart that’s here too is replaced, the others added', result.replaced.length === 1 && result.added[0] === 'Halvard Holdings' && workbook.charts.length === before + 1, result);
  check('Import: the replaced chart has the file’s data, in one undoable step', nameHere() === 'Imported name' && undoStack.length === undos + 1 && workbook.chartId === current);
  check('Import: recorded in its history, with its source', historyLog[0].summary === 'Imported from Fund.rboreal.json' && historyLog[0].source === 'import' && historyLog[0].changes.length === 1);
  check('Import: the history keeps every entry, from both', historyLog.some(h => h.id === 'h_from_file') && historyLog.some(h => /Renamed again|Mine, still/.test(JSON.stringify(h.changes))));
  undoState();
  check('Import: undo takes it back', nameHere() === 'Waiting for leave');
  switchChart('chart_other');
  check('Import: an added chart keeps its id, its history, and a note of the import', chartInUse().name === 'Halvard Holdings' && historyLog[0].source === 'import' && historyLog.some(h => h.id === 'h_from_file'));
  switchChart(current);
  const asNew = Store.importWorkbook(incoming, { source: 'Fund.rboreal.json', asNew: true });
  check('Import: as new charts, every chart is added under a name of its own', asNew.added.length === 2 && asNew.replaced.length === 0 && workbook.charts.length === before + 3
    && new Set(workbook.charts.map(c => c.id)).size === workbook.charts.length && new Set(workbook.charts.map(c => norm(c.name))).size === workbook.charts.length, asNew);

  // ---- Resetting, and clearing ----
  const resetBefore = historyLog.length;
  resetState();
  check('Reset: still one step, recorded as a reset, the history kept', historyLog[0].source === 'reset' && historyLog.length === resetBefore + 1);
  Store.openCopy(text, name);
  check('Open a copy: where files can’t be kept open, a downloaded copy becomes the working copy, kept here', Store.place().place === 'browser' && nameHere() === 'Waiting for leave');
  Store.clearBrowserCopy();
  check('Clear: this browser forgets the workbook and where it was kept', !localStorage.getItem(WORKBOOK_KEY) && Store.place().place === 'browser' && workbook.charts.length === 1 && isSampleChart());

  check('No errors on the page', !window.pageErrors.length, window.pageErrors.join(' | '));
}

addEventListener('load', () => run().catch(e => check('The run itself', false, `${e.message}\n${e.stack}`)).finally(() => {
  for (const [k, v] of Object.entries(kept)) v === null ? localStorage.removeItem(k) : localStorage.setItem(k, v);
  const failed = out.filter(x => !x.ok).length;
  document.title = `store test: ${out.length - failed} pass, ${failed} fail`;
  document.getElementById('out').innerHTML = `${document.title}\n\n` + [...out.filter(x => !x.ok), ...out.filter(x => x.ok)].map(x =>
    `<span class="${x.ok ? '' : 'fail'}">${x.ok ? 'PASS' : 'FAIL'}  ${esc(x.name)}${x.detail && !x.ok ? `  [${esc(x.detail)}]` : ''}</span>`).join('\n');
}));
</script>
</body>
</html>

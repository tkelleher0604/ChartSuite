<script>
// Checks of the canvas (canvas.js) and the format bar (formatbar.js) in the window, on the sample, each
// driven as a person would: how a view opens, the scope a format goes to and its live preview, sizes in
// slide points, the keys, how a highlight draws, and that what's drawn is the scene however it came to be. The
// window is set to each size it's checked at.
const out = [];
const check = (name, ok, detail = '') => out.push({ name, ok: !!ok, detail: String(detail ?? '') });
const tick = (ms = 40) => new Promise(r => setTimeout(r, ms));
const until = async (f, ms = 4000) => { for (let t = 0; t < ms; t += 25) { if (f()) return true; await tick(25); } return false; };
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const txt = el => (el?.textContent ?? '').replace(/\s+/g, ' ').trim();
const cv = () => Canvas.active.peek(), sc = () => cv().scene();
const charts = () => App.views.peek().filter(v => v.layout === 'chart');
const show = async v => { Shell.show(v.id); await until(() => sc()?.view === v.id); await tick(120); };
// The window at a size, as a screen of that size lays it out.
const size = async (w, h) => { Object.assign($('.shell').style, { right: 'auto', bottom: 'auto', width: `${w}px`, height: `${h}px` }); await tick(160); };
// The page as the canvas shows it: its corners on screen, and the root's size.
function onScreen() {
  const g = cv().graph, p = sc().page, a = g.localToGraph(0, 0), b = g.localToGraph(p.w, p.h);
  return { a, b, W: cv().root.clientWidth, H: cv().root.clientHeight, z: g.zoom() };
}
const key = (k, o = {}) => { const e = new KeyboardEvent('keydown', { key: k, code: o.code ?? k, bubbles: true, cancelable: true, ...o }); cv().root.dispatchEvent(e); };
const menuItems = () => $$('.float .menu-item').map(txt);
const closeMenus = async () => { document.body.dispatchEvent(new PointerEvent('pointerdown', { bubbles: true })); await tick(); };

async function run() {
  await until(() => App.views.peek().length && sc(), 15000);
  await tick(300);
  const main = charts()[0];

  // ---- The opening frame: the whole page where it fits at 60% or more; else 60% from its top left ----
  // Each view is opened from another at each size, so it's framed for that size as it opens, whether or
  // not this browser lays the window out again before the next check.
  for (const [w, h] of [[1024, 768], [1280, 800], [1440, 900], [1920, 1080]]) {
    await size(w, h);
    const bad = [], order = charts();
    if (order[0].id === Shell.view.peek()) order.push(order.shift());
    for (const v of order) {
      await show(v);
      // (Its margin is cut to the sheet's own where the page is shown larger than the sheet.)
      const { a, b, W, H, z } = onScreen(), fits = b.x <= W + 0.5 && b.y <= H + 0.5, cut = sc().page.margin * Math.max(0, z - sc().page.scale);
      if (a.x < -cut - 0.5 || a.y < -cut - 0.5 || z < 0.6 - 1e-6 || (!fits && z > 0.6 + 1e-6)) bad.push(`${v.name} at ${Math.round(z * 100)}%, page ${[a.x, a.y, b.x, b.y].map(Math.round)} in ${W}×${H}`);
    }
    check(`at ${w}×${h} every view opens on its whole page, or at 60% from its top left`, !bad.length, bad.join('; '));
  }
  await size(1440, 900);
  await show(main);
  const whole = () => { const { a, b, W, H } = onScreen(); return a.x >= -0.5 && a.y >= -0.5 && b.x <= W + 0.5 && b.y <= H + 0.5; };
  cv().zoom('fit'); await tick(120);
  check('Fit shows the whole page', whole());
  const pageWas = sc().page.h;
  Shell.at({ asOf: '2023-12-31' }); await until(() => sc().page.h !== pageWas || sc().day === '2023-12-31'); await tick(200);
  check('as of a past day, the page is framed again, its title and as-of line in view', whole(), JSON.stringify(onScreen()));
  Shell.at(null); await tick(200);
  check('… and as of today', whole());

  // ---- The scope: the selection, as in PowerPoint; its menu, the groups of the styles that reach it, as the
  // Key says them, under each style's name, by their reach ----
  const chip = () => txt($('[data-fb="scope"]'));
  Shell.select(['northpine']); await tick(120);
  check('one box selected, a format goes to “This box”', chip() === 'This box', chip());
  Shell.select(['northpine', 'halvard', 'fund']); await tick(120);
  check('three, to “These 3 boxes”', chip() === 'These 3 boxes', chip());
  const line = sc().marks.find(m => m.type === 'line' && !m.computed);
  Shell.select([line.id]); await tick(120);
  check('a line, to “This line”', chip() === 'This line', chip());
  Shell.select(['northpine']); await tick(120);
  $('[data-fb="scope"]').click(); await tick(120);
  const items = menuItems(), heads = $$('.float .menu-head').map(txt), menu = $$('.float .menu-head, .float .menu-item').map(txt);
  check('its menu offers the selection, then each group that reaches it, as the Key says it, with its reach', items[0] === 'This box' && items.slice(1).every(t => /^\S.* \(\d+\)$/.test(t) && !t.startsWith('All '))
    && items.includes('Portfolio companies (4)'), menu.join(' | '));
  const pcHead = menu.slice(0, menu.indexOf('Portfolio companies (4)')).filter(t => heads.includes(t)).at(-1);
  check('… each under its style’s name, and a style named as its one group (Name) is that row alone, ahead of the heads', !!pcHead && pcHead !== 'Portfolio companies'
    && items.includes('Name (24)') && !heads.includes('Name') && menu.indexOf('Name (24)') < menu.indexOf(heads[0]), menu.join(' | '));
  await closeMenus();
  // The groups are the Key's: a style's outputs that look alike are one group, Funds, its reach every box of them.
  Shell.select(['fund']); await tick(120);
  $('[data-fb="scope"]').click(); await tick(120);
  const fundItems = menuItems(), funds = sc().legend.find(r => r.caption === 'Funds');
  const fundReach = sc().marks.filter(m => m.type === 'box' && Scene.reach(App.shown.peek(), App.chart.peek(), sc().view, sc(), m.id, App.state.peek())
    .some(r => funds?.outputs.some(p => Tree.key(p) === Tree.key(r.output)))).length;
  check('a box of a group the Key shows as one row is offered that group, by the Key’s caption', !!funds && fundItems.includes(`Funds (${fundReach})`) && fundReach > 2, fundItems.join(' | '));
  await closeMenus();
  Shell.select(['northpine']); await tick(120);
  const pcs = sc().marks.filter(m => m.type === 'box' && App.state.peek()[m.record]?.kind === 'Entity' && JSON.stringify(m.settings.Fill.note?.pattern ?? {}).includes('Portfolio Company')).map(m => m.id);
  const fills = () => Object.fromEntries(pcs.map(id => [id, App.scene.peek().byId.get(id).settings.Fill.value]));
  const was = fills();
  FormatBar.apply('Fill', '#fff2cc'); await tick(120);
  const now = fills();
  check('a fill with one box selected fills that box alone', now.northpine === '#fff2cc' && pcs.filter(id => id !== 'northpine').every(id => now[id] === was[id]) && pcs.length === 4, JSON.stringify(now));
  $('[data-fb="scope"]').click(); await tick(120);
  $$('.float .menu-item').find(e => txt(e).startsWith('Portfolio companies'))?.click(); await tick(120);
  check('choosing a group names it on the chip', chip() === 'Portfolio companies (4)', chip());
  FormatBar.apply('Fill', '#e2f0d9'); await tick(120);
  check('… and a fill then goes to every box it reaches but the one entered for itself', pcs.filter(id => id !== 'northpine').every(id => fills()[id] === '#e2f0d9'), JSON.stringify(fills()));
  Shell.select(['halvard']); await tick(120);
  check('another selection is formatted as itself again', chip() === 'This box', chip());

  // ---- Live preview: a swatch or an option pointed at is drawn, and leaving ends it ----
  const changes = App.wb.changes().length, fillOf = id => sc().byId.get(id).settings.Fill.value;
  $('[data-fb="fill"]').click(); await tick(120);
  const swatch = $$('.float .palette > button').find(b => b.getAttribute('aria-label') === 'Blue, Accent 1, Lighter 60%');
  swatch.dispatchEvent(new PointerEvent('pointerenter')); await tick(80);
  check('pointing at a swatch draws the box in it', fillOf('halvard') === '#b4c7e7' && App.scene.peek().byId.get('halvard').settings.Fill.value !== '#b4c7e7', fillOf('halvard'));
  check('… and changes nothing', App.wb.changes().length === changes);
  $('.float .palette').dispatchEvent(new PointerEvent('pointerleave')); await tick(80);
  check('leaving the swatches ends the preview', fillOf('halvard') === App.scene.peek().byId.get('halvard').settings.Fill.value);
  swatch.dispatchEvent(new PointerEvent('pointerenter')); await tick(80);
  cv().nudge(1, 0); await tick(120);
  check('a change to the chart ends a preview of it as it was', sc() === App.scene.peek() && fillOf('halvard') !== '#b4c7e7');
  $('.float .palette').dispatchEvent(new PointerEvent('pointerleave')); await tick(40);
  swatch.dispatchEvent(new PointerEvent('pointerenter')); await tick(80);
  await closeMenus(); await tick(80);
  check('closing the palette ends it too', sc() === App.scene.peek() && App.wb.changes().length === changes + 1);
  $('[data-fb="size"]').click(); await tick(120);
  const sizeOf = () => sc().byId.get('halvard').texts[0].look.Size;
  $$('.float .menu-item').find(e => txt(e) === '20').dispatchEvent(new PointerEvent('pointerover', { bubbles: true })); await tick(80);
  check('pointing at a size in its menu draws the text at it', Math.abs(sizeOf() - Scene.fromSlide(App.scene.peek().page, 20)) < 0.05, sizeOf());
  document.body.dispatchEvent(new PointerEvent('pointerover', { bubbles: true })); await tick(80);
  check('… until the pointer leaves it', sc() === App.scene.peek());
  await closeMenus();

  // ---- Sizes in slide points, on the half-point grid; a frame shows its caption's ----
  const shown = () => +txt($('[data-fb="size"]'));
  check('the format bar shows a size in slide points, to the half point', shown() * 2 === Math.round(shown() * 2) && Math.abs(shown() - Scene.toSlide(sc().page, sizeOf())) <= 0.25, `${shown()} for ${Scene.toSlide(sc().page, sizeOf())}`);
  const v40 = charts().find(v => v.name === '40 Act');
  if (v40) {
    await show(v40);
    const frame = sc().marks.find(m => m.type === 'frame');
    Shell.select([frame.id]); await tick(120);
    check('a frame selected shows its caption’s font and size', txt($('[data-fb="font"]')) === frame.caption.look.Font && +txt($('[data-fb="size"]')) > 0, `${txt($('[data-fb="font"]'))} ${txt($('[data-fb="size"]'))}`);
    Shell.select([]); await show(main);
  } else check('a view with frames', false);

  // ---- Tidy is with the arrangement, not the zoom ----
  Shell.select(['halvard']); await tick(80);
  $('[data-fb="zoom"]').click(); await tick(120);
  const zoomItems = menuItems();
  await closeMenus();
  $('[data-fb="arrange"]').click(); await tick(120);
  const arrange = menuItems();
  await closeMenus();
  check('Tidy is beside Align and Order, and not among the zoom levels', !zoomItems.includes('Tidy') && arrange.includes('Tidy') && !!$('[data-fb="tidy"]') && $('[data-fb="tidy"]').previousElementSibling?.dataset.fb === 'group', zoomItems.join(', '));

  // ---- At 1024 the chip gives way, and the zoom stays in the window ----
  await size(1024, 768);
  Shell.select(['gp']); await tick(120);
  $('[data-fb="scope"]').click(); await tick(120);
  $$('.float .menu-item').find(e => txt(e).startsWith('Limited liability company'))?.click(); await tick(120);
  const zr = $('[data-fb="zoom"]').getBoundingClientRect(), shell = $('.shell').getBoundingClientRect(), span = $('[data-fb="scope"] > span');
  check('at 1024 the zoom stays in the window', zr.right <= shell.right + 0.5 && zr.width > 0, `${zr.right} of ${shell.right}`);
  $('[data-fb="scope"]').dispatchEvent(new PointerEvent('pointerover', { bubbles: true }));
  check('a scope cut short is named whole on hover', span.scrollWidth <= span.clientWidth || $('[data-fb="scope"]').dataset.tip === txt(span), `${span.scrollWidth} ${span.clientWidth} ${$('[data-fb="scope"]').dataset.tip}`);
  await size(1440, 900);

  // ---- Colors by PowerPoint's names ----
  const names = [['#DAE3F3', 'Blue, Accent 1, Lighter 80%'], ['E2F0D9', 'Green, Accent 6, Lighter 80%'], ['#f2f2f2', 'White, Background 1, Darker 5%'], ['#595959', 'Black, Text 1, Lighter 35%'],
    ['#C00000', 'Dark Red'], ['#7f7f7f', 'Black, Text 1, Lighter 50%'], ['#ffc000', 'Gold, Accent 4'], ['#000000', 'Black, Text 1'], ['#123456', null]];
  const bad = names.filter(([c, n]) => FormatBar.colorName(c) !== n);
  check('FormatBar.colorName gives PowerPoint’s name for a theme color, and null for a custom one', !bad.length, bad.map(([c]) => `${c}: ${FormatBar.colorName(c)}`).join('; '));
  $('[data-fb="fill"]').click(); await tick(120);
  const tips = $$('.float .palette > button').slice(0, 3).map(b => b.dataset.tip);
  await closeMenus();
  check('a swatch is named so on hover', tips.join() === 'White, Background 1,Black, Text 1,Blue, Accent 1', tips.join(' | '));

  // ---- A highlight: lines lit where they lie, under the boxes; a box dimmed keeps its fill ----
  const ln = sc().marks.find(m => m.type === 'line' && m.from && m.to);
  Shell.parts.peek().canvas.highlight({ [ln.record]: [2, 1], [ln.from]: [1, 0] }, { dim: true }); await tick(120);
  document.getAnimations().forEach(a => a.finish());
  const edge = $(`.dc [data-cell-id="${ln.id}"]`), other = sc().marks.find(m => m.type === 'box' && m.id !== ln.from && m.id !== ln.to);
  const body = $(`.dc [data-cell-id="${other.id}"] > path`), text = $(`.dc [data-cell-id="${other.id}"] text`);
  check('a line lit is traced where it lies, not drawn over the boxes', edge.classList.contains('dc-hl') && edge.classList.contains('h2') && !$$('.dc-marks path').some(p => p.getAttribute('d')?.startsWith('M') && p.classList.contains('h2')));
  check('a dimmed box keeps its fill, and fades its outline and text', getComputedStyle(body).fillOpacity === '1' && +getComputedStyle(body).strokeOpacity < 0.5 && +getComputedStyle(text).opacity < 0.5
    && getComputedStyle(body.parentNode).opacity === '1', `${getComputedStyle(body).fillOpacity} ${getComputedStyle(body).strokeOpacity} ${getComputedStyle(text).opacity}`);
  const order = [...$('.x6-graph-svg-stage').children].map(e => e.getAttribute('data-cell-id'));
  check('lines are drawn under the boxes', sc().marks.filter(m => m.type === 'line' && !m.merged).every(l => order.indexOf(l.id) < Math.min(...sc().marks.filter(m => m.type === 'box').map(b => order.indexOf(b.id)))));
  Shell.parts.peek().canvas.highlight(null); await tick(80);

  // ---- The keys: Tab through the boxes in reading order; the arrows nudge ----
  Shell.select([]); await tick(60);
  cv().root.focus();
  const reading = (() => { const rows = []; for (const b of sc().marks.filter(m => m.type === 'box').sort((a, b) => a.y - b.y)) { const r = rows.at(-1); if (r && b.y < r[0].y + r[0].h / 2) r.push(b); else rows.push([b]); } return rows.flatMap(r => r.sort((a, b) => a.x - b.x)).map(b => b.id); })();
  key('Tab'); await tick(60);
  const first = Shell.selection.peek()[0];
  key('Tab'); await tick(60);
  const second = Shell.selection.peek()[0];
  key('Tab', { shiftKey: true }); await tick(60);
  check('Tab selects the first box in reading order, then the next; Shift+Tab goes back', first === reading[0] && second === reading[1] && Shell.selection.peek()[0] === reading[0], `${first} ${second} ${Shell.selection.peek()[0]}`);
  const x0 = sc().byId.get(first).x;
  key('ArrowRight'); await tick(120);
  check('an arrow key nudges the box selected', Math.abs(sc().byId.get(first).x - x0 - 1) <= 0.5, `${x0} → ${sc().byId.get(first).x}`);
  Shell.select([]); cv().root.focus();
  key('Tab', { shiftKey: true }); await tick(60);
  check('Shift+Tab from nothing selects the last box', Shell.selection.peek()[0] === reading.at(-1));

  // ---- Relate handles sit on a box's outline, a triangle's on its slopes and base, clear of every line and
  // of the box's grips; a handle clicked, not dragged, selects its box ----
  const g = cv().graph, r = cv().root.getBoundingClientRect();
  const toSeg = ([x, y], [[ax, ay], [bx, by]]) => { const dx = bx - ax, dy = by - ay, l = dx * dx + dy * dy, t = l ? Math.min(1, Math.max(0, ((x - ax) * dx + (y - ay) * dy) / l)) : 0; return Math.hypot(x - ax - t * dx, y - ay - t * dy); };
  const handlesOn = async m => {
    const a = g.localToGraph(m.x, m.y), b = g.localToGraph(m.x + m.w, m.y + m.h);
    cv().root.dispatchEvent(new PointerEvent('pointermove', { bubbles: true, clientX: r.left + (a.x + b.x) / 2, clientY: r.top + b.y - 3 }));
    await tick(60);
    return $$('.dc-handle').filter(h => !h.hidden && cv().root.classList.contains('relating-on')).map(h => { const p = g.graphToLocal(parseFloat(h.style.left), parseFloat(h.style.top)); return { h, side: h.classList[1], p: [p.x, p.y] }; });
  };
  const segs = () => sc().marks.filter(m => m.points).flatMap(m => m.points.slice(1).map((p, i) => [m.points[i], p]));
  const clearOf = hs => hs.every(({ p }) => segs().every(s => toSeg(p, s) * g.zoom() >= 15.9));
  const tri = sc().byId.get('fund'), hs = await handlesOn(tri), apex = [tri.x + tri.w / 2, tri.y];
  const onTri = ({ side, p }) => side === 'e' ? toSeg(p, [apex, [tri.x + tri.w, tri.y + tri.h]]) < 0.6 : side === 'w' ? toSeg(p, [apex, [tri.x, tri.y + tri.h]]) < 0.6 : side === 's' && Math.abs(p[1] - tri.y - tri.h) < 0.6;
  check('a triangle’s relate handles sit on its slopes and base, clear of every line', tri.shape === 'triangle' && hs.length >= 2 && hs.every(onTri) && clearOf(hs), hs.map(x => `${x.side} ${x.p.map(Math.round)}`).join('; '));
  const boxes = sc().marks.filter(m => m.type === 'box' && m.shape !== 'triangle' && m.shape !== 'oval');
  const busy = [];
  for (const m of boxes.slice(0, 12)) {
    const hs = await handlesOn(m), onRect = ({ side, p }) => side === 'n' || side === 's' ? Math.abs(p[1] - (side === 'n' ? m.y : m.y + m.h)) < 0.6 : Math.abs(p[0] - (side === 'w' ? m.x : m.x + m.w)) < 0.6;
    if (!hs.every(onRect) || !clearOf(hs)) busy.push(m.id);
  }
  check('every box’s handles sit on its outline, clear of the lines at it', !busy.length, busy.join(' '));
  Shell.select(['fund']); await tick(80);
  const gripped = await handlesOn(tri), grips = [0, 0.5, 1].flatMap(fx => [0, 0.5, 1].map(fy => [tri.x + tri.w * fx, tri.y + tri.h * fy]));
  check('… and clear of its grips when it’s selected', gripped.every(({ p }) => grips.every(q => Math.hypot(p[0] - q[0], p[1] - q[1]) * g.zoom() >= 15.9)), gripped.map(x => `${x.side} ${x.p.map(Math.round)}`).join('; '));
  Shell.select(['halvard']); await tick(80);
  const [one] = await handlesOn(tri), hr = one?.h.getBoundingClientRect();
  if (one) {
    one.h.dispatchEvent(new PointerEvent('pointerdown', { bubbles: true, button: 0, clientX: hr.left + 4, clientY: hr.top + 4 }));
    window.dispatchEvent(new PointerEvent('pointerup', { bubbles: true, button: 0, clientX: hr.left + 5, clientY: hr.top + 4 }));
    await tick(80);
  }
  check('a handle clicked, not dragged, selects its box and offers nothing', !!one && Shell.selection.peek().join() === 'fund' && !$('.float .menu-item'), Shell.selection.peek().join());
  await closeMenus();

  // ---- A Key row selected however it came to be (Back, Find, another part) is the row Delete hides ----
  const legend = sc().marks.find(m => m.geometry === 'legend'), kr = legend?.rows[0];
  Shell.select(['halvard']); await tick(60);
  Shell.select([`${legend.id}#${kr.key}`]); await tick(100);
  cv().root.focus(); key('Delete'); await tick(120);
  const hid = txt($$('.toast').at(-1)), still = App.scene.peek().byId.get(legend.id);
  check('a Key row selected as Back selects it is hidden by Delete, and the Key stays', !!still && still.hide.includes(kr.key) && /^Hid .* in the key/.test(hid), hid);
  Shell.parts.peek().undo.undo(); await tick(120);

  // ---- A highlight lights a relation the view hides on the line it already draws between the two boxes,
  // rather than routing a second line beside it ----
  Shell.select(['gp', 'fund']); await tick(400);
  const gpl = sc().byId.get('gp_of_fund'), gpCell = gpl && $(`.dc [data-cell-id="${gpl.merged ?? gpl.id}"]`);
  check('two boxes selected light the line drawn between them, and draw no second route', !sc().marks.some(m => m.revealed) && !!gpCell?.classList.contains('dc-hl') && gpCell.classList.contains('strong'),
    `${sc().marks.filter(m => m.revealed).map(m => m.id)} ${gpCell?.getAttribute('class')}`);
  Shell.select([]); await tick(120);

  // ---- Tidy: pointed at, the chart is drawn tidied and nothing changes; made, it's one change, named so
  // everywhere, and the view is framed on its page again ----
  const tidyBtn = $('[data-fb="tidy"]'), made = App.wb.changes().length, base = () => App.scene.peek();
  tidyBtn.dispatchEvent(new PointerEvent('pointerenter')); await tick(200);
  const shifted = sc() !== base() && sc().marks.some(m => m.type === 'box' && base().byId.get(m.id) && (base().byId.get(m.id).x !== m.x || base().byId.get(m.id).y !== m.y));
  check('pointing at Tidy draws the chart as Tidy would lay it out, and changes nothing', shifted && App.wb.changes().length === made);
  tidyBtn.dispatchEvent(new PointerEvent('pointerleave')); await tick(120);
  check('… and leaving it draws the chart as it is', sc() === base());
  cv().zoom(2); await tick(80);
  tidyBtn.dispatchEvent(new PointerEvent('pointerenter')); await tick(120);
  tidyBtn.click(); await tick(200);
  const tidyToast = txt($$('.toast').at(-1)), { a: ta, z: tz } = onScreen();
  check('Tidy is one change, “Tidied the layout”, and the view is framed on its page again', tidyToast.startsWith('Tidied the layout') && App.wb.changes().length === made + 1
    && sc() === base() && (whole() || (Math.abs(tz - 0.6) < 1e-6 && ta.x > -0.5 && ta.y > -0.5)), `${tidyToast} ${tz}`);
  Shell.parts.peek().undo.undo(); await tick(150);
  check('… and Undo says so too', txt($$('.toast').at(-1)).startsWith('Undid: Tidied the layout'), txt($$('.toast').at(-1)));

  // ---- A page drawn very small opens on its title, its margin no wider on screen than the sheet's own ----
  const pageOf = { id: main.id, kind: 'View' };
  App.change(tx => tx.note('Page', pageOf, { w: 240, h: 135 }), { dated: false }); await tick(200);
  { const p = sc().page, { a, z, W, H } = onScreen(), title = sc().marks.find(m => m.role === 'title'), t = title && g.localToGraph(title.x + Math.min(...title.texts[0].lines.map(l => l.x)), title.y + title.texts[0].lines[0].y);
    check('a page drawn very small opens at 60%, its margin cut to the sheet’s, its title in view', p.scale < 0.2 && Math.abs(z - 0.6) < 1e-6 && a.x + p.margin * z <= 28 + 48 + 0.5 && a.y + p.margin * z <= 28 + 48 + 0.5
      && !!t && t.x >= 0 && t.y >= 0 && t.x < W && t.y < H, `scale ${p.scale}, margin from ${Math.round(a.x + p.margin * z)},${Math.round(a.y + p.margin * z)}, title at ${t && [t.x, t.y].map(Math.round)}`); }
  Shell.parts.peek().undo.undo(); await tick(200);

  // ---- Deleting as of a past day says from when ----
  Shell.at({ asOf: '2025-06-30' }); await tick(200);
  Shell.select(['halvard']); await tick(80);
  cv().root.focus(); key('Delete', { shiftKey: true }); await tick(120);
  const toast = txt($$('.toast').at(-1));
  check('a record deleted as of a past day says so', /^Deleted Halvard.* as of Jun 30, 2025/.test(toast), toast);
  Shell.at(null); await tick(100);

  // ---- What's drawn is the scene, however it came to be: after edits, views shown in turn, previews and
  // undoing, each cell shown is where the scene puts it, saying what it says, stacked in its order, and no
  // other cell is shown ----
  const j = x => JSON.stringify(x);
  const drawnAsScene = () => {
    const s = sc(), shown = cv().graph.getCells().filter(c => c.isVisible() && c.id !== '·page'), want = new Map(), bad = [];
    s.marks.forEach((m, i) => {
      if (m.geometry !== 'group') want.set(m.id, [m, i]);
      if (m.type === 'line' && m.texts.length && Number.isFinite(m.labelAt?.x) && Number.isFinite(m.labelAt?.y)) want.set(`${m.id}·label`, [m, i + 0.5]);
    });
    const texts = ms => JSON.stringify(ms.flatMap(t => t.children?.map(c => c.textContent) ?? []));
    for (const c of shown) {
      const [m] = want.get(c.id) ?? [];
      if (!m) bad.push(`${c.id} drawn`);
      else if (c.id.endsWith('·label')) { const p = c.getPosition(); if (p.x !== m.labelAt.x || p.y !== m.labelAt.y) bad.push(`${c.id} at ${p.x},${p.y}`); }
      else if (c.isEdge()) { if (j([c.getSource(), ...c.getVertices(), c.getTarget()].map(p => [p.x, p.y])) !== j(m.points)) bad.push(`${c.id} routed otherwise`); }
      else {
        const p = c.getPosition(), z = c.getSize();
        if (p.x !== m.x || p.y !== m.y || z.width !== Math.max(1, m.w) || z.height !== Math.max(1, m.h)) bad.push(`${c.id} at ${p.x},${p.y} ${z.width}×${z.height}`);
        if (m.type === 'box' && texts(c.getMarkup().slice(1)) !== j(m.texts.flatMap(it => it.lines.map(l => l.text)))) bad.push(`${c.id} says otherwise`);
      }
    }
    for (const id of want.keys()) if (!shown.some(c => c.id === id)) bad.push(`${id} not drawn`);
    const order = shown.sort((a, b) => a.getZIndex() - b.getZIndex()).map(c => want.get(c.id)?.[1]);
    if (order.some((x, i) => i && x < order[i - 1])) bad.push('stacked out of order');
    return bad;
  };
  const steps = [], step = async (what, f) => { await f(); await tick(120); const bad = drawnAsScene(); if (bad.length) steps.push(`${what}: ${bad.slice(0, 3).join(', ')}`); };
  const mainView = charts()[0], bar = () => $('.fx-out button.tag');
  await step('shown', () => show(mainView));
  await step('a name', () => App.change(tx => tx.update('fund_name', { value: 'Calder Ridge Capital Partners III-A, L.P.' })));
  await step('a tag', () => App.change(tx => tx.update('fund_good', { tag: false })));
  for (const v of [...charts().slice(1), mainView]) await step(`${v.name} shown`, () => show(v));
  await step('a style', () => App.change(tx => tx.note('Fill', { kind: 'Entity' }, '#fbe5d6', { view: mainView.id }), { dated: false }));
  await step('a box hidden', () => App.change(tx => tx.note('Shown', Tree.treeOf(App.state.peek(), 'gp'), false, { view: mainView.id }), { dated: false }));
  await step('a ruling redlined', async () => { Shell.select(['own_us_fund']); await tick(120); bar()?.dispatchEvent(new PointerEvent('pointerenter')); });
  await step('… and not', () => bar()?.dispatchEvent(new PointerEvent('pointerleave')));
  await step('a hidden box revealed', () => Shell.parts.peek().canvas.reveal(['gp']));
  await step('… and not', () => Shell.parts.peek().canvas.reveal(null));
  for (let i = 0; i < 4; i++) await step(`undone ${i + 1}`, () => Shell.parts.peek().undo.undo());
  for (const v of [charts()[1], mainView]) await step(`${v.name} shown again`, () => show(v));
  check('what the canvas draws is the scene, after edits, views shown in turn, previews and undoing', !steps.length, steps.join('; '));
}

window.onerror = (m, s, l, c, e) => check(`error: ${m} (${(s || '').split('/').pop()}:${l})`, false, e?.stack);
Shell.ready.then(() => run())
  .catch(e => check('runs', false, e.stack ?? e))
  .finally(() => {
    const failed = out.filter(c => !c.ok);
    const line = c => `${c.ok ? 'pass' : 'FAIL'}  ${c.name}${c.detail && !c.ok ? `  (${c.detail})` : ''}`;
    document.title = `canvas test: ${out.length - failed.length} pass, ${failed.length} fail`;
    $('#out').innerHTML = [`${out.length - failed.length} passed, ${failed.length} failed`, '',
      ...failed.map(c => `<span class="fail">${line(c).replace(/</g, '&lt;')}</span>`), ...(failed.length ? [''] : []),
      ...out.filter(c => c.ok).map(line).map(s => s.replace(/</g, '&lt;'))].join('\n');
  });
</script>
</body>
</html>

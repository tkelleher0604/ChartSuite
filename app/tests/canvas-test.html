<script>
// Checks of the canvas (canvas.js) and the format bar (formatbar.js) in the window, on the sample, each
// driven as a person would: how a view opens, the scope a format goes to and its live preview, sizes in
// slide points, the keys, how a highlight draws, and that what's drawn is the scene however it came to be. The
// window is set to each size it's checked at.
const out = [];
const check = (name, ok, detail = '') => out.push({ name, ok: !!ok, detail: String(detail ?? '') });
const tick = (ms = 40) => new Promise(r => setTimeout(r, ms));
const until = async (f, ms = 4000) => { for (let t = 0; t < ms; t += 25) { if (f()) return true; await tick(25); } return false; };
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const txt = el => (el?.textContent ?? '').replace(/\s+/g, ' ').trim();
const cv = () => Canvas.active.peek(), sc = () => cv().scene();
const charts = () => App.views.peek().filter(v => v.layout === 'chart');
const show = async v => { Shell.show(v.id); await until(() => sc()?.view === v.id); await tick(120); };
// The window at a size, as a screen of that size lays it out.
const size = async (w, h) => { Object.assign($('.shell').style, { right: 'auto', bottom: 'auto', width: `${w}px`, height: `${h}px` }); await tick(160); };
// The page as the canvas shows it: its corners on screen, and the root's size.
function onScreen() {
  const g = cv().graph, p = sc().page, a = g.localToGraph(0, 0), b = g.localToGraph(p.w, p.h);
  return { a, b, W: cv().root.clientWidth, H: cv().root.clientHeight, z: g.zoom() };
}
// Where the title's words start on screen.
function titleAt() {
  const t = sc().marks.find(m => m.role === 'title' && m.texts[0]?.lines.length), l = t?.texts[0].lines[0];
  return t ? cv().graph.localToGraph(t.x + t.column.x, t.y + l.y - t.look.Size * Scene.PT * 0.93) : { x: NaN, y: NaN };
}
const key = (k, o = {}) => { const e = new KeyboardEvent('keydown', { key: k, code: o.code ?? k, bubbles: true, cancelable: true, ...o }); cv().root.dispatchEvent(e); };
const menuItems = () => $$('.float .menu-item').map(txt);
const closeMenus = async () => { document.body.dispatchEvent(new PointerEvent('pointerdown', { bubbles: true })); await tick(); };

async function run() {
  await until(() => App.views.peek().length && sc(), 15000);
  await tick(300);
  const main = charts()[0];

  // ---- The opening frame: the whole page, as PowerPoint opens a slide, at every size ----
  // Each view is opened from another at each size, so it's framed for that size as it opens, whether or
  // not this browser lays the window out again before the next check.
  const whole = () => { const { a, b, W, H } = onScreen(); return a.x >= -0.5 && a.y >= -0.5 && b.x <= W + 0.5 && b.y <= H + 0.5; };
  for (const [w, h] of [[1024, 768], [1280, 800], [1440, 900], [1920, 1080]]) {
    await size(w, h);
    const bad = [], order = charts();
    if (order[0].id === Shell.view.peek()) order.push(order.shift());
    for (const v of order) {
      await show(v);
      // (Within a margin of 28 px at most, across or down.)
      const { a, b, W, H, z } = onScreen();
      if (!whole() || (W - (b.x - a.x) > 57 && H - (b.y - a.y) > 57)) bad.push(`${v.name} at ${Math.round(z * 100)}%, page ${[a.x, a.y, b.x, b.y].map(Math.round)} in ${W}×${H}`);
    }
    check(`at ${w}×${h} every view opens on its whole page, as large as fits`, !bad.length, bad.join('; '));
  }
  await size(1440, 900);
  await show(main);
  cv().zoom('fit'); await tick(120);
  check('Fit shows the whole page', whole());
  const pageWas = sc().page.h;
  Shell.at({ asOf: '2023-12-31' }); await until(() => sc().page.h !== pageWas || sc().day === '2023-12-31'); await tick(200);
  check('as of a past day, the page is framed again, its title and as-of line in view', whole(), JSON.stringify(onScreen()));
  Shell.at(null); await tick(200);
  check('… and as of today', whole());

  // ---- The scope, in two parts: the selection, as in PowerPoint, and all like it, the narrowest group that
  // reaches it; its ▾ offers every group that does: the Styles rows, as the Key says them, under each style's
  // name, then the selection's own groups, its kind and its options and tags, each by its reach ----
  const ownPart = () => txt($('[data-fb="own"]')), like = () => txt($('[data-fb="like"]'));
  const chip = () => txt($('[data-fb="scope"] [aria-pressed="true"]'));
  const dulled = () => $$('.dc .x6-cell.dc-dull').map(e => e.getAttribute('data-cell-id'));
  Shell.select(['northpine']); await tick(120);
  check('one box selected, a format goes to “This box”, with all like it beside it', chip() === 'This box' && ownPart() === 'This box' && /^All .+ \(\d+\)$/.test(like()), `${ownPart()} | ${like()}`);
  check('… and nothing on the chart is dulled', !dulled().length, dulled().join());
  Shell.select(['northpine', 'halvard', 'fund']); await tick(120);
  check('three, to “These 3 boxes”', chip() === 'These 3 boxes', chip());
  const line = sc().marks.find(m => m.type === 'line' && !m.computed);
  Shell.select([line.id]); await tick(120);
  check('a line, to “This line”', chip() === 'This line', chip());
  Shell.select(['northpine']); await tick(120);
  $('[data-fb="groups"]').click(); await tick(120);
  const items = menuItems(), heads = $$('.float .menu-head').map(txt), menu = $$('.float .menu-head, .float .menu-item').map(txt);
  const seps = $$('.float .menu-sep, .float .menu-head, .float .menu-item').map(e => e.classList.contains('menu-sep') ? '-' : txt(e));
  check('its ▾ offers the selection, then each group that reaches it, with its reach', items[0] === 'This box' && items.slice(1).every(t => /^\S.* \(\d+\)$/.test(t) && !t.startsWith('All '))
    && items.includes('Portfolio companies (4)'), menu.join(' | '));
  const pcHead = menu.slice(0, menu.indexOf('Portfolio companies (4)')).filter(t => heads.includes(t)).at(-1);
  check('… the Styles rows each under its style’s name, and a style that is its one group (Names) that row alone, after the heads and apart from them', !!pcHead && pcHead !== 'Portfolio companies'
    && items.includes('Names (24)') && !heads.includes('Name') && menu.indexOf('Names (24)') > menu.indexOf(heads.at(-1))
    && seps.slice(0, seps.indexOf('Names (24)')).reverse().find(t => t === '-' || heads.includes(t)) === '-', seps.join(' | '));
  // The Styles rows that reach the box, by Styles' captions, as Styles lists them (Scene.groupsOf's order), under
  // their styles' names, then those under none; then apart, the box's own groups, its kind first.
  const reaching = Scene.groupsOf(App.notes.peek(), sc().view).filter(g => Scene.reach(App.shown.peek(), App.chart.peek(), sc().view, sc(), 'northpine', App.state.peek())
    .some(r => r.style === g.style && g.outputs.some(p => Tree.narrower(r.output, p))));
  const listedSo = reaching.flatMap((g, i) => [...(g.name && g.style !== reaching[i - 1]?.style ? ['#' + g.name] : []), ...(!g.name && reaching[i - 1]?.name ? ['-'] : []), g.caption]);
  const ownAt = seps.findIndex((t, i) => t === '-' && i > seps.indexOf('This box') + 1 && /^Entity \(\d+\)$/.test(seps[i + 1] ?? ''));
  const menuSays = seps.slice(seps.indexOf('This box') + 2, ownAt).map(t => heads.includes(t) ? '#' + t : t.replace(/ \(\d+\)$/, ''));
  check('… in the order Styles lists them, each style’s under its name, and those under none after them all', ownAt > 0 && JSON.stringify(menuSays) === JSON.stringify(listedSo)
    && listedSo.indexOf('Names') > listedSo.indexOf('Portfolio companies'), `${menuSays.join(' | ')} vs ${listedSo.join(' | ')}`);
  // Its own groups: every box of its kind, and of each of its options and tags, by the boxes drawn that have it.
  const rs = App.state.peek(), drawnBoxes = sc().marks.filter(m => m.type === 'box'), entryOf = (b, edge) => Object.keys(rs).find(id => rs[id].at === b.record && rs[id].edge === edge);
  const reachOf = (edge, out) => drawnBoxes.filter(b => { const e = entryOf(b, edge); return e && Object.entries(out).every(([k, v]) => rs[e][k] === v); }).length;
  const entities = drawnBoxes.filter(b => rs[b.record].kind === 'Entity').length, delaware = reachOf('Jurisdiction', { choice: 'Delaware' });
  const ownGroups = seps.slice(ownAt + 1).filter(t => t !== '-' && !t.startsWith('Clear '));
  // (One a Styles row already is alone, its Vehicle Type, is offered once, as that row: Portfolio companies.)
  check('… then the box’s own groups: its kind, then its options by their entries’ names, then its tags, each by the boxes drawn that have it, but those Styles rows already are',
    ownGroups[0] === `Entity (${entities})` && ownGroups.includes(`Jurisdiction: Delaware (${delaware})`) && !ownGroups.some(t => t.startsWith('Vehicle Type: Portfolio Company'))
    && ownGroups.findIndex(t => /^[^:]+ \(\d+\)$/.test(t) && t !== ownGroups[0]) > ownGroups.findLastIndex(t => t.includes(': ')) && !ownGroups.some(t => /^Portfolio companies/.test(t)), ownGroups.join(' | '));
  // Pointing at one cues it: what it reaches lit, the rest dulled; leaving it, the cue is the scope's again.
  const delawareItem = $$('.float .menu-item').find(e => txt(e).startsWith('Jurisdiction: Delaware'));
  delawareItem?.dispatchEvent(new PointerEvent('pointermove', { bubbles: true })); await tick(100);
  const cued = new Set(drawnBoxes.filter(b => { const e = entryOf(b, 'Jurisdiction'); return e && rs[e].choice === 'Delaware'; }).map(b => b.id)), dull = dulled();
  check('… and pointing at a group cues it on the chart, every box it reaches lit and every other mark dulled, its title too',
    [...cued].every(id => !dull.includes(id) && $(`.dc-marks .dc-cue`)) && drawnBoxes.filter(b => !cued.has(b.id)).every(b => dull.includes(b.id))
    && dull.includes(sc().marks.find(m => m.role === 'title')?.id) && $$('.dc-marks path.dc-cue').length === cued.size, `${dull.length} dulled, ${$$('.dc-marks path.dc-cue').length} lit`);
  await closeMenus(); await tick(80);
  check('… and the cue goes once the menu does, the selection being the scope', !dulled().length && !$$('.dc-marks .dc-cue').length, dulled().join());
  // The groups are the Key's: a style's outputs that look alike are one group, Funds, its reach every box of them.
  Shell.select(['fund']); await tick(120);
  $('[data-fb="groups"]').click(); await tick(120);
  const fundItems = menuItems(), funds = sc().legend.find(r => r.caption === 'Funds');
  const fundReach = sc().marks.filter(m => m.type === 'box' && Scene.reach(App.shown.peek(), App.chart.peek(), sc().view, sc(), m.id, App.state.peek())
    .some(r => funds?.outputs.some(p => Tree.key(p) === Tree.key(r.output)))).length;
  check('a box of a group the Key shows as one row is offered that group, by the Key’s caption', !!funds && fundItems.includes(`Funds (${fundReach})`) && fundReach > 2, fundItems.join(' | '));
  await closeMenus();
  Shell.select(['northpine']); await tick(120);
  check('all like it names the narrowest Styles row that reaches the selection and more', like() === 'All Portfolio companies (4)', like());
  const pcs = sc().marks.filter(m => m.type === 'box' && App.state.peek()[m.record]?.kind === 'Entity' && JSON.stringify(m.settings.Fill.note?.pattern ?? {}).includes('Portfolio Company')).map(m => m.id);
  const fills = () => Object.fromEntries(pcs.map(id => [id, App.scene.peek().byId.get(id).settings.Fill.value]));
  const was = fills();
  FormatBar.apply('Fill', '#fff2cc'); await tick(120);
  const now = fills();
  check('a fill with one box selected fills that box alone', now.northpine === '#fff2cc' && pcs.filter(id => id !== 'northpine').every(id => now[id] === was[id]) && pcs.length === 4, JSON.stringify(now));
  $('[data-fb="like"]').click(); await tick(120);
  check('choosing all like it presses it, and cues the group: the other boxes dulled', chip() === 'All Portfolio companies (4)' && pcs.every(id => !dulled().includes(id)) && dulled().includes('fund'), `${chip()}; ${dulled().length} dulled`);
  FormatBar.apply('Fill', '#e2f0d9'); await tick(120);
  check('… and a fill then goes to every box it reaches but the one entered for itself', pcs.filter(id => id !== 'northpine').every(id => fills()[id] === '#e2f0d9'), JSON.stringify(fills()));
  const kept = txt($$('.toast').at(-1)), np = App.notes.peek().nameOf(App.state.peek(), 'northpine'), groupSaid = Time.describe(App.wb.changes().at(-1));
  check('… which says at once, by the group, that the one keeps its own', kept.startsWith(`Changed Fill for Portfolio companies; ${np} keeps its own`), kept);
  check('… and History names the change by the group, as the Key does', groupSaid === `Changed Fill for Portfolio companies in ${main.name}`, groupSaid);
  check('… and the group stays chosen after the change', chip() === 'All Portfolio companies (4)', chip());
  $('[data-fb="groups"]').click(); await tick(120);
  const clearIt = $$('.float .menu-item').find(e => txt(e).startsWith('Clear '));
  check('… and its ▾ offers to clear what the one keeps', txt(clearIt) === `Clear ${np}’s own Fill`, menuItems().join(' | '));
  clearIt?.click(); await tick(120);
  check('… which gives it the group’s fill', fills().northpine === '#e2f0d9' && txt($$('.toast').at(-1)).startsWith(`Cleared ${np}’s own Fill`), `${fills().northpine} ${txt($$('.toast').at(-1))}`);
  await closeMenus();
  // Ctrl+Shift+A goes from one part to the other.
  const ctrlShiftA = () => window.dispatchEvent(new KeyboardEvent('keydown', { key: 'A', code: 'KeyA', ctrlKey: true, shiftKey: true, bubbles: true, cancelable: true }));
  ctrlShiftA(); await tick(100);
  const toOwn = chip();
  ctrlShiftA(); await tick(100);
  check('Ctrl+Shift+A goes from all like it to the selection and back', toOwn === 'This box' && chip() === 'All Portfolio companies (4)' && !!dulled().length, `${toOwn}, then ${chip()}`);
  Shell.select(['halvard']); await tick(120);
  check('another selection is formatted as itself again, and nothing is dulled', chip() === 'This box' && !dulled().length, chip());
  // A group of a box's own, chosen from the ▾ and given a fill, becomes a Styles row, keyed: every Cayman box green.
  const feeder = drawnBoxes.find(b => { const e = entryOf(b, 'Jurisdiction'); return e && rs[e].choice === 'Cayman Islands'; });
  Shell.select([feeder.id]); await tick(120);
  $('[data-fb="groups"]').click(); await tick(120);
  const cayman = $$('.float .menu-item').find(e => txt(e).startsWith('Jurisdiction: Cayman Islands'));
  const caymans = reachOf('Jurisdiction', { choice: 'Cayman Islands' });
  check('a box’s option is offered as a group of its own', !!cayman && txt(cayman) === `Jurisdiction: Cayman Islands (${caymans})`, menuItems().join(' | '));
  cayman?.click(); await tick(120);
  FormatBar.apply('Fill', '#92d050'); await tick(150);
  const greens = App.scene.peek().marks.filter(m => m.type === 'box' && m.settings.Fill.value === '#92d050').length, keyed = App.scene.peek().legend.find(r => r.swatch.Fill === '#92d050');
  check('… and a fill for it fills every box of it, and keys it, as Styles does', caymans > 1 && greens === caymans && keyed?.caption === 'Cayman Islands' && chip() === `All Cayman Islands (${caymans})`,
    `${greens} of ${caymans} green; key ${keyed?.caption}; ${chip()}`);
  // Bold for a group of an option lands on its boxes, not on the option's own text, written in them or not.
  FormatBar.apply('Bold', true); await tick(150);
  const caymanBoxes = App.scene.peek().marks.filter(m => m.type === 'box' && m.settings.Fill.value === '#92d050');
  check('… and Bold for it bolds every text of its boxes, the jurisdiction they write too', caymanBoxes.length === caymans && caymanBoxes.every(b => b.texts.length > 1 && b.texts.every(it => it.look.Bold)),
    caymanBoxes.map(b => b.texts.map(it => `${it.text}:${it.look.Bold}`).join(',')).join(' / '));
  Shell.parts.peek().undo.undo(); await tick(120); Shell.parts.peek().undo.undo(); await tick(120);
  Shell.select(['halvard']); await tick(120);

  // ---- Live preview: a swatch or an option pointed at is drawn, and leaving ends it ----
  const changes = App.wb.changes().length, fillOf = id => sc().byId.get(id).settings.Fill.value;
  $('[data-fb="fill"]').click(); await tick(120);
  const swatch = $$('.float .palette > button').find(b => b.getAttribute('aria-label') === 'Blue, Accent 1, Lighter 60%');
  swatch.dispatchEvent(new PointerEvent('pointerenter')); await tick(80);
  check('pointing at a swatch draws the box in it', fillOf('halvard') === '#b4c7e7' && App.scene.peek().byId.get('halvard').settings.Fill.value !== '#b4c7e7', fillOf('halvard'));
  check('… and changes nothing', App.wb.changes().length === changes);
  $('.float .palette').dispatchEvent(new PointerEvent('pointerleave')); await tick(80);
  check('leaving the swatches ends the preview', fillOf('halvard') === App.scene.peek().byId.get('halvard').settings.Fill.value);
  swatch.dispatchEvent(new PointerEvent('pointerenter')); await tick(80);
  cv().nudge(1, 0); await tick(120);
  check('a change to the chart ends a preview of it as it was', sc() === App.scene.peek() && fillOf('halvard') !== '#b4c7e7');
  $('.float .palette').dispatchEvent(new PointerEvent('pointerleave')); await tick(40);
  swatch.dispatchEvent(new PointerEvent('pointerenter')); await tick(80);
  await closeMenus(); await tick(80);
  check('closing the palette ends it too', sc() === App.scene.peek() && App.wb.changes().length === changes + 1);
  $('[data-fb="size"]').click(); await tick(120);
  const sizeOf = () => sc().byId.get('halvard').texts[0].look.Size;
  $$('.float .menu-item').find(e => txt(e) === '20').dispatchEvent(new PointerEvent('pointerover', { bubbles: true })); await tick(80);
  const pointed = JSON.stringify([sc().page.scale, sizeOf()]), grew = sizeOf() > App.scene.peek().byId.get('halvard').texts[0].look.Size;
  document.body.dispatchEvent(new PointerEvent('pointerover', { bubbles: true })); await tick(80);
  check('… until the pointer leaves it', sc() === App.scene.peek());
  await closeMenus();
  // What's drawn while a size is pointed at is what picking it makes.
  $('[data-fb="size"]').click(); await tick(120);
  $$('.float .menu-item').find(e => txt(e) === '20')?.click(); await tick(200);
  check('pointing at a size in its menu draws the text as picking it will', grew && JSON.stringify([sc().page.scale, sizeOf()]) === pointed, `${pointed} pointed, ${JSON.stringify([sc().page.scale, sizeOf()])} picked`);
  Shell.parts.peek().undo.undo(); await tick(150);

  // ---- Sizes in slide points, on the half-point grid; a frame shows its caption's ----
  const shown = () => +txt($('[data-fb="size"]'));
  check('the format bar shows a size in slide points, to the half point', shown() * 2 === Math.round(shown() * 2) && Math.abs(shown() - Scene.toSlide(sc().page, sizeOf())) <= 0.25, `${shown()} for ${Scene.toSlide(sc().page, sizeOf())}`);
  // A size picked reads back as picked where the chart can keep a scale for it, though the box grows and the
  // chart's scale drops with it (12 on Fund III); and where it can't, the bar says what it prints, as near the
  // pick as the page allows (14).
  Shell.select(['fund']); await tick(120);
  const scaleWas = sc().page.scale, pickSize = async z => {
    $('[data-fb="size"]').click(); await tick(120);
    $$('.float .menu-item').find(e => txt(e) === String(z))?.click(); await tick(200);
    return Scene.toSlide(sc().page, sc().byId.get('fund').texts[0].look.Size);
  };
  const at12 = await pickSize(12), scale12 = sc().page.scale, shown12 = shown();
  Shell.parts.peek().undo.undo(); await tick(150);
  const at14 = await pickSize(14);
  check('a size picked reads back as picked, and prints so, though the chart is drawn smaller for it', shown12 === 12 && Math.abs(at12 - 12) < 0.01 && scale12 < scaleWas,
    `bar ${shown12}, drawn ${at12}, scale ${scaleWas} → ${scale12}`);
  check('… or, where no scale the chart can keep allows it, the bar says what prints, as near as the page allows', shown() === Math.round(at14 * 2) / 2 && at14 > 12.5 && at14 <= 14,
    `bar ${shown()}, drawn ${at14}, scale ${sc().page.scale}`);
  Shell.parts.peek().undo.undo(); await tick(150);
  Shell.select(['halvard']); await tick(120);
  const v40 = charts().find(v => v.name === '40 Act');
  if (v40) {
    await show(v40);

    for (const [what, begin] of [
      ['a line deleted', async () => { Shell.select([hisLine]); await tick(80); cv().root.focus(); key('Delete', { shiftKey: true }); }],
      ['a person deleted', async () => { Shell.select([okafor]); await tick(80); cv().root.focus(); key('Delete', { shiftKey: true }); }],
      ['a fund’s start moved past today', async () => { Shell.select([coinv]); await tick(120); field = $$('aside.inspector input').find(i => i.getAttribute('aria-label') === 'Formation Date');
        if (!field) throw new Error('no Formation Date: ' + coinv + ' ' + txt($('.insp')).slice(0, 200));
        field.focus(); await tick(); field.value = 'March 2, 2027'; field.dispatchEvent(new Event('input', { bubbles: true })); }]]) {
      await begin(); await tick(200);
      const inked = cv().graph.getCells().filter(c => c.getData()?.kind === 'ink').length, over = overprints();
      if (!inked || over.length) struck.push(`${what}: ${inked ? over.join(', ') : 'nothing struck'}`);
      if (App.pending.peek()) App.discard(); else { field.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', bubbles: true, cancelable: true })); field.blur(); }
      await tick(160);
    }
    check('a struck label is drawn only where it’s clear of every label and box of the scene Enter makes', !!okafor && !!hisLine && !struck.length, `${okafor} ${hisLine} ${struck.join('; ')}`);
    // Esc pressed to clear the selection keeps a change pending; with nothing else to escape, it discards it
    await tickRow('pension', 'fund', /is an owner of Fund III$/); await tick(120);
    Shell.select(['northpine']); await tick(80); cv().root.focus(); key('Escape'); await tick(120);
    check('Esc pressed on the chart to clear its selection clears it and keeps the change pending, redlined', !Shell.selection.peek().length && !!App.pending.peek() && sc() !== App.scene.peek(), `${Shell.selection.peek()} ${!!App.pending.peek()}`);
    key('Escape'); await tick(160);
    check('… and pressed again, with nothing else to escape, discards it', !App.pending.peek() && !$('.pendbar') && sc() === App.scene.peek());
    // A click away leaves a change pending, its redline drawn
    await tickRow('pension', 'fund', /is an owner of Fund III$/); await tick(120);
    const red = sc();
    Shell.select([]); cv().root.focus(); await tick(160);
    check('a click away leaves a change pending, its bar and its redline drawn', !!App.pending.peek() && $$('.pendbar').length === 1 && !!$('.view > .pendbar') && sc() === red && sc() !== App.scene.peek(), `${!!App.pending.peek()} ${sc() === red}`);
    $$('.pendbar .btn').find(b => txt(b) === 'Discard')?.click(); await tick(160);
    check('… till Discard drops it, and the chart is drawn as it is', !App.pending.peek() && !$('.pendbar') && sc() === App.scene.peek() && !drawnAsScene().length);
  }

  const steps = [], step = async (what, f) => { await f(); await tick(120); const bad = drawnAsScene(); if (bad.length) steps.push(`${what}: ${bad.slice(0, 3).join(', ')}`); };
  const mainView = charts()[0], bar = () => $('.fx-out button.tag');
  await step('shown', () => show(mainView));
  await step('a name', () => App.change(tx => tx.update('fund_name', { value: 'Calder Ridge Capital Partners III-A, L.P.' })));
  await step('a tag', () => App.change(tx => tx.update('fund_good', { tag: false })));
  for (const v of [...charts().slice(1), mainView]) await step(`${v.name} shown`, () => show(v));
  await step('a style', () => App.change(tx => tx.note('Fill', { kind: 'Entity' }, '#fbe5d6', { view: mainView.id }), { dated: false }));
  await step('a box hidden', () => App.change(tx => tx.note('Shown', Tree.treeOf(App.state.peek(), 'gp'), false, { view: mainView.id }), { dated: false }));
  await step('a ruling redlined', async () => { Shell.select(['own_us_fund']); await tick(120); bar()?.dispatchEvent(new PointerEvent('pointerenter')); });
  await step('… and not', () => bar()?.dispatchEvent(new PointerEvent('pointerleave')));
  await step('a hidden box revealed', () => Shell.parts.peek().canvas.reveal(['gp']));
  await step('… and not', () => Shell.parts.peek().canvas.reveal(null));
  for (let i = 0; i < 4; i++) await step(`undone ${i + 1}`, () => Shell.parts.peek().undo.undo());
  for (const v of [charts()[1], mainView]) await step(`${v.name} shown again`, () => show(v));
  await step('tidied', () => $('[data-fb="tidy"]')?.click());
  await step('… and undone', () => Shell.parts.peek().undo.undo());
  await step('as of a past day', () => Shell.at({ asOf: '2025-06-30' }));
  await step('… and today', () => Shell.at(null));
  for (const v of charts()) await step(`${v.name} shown at its own scale`, () => show(v));
  await step(`${mainView.name} last`, () => show(mainView));
  check('what the canvas draws is the scene, after edits, views shown in turn, previews, undoing, Tidy and a past day', !steps.length, steps.join('; '));
}

window.onerror = (m, s, l, c, e) => check(`error: ${m} (${(s || '').split('/').pop()}:${l})`, false, e?.stack);
Shell.ready.then(() => run())
  .catch(e => check('runs', false, e.stack ?? e))
  .finally(() => {
    const failed = out.filter(c => !c.ok);
    const line = c => `${c.ok ? 'pass' : 'FAIL'}  ${c.name}${c.detail && !c.ok ? `  (${c.detail})` : ''}`;
    document.title = `canvas test: ${out.length - failed.length} pass, ${failed.length} fail`;
    $('#out').innerHTML = [`${out.length - failed.length} passed, ${failed.length} failed`, '',
      ...failed.map(c => `<span class="fail">${line(c).replace(/</g, '&lt;')}</span>`), ...(failed.length ? [''] : []),
      ...out.filter(c => c.ok).map(line).map(s => s.replace(/</g, '&lt;'))].join('\n');
  });
</script>
</body>
</html>

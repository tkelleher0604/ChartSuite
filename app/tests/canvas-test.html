<script>
window.EyeDropper = undefined;  // (the way a browser without its own goes, which this window can click; `format` tries both)
// Checks of the canvas (canvas.js) and the format bar (formatbar.js) in the window, on the sample, each
// driven as a person would: how a view opens, the scope a format goes to and its live preview, sizes in
// slide points, the keys, how a highlight draws, and that what's drawn is the scene however it came to be. The
// window is set to each size it's checked at.
const out = [];
const check = (name, ok, detail = '') => out.push({ name, ok: !!ok, detail: String(detail ?? '') });
// (A little under what's asked: the page is near what a run of the suite gives it.)
const tick = (ms = 40) => new Promise(r => setTimeout(r, ms * 0.8));
const until = async (f, ms = 4000) => { for (let t = 0; t < ms; t += 25) { if (f()) return true; await tick(25); } return false; };
// What a click there lands on: what's travelling lands first, for frames can stall in a headless run while its clock goes on.
const hitAt = (x, y) => { for (const a of document.getAnimations()) if (a.effect?.target?.closest?.('.dc')) a.finish(); cv()?.root.classList.remove('flying'); return document.elementFromPoint(x, y); };
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const txt = el => (el?.textContent ?? '').replace(/\s+/g, ' ').trim();

const show = async v => { Shell.show(v.id); await until(() => sc()?.view === v.id); await tick(120); };
// The window at a size, as a screen of that size lays it out.
const size = async (w, h) => { Object.assign($('.shell').style, { right: 'auto', bottom: 'auto', width: `${w}px`, height: `${h}px` }); await tick(160); };
// The page as the canvas shows it: its corners on screen, and the root's size.
function onScreen() {
  const g = cv().graph, p = sc().page, a = g.localToGraph(0, 0), b = g.localToGraph(p.w, p.h);
  return { a, b, W: cv().root.clientWidth, H: cv().root.clientHeight, z: g.zoom() };
}
// Where the title's words start on screen.
function titleAt() {
  const t = sc().marks.find(m => m.role === 'title' && m.texts[0]?.lines.length), l = t?.texts[0].lines[0];
  return t ? cv().graph.localToGraph(t.x + t.column.x, t.y + l.y - t.look.Size * Scene.PT * 0.93) : { x: NaN, y: NaN };
}
const key = (k, o = {}) => { const e = new KeyboardEvent('keydown', { key: k, code: o.code ?? k, bubbles: true, cancelable: true, ...o }); cv().root.dispatchEvent(e); };
const menuItems = () => $$('.float .menu-item').map(txt);

// A color's menu's flyout, the whole palette; the rows under a right-click's More.
const moreColors = async () => { $$('.float .palette .menu-item.sub').find(b => txt(b) === 'More colors').click(); await tick(120); };
const underMore = async () => { const b = $$('.float .menu-item').find(e => txt(e) === 'More'); b.dispatchEvent(new PointerEvent('pointermove', { bubbles: true })); await tick(120); };

async function run() {
  await until(() => App.views.peek().length && sc(), 15000);
  // (canvas-test.html?only=reloaded runs that section alone.)
  const only = new URLSearchParams(location.search).get('only');
  if (only) { await size(1440, 900); return eval(only)(); }
  await tick(300);
  const main = charts()[0];

  // ---- The opening frame: the whole page, as PowerPoint opens a slide, at every size ----

  // not this browser lays the window out again before the next check.
  const whole = () => { const { a, b, W, H } = onScreen(); return a.x >= -0.5 && a.y >= -0.5 && b.x <= W + 0.5 && b.y <= H + 0.5; };
  for (const [w, h] of [[1024, 768], [1280, 800], [1440, 900], [1920, 1080]]) {
    await size(w, h);
    const bad = [], order = charts();
    if (order[0].id === Shell.view.peek()) order.push(order.shift());
    for (const v of order) {
      await show(v);
      // (Within a margin of 28 px at most, across or down.)
      const { a, b, W, H, z } = onScreen();
      if (!whole() || (W - (b.x - a.x) > 57 && H - (b.y - a.y) > 57)) bad.push(`${v.name} at ${Math.round(z * 100)}%, page ${[a.x, a.y, b.x, b.y].map(Math.round)} in ${W}×${H}`);
    }
    check(`at ${w}×${h} every view opens on its whole page, as large as fits`, !bad.length, bad.join('; '));
  }
  await size(1440, 900);
  await show(main);
  cv().zoom('fit'); await tick(120);
  check('Fit shows the whole page', whole());
  // As of another day the chart holds still: the zoom as it was, and what's left of the chart where it was on screen.
  const zWas = cv().graph.zoom(), fundAt = () => { const m = sc().byId.get('fund'); return m && cv().graph.localToGraph(m.x, m.y); }, fundWas = fundAt();
  Shell.at({ asOf: '2023-12-31' }); await until(() => sc().day === '2023-12-31'); await tick(200);
  const fundThen = fundAt();
  check('as of a past day, the chart holds still: the zoom as it was, and a box drawn then where it was on screen', cv().graph.zoom() === zWas && !!fundThen
    && Math.abs(fundThen.x - fundWas.x) < 0.5 && Math.abs(fundThen.y - fundWas.y) < 0.5, JSON.stringify({ zWas, z: cv().graph.zoom(), fundWas, fundThen }));
  Shell.at(null); await tick(200);
  check('… and as of today, framed still', whole() && cv().graph.zoom() === zWas);

  // ---- The scope, in two parts: the selection, as in PowerPoint, and all like it, the narrowest group that
  // reaches it; its ▾ offers every group that does: the Styles rows, as the Key says them, under each style's
  // name, then the selection's own groups, its kind and its options and tags, each by its reach ----
  const ownPart = () => txt($('[data-fb="own"]')), like = () => txt($('[data-fb="like"]'));
  const chip = () => txt($('[data-fb="scope"] [aria-pressed="true"]'));
  const dulled = () => $$('.dc .x6-cell.dc-dull').map(e => e.getAttribute('data-cell-id'));
  // (The pen goes by itself: these are of a pen put at the title, a hand putting it there at each box as a new selection lets it go. Its own checks are after them: see The pen.)
  const toTitle = () => { FormatBar.pen.level.value = { own: true }; }, penHome = FormatBar.pen.home;
  FormatBar.pen.home = () => { const had = penHome(); toTitle(); return had; };
  let handAtTitle = true;
  const handing = () => { if (handAtTitle && !FormatBar.pen.level.peek()) toTitle(); };
  preactSignals.effect(() => { Shell.selection.value; handing(); queueMicrotask(handing); });
  window.handsOff = () => { handAtTitle = false; FormatBar.pen.home = penHome; };
  toTitle();
  Shell.select(['northpine']); await tick(120);
  check('one box selected, a format goes to “This box”, with all like it beside it', chip() === 'This box' && ownPart() === 'This box' && /^\d+ \S/.test(like()),`${ownPart()} | ${like()}`);
  check('… and nothing on the chart is dulled', !dulled().length, dulled().join());
  Shell.select(['northpine', 'halvard', 'fund']); await tick(120);
  check('three, to “These 3 boxes”', chip() === 'These 3 boxes', chip());
  const line = sc().marks.find(m => m.type === 'line' && !m.computed);
  Shell.select([line.id]); await tick(120);
  check('a line, to “This line”', chip() === 'This line', chip());
  Shell.select(['northpine']); await tick(120);
  $('[data-fb="groups"]').click(); await tick(120);
  const items = menuItems(), heads = $$('.float .menu-head').map(txt), menu = $$('.float .menu-head, .float .menu-item').map(txt);
  const seps = $$('.float .menu-sep, .float .menu-head, .float .menu-item').map(e => e.classList.contains('menu-sep') ? '-' : txt(e));
  check('its ▾ offers the selection, then each group that reaches it, with its reach', items[0] === 'This box' && items.slice(1).every(t => /^\S.* \(\d+\)$/.test(t) && !t.startsWith('All '))
    && items.includes('Portfolio companies (4)'), menu.join(' | '));
  const pcHead = menu.slice(0, menu.indexOf('Portfolio companies (4)')).filter(t => heads.includes(t)).at(-1);
  check('… the Styles rows each under its style’s name, and a style that is its one group (Names) that row alone, first, in the same place for every box', !!pcHead && pcHead !== 'Portfolio companies'
    && items.some(t => /^Names \(\d+\)$/.test(t)) && !heads.includes('Name') && /^This box,-,Names \(\d+\)$/.test(seps.slice(0, 3).join()), seps.join(' | '));
  // The Styles rows that reach the box, by Styles' captions: those under no name first; then as Styles lists them (Scene.groupsOf's
  // order), under their styles' names; then apart, under Same field value, the box's own groups, its kind first.
  const reaching = Scene.groupsOf(App.notes.peek(), sc().view).filter(g => Scene.reach(App.shown.peek(), App.chart.peek(), sc().view, sc(), 'northpine', App.state.peek())
    .some(r => r.style === g.style && g.outputs.some(p => Tree.narrower(r.output, p))));
  const headedSo = reaching.filter(g => g.name), listedSo = [...reaching.filter(g => !g.name).map(g => g.caption), '-', ...headedSo.flatMap((g, i) => [...(g.style !== headedSo[i - 1]?.style ? ['#' + g.name] : []), g.caption])];
  const ownHead = seps.indexOf('Same field value'), ownAt = ownHead;
  const menuSays = seps.slice(seps.indexOf('This box') + 2, ownHead - 1).map(t => heads.includes(t) ? '#' + t : t.replace(/ \(\d+\)$/, ''));
  check('… in the order Styles lists them, each style’s under its name, and those under none before them all', ownHead > 0 && JSON.stringify(menuSays) === JSON.stringify(listedSo), `${menuSays.join(' | ')} vs ${listedSo.join(' | ')}`);
  // Its own groups: every box of its kind, and of each of its options and tags, by the boxes drawn that have it.
  const rs = App.state.peek(), drawnBoxes = sc().marks.filter(m => m.type === 'box'), entryOf = (b, edge) => Object.keys(rs).find(id => rs[id].at === b.record && rs[id].edge === edge);
  const reachOf = (edge, out) => drawnBoxes.filter(b => { const e = entryOf(b, edge); return e && Object.entries(out).every(([k, v]) => rs[e][k] === v); }).length;
  const entities = drawnBoxes.filter(b => rs[b.record].kind === 'Entity').length, delaware = reachOf('Jurisdiction', { choice: 'Delaware' });
  const ownGroups = seps.slice(ownAt + 1).filter(t => t !== '-' && !t.startsWith('Clear '));
  // (One a Styles row already is alone, its Vehicle Type, is offered once, as that row: Portfolio companies.)
  check('… then the box’s own groups: its kind, then its options by their entries’ names, then its tags, each by the boxes drawn that have it, but those Styles rows already are',
    ownGroups[0] === `Entity (${entities})` && ownGroups.includes(`Jurisdiction: Delaware (${delaware})`) && !ownGroups.some(t => t.startsWith('Vehicle Type: Portfolio Company'))
    && ownGroups.findIndex(t => /^[^:]+ \(\d+\)$/.test(t) && t !== ownGroups[0]) > ownGroups.findLastIndex(t => t.includes(': ')) && !ownGroups.some(t => /^Portfolio companies/.test(t)), ownGroups.join(' | '));
  // Pointing at one cues it: what it reaches lit, the rest dulled; leaving it, the cue is the scope's again.
  const delawareItem = $$('.float .menu-item').find(e => txt(e).startsWith('Jurisdiction: Delaware'));
  delawareItem?.dispatchEvent(new PointerEvent('pointermove', { bubbles: true })); await tick(100);
  const cued = new Set(drawnBoxes.filter(b => { const e = entryOf(b, 'Jurisdiction'); return e && rs[e].choice === 'Delaware'; }).map(b => b.id)), dull = dulled();
  check('… and pointing at a group cues it on the chart, every box it reaches lit and every other mark dulled, its title too',
    [...cued].every(id => !dull.includes(id) && $(`.dc-marks .dc-cue`)) && drawnBoxes.filter(b => !cued.has(b.id)).every(b => dull.includes(b.id))
    && dull.includes(sc().marks.find(m => m.role === 'title')?.id) && $$('.dc-marks path.dc-cue').length === cued.size, `${dull.length} dulled, ${$$('.dc-marks path.dc-cue').length} lit`);
  await closeMenus(); await tick(80);
  check('… and the cue goes once the menu does, the selection being the scope', !dulled().length && !$$('.dc-marks .dc-cue').length, dulled().join());
  // The groups are the Key's: a style's outputs that look alike are one group, Funds, its reach every box of them.
  Shell.select(['feeder']); await tick(120);
  $('[data-fb="groups"]').click(); await tick(120);
  const fundItems = menuItems(), funds = sc().legend.find(r => r.caption === 'Funds');
  const fundReach = sc().marks.filter(m => m.type === 'box' && Scene.reach(App.shown.peek(), App.chart.peek(), sc().view, sc(), m.id, App.state.peek())
    .some(r => funds?.outputs.some(p => Tree.key(p) === Tree.key(r.output)))).length;
  check('a box of a group the Key shows as one row is offered that group, by the Key’s caption', !!funds && fundItems.includes(`Funds (${fundReach})`) && fundReach > 2, fundItems.join(' | '));
  await closeMenus();
  Shell.select(['northpine']); await tick(120);
  check('all like it names the narrowest Styles row that reaches the selection and more', like() === '4 portfolio companies', like());
  const pcs = sc().marks.filter(m => m.type === 'box' && App.state.peek()[m.record]?.kind === 'Entity' && JSON.stringify(m.settings.Fill.note?.pattern ?? {}).includes('Portfolio Company')).map(m => m.id);
  const fills = () => Object.fromEntries(pcs.map(id => [id, App.scene.peek().byId.get(id).settings.Fill.value]));
  const was = fills();
  FormatBar.apply('Fill', '#fff2cc'); await tick(120);
  const now = fills();
  check('a fill with one box selected fills that box alone', now.northpine === '#fff2cc' && pcs.filter(id => id !== 'northpine').every(id => now[id] === was[id]) && pcs.length === 4, JSON.stringify(now));
  $('[data-fb="like"]').click(); await tick(120);
  check('choosing all like it presses it, and what it reaches has a thin outline, the others untouched', chip() === '4 portfolio companies' && $$('.dc-marks path.dc-reach').length === 4 && !dulled().length, `${chip()}; ${$$('.dc-marks path.dc-reach').length} outlined, ${dulled().length} dulled`);
  FormatBar.apply('Fill', '#e2f0d9'); await tick(120);
  check('… and a fill then goes to every box it reaches but the one entered for itself', pcs.filter(id => id !== 'northpine').every(id => fills()[id] === '#e2f0d9'), JSON.stringify(fills()));
  const kept = txt($$('.toast').at(-1)), np = App.notes.peek().nameOf(App.state.peek(), 'northpine'), groupSaid = Time.describe(App.wb.changes().at(-1));
  const green = FormatBar.colorName('#e2f0d9');
  // (The first change of a session to reach more than one box says what it reached, with Undo and Just this box.)
  check('… which says at once what it reached, and that the one keeps its own, with Undo and Just this box', kept.includes(`${np} keeps its own`) && /^Filled all 4 portfolio companies/.test(kept) && /Just this box/.test(kept) && /Undo/.test(kept), kept);
  check('… and History names the change by the group, as the Key does, with the color by its name', groupSaid === `Set the fill of Portfolio companies to ${green} in ${main.name}`, groupSaid);
  // Each look is said with what it's given: a switch by what it makes, none as taken off, a color and a shape by name.
  const stamp = { who: 'Dana Jordan', when: new Date().toISOString(), chart: App.chart.peek() }, npBox = { id: 'northpine', kind: 'Entity' };
  const looks = [['Bold', true], ['Strike', false], ['Fill', 'none'], ['Font', 'Garamond'], ['Shape', 'rounded'], ['Fill', '#fff2cc'], ['Dash', 'dashed']]
    .map(([label, value], i) => Time.describe({ ...stamp, id: 'xl' + i, removes: [], adds: [{ id: `xl${i}a`, note: `xln${i}`, label, pattern: npBox, view: main.id, value }] }));
  check('a box’s looks are said as made: bold, not struck through, its fill taken off, its font, shape and fill set, its outline dashed', JSON.stringify(looks) === JSON.stringify([
    `Made ${np} bold`, `Made ${np} not struck through`, `Took the fill off ${np}`, `Set the font of ${np} to Garamond`, `Set the shape of ${np} to rounded rectangle`,
    `Set the fill of ${np} to ${FormatBar.colorName('#fff2cc')}`, `Made the outline of ${np} dashed`].map(s => `${s} in ${main.name}`)), looks.join(' / '));
  // A box's size changed is said as resized, its place alone as moved.
  const npAt = sc().byId.get('northpine'), placed = (x, w) => App.change(tx => tx.note('Position', Tree.treeOf(App.state.peek(), 'northpine'), { x, y: npAt.y, w }, { view: main.id }), { dated: false });
  const madePlaces = [placed(npAt.x, npAt.w)]; await tick(60); madePlaces.push(placed(npAt.x, npAt.w + 40)); await tick(60);
  const resizedSaid = Time.describe(App.wb.changes().at(-1));
  madePlaces.push(placed(npAt.x + 20, npAt.w + 40)); await tick(60);
  const movedSaid = Time.describe(App.wb.changes().at(-1));
  for (const c of madePlaces) if (c) { Shell.parts.peek().undo.undo(); await tick(60); }
  check('a box resized is said so, and one moved, moved', resizedSaid === `Resized ${np} in ${main.name}` && movedSaid === `Moved ${np} in ${main.name}`, `${resizedSaid} / ${movedSaid}`);
  check('… and the group stays chosen after the change', chip() === '4 portfolio companies', chip());
  $('[data-fb="groups"]').click(); await tick(120);
  const clearIt = $$('.float .menu-item').find(e => txt(e).startsWith('Clear '));
  check('… and its ▾ offers to clear what the one keeps', txt(clearIt) === `Clear ${np}’s own Fill`, menuItems().join(' | '));
  clearIt?.click(); await tick(120);
  check('… which gives it the group’s fill', fills().northpine === '#e2f0d9' && txt($$('.toast').at(-1)).startsWith(`Cleared ${np}’s own Fill`), `${fills().northpine} ${txt($$('.toast').at(-1))}`);
  await closeMenus();
  // Ctrl+Shift+A goes from one part to the other.
  const ctrlShiftA = () => window.dispatchEvent(new KeyboardEvent('keydown', { key: 'A', code: 'KeyA', ctrlKey: true, shiftKey: true, bubbles: true, cancelable: true }));
  ctrlShiftA(); await tick(100);
  const toOwn = chip();
  ctrlShiftA(); await tick(100);
  check('Ctrl+Shift+A goes from all like it to the selection and back', toOwn === 'This box' && chip() === '4 portfolio companies' && !!$$('.dc-marks path.dc-reach').length, `${toOwn}, then ${chip()}`);
  toTitle();
  Shell.select(['halvard']); await tick(120);
  check('at the title, nothing is dulled', chip() === 'This box' && !dulled().length, chip());
  // A group of a box's own, chosen from the ▾ and given a fill, becomes a Styles row, keyed: every Cayman box green.
  const feeder = drawnBoxes.find(b => { const e = entryOf(b, 'Jurisdiction'); return e && rs[e].choice === 'Cayman Islands'; });
  Shell.select([feeder.id]); await tick(120);
  $('[data-fb="groups"]').click(); await tick(120);
  // (A long list has what each field could reach a row away.)
  $$('.float .menu-item').find(e => txt(e) === 'Same field value')?.dispatchEvent(new PointerEvent('pointermove', { bubbles: true })); await tick(120);
  const cayman = $$('.float .menu-item').find(e => txt(e).startsWith('Jurisdiction: Cayman Islands'));
  const caymans = reachOf('Jurisdiction', { choice: 'Cayman Islands' });
  check('a box’s option is offered as a group of its own', !!cayman && txt(cayman) === `Jurisdiction: Cayman Islands (${caymans})`, menuItems().join(' | '));
  cayman?.click(); await tick(120);
  FormatBar.apply('Fill', '#92d050'); await tick(150);
  const greens = App.scene.peek().marks.filter(m => m.type === 'box' && m.settings.Fill.value === '#92d050').length, keyed = App.scene.peek().legend.find(r => r.swatch.Fill === '#92d050');

// The format bar's are on the sample as it opens, so in a window of their own, whose checks count here; so are the templates'.
const framed = async which => {
  const f = document.body.appendChild(Object.assign(document.createElement('iframe'), { src: `${location.pathname.split('/').pop()}?${which}` }));
  f.style.cssText = 'position:fixed;left:0;top:0;width:1440px;height:900px;z-index:-1;border:0';
  await until(() => f.contentWindow.__done, 200000);
  out.push(...(f.contentWindow.__out ?? []));
  f.remove();
};

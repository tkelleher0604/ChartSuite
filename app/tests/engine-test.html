<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rboreal engine test</title>
<style>
  body { margin: 0; padding: 20px; background: #fafafa; color: #18181b; font: 13px/1.5 ui-monospace, Consolas, monospace; }
  .fail { color: #b42318; }
  @media (prefers-color-scheme: dark) { body { background: #111113; color: #e4e4e7; } .fail { color: #f97066; } }
</style>
</head>
<body>
<pre id="out">Running…</pre>
<script src="../core/common.js"></script>
<script src="../core/model.js"></script>
<script src="../core/sample.js"></script>
<script src="../core/formulas.js"></script>
<script src="../core/styles.js"></script>
<script src="engine-reference.js"></script>
<script src="grown.js"></script>
<script>
// Checks of the formula engine itself (formulas.js) beyond what the formula lab's self-test checks of the
// sample's results. First, that it gives exactly what the engine gave before it was made to scale
// (engine-reference.js, the oracle), on grown charts and on definitions chosen to reach every way it works
// a step out. Then cases where the engine once went wrong. Nothing is saved.
saveState = () => {};
const out = [];
const check = (name, ok, detail = '') => out.push({ name, ok: !!ok, detail: String(detail ?? '') });
const show = (R, v) => Formulas.formatValue(R, v);

// ---- The same as the oracle ----

// Everything a working-out gives, spelled out for comparing: the records in the order they come, each
// record, what the formulas say of each (with what each implication read), the rows per definition, the
// errors, the plan, and why each computed or covered record is there, in the engine's own words.
function spelled(E, R) {
  const each = (obj, fn = x => x) => Object.fromEntries(Object.keys(obj).map(k => [k, JSON.stringify(fn(obj[k]))]));
  const said = [...Object.keys(R.computed), ...Object.keys(R.covered)];
  return {
    'record order': { all: Object.keys(R.records).join(' ') },
    records: each(R.records),
    'what the formulas say': each(R.computed),
    'entered records a formula covers': each(R.covered),
    rows: each(R.rows),
    errors: { all: JSON.stringify(R.errors) },
    'definition errors': { all: JSON.stringify(R.defErrors) },
    'kept aside': { all: JSON.stringify(R.keptAside) },
    plan: { all: JSON.stringify(R.order) },
    explanations: Object.fromEntries(said.map(id => [id, JSON.stringify(E.explain(R, id))])),
  };
}

// Where two spelled-out workings-out differ: a count per part, and the first few differences.
function differences(a, b) {
  const found = [];
  for (const part of Object.keys(a)) {
    const keys = new Set([...Object.keys(a[part]), ...Object.keys(b[part])]);
    const differ = [...keys].filter(k => a[part][k] !== b[part][k]);
    if (differ.length) found.push(`${part}: ${differ.length} differ, as ${differ.slice(0, 2).map(k => `${k}: ${String(a[part][k]).slice(0, 160)} ≠ ${String(b[part][k]).slice(0, 160)}`).join('; ')}`);
  }
  return found;
}

// Definitions that reach the ways a step can be worked out that the sample's don't: an implication whose
// form doesn't say where it can hold; NOT; a list that errs; three arguments; a look-through whose factor
// isn't a number; a holding read from the other side; a value formula and an implication on one loop,
// which is circular; and a relation that reads itself through NOT.
const EDGE_DEFINITIONS = [
  { id: 'def_sibling', name: 'Sibling', type: 'tag', args: [{ edge: 'Elder', at: ['Entity'] }, { edge: 'Younger', at: ['Entity'] }],
    implications: [{ label: 'A shared owner', formula: '← ANY(Younger.Owners, @ IN Elder.Owners)' }] },
  { id: 'def_passive', name: 'Passive Holder', type: 'tag', args: [{ edge: 'Holder', at: ['Entity', 'Individual', 'Investor Group'] }, { edge: 'Company', at: ['Entity'] }],
    implications: [{ label: 'Holds without control', formula: '← Holder IN Company.Owners AND NOT Control(Holder, Company)' }] },
  { id: 'def_bogus', name: 'Bogus', type: 'tag', args: [{ edge: 'From', at: ['Entity'] }, { edge: 'To', at: ['Entity'] }],
    implications: [{ label: 'A step that isn’t there', formula: '← To IN REACH(From, Nowhere)' }, { label: 'Owned', formula: '← From IN To.Owners' }] },
  { id: 'def_signing', name: 'Signing Path', type: 'tag', args: [{ edge: 'Signatory', at: ['Individual'] }, { edge: 'Via', at: ['Entity'] }, { edge: 'On Behalf Of', at: ['Entity'] }],
    implications: [{ label: 'An officer of the general partner', formula: '← Via IN [On Behalf Of].[General Partners] AND Signatory IN Via.Personnel' }] },
  { id: 'def_name_product', name: 'Name Product', type: 'field', datatype: 'number', args: [{ edge: 'Top', at: ['Entity', 'Individual', 'Investor Group'] }, { edge: 'Bottom', at: ['Entity'] }],
    formula: '= LOOKTHROUGH(Top, Bottom, Holdings, Name)' },
  { id: 'def_half', name: 'Half Owner', type: 'tag', args: [{ edge: 'Holder', at: ['Entity', 'Individual'] }, { edge: 'Company', at: ['Entity'] }],
    implications: [{ label: 'Half or more', formula: '← SUM(FILTER(Company.Owners, @ = Holder OR @ IN REACH(Holder, Holdings)).Percentage) >= 50%' }] },
  { id: 'def_control_count', name: 'Control Count', type: 'field', datatype: 'number', at: ['Entity'], formula: '= COUNT(Controllers) + IF([Widely Held], 1, 0)' },
  { id: 'def_widely_held', name: 'Widely Held', type: 'tag', at: ['Entity'], implications: [{ label: 'Many controllers', formula: '← [Control Count] > 3' }] },
  { id: 'def_contrary', name: 'Contrary', type: 'tag', args: [{ edge: 'P', at: ['Entity'] }, { edge: 'Q', at: ['Entity'] }],
    implications: [{ label: 'Owned, unless the other way', formula: '← Q IN P.Owners AND NOT Contrary(Q, P)' }] },
];

// The charts: the sample a chart starts from, grown; the feeder's control of the fund ruled out; the core
// with the fund as a BDC, so the carve-out comes up; and the core with the definitions above, once with an
// entry named Owners on the blocker, which makes the blocker's Owners ambiguous.
function oracleCharts() {
  const st = sampleState();
  const sample = n => engineInputs(grown(st.records, n), null, null, st);
  const core = (n, edit = () => {}, defs = SAMPLE_DEFINITIONS) => { const recs = grown(SAMPLE_CORE, n); edit(recs); return engineInputs(recs, defs, SAMPLE_NAMES); };
  const rebutted = engineInputs({ ...grown(st.records, 24), x_rebut: { args: [{ edge: 'Controller', at: 'feeder' }, { edge: 'Controlled', at: 'fund' }], tag: false } }, null, null, st);
  return [
    ['The sample', sample(0)],
    ['The sample with 12 more entities', sample(12)],
    ['The sample with 24 more entities and the feeder’s control of the fund ruled out', rebutted],
    ['The core with the fund as a BDC and 20 more entities', core(20, recs => { recs.fund_ics.choice = 'Business Development Company'; })],
    ['The core with 10 more entities and the edge definitions', core(10, () => {}, [...SAMPLE_DEFINITIONS, ...EDGE_DEFINITIONS])],
    ['…with an entry named Owners on the blocker', core(10, recs => { recs.x_owners = { at: 'blocker', edge: 'Owners', field: 'text', value: 'See the register' }; }, [...SAMPLE_DEFINITIONS, ...EDGE_DEFINITIONS])],
  ];
}

function sameAsOracle() {
  for (const [name, { recs, definitions, names }] of oracleCharts()) {
    const was = FormulasReference.computeState(recs, definitions, names);
    const now = Formulas.computeState(recs, definitions, names);
    const found = differences(spelled(FormulasReference, was), spelled(Formulas, now));
    check(`${name}: the same as the oracle, record by record and explanation by explanation (${Object.keys(now.computed).length} computed, ${now.errors.length} errors; ${was.ms.toFixed(0)} ms before, ${now.ms.toFixed(0)} ms now)`,
      !found.length, found.join(' | '));
  }
}

// ---- Cases where the engine once went wrong ----

// A relation entered at a computed record has that record's form, so its name and list names apply in
// formulas, even where something looked at it before the record it's located at was worked out. Here a
// person's Assignments are counted before the deadlines are worked out, and Responsible is entered at one.
function enteredAtComputed() {
  const recs = {
    q: { kind: 'Entity' }, q_name: { at: 'q', edge: 'Name', field: 'text', value: 'Quillhaven Fund I, L.P.' },
    rule: { kind: 'Rule' }, rule_name: { at: 'rule', edge: 'Name', field: 'text', value: 'Annual Report' },
    p: { kind: 'Individual' }, p_name: { at: 'p', edge: 'Name', field: 'text', value: 'Rebecca A. Moretti' },
  };
  const deadline = Formulas.computedId([{ edge: 'Entity', at: 'q' }, { edge: 'Rule', at: 'rule' }]);
  recs.resp = { args: [{ edge: 'Deadline', at: deadline }, { edge: 'Person', at: 'p' }], tag: true };
  const defs = [
    { id: 'def_load', name: 'Load', type: 'field', datatype: 'number', at: ['Individual'], formula: '= COUNT(Assignments)' },
    { id: 'def_deadline', name: 'Deadline', type: 'tag', args: [{ edge: 'Entity', at: ['Entity'] }, { edge: 'Rule', at: ['Rule'] }],
      implications: [{ label: 'Every rule applies', formula: '← TRUE' }] },
  ];
  const lists = { Deadline: { Person: 'Responsible' }, Person: { Deadline: 'Assignments' } };
  // The relation's form, as the app keys names by it: worked out once the deadline is there.
  const first = Formulas.computeState(recs, defs, { relations: [] });
  const form = formKeyOf('resp', first.records);
  const names = { relations: [{ name: 'Responsible', type: 'tag', edges: ['Deadline', 'Person'], form, lists }] };
  const R = Formulas.computeState(recs, defs, names);
  check('A relation entered at a computed record has the form the model gives it', Formulas.formOf(R, 'resp') === form, Formulas.formOf(R, 'resp'));
  check('…so its list name reads in a formula at that record (Responsible.Name)', show(R, Formulas.evaluateAt(R, 'Responsible.Name', deadline)) === 'Rebecca A. Moretti',
    show(R, Formulas.evaluateAt(R, 'Responsible.Name', deadline)));
  check('…as its edge label does (Person.Name)', show(R, Formulas.evaluateAt(R, 'Person.Name', deadline)) === 'Rebecca A. Moretti');
  check('…and from the other side (Assignments)', show(R, Formulas.evaluateAt(R, 'COUNT(Assignments)', 'p')) === '1');
}

// The order definitions are listed in doesn't change what they compute. Percentage is located at the
// computed Ownership relation, and Owner Count reads Ownership's list by its edge label, Owner; each is
// listed before Ownership and after it.
function orderDoesNotMatter() {
  const recs = {};
  for (const [id, name] of [['a', 'Alder Capital'], ['b', 'Birch Holdings'], ['c', 'Cedar Partners']]) {
    recs[id] = { kind: 'Entity' };
    recs[`${id}_name`] = { at: id, edge: 'Name', field: 'text', value: name };
  }
  recs.i1 = { args: [{ edge: 'Investor', at: 'a' }, { edge: 'Issuer', at: 'b' }], tag: true };
  recs.i1_units = { at: 'i1', edge: 'Units', field: 'number', value: 60 };
  recs.i2 = { args: [{ edge: 'Investor', at: 'c' }, { edge: 'Issuer', at: 'b' }], tag: true };
  recs.i2_units = { at: 'i2', edge: 'Units', field: 'number', value: 40 };
  const ownershipSpec = JSON.stringify(['tag:true', ...[JSON.stringify(['owner', 'kind:entity']), JSON.stringify(['owned', 'kind:entity'])].sort()]);
  const ownership = { id: 'def_ownership', name: 'Ownership', type: 'tag', args: [{ edge: 'Owner', at: ['Entity'] }, { edge: 'Owned', at: ['Entity'] }],
    implications: [{ label: 'Holds units', formula: '← Owner IN Owned.Investors' }] };
  const percentage = { id: 'def_pct', name: 'Percentage', type: 'field', datatype: 'percent', covers: [Formulas.parameterizationKey([{ edge: 'Percentage', spec: ownershipSpec }])],
    formula: '= SUM(FILTER(Owned.Investors, @ = Owner).Units) / SUM(Owned.Investors.Units)' };
  const ownerCount = { id: 'def_owner_count', name: 'Owner Count', type: 'field', datatype: 'number', at: ['Entity'], formula: '= COUNT(Owner)' };
  const names = { relations: [
    { name: 'Ownership', type: 'tag', edges: ['Owner', 'Owned'], lists: { Owned: { Owner: 'Owners' }, Owner: { Owned: 'Holdings' } } },
    { name: 'Interest', type: 'tag', edges: ['Investor', 'Issuer'], lists: { Issuer: { Investor: 'Investors' }, Investor: { Issuer: 'Investments' } } },
  ] };
  const results = [[ownership, percentage, ownerCount], [percentage, ownerCount, ownership]].map(defs => {
    const R = Formulas.computeState(recs, defs, names);
    const pct = Object.values(R.records).filter(r => r.computed === 'def_pct').map(r => show(R, r.value)).sort();
    return { pct: pct.join(', '), owners: show(R, Formulas.evaluateAt(R, '[Owner Count]', 'b')), order: R.order.flat().join(' ') };
  });
  check('Percentage, located at a computed relation, is worked out after it whatever the order', results.every(r => r.pct === '0.4, 0.6'), results.map(r => r.pct).join(' | '));
  check('A list read by its edge label is worked out after the relation that makes it, whatever the order', results.every(r => r.owners === '2'), results.map(r => r.owners).join(' | '));
  check('The plan is the same either way', results[0].order === results[1].order, results.map(r => r.order).join(' | '));
}

function run() {
  sameAsOracle();
  enteredAtComputed();
  orderDoesNotMatter();
  const failed = out.filter(x => !x.ok).length;
  document.title = `engine test: ${out.length - failed} pass, ${failed} fail`;
  document.getElementById('out').innerHTML = `${esc(document.title)}\n\n` + [...out.filter(x => !x.ok), ...out.filter(x => x.ok)].map(x =>
    `<span class="${x.ok ? '' : 'fail'}">${x.ok ? 'PASS' : 'FAIL'}  ${esc(x.name)}${x.detail ? `  [${esc(x.detail)}]` : ''}</span>`).join('\n');
}

try { run(); } catch (e) { document.title = 'engine test: stopped'; document.getElementById('out').textContent = `${e.message}\n${e.stack}`; }
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dendra engine test</title>
<style>
  body { margin: 0; padding: 20px; background: #fafafa; color: #18181b; font: 13px/1.5 ui-monospace, Consolas, monospace; }
  .fail { color: #b42318; }
  @media (prefers-color-scheme: dark) { body { background: #111113; color: #e4e4e7; } .fail { color: #f97066; } }
</style>
</head>
<body>
<pre id="out">Running…</pre>
<script src="../core/tree.js"></script>
<script src="../core/notes.js"></script>
<script src="../core/log.js"></script>
<script src="../core/formulas.js"></script>
<script src="../sample/calder-ridge.js"></script>
<script src="grown.js"></script>
<script>
// Checks of the formula engine (formulas.js), end to end: the sample's log, as of a day, its Formula notes and
// relation names as Notes gives them, worked out. First the sample's results, as formulas.md describes them,
// and the changes the reworked semantics made on purpose: Control gains its fourth row, "Through a
// controlled company", and Remote Affiliate rules out the BDC's close affiliates under §57(d); and those the
// legal team's revisions of October 2026 made: the 25% and 5% tests read votes, the 3(c)(1) count only 3(c)(1)
// funds, each tax year's Delaware tax is its own deadline, paid at its year, and a signatory's capacity is
// checked. Then the semantics (nothing, loops, stages and grounds), the APIs for the formula bar, the redline and
// the editor, definitions that reach the ways a group is worked out that the sample's don't, and cases where the
// engine once went wrong. Nothing is saved.
const out = [];
const check = (name, ok, detail = '') => out.push({ name, ok: !!ok, detail: String(detail ?? '') });
const esc = s => String(s).replace(/[&<>]/g, c => `&#${c.charCodeAt(0)};`);
// How a value reads, for these checks: a record by its output, a list's items joined, a number as a percentage
// where asked.
const show = (R, v, pct = false) => {
  if (v?.t === 'err') return v.code;
  if (Array.isArray(v)) return v.length ? v.map(x => show(R, x, pct)).join('; ') : '(empty list)';
  if (v?.t === 'rec') {
    const r = R.records[v.id];
    if (!r) return '(blank)';
    if (Tree.isObject(r)) return Formulas.text(R, v);
    return show(R, Tree.isTag(r) ? r.tag : Tree.isChoice(r) ? r.choice : r.field === 'date' ? { t: 'date', iso: r.value } : r.value, pct);
  }
  if (v === null || v === undefined) return '(blank)';
  if (typeof v === 'number') return pct ? `${+(v * 100).toPrecision(12)}%` : String(+v.toPrecision(12));
  return Formulas.text(R, v);
};

const objOf = (R, id) => { let cur = id; while (R.records[cur]?.at) cur = R.records[cur].at; return cur; };
const rowsOf = (R, def) => R.rows[def] ?? [];
const entryRow = (R, def, obj) => rowsOf(R, def).find(r => r.at && objOf(R, r.at) === obj);
const pairRow = (R, def, a, b) => rowsOf(R, def).find(r => r.args && objOf(R, r.args[0].at) === a && objOf(R, r.args[1].at) === b);
const attested = (R, row) => !!row && !row.error && (row.entered ? R.records[row.entered].tag === true : row.value === true);
const labelsOf = (R, row) => (row?.holds ?? []).map(i => R.state.P.byId.get(row.def).rows[i].label);
const pairOf = (R, row) => row.args.map(a => objOf(R, a.at)).join('→');
// A Delaware annual tax entry, at the relation of a taxpayer and a tax year: whose, and for which year.
const taxRows = (R, def, obj) => rowsOf(R, def).filter(r => r.at && R.records[r.at]?.args?.some(a => a.edge === 'Taxpayer' && objOf(R, a.at) === obj));
const yearOf = (R, row) => { const y = (R.records[row.at] ?? row).args.find(a => a.edge === 'Tax Year').at; return Object.values(R.records).find(x => x.at === y && x.edge === 'Year')?.value; };
const withRecords = more => workOut({ ...SAMPLE_INPUTS.recs, ...more });
const ctl = (a, b) => Formulas.computedId([{ edge: 'Controller', at: a }, { edge: 'Controlled', at: b }]);
const PRESUMED = 'Presumed: more than 25% of voting securities';
// Rebutting the presumption that Okafor, a member of GP III but not its managing member, controls it by his half of its units.
const rebuttal = { x_rebut: { args: [{ edge: 'Controller', at: 'okafor' }, { edge: 'Controlled', at: 'gp' }], tag: false } };

// ---- The sample, as formulas.md describes it ----

function theSample() {
  const R = workOut();
  const { definitions } = SAMPLE_INPUTS;
  check('Notes gives the sample’s 29 definitions, each with what it covers and its rows', definitions.length === 29 && definitions.every(d => d.covers.length && d.rows.length && d.type));
  check('…and none has a problem', !Object.keys(R.defErrors).length, JSON.stringify(R.defErrors));
  const problems = definitions.flatMap(d => d.rows.flatMap(r => Formulas.check(r.formula, { computed: R, def: d.id }).problems.map(p => `${d.id}: ${p.message}`)));
  check('…nor any of their rows, names included', !problems.length, problems.slice(0, 3).join(' | '));
  const counts = {};
  for (const c of Object.values(R.computed)) counts[c.def] = (counts[c.def] ?? 0) + 1;
  const total = Object.keys(R.computed).length;
  check(`The sample works out 600 computed records, with no errors: the 577 before, and the 40 Act filter’s BDC Affiliate (${counts.def_bdc_affiliate})`,
    total === 600 && !R.errors.length && counts.def_bdc_affiliate === 23 && total - counts.def_bdc_affiliate === 577, `${total} computed, ${R.errors.length} errors`);
  // Control 66 → 51: the feeder, the Cayman GP and the holding company no longer control the fund and what it
  // controls (15), since a limited partnership interest carries no vote. 3(c)(1) Count 5 → 0: every fund is 3(c)(7).
  // The Delaware tax 7 → 10: the AIV owes tax years 2025 and 2026, and the two blockers their franchise tax for
  // 2026, each year its own as the jurisdiction's one Franchise Tax Due (2) was not. New: Voting Percentage (24
  // holdings), Capacity Held (13 signing authorities), the tax years owed (10), CIMA accounts, CRS and FATCA (1
  // each). Annual Tax Amount 8 → 22: each of the 14 limited partnership and LLC tax years paid has its amount too;
  // a corporation's franchise tax has none. Ownership Adds Up 16 → 11: not ruled out where the other owners
  // aren't charted, at the four portfolio companies and the BDC.
  const want = { def_control: 51, def_affiliated: 289, def_close: 21, def_remote: 22, def_look_through: 51, def_adds_up: 11, def_tax: 6,
    def_private_fund: 5, def_investment_company: 1, def_annual_tax: 10, def_annual_tax_amount: 22, def_annual_tax_owed: 10, def_annual_return: 2,
    def_form_adv: 1, def_form_pf: 1, def_cima_fee: 1, def_cima_accounts: 1, def_crs: 1, def_fatca: 1, def_form_d: 2, def_cftc: 3, def_lei: 4,
    def_formation_on_file: 12, def_governing_on_file: 12, def_bdc_affiliate: 23, def_voting: 24, def_capacity_held: 13 };
  const off = Object.keys({ ...want, ...counts }).filter(d => want[d] !== counts[d]);
  check('…by definition: Control 51, Affiliated Person 289, Close Affiliate 21, Remote Affiliate 22, Look-Through Ownership 51, and the rest', !off.length,
    off.map(d => `${d} ${counts[d]} (want ${want[d]})`).join(', '));

  // The changes the semantics made on purpose.
  const through = rowsOf(R, 'def_control').filter(r => attested(R, r) && labelsOf(R, r).join() === 'Through a controlled company').map(r => pairOf(R, r)).sort();
  check('Control holds 11 pairs only through a controlled company whose general partner the controller controls: Chen and Okafor → the fund, Fund III-A, the AIV, the co-invest vehicle and the feeder, and the sponsor’s holding company → the feeder',
    through.join() === 'chen→aiv,chen→coinv,chen→feeder,chen→fund,chen→fund3a,holdco→feeder,okafor→aiv,okafor→coinv,okafor→feeder,okafor→fund,okafor→fund3a', through.join(' '));
  const remote = rowsOf(R, 'def_remote').filter(r => !r.error);
  const closeOfBdc = rowsOf(R, 'def_close').filter(r => attested(R, r) && objOf(R, r.args[1].at) === 'bdc').map(r => objOf(R, r.args[0].at)).sort();
  check('Remote Affiliate attests only the pension plan, under (e)(1)(A)', remote.filter(r => r.value === true).map(r => objOf(R, r.args[0].at)).join() === 'pension'
    && labelsOf(R, pairRow(R, 'def_remote', 'pension', 'bdc')).includes('(e)(1)(A)'));
  check('…and rules out each of the BDC’s 21 close affiliates, as close affiliates under §57(b)', closeOfBdc.length === 21
    && remote.filter(r => r.value === false).map(r => objOf(R, r.args[0].at)).sort().join() === closeOfBdc.join() && remote.filter(r => r.value === false).every(r => r.label === 'Close affiliate (§57(b))'));

  for (const id of ['fund', 'feeder', 'blocker', 'gp', 'mgmt']) check(`Ownership Adds Up attested on ${id}`, entryRow(R, 'def_adds_up', id)?.value === true);
  for (const id of ['chen', 'okafor', 'inv_us', 'inv_nonus']) check(`Ownership Adds Up records nothing on ${id}`, !entryRow(R, 'def_adds_up', id));
  for (const id of ['northpine', 'halvard', 'bdc']) check(`…nor on ${id}, short of 100%, whose other owners aren’t charted`, !entryRow(R, 'def_adds_up', id));
  const short = withRecords({ own_okfr_gp_pct: { ...SAMPLE_INPUTS.recs.own_okfr_gp_pct, value: 0.3 } });
  check('…but rules it out where every owner is meant to be charted: GP III, its members holding 80%', entryRow(short, 'def_adds_up', 'gp')?.value === false
    && entryRow(short, 'def_adds_up', 'gp').label === 'Owners missing', JSON.stringify(entryRow(short, 'def_adds_up', 'gp')));
  // Nothing from nothing: owners whose percentages aren't recorded yet neither add up nor fail to; one typed does.
  const owners = (pcts) => withRecords(Object.fromEntries([['x_f', { kind: 'Entity' }], ['x_f_type', { at: 'x_f', edge: 'Entity Type', choice: 'Limited Partnership' }],
    ...pcts.flatMap((p, i) => [[`x_o${i}`, { args: [{ edge: 'Owner', at: 'pension' }, { edge: 'Owned', at: 'x_f' }].map(a => a.edge === 'Owner' ? { ...a, at: ['pension', 'inv_us'][i] } : a), tag: true }],
      ...(p === null ? [] : [[`x_o${i}_pct`, { at: `x_o${i}`, edge: 'Percentage', field: 'percent', value: p }]])])]));
  check('…and records nothing where its owners’ percentages are blank, ruling out once one is typed that doesn’t add up', !entryRow(owners([null, null]), 'def_adds_up', 'x_f')
    && entryRow(owners([0.4, null]), 'def_adds_up', 'x_f')?.value === false && entryRow(owners([0.4, 0.6]), 'def_adds_up', 'x_f')?.value === true,
    JSON.stringify([entryRow(owners([null, null]), 'def_adds_up', 'x_f'), entryRow(owners([0.4, null]), 'def_adds_up', 'x_f')?.value]));
  // A percentage out of range is the sample's rule to flag, as Ownership Adds Up flags owners that don't add up.
  check('Percentages In Range records nothing where every holding is from 0% to 100%', !rowsOf(R, 'def_in_range').length);
  const odd = withRecords({ own_fund_npine_pct: { ...SAMPLE_INPUTS.recs.own_fund_npine_pct, value: 1.5 }, own_chen_gp_pct: { ...SAMPLE_INPUTS.recs.own_chen_gp_pct, value: -0.05 } });
  const ruled = rowsOf(odd, 'def_in_range').map(r => `${pairOf(odd, { args: odd.records[r.at].args })} ${r.value} ${r.label}`).sort();
  check('…and rules out a holding of 150% and one of −5%, by their Percentage', ruled.join() === 'chen→gp false Percentage,fund→northpine false Percentage', ruled.join(' / '));

  check('Tax Classification: Partnership for Northpine, by the row Otherwise', entryRow(R, 'def_tax', 'northpine')?.value === 'Partnership' && entryRow(R, 'def_tax', 'northpine').label === 'Otherwise');
  check('Tax Classification: C Corporation for Halvard, by the row Corporation', entryRow(R, 'def_tax', 'halvard')?.value === 'C Corporation' && entryRow(R, 'def_tax', 'halvard').label === 'Corporation');
  check('Tax Classification: the BDC’s entered election stands, and the rows would give C Corporation', R.records.bdc_tax.choice === 'Regulated Investment Company'
    && R.covered.bdc_tax?.value === 'C Corporation' && R.covered.bdc_tax.agrees === false);
  check('Tax Classification agrees with the entered classifications of the fund, the GP, the manager and the blocker', ['fund_tax', 'gp_tax', 'mgmt_tax', 'blocker_tax'].every(id => R.covered[id]?.agrees === true));
  check('Tax Classification gives the feeder, an exempted limited partnership, nothing', !entryRow(R, 'def_tax', 'feeder'));

  for (const [a, b, want] of [['inv_nonus', 'fund', 0.284], ['inv_nonus', 'northpine', 0.18176], ['inv_us', 'halvard', 0.58712], ['coinv', 'corvane', 0.125]]) {
    const got = pairRow(R, 'def_look_through', a, b)?.value;
    check(`Look-through ${a} → ${b} is ${+(want * 100).toFixed(3)}%`, Math.abs(got - want) < 1e-12, got);
  }
  check('Look-through is recorded only between connected pairs', !pairRow(R, 'def_look_through', 'pension', 'fund') && !pairRow(R, 'def_look_through', 'inv_us', 'bdc'));

  for (const [a, b] of [['chen', 'mgmt'], ['okafor', 'mgmt'], ['chen', 'gp'], ['okafor', 'gp'], ['gp', 'fund'], ['caygp', 'feeder'], ['fund', 'blocker'], ['fund', 'northpine'],
    ['fund', 'halvard'], ['chen', 'fund'], ['okafor', 'fund'], ['chen', 'feeder'], ['okafor', 'feeder']])
    check(`Control: ${a} controls ${b}`, attested(R, pairRow(R, 'def_control', a, b)), labelsOf(R, pairRow(R, 'def_control', a, b)).join(', '));
  check('Control: Chen’s control of the management company holds by Managing member and the presumption, on her 60% of its votes',
    ['Managing member', PRESUMED].every(l => labelsOf(R, pairRow(R, 'def_control', 'chen', 'mgmt')).includes(l)));
  check('Voting Percentage: a limited partnership interest carries no vote, and the feeder’s 28.4% of the fund none',
    ['own_us_fund', 'own_nonus_fdr', 'own_fdr_fund', 'own_inv3a_3a', 'own_invaiv_aiv', 'own_invco_coinv'].every(o => entryRow(R, 'def_voting', o)?.value === 0)
    && entryRow(R, 'def_voting', 'own_chen_mgmt')?.value === 0.6);
  for (const [a, b] of [['feeder', 'fund'], ['feeder', 'blocker'], ['caygp', 'fund'], ['holdco', 'fund']])
    check(`Control: ${a} doesn’t control ${b}: the feeder’s interest in the fund isn’t a voting security`, !pairRow(R, 'def_control', a, b));
  const R2 = withRecords(rebuttal);
  check('Rebuttal: the ruling-out stands, and the presumption still holds beneath it', R2.records.x_rebut.tag === false && labelsOf(R2, { def: 'def_control', holds: R2.covered.x_rebut?.holds }).includes(PRESUMED));
  for (const b of ['fund', 'blocker', 'northpine', 'halvard', 'corvane']) check(`Rebuttal: Okafor no longer controls ${b}`, !attested(R2, pairRow(R2, 'def_control', 'okafor', b)));
  check('…while Chen, GP III’s managing member, still controls the fund', attested(R2, pairRow(R2, 'def_control', 'chen', 'fund')));

  const aff = rowsOf(R, 'def_affiliated').filter(r => attested(R, r));
  const has = (a, b, l) => labelsOf(R, pairRow(R, 'def_affiliated', a, b)).includes(l);
  const pairs = aff.map(r => [objOf(R, r.args[0].at), objOf(R, r.args[1].at)]);
  check('Affiliated Person: (B) mirrors (A)', pairs.every(([a, b]) => has(a, b, '(B)') === has(b, a, '(A)') && has(a, b, '(A)') === has(b, a, '(B)')));
  check('Affiliated Person: no one is their own affiliate', pairs.every(([a, b]) => a !== b));

  const closeOf = (res, bdc) => Object.fromEntries(rowsOf(res, 'def_close').filter(r => attested(res, r) && objOf(res, r.args[1].at) === bdc).map(r => [objOf(res, r.args[0].at), labelsOf(res, r)]));
  const closeBdc = closeOf(R, 'bdc');
  for (const [a, label] of Object.entries({ chen: '(b)(1)', raman: '(b)(1)', okafor: '(b)(1)', mgmt: '(b)(2)', gp: '(b)(1) affiliates', fund: '(b)(1) affiliates',
    feeder: '(b)(1) affiliates', blocker: '(b)(2) affiliates', northpine: '(b)(2) affiliates', halvard: '(b)(2) affiliates' }))
    check(`Close Affiliate: ${a} of the BDC under ${label}`, closeBdc[a]?.includes(label), (closeBdc[a] ?? []).join(', '));

  const asBdc = withRecords({ fund_ics: { ...SAMPLE_INPUTS.recs.fund_ics, choice: 'Business Development Company' } });
  const closeFund = closeOf(asBdc, 'fund');
  check('Fund as BDC: no errors, Affiliated Person’s (F) reading an empty list of Depositors', !asBdc.errors.length, asBdc.errors.slice(0, 2).map(e => `${e.def} ${e.error.code}`).join(' '));
  for (const a of ['gp', 'chen', 'okafor', 'feeder', 'mgmt']) check(`Fund as BDC: ${a} under (b)(2)`, closeFund[a]?.includes('(b)(2)'), (closeFund[a] ?? []).join(', '));
  for (const a of ['blocker', 'northpine', 'halvard']) check(`Fund as BDC: ${a} not under (b)(2) (the carve-out)`, !closeFund[a]?.includes('(b)(2)'));
  for (const a of ['blocker', 'northpine', 'halvard']) check(`Fund as BDC: ${a} under (b)(2) affiliates, read literally`, closeFund[a]?.includes('(b)(2) affiliates'));

  check('3(c)(1) Count: nothing for a 3(c)(7) fund', !rowsOf(R, 'def_3c1').length);
  const as3c1 = withRecords({ fund_ics: { ...SAMPLE_INPUTS.recs.fund_ics, choice: '3(c)(1) Fund' } });
  check('3(c)(1) Count of the fund as a 3(c)(1) fund: the U.S. investors’ 86 beneficial owners, and the feeder’s 41 holders, looked through at 28.4%',
    entryRow(as3c1, 'def_3c1', 'fund')?.value === 127, entryRow(as3c1, 'def_3c1', 'fund')?.value);
  const loop = withRecords({
    fund_ics: { ...SAMPLE_INPUTS.recs.fund_ics, choice: '3(c)(1) Fund' },
    x_loop: { args: [{ edge: 'Owner', at: 'northpine' }, { edge: 'Owned', at: 'fund' }], tag: true },
    x_loop_pct: { at: 'x_loop', edge: 'Percentage', field: 'percent', value: 0.2 },
    x_np_pf: { at: 'northpine', edge: 'Private Fund', tag: true },
  });
  check('3(c)(1) Count around a loop of 10% fund holdings looks through one tier, to the holder’s own holders, and settles', entryRow(loop, 'def_3c1', 'fund')?.value === 129, entryRow(loop, 'def_3c1', 'fund')?.value);
  const lt = pairRow(loop, 'def_look_through', 'inv_us', 'fund')?.value;
  check('Look-through around the same loop settles at its limit, 71.6% / (1 − 64% × 20%)', Math.abs(lt - 0.716 / (1 - 0.64 * 0.2)) < 1e-9, lt);

  // Deadlines: each tax year's Delaware tax, and one weekend rule each.
  const aivTax = taxRows(R, 'def_annual_tax', 'aiv').map(r => `${yearOf(R, r)} ${r.value?.iso}`).sort();
  check('The AIV owes Delaware annual tax for 2025, due June 1, 2026, and for 2026, due June 1, 2027', aivTax.join() === '2025 2026-06-01,2026 2027-06-01', aivTax.join());
  const amounts = taxRows(R, 'def_annual_tax_amount', 'aiv').map(r => `${yearOf(R, r)} ${r.value}`).sort();
  check('…$300 for 2025 and $400 for 2026', amounts.join() === '2025 300,2026 400', amounts.join());
  const june27 = rowsOf(R, 'def_annual_tax').filter(r => r.value?.iso === '2027-06-01');
  check('Seven Delaware annual taxes are due June 1, 2027, $2,800 in all', june27.length === 7
    && rowsOf(R, 'def_annual_tax_amount').filter(a => june27.some(d => d.at === a.at)).reduce((s, a) => s + a.value, 0) === 2800, june27.length);
  // A payment is recorded at the tax year it settles, which is entered to bear it.
  const paidAt = Object.values(R.records).filter(r => r.edge === 'Annual Tax Paid'), fundYears = paidAt.filter(r => objOf(R, R.records[r.at].args.find(a => a.edge === 'Taxpayer').at) === 'fund');
  check('Each payment is at the tax year it settled, 18 in all: Fund III’s for 2023, 2024 and 2025, paid the May after each', paidAt.length === 18 && paidAt.every(r => !R.records[r.at].computed && R.records[r.at].tag === true)
    && fundYears.map(r => `${yearOf(R, r)} ${r.value}`).sort().join() === '2023 2024-05-29,2024 2025-05-28,2025 2026-05-27', fundYears.map(r => `${yearOf(R, r)} ${r.value}`).join());
  const dues = (R, obj) => taxRows(R, 'def_annual_tax', obj).filter(r => r.value).map(r => `${yearOf(R, r)} ${r.value.iso}`).sort().join();
  check('…so a year paid owes nothing, has its amount, and agrees with the rule that it was on the register', dues(R, 'fund') === '2026 2027-06-01'
    && taxRows(R, 'def_annual_tax_amount', 'fund').filter(r => r.value).map(r => `${yearOf(R, r)} ${r.value}`).sort().join() === '2023 300,2024 300,2025 300,2026 400'
    && fundYears.every(r => R.covered[r.at]?.def === 'def_annual_tax_owed' && R.covered[r.at].agrees), dues(R, 'fund'));
  const owes = Object.keys(R.records).find(id => R.records[id].args?.some(a => a.edge === 'Taxpayer' && objOf(R, a.at) === 'aiv') && yearOf(R, R.records[id]) === 2025);
  const payAiv = withRecords({ x_aiv_2025: { args: R.records[owes].args, tag: true }, x_aiv_2025_paid: { at: 'x_aiv_2025', edge: 'Annual Tax Paid', field: 'date', value: '2026-10-26' } });
  check('Paying the AIV’s 2025 at its year settles that year alone: 2026 is still due June 1, 2027', dues(payAiv, 'aiv') === '2026 2027-06-01' && !payAiv.errors.length, dues(payAiv, 'aiv'));
  // As of the days around the payments, each year is due until it's paid: the deadlines read where they always have.
  const dueOn = day => { const { recs, definitions, names } = sampleAsOf(day); return dues(Formulas.computeState(recs, definitions, names, null), 'fund'); };
  const around = ['2024-07-01', '2025-05-27', '2025-05-28', '2026-05-26', '2026-05-27'].map(dueOn);
  check('Fund III’s tax is due a year at a time: 2024’s until May 28, 2025, then 2025’s until May 27, 2026, then 2026’s', JSON.stringify(around)
    === JSON.stringify(['2024 2025-05-30', '2024 2025-05-30,2025 2026-06-01', '2025 2026-06-01', '2025 2026-06-01,2026 2027-06-01', '2026 2027-06-01']), JSON.stringify(around));
  // A corporation's franchise tax is its Delaware tax for the year, due March 1 after it, each payment at its year.
  const blockerPaid = paidAt.filter(r => objOf(R, R.records[r.at].args.find(a => a.edge === 'Taxpayer').at) === 'blocker').map(r => `${yearOf(R, r)} ${r.value}`).sort();
  check('Fund III Blocker’s franchise tax is its Delaware tax by the year: 2023, 2024 and 2025 paid each February after, 2026 due March 1, 2027; with no amount',
    blockerPaid.join() === '2023 2024-02-27,2024 2025-02-26,2025 2026-02-24' && dues(R, 'blocker') === '2026 2027-03-01' && dues(R, 'aivblk') === '2026 2027-03-01'
    && !taxRows(R, 'def_annual_tax_amount', 'blocker').some(r => r.value) && !Object.values(R.records).some(r => /^Franchise Tax/.test(r.edge ?? '')), `${blockerPaid.join()} | ${dues(R, 'blocker')}`);
  // Paying: Formulas.pay settles the earliest year unsettled, entering the year to bear the payment, as Paid… does.

  const bad = [];
  const later = (p, stage, defs) => p.some(x => (x.id && defs.has(R.records[x.id]?.computed) && R.computed[x.id]?.stage >= stage) || (x.items && later(x.items, stage, defs)));
  for (const [id, c] of Object.entries(R.computed)) {
    const g = R.state.P.groups[R.state.P.byId.get(c.def).step];
    if (!g.loops || R.records[id].tag !== true) continue;
    looped++;
    const gr = Formulas.ground(R, id), defs = new Set(g.defs.map(d => d.id));
    if (!gr?.rows.length || later(gr.rows[0].parts, c.stage, defs)) bad.push(id);
  }
  check(`Every attestation on a loop has a ground in earlier rounds (${looped} of them)`, looped > 300 && !bad.length, bad.slice(0, 3).join(' '));
  let unfolded = 0;
  const walk = (id, depth) => {
    if (depth > 60) return false;
    unfolded++;
    const ids = [], collect = ps => ps.forEach(p => { if (p.id && R.computed[p.id]) ids.push(p.id); if (p.items) collect(p.items); });
    collect(Formulas.ground(R, id)?.rows[0]?.parts ?? []);
    return ids.every(x => walk(x, depth + 1));
  };
  check('…and unfolding Chen’s control of Halvard ends at entered records', walk(ctl('chen', 'halvard'), 0) && unfolded > 3, unfolded);
}

  const percentage = definition('def_pct', 'Percentage', { field: 'percent' }, [['Percentage', ownershipSpec]], [{ label: '', formula: '= SUM(FILTER(Owned.Investors, @ = Owner).Units) / SUM(Owned.Investors.Units)' }]);

  const names = { relations: [

// ---- Working out again ----

// Edits to the sample of every kind, chosen at random (from a fixed seed), one after another: each worked out
// again from the working-out before, as the app does, must agree with the same chart worked out from nothing,
// in every record and its order, value, stage, row and error, and the grounds of every seventh computed record.
function workedOutAgain() {
  const { definitions: defs, names } = SAMPLE_INPUTS;
  let seed = 46, recs = SAMPLE_INPUTS.recs, before = Formulas.computeState(recs, defs, names, null), k = 0;
  const rand = () => (seed = (seed * 1103515245 + 12345) % 2147483648) / 2147483648;
  const pick = xs => xs[Math.floor(rand() * xs.length)], ids = (r, f) => Object.keys(r).filter(x => f(r[x]));
  const pct = () => Math.round(rand() * 100) / 100, set = (r, id, change) => id && { ...r, [id]: { ...r[id], ...change } };
  const ruleOut = def => r => { const c = pick(Object.keys(before.computed).filter(x => before.computed[x].def === def)); return c && { ...r, [`rnd${k}`]: { args: before.records[c].args, tag: false } }; };
  const gone = (r, id) => { const out = Tree.dependents(r, [id]); return Object.fromEntries(Object.entries(r).filter(([x]) => !out.has(x))); };
  const kinds = [
    r => set(r, pick(ids(r, x => x.edge === 'Percentage')), { value: pct() }),
    r => { const id = pick(ids(r, x => 'tag' in x)); return set(r, id, { tag: !r[id].tag }); },
    r => set(r, pick(ids(r, x => x.edge === 'Entity Type')), { choice: pick(['Limited Partnership', 'Limited Liability Company', 'Corporation']) }),
    r => set(r, pick(ids(r, x => x.edge === 'Investment Company Status')), { choice: pick(['3(c)(7) Fund', 'Business Development Company', '3(c)(1) Fund']) }),
    r => { const id = pick(ids(r, x => x.edge === 'Name')); return set(r, id, { value: `${r[id].value} II` }); },
    r => { const own = pick(ids(r, x => x.tag && x.args?.some(a => a.edge === 'Owner'))); return own && { ...r, [`rnd${k}`]: { at: own, edge: 'Voting Percentage', field: 'percent', value: pct() } }; },
    r => { const ents = ids(r, x => x.kind === 'Entity'), a = pick(ents), b = pick(ents); return a !== b && { ...r, [`rnd${k}`]: { args: [{ edge: 'Owner', at: a }, { edge: 'Owned', at: b }], tag: true },
      [`rnd${k}p`]: { at: `rnd${k}`, edge: 'Percentage', field: 'percent', value: pct() } }; },
    r => gone(r, pick(ids(r, x => x.args?.some(a => a.edge === 'Owner')))),
    r => { const id = `rnd${k}`; return { ...r, [id]: { kind: 'Entity' }, [`${id}n`]: { at: id, edge: 'Name', field: 'text', value: `Random Holdings ${k}, LLC` },
      [`${id}o`]: { args: [{ edge: 'Owner', at: pick(ids(r, x => x.kind === 'Entity')) }, { edge: 'Owned', at: id }], tag: true }, [`${id}p`]: { at: `${id}o`, edge: 'Percentage', field: 'percent', value: 0.6 } }; },
    r => gone(r, pick(ids(r, x => x.kind === 'Entity'))),
    ruleOut('def_control'), ruleOut('def_affiliated'),
  ];
  const said = R => JSON.stringify([Object.entries(R.records), R.computed, R.covered, R.errors, R.rows, R.keptAside]);
  const differ = [];
  let edits = 0, again = 0;
  for (; k < 60; k++) {
    const r = pick(kinds)(recs);
    if (!r) continue;
    const A = Formulas.computeState(r, defs, names, before), B = Formulas.computeState(r, defs, names, null);
    edits++;
    again += A.steps.some(s => s.live !== undefined);
    if (said(A) !== said(B) || Object.keys(B.computed).some((id, i) => i % 7 === 0 && JSON.stringify(Formulas.ground(A, id)) !== JSON.stringify(Formulas.ground(B, id)))) differ.push(k);
    recs = r;
    before = A;
  }
  check(`Random edits to the sample, each worked out again from the last, agree with the chart worked out from nothing`, edits > 40 && !differ.length,
    `${edits} edits, ${differ.length ? `edit ${differ.join(', ')} differ` : 'none differ'}`);
  check('…most of them working a group out again, not from nothing', again > edits / 2, `${again} of ${edits}`);
}

// ---- Renaming, text, and what a definition uses ----

function renaming() {
  const C = 'calder-ridge', DAY = '2026-10-26', ownership = { args: [{ edge: 'Owner', loc: {} }, { edge: 'Owned', loc: {} }] };
  const worked = wb => { const N = wb.notes(C), S = wb.schema(C); return Formulas.computeState(wb.asOf(C, DAY), N.definitions(S), { relations: N.relations(S) }); };
  const before = worked(Log.open(SAMPLE));
  const rows = wb => wb.notes(C).notes('Formula').flatMap(n => n.value.map(r => r.formula));
  const renamed = (f, from) => { const wb = Log.open(SAMPLE), tx = wb.edit({ chart: C, who: 'Dana Jordan' }); f(tx); const c = tx.commit(); return { wb, c, R: worked(wb), cited: rows(wb).filter(t => t.includes(from)).length }; };
  const list = renamed(tx => tx.note('Name', ownership, 'Investments', { param: 'Owned' }), 'Holdings');
  check('Renaming a list renames it in every formula that cites it, in one change', typeof list.c === 'object' && list.cited === 0
    && rows(list.wb).some(t => t.includes('Investor.Investments')) && list.R.errors.length === before.errors.length && Object.keys(list.R.computed).length === Object.keys(before.computed).length,
    `${list.R.errors.length} errors, ${Object.keys(list.R.computed).length} computed`);
  const rel = renamed(tx => tx.note('Name', ownership, 'Holding'), 'Ownership(');
  check('…as does renaming a relation', rel.cited === 0 && rows(rel.wb).some(t => t.includes('Holding(')) && Object.keys(rel.R.computed).length === Object.keys(before.computed).length);
  const entry = renamed(tx => tx.rename({ args: [{ edge: 'Percentage', loc: ownership }] }, 'Percentage', 'Share'), '.Percentage');
  check('…and renaming an entry’s label', entry.cited === 0 && Object.keys(entry.R.computed).length === Object.keys(before.computed).length && entry.R.errors.length === before.errors.length);
  const at = text => Formulas.text(before, Formulas.evaluateAt(before, text, null, { '@AsOf': { t: 'date', iso: '2026-10-26' } }));
  check('TEXT sets a date and a number as Excel does, and @AsOf is the day given', at('="As of " & TEXT(@AsOf, "mmmm d, yyyy")') === 'As of October 26, 2026'
    && at('=TEXT(0.716, "0.0%")') === '71.6%' && at('=TEXT(1234.5, "$#,##0")') === '$1,235' && at('=TEXT(@AsOf, "mmm d")') === 'Oct 26', at('=TEXT(1234.5, "$#,##0")'));
  check('What each definition uses', before.uses.def_look_through?.includes('def_look_through') === false && before.uses.def_close?.includes('def_affiliated'), JSON.stringify(before.uses.def_close));
}

function runAll() {
  for (const f of [theSample, semantics, grounds, apis, testDefinitions, enteredAtComputed, orderDoesNotMatter, listedFirst, workedOutAgain, renaming]) {
    try { f(); } catch (e) { check(`${f.name} stopped`, false, `${e.message} ${e.stack.split('\n')[1]}`); }
  }
  const failed = out.filter(x => !x.ok).length;
  document.title = `engine test: ${out.length - failed} pass, ${failed} fail`;
  document.getElementById('out').innerHTML = `${esc(document.title)}\n\n` + [...out.filter(x => !x.ok), ...out.filter(x => x.ok)].map(x =>
    `<span class="${x.ok ? '' : 'fail'}">${x.ok ? 'PASS' : 'FAIL'}  ${esc(x.name)}${x.detail ? `  [${esc(x.detail)}]` : ''}</span>`).join('\n');
}

try { runAll(); } catch (e) { document.title = 'engine test: stopped'; document.getElementById('out').textContent = `${e.message}\n${e.stack}`; }
</script>

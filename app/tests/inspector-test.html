<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dendra inspector test</title>
<script>
  // ?theme=dark or light; ?wide widens the inspector; ?run runs the checks below, which edit the sample in memory.
  const Q = new URLSearchParams(location.search);
  document.documentElement.dataset.theme = Q.get('theme') || 'light';
  try { localStorage.clear(); localStorage.setItem('dendra.toured', '1'); localStorage.setItem('dendra.name', 'Dana Jordan'); } catch {}
</script>
<link rel="stylesheet" href="../../vendor/codemirror/codemirror.css">
<link rel="stylesheet" href="../../vendor/codemirror/show-hint.css">

<link rel="stylesheet" href="../css/inspector.css">

<style>
  .results { position: absolute; inset: 0; overflow: auto; padding: 20px 24px; font: 12px/18px var(--mono); color: var(--ink-2); }
  .results .fail { color: var(--no); }
  .results b { color: var(--ink); font-weight: 500; }
</style>
</head>
<body>
<div id="app"></div>
<script src="../../vendor/preact/preact.min.umd.js"></script>
<script src="../../vendor/preact/hooks.umd.js"></script>
<script src="../../vendor/htm/htm.umd.js"></script>
<script src="../../vendor/signals/signals-core.min.js"></script>
<script src="../../vendor/signals/signals.min.js"></script>
<script src="../../vendor/floating-ui/floating-ui.core.umd.min.js"></script>
<script src="../../vendor/floating-ui/floating-ui.dom.umd.min.js"></script>
<script src="../../vendor/tinykeys/tinykeys.umd.js"></script>
<script src="../../vendor/ufuzzy/uFuzzy.iife.min.js"></script>
<script src="../../vendor/msal/msal-browser.min.js"></script>
<script src="../../vendor/elkjs/elk.bundled.js"></script>
<script src="../../vendor/codemirror/codemirror.js"></script>
<script src="../../vendor/codemirror/simple.js"></script>
<script src="../../vendor/codemirror/show-hint.js"></script>
<script src="../../vendor/codemirror/lint.js"></script>

<script src="../core/notes.js"></script>

<script src="../core/sharepoint.js"></script>
<script>
// The workbook opened at once, in memory: Store keeps it in IndexedDB, which this page leaves alone.
const Store = { open: () => Promise.resolve(Log.open(SAMPLE)), who: () => localStorage.getItem('dendra.name'), status: () => ({ text: '' }), subscribe: () => () => {},
  books: () => Promise.resolve([]), where: () => null };
</script>
<script src="../sample/calder-ridge.js"></script>
<script src="../ui/shell.js"></script>
<script src="../ui/app.js"></script>
<script src="../ui/time.js"></script>
<script src="../core/layout.js"></script>
<script src="../core/scene.js"></script>
<script src="../ui/inspector.js"></script>
<script src="../ui/formulabar.js"></script>
<script>
// ?wide widens the inspector; ?y=… scrolls it, for looking at.
if (Q.has('wide')) addEventListener('DOMContentLoaded', () => setTimeout(Shell.widen, 0));
if (Q.has('y')) Shell.ready.then(() => setTimeout(() => { document.querySelector('.inspector').scrollTop = +Q.get('y'); }, 200));

// ---- The checks: each drives the inspector as a person would, then reads the log ----
const results = [], check = (name, ok, detail = '') => results.push({ name, ok: !!ok, detail });
const tick = (ms = 30) => new Promise(r => setTimeout(r, ms));
const $ = s => document.querySelector('.inspector ' + s), $$ = s => [...document.querySelectorAll('.inspector ' + s)];
// What an element says, its no-break spaces, which bind a name's suffix and numerals, as spaces.
const spoken = el => el.textContent.replace(/\s/g, ' ');
const rowOf = label =>$$('.row').find(r => r.querySelector(':scope > .k')?.textContent.trim() === label);
const st = () => App.state.value, last = () => App.wb.changes().at(-1);
const N = () => App.notes.value;
const key = (el, k, o = {}) => el.dispatchEvent(new KeyboardEvent('keydown', { key: k, bubbles: true, ...o }));
const type = async (el, text) => { el.focus(); await tick(); el.value = text; el.dispatchEvent(new Event('input', { bubbles: true })); await tick(); key(el, 'Enter'); await tick(); };
const pick = async label => { const it = [...document.querySelectorAll('.float .menu-item')].find(x => x.querySelector('.label').textContent === label); it?.click(); await tick(); return !!it; };

async function run() {
  while (!App.chart.value) await tick(50);
  const C = App.chart.value, n0 = App.wb.changes().length;
  Shell.select(['fund']); await tick();
  check('a record shows its name and path', Tree.clean($('.ih .cell')?.value) === 'Calder Ridge Capital Partners III, L.P.' && $('.ih .path')?.textContent.includes('Entity'), $('.ih')?.textContent);
  check('… its suffix kept to it, as the chart sets it, and its lines balanced', $('.ih .cell').value.endsWith('III,\u00a0L.P.') && getComputedStyle($('.ih .cell')).textWrap.includes('balance'), JSON.stringify($('.ih .cell').value));
  check('entries follow Order, with Name as the title', $$('.rows > .ent > .row > .k').slice(0, 3).map(k => k.textContent.trim()).join() === 'Short Name,Vehicle Type,Entity Type', $$('.rows > .ent > .row > .k').slice(0, 3).map(k => k.textContent.trim()).join());
  check('entries at entries show below them', !!rowOf('Tax Classification') && rowOf('Tax Classification').style.getPropertyValue('--depth') === '1');
  const lei = rowOf('LEI Registered'), parts = el => [...el.children].filter(c => !c.matches('.grip'));
  check('a tag is a checkbox row: its box, then its name, its entries beneath it', lei?.classList.contains('chk') && !!parts(lei)[0].querySelector('.tag') && parts(lei)[1].matches('.k')
    && !rowOf('EIN').classList.contains('chk') && rowOf('Last Renewed')?.style.getPropertyValue('--depth') === '1');
  const box = el => el.getBoundingClientRect(), over = r => box(r.querySelector(':scope > .v')).top >= box(r.querySelector(':scope > .k')).bottom - 1;
  const beside = r => { const k = box(r.querySelector(':scope > .k')), v = box(r.querySelector(':scope > .v')); return (v.left >= k.right || v.right <= k.left) && Math.abs(v.top - k.top) < 2; };
  document.querySelector('.main').style.setProperty('--insp', '320px'); await tick(60);
  check('narrow, a row sets its label over its value, and a tag stays a checkbox row', over(rowOf('EIN')) && over(rowOf('Formation Date')) && beside(rowOf('LEI Registered')));
  document.querySelector('.main').style.setProperty('--insp', '384px'); await tick(60);
  check('… and wide, beside it', beside(rowOf('EIN')) && beside(rowOf('Investment Company Status')));
  const labels = $$('.rows .row:not(.chk) > .k:not(.wide)'), ics = rowOf('Investment Company Status').querySelector(':scope > .k');
  check('… its labels in a column as wide as the longest, so none wraps, and every value starts at one edge', labels.every(k => box(k).height <= 28) && box(ics).right - box(ics).left >= ics.scrollWidth - 1
    && new Set($$('.rows .row:not(.chk) > .v').map(v => Math.round(box(v).left))).size === 1, labels.filter(k => box(k).height > 28).map(k => k.textContent).join(', '));
  document.querySelector('.main').style.removeProperty('--insp'); await tick(60);
  const chev = rowOf('Vehicle Type').querySelector('.sel');
  check('a choice’s chevron follows its last word', getComputedStyle(chev, '::after').content === 'none' && getComputedStyle(chev.querySelector('span'), '::after').content !== 'none');
  const title = $('.ih .cell'), changes = App.wb.changes().length;
  await type(title, '');
  check('clearing a record’s title keeps its Name, and puts the title back', st().fund_name?.value === 'Calder Ridge Capital Partners III, L.P.' && Tree.clean($('.ih .cell').value) === st().fund_name.value && App.wb.changes().length === changes,
    `${JSON.stringify(st().fund_name)} ${$('.ih .cell').value}`);

  // Typing a value
  await type(rowOf('EIN').querySelector('.cell'), '92-4810338');
  check('typing a value corrects it', st().fund_ein?.value === '92-4810338' && last().adds.some(r => r.record === 'fund_ein'), st().fund_ein?.value);
  await type(rowOf('Formation Date').querySelector('input'), '3/1/2023');
  check('a date typed any way is kept as a day', st().fund_formed?.value === '2023-03-01', st().fund_formed?.value);
  const bad = rowOf('Target Commitments').querySelector('input'); await type(bad, 'lots');
  check('a value its datatype can’t read stays, marked, and changes nothing', bad.getAttribute('aria-invalid') === 'true' && st().fund_target.value === 750000000);
  key(bad, 'Escape'); await tick();

  // Typing over a value as in Excel: focused, it's selected whole; Enter keeps it and goes down; Ctrl+Z is then
  // the window's Undo, and a field never shows other than its record but while it's typed
  const einCell = rowOf('EIN').querySelector('.cell'), was0 = st().fund_ein.value;
  einCell.focus(); await tick();
  check('focusing a value selects it whole, so typing replaces it', einCell.selectionStart === 0 && einCell.selectionEnd === einCell.value.length && einCell.value.length > 0);
  einCell.value = '11-1111111'; einCell.dispatchEvent(new Event('input', { bubbles: true })); await tick();
  key(einCell, 'Enter'); await tick();
  const leiCell = rowOf('LEI').querySelector('.cell');
  check('Enter keeps it and goes down to the next value, selected', st().fund_ein.value === '11-1111111' && document.activeElement === leiCell && leiCell.selectionEnd === leiCell.value.length,
    document.activeElement?.getAttribute('aria-label'));
  key(leiCell, 'z', { ctrlKey: true }); await tick(60);
  check('… where Ctrl+Z undoes the change, and the field shows the record again', st().fund_ein.value === was0 && rowOf('EIN').querySelector('.cell').value === was0 && !$('.cell.add')
    && document.querySelector('.toast')?.textContent.startsWith('Undid'), `${st().fund_ein.value} ${rowOf('EIN').querySelector('.cell').value}`);
  key(leiCell, 'y', { ctrlKey: true }); await tick(60);
  check('… and Ctrl+Y redoes it', st().fund_ein.value === '11-1111111');
  Shell.parts.value.undo.undo(); await tick(60);
  const typedOver = rowOf('EIN').querySelector('.cell');
  typedOver.focus(); typedOver.value = '5'; typedOver.dispatchEvent(new Event('input', { bubbles: true })); await tick();
  const kept = App.wb.changes().length;
  key(typedOver, 'z', { ctrlKey: true }); await tick();
  check('… but while a value is typed, Ctrl+Z is the field’s own', App.wb.changes().length === kept && st().fund_ein.value === was0);
  key(typedOver, 'Escape'); await tick();

  // Flipping a tag
  const erisa = rowOf('ERISA Plan Assets').querySelector('.tag');
  check('a ruled-out tag is red and crossed', erisa.classList.contains('no'));
  erisa.dispatchEvent(new PointerEvent('pointerenter')); await tick();
  const pend = FormulaBar.pending.peek();
  check('hovering a tag previews the other state, and the bar redlines what it would change', erisa.classList.contains('yes') && erisa.classList.contains('peek')
    && pend?.change.records.fund_erisa?.tag === true && pend.diff.change.includes('fund_erisa'), JSON.stringify(pend?.change));
  erisa.dispatchEvent(new PointerEvent('pointerleave')); await tick();
  check('… and leaving it ends the redline', !FormulaBar.pending.peek());
  erisa.click(); await tick();
  check('clicking a tag switches it', st().fund_erisa.tag === true);

  // A choice from its dropdown
  rowOf('Investment Company Status').querySelector('.sel').click(); await tick();
  const opts = [...document.querySelectorAll('.float .menu-item .label')].map(x => x.textContent);
  check('a choice’s dropdown lists its options and New option', opts.includes('3(c)(7) Fund') && opts.at(-1) === 'New option', opts.join(', '));
  await pick('Business Development Company');
  check('choosing an option sets it', st().fund_ics.choice === 'Business Development Company', st().fund_ics.choice);

  // Computed values: italic; typing over one enters it, and clearing that lets the formula stand. The U.S.
  // investors' limited partnership interest carries no vote by default; one that can remove the GP may.
  const whys = [], offWhy = Shell.on('why-open', d => whys.push(d));
  Shell.select(['own_us_fund']); await tick();
  const count = () => Object.entries(st()).find(([, r]) => r.at === 'own_us_fund' && r.edge === 'Voting Percentage');
  const cnt = rowOf('Voting Percentage').querySelector('input'), was = count();
  check('a computed value is italic', cnt.classList.contains('fx') && App.computed.value.computed[was[0]]);
  await type(cnt, '10%');
  check('clicking a computed value asks why', whys.includes(was[0]));
  check('typing over a computed value enters it, with an amber corner', count()[1].value === 0.1 && !App.computed.value.computed[count()[0]] && !!rowOf('Voting Percentage').querySelector('.hug.over'));
  await type(rowOf('Voting Percentage').querySelector('input'), '');
  check('clearing an entered value lets the formula stand', count()[1].value === was[1].value && !!App.computed.value.computed[count()[0]], JSON.stringify(count()));
  // An entry saying what the formula gives overrides nothing: it has no corner, as a paid tax year has none.
  const agree = Object.keys(App.computed.value.covered).find(id => App.computed.value.covered[id].agrees && st()[id]?.args);
  Shell.select([agree]); await tick(60);
  check('… an entry that says what its formula gives has no amber corner', !!agree && !$$('.insp .over').length && !$$('.fx-out.over').length, agree);
  Shell.select(['own_us_fund']); await tick();
  offWhy();
  Shell.select(['fund']); await tick();

  // Adding an entry, with its specification
  $('.add-entry').click(); await tick();
  await pick('Tag');
  await type($('.draft input'), 'Side Letters');
  const added = Object.entries(st()).find(([, r]) => r.at === 'fund' && r.edge === 'Side Letters');
  check('adding a tag records it attested, with its specification', added && added[1].tag === true && last().adds.some(r => 'spec' in r));
  $('.add-entry').click(); await tick();
  await pick('Value');
  await type($('.draft input'), 'Closing Date');
  await type($('.draft .v input'), 'June 30, 2024');
  const field = Object.values(st()).find(r => r.at === 'fund' && r.edge === 'Closing Date');
  check('adding a field reads its datatype from its value', field?.field === 'date' && field.value === '2024-06-30', JSON.stringify(field));

  // Reordering by dragging
  const ein = rowOf('EIN'), short = rowOf('Short Name'), g = ein.querySelector('.grip');
  const at = el => el.getBoundingClientRect().top + 4;
  g.dispatchEvent(new PointerEvent('pointerdown', { bubbles: true, button: 0, clientY: at(ein), pointerId: 1 }));
  dispatchEvent(new PointerEvent('pointermove', { clientY: at(ein) - 10 }));
  dispatchEvent(new PointerEvent('pointermove', { clientY: at(short) }));
  dispatchEvent(new PointerEvent('pointerup', { clientY: at(short) })); await tick();
  check('dragging an entry reorders it, by Order', N().order(Tree.treeOf(st(), 'fund_ein')) === 1 && $$('.rows > .ent > .row > .k')[0].textContent.trim() === 'EIN',
    $$('.rows > .ent > .row > .k').slice(0, 3).map(k => k.textContent.trim()).join());

  // Deleting never asks, and undoes
  rowOf('Fiscal Year End').querySelector('.grip').dispatchEvent(new PointerEvent('pointerdown', { bubbles: true, button: 0, clientY: 0 }));
  dispatchEvent(new PointerEvent('pointerup', { clientY: 0 })); await tick();
  await pick('Delete');
  check('deleting removes it at once, with a toast to undo', !st().fund_fye && document.querySelector('.toast')?.textContent.includes('Deleted Fiscal Year End'));
  document.querySelector('.toast button').click(); await tick();
  check('Undo brings it back', !!st().fund_fye);

  // Relatives by list
  check('relatives show by list, each a link', $$('.sect > .fold').map(s => s.textContent).includes('Owners') && $$('.row.rel .k .lk').some(a => a.textContent === 'Offshore Feeder'));
  $$('.row.rel .k .lk').find(a => a.textContent === 'Offshore Feeder').click(); await tick();
  check('a relative’s link selects it', Shell.selection.value[0] === 'feeder');

  // The look: by where it comes from, said once; colors by PowerPoint's names (the format bar's, here a
  // stand-in where it's missing), a code only for one of the user's own; sizes as the slide has them
  const fb = typeof FormatBar === 'undefined' ? (globalThis.FormatBar = {}) : FormatBar, ownName = fb.colorName;
  fb.colorName ??= hex => ({ '#dae3f3': 'Blue, Accent 1, Lighter 80%' })[hex.toLowerCase()] ?? null;
  App.change(tx => tx.note('Fill', Tree.treeOf(st(), 'fund'), '#123456', { view: Shell.view.peek() })); Shell.select(['fund']); await tick(60);
  const looks = () => { const sec = $$('section').find(s => s.querySelector('.fold')?.textContent === 'Look'); return sec ? [...sec.querySelectorAll('.row')].map(r => r.textContent.trim()) : []; };
  check('the look says where each property comes from once, this box’s own first, a color of one’s own by its code', looks()[0] === 'This box' && looks()[1] === 'Fill#123456'
    && looks().includes('Entity Type: Limited partnership') && !$('.from'), looks().join(' | '));
  Shell.parts.value.undo.undo(); await tick(60);
  check('… and a theme color by its name', looks().includes('Vehicle Type: Funds') && looks().includes('FillBlue, Accent 1, Lighter 80%'), looks().join(' | '));
  if (!ownName) delete fb.colorName;
  // A line's text, by what it shows: a tag's is its name, a value's its value, or its name and value
  const gp = App.scene.peek().marks.find(m => m.type === 'line' && st()[m.record]?.args && N().nameOf(st(), m.record) === 'General Partner')?.record;
  Shell.select([gp]); await tick(60);
  const lookRows = () => $$('section').find(s => s.querySelector('.fold')?.textContent === 'Look')?.querySelectorAll('.row:not(.src)') ?? [];
  check('a line’s Look says what its text shows, never “Label: Label”', looks().includes('TextName') && ![...lookRows()].some(r => r.querySelector('.k')?.textContent === r.querySelector('.v')?.textContent), looks().join(' | '));
  App.change(tx => tx.note('Format', Tree.treeOf(st(), gp), 'none', { view: Shell.view.peek() })); await tick(60);
  check('… and none where it shows none', looks().includes('TextNone'), looks().join(' | '));
  Shell.parts.value.undo.undo(); await tick(60);

  // Pasting a link
  Shell.select(['blocker']); await tick();
  const dt = new DataTransfer(); dt.setData('text/plain', 'https://contoso.sharepoint.com/sites/FundLegal/Shared%20Documents/Blocker%20Consent.pdf');
  document.body.dispatchEvent(new ClipboardEvent('paste', { clipboardData: dt, bubbles: true, cancelable: true })); await tick();
  const doc = Object.entries(st()).find(([, r]) => r.edge === 'Link' && r.value.endsWith('Blocker%20Consent.pdf'));
  check('pasting a link links a document', doc && Object.values(st()).some(r => r.args?.some(a => a.at === doc[1].at) && r.args.some(a => a.at === 'blocker')), $$('section .row.rel .k .lk').map(a => a.textContent).join(' | '));

  // Two boxes
  Shell.emit('relate-open', ['blocker', 'bdc']); await tick();
  check('two boxes say what holds between them, each as a sentence', $$('.rr .nm').some(x => spoken(x) === 'Fund III Blocker is a close affiliate of the BDC'), $$('.rr .nm').map(x => x.textContent).join(', '));
  // Why a formula gives each is the formula bar's reason, cited in full (here a stand-in where the bar's is missing)
  const ownReason = FormulaBar.reason;
  FormulaBar.reason ??= id => App.computed.peek().computed[id] ? { label: App.computed.peek().computed[id].label, cite: `§57(${id.length})`, words: '' } : null;
  Shell.select([]); await tick(); Shell.emit('relate-open', ['blocker', 'bdc']); await tick();
  const given = $$('.rr[data-key]').filter(r => r.querySelector('.why'));
  check('… why a formula gives one, as the formula bar gives it', given.length > 0 && given.every(r => r.querySelector('.why').textContent === FormulaBar.reason(r.dataset.key).cite),
    given.map(r => r.querySelector('.why').textContent).join(' | '));
  Shell.select(['chen']); await tick(60);
  [...$$('.sect > .fold')].find(f => f.textContent === 'Affiliated Person Of')?.click(); await tick(60);
  const roles = $$('.row.rel .v .lk.fx').map(x => x.textContent);
  check('… and so does a relative’s caption', roles.length > 3 && roles.every(t => t.startsWith('§')), roles.slice(0, 4).join(' | '));
  if (!ownReason) delete FormulaBar.reason;
  Shell.emit('relate-open', ['blocker', 'bdc']); await tick();
  const ghost = label => $$('.rr .add-entry').find(b => b.textContent === label);
  check('… where something holds, what else could is behind Add a relation, an action', !!ghost('Add a relation') && !$$('.sect > .fold').some(f => f.textContent === 'Add a relation'));
  ghost('Add a relation')?.click(); await tick();
  // In the formula bar's words: an owner's list of what it owns named "Investor In" says so here too
  const ownList = App.notes.peek().notes('Name').find(n => n.value === 'Ownership' && !n.param && n.pattern.args?.length === 2);
  App.change(tx => tx.note('Name', ownList.pattern, 'Investor In', { param: 'Owned' })); await tick(60);
  check('… each said in the formula bar’s words', $$('.rr .nm').some(x => spoken(x) === 'Fund III Blocker is an investor in the BDC'), $$('.rr .nm').map(x => x.textContent).join(', '));
  Shell.parts.value.undo.undo(); await tick(60);
  const rr = $$('.rr').filter(r => r.querySelector('.nm') && spoken(r.querySelector('.nm')) === 'Fund III Blocker is an owner of the BDC');
  check('… and behind Add a relation, what else could be entered, not what a formula works out', rr.length === 1 && $$('.rr .nm').some(x => / is an adviser to /.test(x.textContent))
    && !$$('.rr .nm').some(x => / is a controller of /.test(x.textContent)), $$('.rr .nm').map(x => x.textContent).join(', '));
  rr[0].querySelector('.tag').click(); await tick();
  const own = Object.entries(st()).find(([, r]) => r.args && r.tag && r.args.some(a => a.at === 'blocker') && r.args.some(a => a.at === 'bdc'));
  check('ticking one relates them', !!own, JSON.stringify(own?.[1]));
  const offered = $$('.rr-at .row > .k').map(k => k.textContent.trim()), pct = $$('.rr-at .row').find(r => r.querySelector(':scope > .k')?.textContent.trim() === 'Percentage')?.querySelector('input');
  check('… and offers its entries at once, the first to type into', offered.includes('Percentage') && offered.includes('Voting Percentage') && document.activeElement === pct, offered.join(', '));
  await type(pct, '2%');
  check('… a value typed there recorded at the relation', Object.values(st()).some(r => r.at === own?.[0] && r.edge === 'Percentage' && r.value === 0.02));
  check('… Enter going down to the next', document.activeElement?.getAttribute('aria-label') === 'Voting Percentage', document.activeElement?.outerHTML.slice(0, 120));
  key(document.activeElement, 'Enter'); await tick();
  check('… and from the last, to its row, so a key typed next is the window’s', document.activeElement?.matches('.rr-at .row') && document.activeElement.textContent.includes('Voting Percentage'), document.activeElement?.outerHTML.slice(0, 120));
  ghost('New relation').click(); await tick();
  const [nm, ra, rb] = $$('.rr.new input');
  for (const [el, v] of [[nm, 'Co-Investment Right'], [ra, 'Holder'], [rb, 'Issuer']]) { el.value = v; el.dispatchEvent(new Event('input', { bubbles: true })); await tick(10); }
  key(rb, 'Enter'); await tick();
  check('New relation makes one, and names it', Object.values(st()).some(r => r.args?.[0].edge === 'Holder' && r.args[1].at === 'bdc') && N().name({ args: [{ edge: 'Holder', loc: {} }, { edge: 'Issuer', loc: {} }] }) === 'Co-Investment Right');

  // A role is chosen in its sentence, and a relation's fields come as a form sets them: the role, then the start, then the end
  Shell.emit('relate-open', ['chen', 'halvard']); await tick(60);
  ghost('Add a relation')?.click(); await tick();
  const role = $$('.rr .nm .sel').find(b => /^Position/.test(b.getAttribute('aria-label')));
  check('a role still to choose is a dropdown in its sentence', role?.closest('.nm').textContent.includes(' is a … of '), $$('.rr .nm').map(x => x.textContent).join(' | '));
  role?.click(); await tick(); await pick('Director');
  const posFields = $$('.rr-at .row > .k').map(k => k.textContent.trim());
  check('… and chosen, its fields are offered as a form sets them, the role first and the start before the end', posFields.join() === 'Title,Start Date,End Date' && document.activeElement?.getAttribute('aria-label') === 'Title', posFields.join(', '));
  const director = $$('.rr').find(r => / is a director of Halvard/.test(r.querySelector('.nm')?.textContent));

// The Description of Affiliated Person as section 2(a)(3) of the Investment Company Act reads.
function describeAffiliated() {
  const f = N().notes('Formula').find(n => n.note === 'def_affiliated');
  const text = ['“Affiliated person” of another person means—',
    '(A) any person directly or indirectly owning, controlling, or holding with power to vote, 5 per centum or more of the outstanding voting securities of such other person;',
    '(B) any person 5 per centum or more of whose outstanding voting securities are directly or indirectly owned, controlled, or held with power to vote, by such other person;',
    '(C) any person directly or indirectly controlling, controlled by, or under common control with, such other person;',
    '(D) any officer, director, partner, copartner, or employee of such other person;',
    '(E) if such other person is an investment company, any investment adviser thereof or any member of an advisory board thereof; and',
    '(F) if such other person is an unincorporated investment company not having a board of directors, the depositor thereof.'].join('\n');
  App.change(tx => tx.note('Description', f.pattern, text));
}

function report() {
  const failed = results.filter(r => !r.ok);
  document.title = failed.length ? `FAIL ${failed.length}` : `PASS ${results.length}`;
  const out = document.createElement('div');
  out.className = 'results';
  out.innerHTML = `<b>${failed.length ? `${failed.length} of ${results.length} failed` : `All ${results.length} passed`}</b><br><br>` +
    results.map(r => `<div class="${r.ok ? '' : 'fail'}">${r.ok ? 'ok  ' : 'FAIL'} ${r.name}${r.ok || !r.detail ? '' : ` — ${String(r.detail).slice(0, 300).replace(/</g, '&lt;')}`}</div>`).join('');
  document.querySelector('.view').appendChild(out);
}
window.onerror = (m, s, l, c, e) => { results.push({ name: `error: ${m} (${(s || '').split('/').pop()}:${l})`, ok: false, detail: `after “${results.at(-1)?.name}”: ${e?.stack}` }); };
addEventListener('unhandledrejection', e => results.push({ name: `rejection: ${e.reason?.message ?? e.reason}`, ok: false, detail: `after “${results.at(-1)?.name}”: ${e.reason?.stack}` }));
// ?act=… leaves the inspector in a passing state, for looking at.
const ACTS = {
  add: () => $('.add-entry').click(),
  menu: () => { const g = rowOf('Jurisdiction').querySelector('.grip'); g.dispatchEvent(new PointerEvent('pointerdown', { bubbles: true, button: 0 })); dispatchEvent(new PointerEvent('pointerup')); },
  peek: () => rowOf('Good Standing').querySelector('.tag').dispatchEvent(new PointerEvent('pointerenter')),
  type: () => { const i = rowOf('EIN').querySelector('.cell'); i.focus(); setTimeout(() => { i.value = '92-4810999'; i.dispatchEvent(new Event('input', { bubbles: true })); }, 30); },
  choose: () => rowOf('Jurisdiction').querySelector('.sel').click(),
  draft: () => { $('.add-entry').click(); setTimeout(() => pick('Value'), 30); },
};
if (ACTS[Q.get('act')]) Shell.ready.then(() => setTimeout(ACTS[Q.get('act')], 100));
if (Q.has('run')) Shell.ready.then(() => setTimeout(() => run().catch(e => check(`threw: ${e.message}`, false, e.stack)).finally(report), 50));
</script>
</body>
</html>

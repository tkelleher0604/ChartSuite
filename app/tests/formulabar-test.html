<script>
// ---- A stand-in for the canvas, until app/ui/canvas.js lands ----
// People, entities and investor groups as boxes laid out by ELK, the relations entered between them as lines,
// and the two calls the formula bar makes: highlight, which draws what it names (computed lines too) and
// dims the rest, and redline. A click selects; shift-click adds to the selection.
const StandIn = (() => {
  // The cast of the 40 Act examples in formulas.md, so the stand-in stays legible.
  const NS = 'http://www.w3.org/2000/svg', CAST = new Set(['chen', 'okafor', 'raman', 'mgmt', 'gp', 'caygp', 'holdco', 'fund', 'feeder', 'blocker',
    'northpine', 'halvard', 'bdc', 'pension', 'inv_us', 'inv_nonus']);
  const FROM = ['owner', 'gp', 'member', 'holder', 'adviser'];
  const INK = '#1b1e1d', BLUE = '#2c4c7c', RED = '#c2372b';
  const hl = Shell.signal(null), rl = Shell.signal(null), placed = Shell.signal(null);
  let host = null, done;
  const ready = new Promise(r => { done = r; });
  // Paint goes in style, so the stand-in's own CSS doesn't cover it.
  const PAINT = new Set(['stroke', 'stroke-width', 'stroke-dasharray', 'fill']);
  const el = (tag, attrs, parent) => {
    const e = document.createElementNS(NS, tag);
    for (const [k, v] of Object.entries(attrs ?? {})) if (v != null) PAINT.has(k) ? e.style.setProperty(k, v) : e.setAttribute(k, v);
    parent?.appendChild(e);
    return e;
  };
  const wrap = s => { const out = [''], words = s.split(' '); for (const w of words) { if (out.at(-1) && (out.at(-1) + ' ' + w).length > 24) out.push(w); else out[out.length - 1] = (out.at(-1) + ' ' + w).trim(); } return out; };

  async function lay() {
    const recs = App.entered.peek(), name = id => App.notes.peek().nameOf(recs, id);
    const boxes = Object.keys(recs).filter(id => CAST.has(id));
    const drawn = new Set(boxes);
    const lines = [];
    for (const [id, r] of Object.entries(recs)) {
      if (r.args?.length !== 2) continue;
      let [a, b] = r.args.map(x => Tree.objectOf(recs, x.at));
      if (!FROM.includes(Tree.norm(r.args[0].edge))) [a, b] = [b, a];
      if (drawn.has(a) && drawn.has(b) && a !== b) lines.push({ id, a, b });
    }
    const size = id => { const ls = wrap(name(id)); return { width: Math.round(Math.max(...ls.map(l => l.length)) * 6 + 22), height: ls.length > 1 ? 40 : 28 }; };
    const out = await new ELK().layout({
      id: 'root', children: boxes.map(id => ({ id, ...size(id) })), edges: lines.map(l => ({ id: l.id, sources: [l.a], targets: [l.b] })),
      layoutOptions: { 'elk.algorithm': 'layered', 'elk.direction': 'DOWN', 'elk.edgeRouting': 'ORTHOGONAL', 'elk.spacing.nodeNode': '16',
        'elk.layered.spacing.nodeNodeBetweenLayers': '44', 'elk.layered.spacing.edgeNodeBetweenLayers': '12', 'elk.layered.spacing.edgeEdgeBetweenLayers': '8' },
    });
    placed.value = { nodes: new Map(out.children.map(c => [c.id, c])), routes: new Map(out.edges.map(e => [e.id, e.sections?.[0]])), lines, w: out.width, h: out.height };
    done();
  }

  // Where a straight line from one box's centre to another's leaves the first box.
  function rim(n, toward) {
    const cx = n.x + n.width / 2, cy = n.y + n.height / 2, dx = toward.x - cx, dy = toward.y - cy;
    const t = Math.min(Math.abs(n.width / 2 / (dx || 1e-9)), Math.abs(n.height / 2 / (dy || 1e-9)));
    return { x: cx + dx * t, y: cy + dy * t };
  }
  const centre = n => ({ x: n.x + n.width / 2, y: n.y + n.height / 2 });

  function draw() {
    const P = placed.value, H = hl.value, L = rl.value, sel = new Set(Shell.selection.value), R = App.computed.value;
    if (!host || !P) return;
    const recs = { ...R.records, ...(L?.records ?? {}) }, HUE = ['', '#1f6fa8', '#187a74', '#a3570f', '#a63a68', '#5c6a17', '#6e5a43'], C = Object.fromEntries(Object.entries(H?.colors ?? {}).map(([id, [c]]) => [id, HUE[c] ?? RED])), strong = new Set(Object.keys(H?.colors ?? {}).filter(id => H.colors[id][1] === 0));
    const appear = new Set(L?.appear ?? []), go = new Set(L?.go ?? []), changed = L?.changed ?? {};
    // An entry lights its object's box; a redlined line, its ends; a selected computed line is drawn too.
    for (const [id, c] of Object.entries(C)) if (recs[id]?.at) { const o = Tree.objectOf(recs, id); if (o && !C[o]) C[o] = c; }
    for (const id of [...appear, ...go]) for (const a of recs[id]?.args ?? []) { const o = Tree.objectOf(recs, a.at); if (o && !C[o]) C[o] = INK; }
    for (const id of sel) if (recs[id]?.computed && !C[id]) C[id] = BLUE;
    const lit = id => C[id] ?? (appear.has(id) ? BLUE : go.has(id) ? RED : null);
    const faint = id => (H?.dim || L) && !lit(id) && !sel.has(id);
    const pad = 24, svg = el('svg', { class: 'si', viewBox: `${-pad} ${-pad} ${P.w + 2 * pad} ${P.h + 2 * pad}`, preserveAspectRatio: 'xMidYMid meet' });
    const defs = el('defs', {}, svg);
    const arrow = color => { const id = 'a' + color.replace(/[^0-9a-z]/gi, ''); if (!svg.getElementById(id)) el('path', { d: 'M0 0L8 4L0 8z', fill: color }, el('marker', { id, viewBox: '0 0 8 8', refX: 7, refY: 4, markerWidth: 6, markerHeight: 6, orient: 'auto' }, defs)); return `url(#${id})`; };
    el('rect', { x: -pad, y: -pad, width: P.w + 2 * pad, height: P.h + 2 * pad, fill: '#fff' }, svg);
    const labelOf = id => {
      const r = recs[id];
      if ('choice' in r) return { id, text: r.choice };
      const pct = Object.entries(recs).find(([, x]) => x.at === id && x.field === 'percent');
      return pct ? { id: pct[0], text: Tree.format('percent', pct[1].value) } : null;
    };
    const label = (g, at, lab, color) => {
      const t = el('text', { x: at.x + 4, y: at.y + 3, class: 'lab', fill: C[lab.id] ?? color ?? null }, g);
      const ch = changed[lab.id];
      if (ch) { el('tspan', { fill: RED, 'text-decoration': 'line-through' }, t).textContent = ch.before; el('tspan', { fill: BLUE, dx: 4 }, t).textContent = ch.after; }
      else t.textContent = lab.text;
    };
    const lines = el('g', {}, svg), boxes = el('g', {}, svg), over = el('g', {}, svg);
    const shown = new Set();
    for (const l of P.lines) {
      const s = P.routes.get(l.id);
      if (!s || !recs[l.id]) continue;
      shown.add(l.id);
      const pts = [s.startPoint, ...(s.bendPoints ?? []), s.endPoint];
      const color = lit(l.id), g = el('g', { class: 'line' + (faint(l.id) ? ' faint' : ''), 'data-id': l.id }, color ? over : lines);
      const d = 'M' + pts.map(p => `${p.x} ${p.y}`).join('L');
      el('path', { class: 'l', d, stroke: color ?? (sel.has(l.id) ? BLUE : null), 'stroke-width': color ? (strong.has(l.id) ? 2.6 : 1.8) : sel.has(l.id) ? 2 : null, 'stroke-dasharray': go.has(l.id) ? '5 4' : null }, g);
      el('path', { class: 'hit', d }, g);
      const lab = labelOf(l.id), long = pts.slice(1).map((p, i) => [pts[i], p]).sort((x, y) => Math.abs(y[1].y - y[0].y) - Math.abs(x[1].y - x[0].y))[0];
      if (lab) label(g, { x: long[0].x, y: (long[0].y + long[1].y) / 2 }, lab, color);
    }
    // Lines the view doesn't draw, while the bar names them, or the redline does: computed ones, dashed.
    for (const id of new Set([...Object.keys(C), ...appear, ...go])) {
      const r = recs[id];
      if (shown.has(id) || r?.args?.length !== 2) continue;
      const [a, b] = r.args.map(x => P.nodes.get(Tree.objectOf(recs, x.at)));
      if (!a || !b || a === b) continue;
      const color = lit(id), p = rim(a, centre(b)), q = rim(b, centre(a)), mx = (p.x + q.x) / 2, my = (p.y + q.y) / 2;
      const nx = -(q.y - p.y), ny = q.x - p.x, k = 0.18, c = { x: mx + nx * k, y: my + ny * k };
      const g = el('g', { class: 'line', 'data-id': id }, over);
      const d = `M${p.x} ${p.y}Q${c.x} ${c.y} ${q.x} ${q.y}`;
      el('path', { class: 'l', d, stroke: color, 'stroke-width': strong.has(id) ? 2.4 : 1.6, 'stroke-dasharray': '6 4', 'marker-end': arrow(color) }, g);
      el('path', { class: 'hit', d }, g);
      if (go.has(id)) { const x = (p.x + 2 * c.x + q.x) / 4, y = (p.y + 2 * c.y + q.y) / 4; el('path', { d: `M${x - 5} ${y - 5}l10 10m0-10l-10 10`, stroke: RED, 'stroke-width': 1.8 }, g); }
    }
    for (const [id, n] of P.nodes) {
      const color = lit(id), g = el('g', { class: 'box' + (faint(id) ? ' faint' : ''), 'data-id': id, transform: `translate(${n.x} ${n.y})` }, boxes);
      el('rect', { width: n.width, height: n.height, rx: 2, stroke: color ?? (sel.has(id) ? BLUE : null), 'stroke-width': color ? (strong.has(id) ? 2.4 : 1.6) : sel.has(id) ? 2 : null }, g);
      const ls = wrap(App.notes.peek().nameOf(recs, id));
      ls.forEach((t, i) => { el('text', { x: n.width / 2, y: n.height / 2 + (i - (ls.length - 1) / 2) * 13 + 4, 'text-anchor': 'middle' }, g).textContent = t; });
    }
    host.replaceChildren(svg);
  }

  function click(e) {
    const hit = e.target.closest?.('[data-id]'), sel = Shell.selection.peek();
    if (!hit) return Shell.select([]);
    const id = hit.dataset.id;
    Shell.select(e.shiftKey ? [...sel.filter(x => x !== id), id] : [id]);
  }

  Shell.effect(() => { if (Object.keys(App.entered.value).length && !placed.peek()) lay(); });
  Shell.effect(draw);
  return {
    ready,
    mount(el) { host = el; host.addEventListener('pointerdown', click); draw(); return () => { host = null; }; },
    highlight(colors, o) { hl.value = colors ? { colors, ...o } : null; },
    redline(r) { rl.value = r; },
    point(on) { this.pointing = on; },
    placed, hl, rl,
  };
})();
if (!Shell.parts.peek().canvas) Shell.register('canvas', StandIn);

// ---- Cases, each set up for a screenshot ----
const q = new URLSearchParams(location.search);
const wait = ms => new Promise(r => setTimeout(r, ms));
const CLOSE_NP = 'fx:bdc=bdc_ics&close affiliate=northpine', AP_NP_CHEN = 'fx:affiliate=northpine&person=chen', OKAFOR_GP = 'fx:controlled=gp&controller=okafor';
const REMOTE_NS = 'fx:bdc=bdc_ics&remote affiliate=pension', CLOSE_BLK = 'fx:bdc=bdc_ics&close affiliate=blocker';
async function ready() {
  for (let i = 0; i < 400 && !Object.keys(App.entered.peek()).length; i++) await wait(10);
  await StandIn.ready;
  await wait(60);
}
const cmOf = key => document.querySelector(`.fxbar [data-key="${key}"] .CodeMirror`)?.CodeMirror;
// The definition's rows, opened over the view by the chevron, which keeps them open.
async function openRows() { if (!FormulaBar.open.peek()) { document.querySelector('.fx-open').click(); await wait(30); } }
const citedKey = () => FormulaBar.model.peek().rows.find(r => r.cited).key;
// The pointer over the n-th occurrence of some text in a row's formula.
function hoverOn(key, text, n = 0) {
  const cm = cmOf(key), v = cm.getValue();
  let i = -1;
  for (let k = 0; k <= n; k++) i = v.indexOf(text, i + 1);
  const p = cm.charCoords(cm.posFromIndex(i), 'window');
  cm.getWrapperElement().dispatchEvent(new MouseEvent('mousemove', { clientX: p.left + 2, clientY: (p.top + p.bottom) / 2, bubbles: true }));
}
// Typing into a row: the cursor after some text, then the text typed.
function typeIn(key, after, text, replace = 0) {
  const cm = cmOf(key), i = cm.getValue().indexOf(after) + after.length;
  cm.focus();
  cm.setCursor(cm.posFromIndex(i));
  cm.replaceRange(text, cm.posFromIndex(i), cm.posFromIndex(i + replace), '+input');
}
// An ownership loop that multiplies to 100%, the blocker owning all of the fund that owns all of it, which
// the look-through can't settle.
function makeLoop() {
  App.change(tx => {
    const own = tx.add('record', { args: [{ edge: 'Owner', at: 'blocker' }, { edge: 'Owned', at: 'fund' }], tag: true });
    tx.add('record', { at: own, edge: 'Percentage', field: 'percent', value: 1 });
  });
  return App.computed.peek().errors.find(e => e.error.code === '#CIRCULAR!' && e.def === 'def_look_through' && e.id && e.args?.some(a => a.at === 'fund'))
    ?? App.computed.peek().errors.find(e => e.error.code === '#CIRCULAR!');
}

const cases = {
  async close() { Shell.select([CLOSE_NP]); },
  async hover() { Shell.select([CLOSE_NP]); await wait(80); await openRows(); hoverOn(citedKey(), '@'); },
  async hoverlist() { Shell.select([CLOSE_NP]); await wait(80); await openRows(); hoverOn(citedKey(), 'Personnel'); },
  async step() { Shell.select([CLOSE_NP]); await wait(80); Shell.emit('why-open', AP_NP_CHEN); },
  async rows() { Shell.select([CLOSE_NP]); await wait(80); await openRows(); },
  async type() { Shell.select([OKAFOR_GP]); await wait(80); await openRows(); typeIn('r2', '> ', '6', 1); },
  async tag() { Shell.select([OKAFOR_GP]); await wait(80); document.querySelector('.fx-out .tag').dispatchEvent(new PointerEvent('pointerenter')); },
  async value() {
    Shell.select(['own_okfr_gp_pct']); await wait(80);
    const i = document.querySelector('.fx-value'); i.focus(); i.value = '20%'; i.dispatchEvent(new Event('input', { bubbles: true }));
  },
  async whynot() { Shell.select(['pension', 'bdc']); await wait(80); await openRows(); hoverOn('r1', 'Personnel'); },
  async override() { Shell.select(['bdc_tax']); },
  async circular() { const e = makeLoop(); await wait(30); Shell.select([e.id]); },
  async point() {
    Shell.select([OKAFOR_GP]); await wait(80); await openRows();
    typeIn('r2', '> 25%', ' AND ');
    await wait(30);
    FormulaBar.point('own_okfr_gp');
  },
  async delete() { Shell.select([OKAFOR_GP]); await wait(80); await openRows(); document.querySelector('.fxbar [data-key="r3"] .fx-x').dispatchEvent(new PointerEvent('pointerenter')); },
};

// ---- Checks ----
const results = [];
const check = (name, ok, detail = '') => results.push({ name, ok: !!ok, detail: String(detail ?? '') });
async function checks() {
  const M = () => FormulaBar.model.peek(), F = () => FormulaBar.finder.peek(), R = () => App.computed.peek();
  check('the bar reads App.computed', R().records[CLOSE_NP] && R().computed[CLOSE_NP]?.def === 'def_close');

  Shell.select([CLOSE_NP]); await wait(40);
  let m = M(), f = F();
  check('a computed record: its name, arguments and output', m.title === 'Close Affiliate' && m.args.map(a => a.id).join() === 'northpine,bdc' && m.out.tag === true && m.computed, `${m.title} ${m.args?.map(a => a.id)}`);
  const cited = m.rows.find(r => r.cited);
  check('the cited row is the ground, the other holding row is ink, the rest grey', cited?.label === '(b)(1) affiliates' && m.rows.filter(r => r.ink).length === 2 && m.rows.some(r => !r.ink),
    m.rows.map(r => `${r.label}:${r.cited ? 'cited' : r.ink ? 'ink' : 'grey'}`).join(' '));
  check('each name in the cited row takes a colour', [...f.colors.values()].length >= 4, [...f.colors].map(([n, c]) => cited.formula.slice(n.from, n.to) + ':' + c).join(' '));
  const lev = id => f.map.get(id)?.[1];
  check('Range Finder: the BDC and Northpine are outlined', lev('bdc') !== undefined && lev('northpine') !== undefined, [...f.map.keys()].slice(0, 12).join(' '));
  check('witnesses are strong: Chen, her Director line, and the Affiliated Person line', lev('chen') === 0 && lev('pos_chen_bdc') === 0 && lev(AP_NP_CHEN) === 0, `${lev('chen')} ${lev('pos_chen_bdc')} ${lev(AP_NP_CHEN)}`);
  check('the rest of a list it reads isn’t: the chart shows the path cited', !f.map.has('raman') && !f.map.has('pos_raman_bdc') && !f.map.has('okafor'), `${lev('raman')} ${lev('pos_raman_bdc')} ${lev('okafor')}`);
  const deep = [...f.map].filter(([, x]) => x[1] === 2).map(([id]) => id);
  check('deeper reasons, lighter, down to entered records', deep.length > 3 && deep.some(id => !R().computed[id] && R().records[id]?.args), deep.slice(0, 10).join(' '));
  check('the canvas is asked to highlight', StandIn.hl.peek()?.colors?.[AP_NP_CHEN] && StandIn.hl.peek().dim);
  // One reason, for every pane that gives one: the row the bar cites, its citation and the statute's words
  const why = FormulaBar.reason(CLOSE_NP);
  check('reason(): the cited row, its citation, and its words from the Description', why?.label === cited.label && why.cite === '§57(b)(1)' && /^any person \(other than the business development company itself\)/.test(why.words ?? ''),
    JSON.stringify(why));
  check('citeOf(): a clause letter under its section', FormulaBar.citeOf('def_affiliated', '(C)') === '§2(a)(3)(C)' && FormulaBar.citeOf('def_remote', '(e)(1)(A)') === '§57(e)(1)(A)'
    && FormulaBar.citeOf('def_control', 'Presumed: more than 25% of voting securities') === '§2(a)(9), presumed', FormulaBar.citeOf('def_affiliated', '(C)'));
  check('reason() is nothing for an entered record', FormulaBar.reason('pos_chen_bdc') === null);

  // One row, whatever it shows: the chart under it never moves
  const tall = () => document.querySelector('.fxbar').offsetHeight;
  check('the bar is one row of 36 px, why said inline, never the formula', tall() === 36 && !document.querySelector('.fx-panel') && document.querySelector('.fx-inline .fx-why')
    && !document.querySelector('.fx-inline .CodeMirror') && !document.querySelector('.fx-row'), tall());

  // Hovering part of the formula, in the rows
  await openRows();
  hoverOn(cited.key, '@'); await wait(30);
  let val = document.querySelector('.fx-val');
  check('hovering @ shows its value here, just after it', val?.textContent === 'Margaret A. Chen', val?.textContent);
  hoverOn(cited.key, 'Personnel'); await wait(30);
  val = document.querySelector('.fx-val');
  check('hovering a list shows its items', /Chen/.test(val?.textContent) && /Raman/.test(val?.textContent), val?.textContent);
  check('what the hovered part means pulses on the chart, the whole list', (StandIn.hl.peek()?.pulse ?? []).includes('pos_raman_bdc') && StandIn.hl.peek().colors.pos_raman_bdc?.[1] === 0);
  FormulaBar.hover.value = null; await wait(10);
  check('… and leaving it, the path again', !StandIn.hl.peek()?.colors.pos_raman_bdc);
  document.querySelector('.fx-open').click(); await wait(30);
  // A sentence too long for the row is cut short, never swapped for the formula
  Shell.select(['fx:controlled=halvard&controller=chen']); await wait(60);
  const cut = document.querySelector('.fx-inline > .fx-why');

  FormulaBar.hover.value = null;

  // Overrides
  await saidOf(['bdc_tax']);
  m = M();
  check('an entered value under a formula shows both, with the amber corner', m.covered && document.querySelector('.fx-out.over') && document.querySelector('.fx-would')?.textContent === 'C Corporation', document.querySelector('.fx-would')?.textContent);
  check('… and says what the rows would give, and why', said() === 'The BDC is a corporation, so its tax classification would be C Corporation.', said());
  check('a value’s place is its object, without the path down to it, where it has one of its kind', M().place === 'The BDC' && (Shell.select(['fx:form pf due=mgmt_pf']), await wait(40), M().place === 'The Manager'), M().place);
  // … and the path where the object has two: a tax paid at its jurisdiction, and one at its entity type
  Shell.select(['blocker_juris_frtax']); await wait(40);
  const once = M().place;
  App.change(tx => tx.add('record', { at: 'blocker_type', edge: 'Franchise Tax Paid', field: 'date', value: '2026-01-02' })); await wait(40);
  check('… and the path down to it where the object has two of its kind', once === 'Fund III Blocker' && M().place === 'Fund III Blocker › Jurisdiction: Delaware', `${once} | ${M().place}`);
  Shell.parts.peek().undo.undo(); await wait(40);
  // One place rule, the core's (Notes.placed), which the bar draws piece by piece: two sides as their line
  // joins them; three as the panel's sentence says them, less its verb; a side named by a number with its kind
  const placeShown = async key => { Shell.select([key]); await wait(40); return document.querySelector('.fxbar .fx-args')?.textContent; };
  const SA = 'David R. Okafor for Fund III, via GP III', TAX = 'fx:tax year=mvpcpcot90r36y&taxpayer=fund_juris';
  check('the place rule: a relation of three sides as the panel says it, less its verb, and an entry at it there too', await placeShown('sign_okfr_fund') === SA
    && App.notes.peek().segmentOf(R().records, 'sign_okfr_fund') === SA && await placeShown('fx:capacity held=sign_okfr_fund') === SA, `${await placeShown('sign_okfr_fund')} | ${await placeShown('fx:capacity held=sign_okfr_fund')}`);
  check('… one of two as its line joins them, and a side named by a number with its kind', await placeShown(CLOSE_NP) === App.notes.peek().segmentOf(R().records, CLOSE_NP)
    && / → /.test(await placeShown(CLOSE_NP)) && await placeShown(TAX) === 'Fund III, tax year 2026', `${await placeShown(CLOSE_NP)} | ${await placeShown(TAX)}`);
  // A long name ends in an ellipsis, and says itself whole on hover; the bar keeps to its row
  const nameAt = o => Object.keys(App.entered.peek()).find(k => App.entered.peek()[k].at === o && App.entered.peek()[k].edge === 'Name');
  const LONG = 'Northpine Software Holdings, a limited liability company organized and existing under the laws of the State of Delaware, together with its successors and permitted assigns, and any affiliate registered as a foreign company in the Cayman Islands';
  App.change(tx => tx.set(nameAt('northpine'), { ...App.entered.peek()[nameAt('northpine')], value: LONG })); await wait(40);
  Shell.select(['northpine']); await wait(40);
  const nm = document.querySelector('.fxbar .fx-name'), bar = document.querySelector('.fxbar');
  nm.dispatchEvent(new PointerEvent('pointerenter'));
  check('a long name in the bar ends in an ellipsis, whole on hover, and the bar keeps to its row', nm.scrollWidth > nm.clientWidth && getComputedStyle(nm).textOverflow === 'ellipsis'
    && nm.title === LONG && bar.scrollWidth <= bar.clientWidth, `${nm.scrollWidth} ${nm.clientWidth} ${bar.scrollWidth} ${bar.clientWidth} ${nm.title.length}`);
  Shell.select(['own_fund_npine']); await wait(40);
  const args = document.querySelector('.fxbar .fx-args');
  args.dispatchEvent(new PointerEvent('pointerenter'));
  check('… and so does a place cut short, by its sides’ names', args.scrollWidth > args.clientWidth && args.title === `${App.notes.peek().nameOf(R().records, 'fund')} → ${LONG}`
    && document.querySelector('.fxbar').scrollWidth <= document.querySelector('.fxbar').clientWidth, args.title);
  Shell.parts.peek().undo.undo(); await wait(40);
  Shell.select(['bdc']); await wait(40);
  document.querySelector('.fxbar .fx-name').dispatchEvent(new PointerEvent('pointerenter'));
  check('… and a name that fits says nothing more on hover', !document.querySelector('.fxbar .fx-name').title, document.querySelector('.fxbar .fx-name').title);

  // The redline: hovering a tag
  Shell.select([OKAFOR_GP]); await wait(40);
  let t0 = performance.now();
  document.querySelector('.fx-out .tag').dispatchEvent(new PointerEvent('pointerenter')); await wait(10);
  const ms = performance.now() - t0;
  let p = FormulaBar.pending.peek();
  // Rebutting Okafor's presumed control of GP III takes his control of the eleven it reaches through GP III.
  check('hovering a tag previews ruling it out, in words: Control: 11 fewer', p?.deltas.find(d => d.name === 'Control')?.minus === 11 && /Control: 11 fewer/.test(document.querySelector('.fx-delta')?.textContent ?? ''), document.querySelector('.fx-delta')?.textContent);
  check('the canvas is asked to redline', StandIn.rl.peek()?.go?.length === p?.diff.go.length && p.diff.go.length >= 11, `${StandIn.rl.peek()?.go?.length} of ${p?.diff.go.length}`);
  check(`the preview is fast enough per keystroke (${ms.toFixed(0)} ms, the engine ${R().ms.toFixed(0)} ms)`, ms < 120, `${ms.toFixed(0)} ms`);
  document.querySelector('.fx-out .tag').dispatchEvent(new PointerEvent('pointerleave')); await wait(10);
  check('leaving it ends the preview', !FormulaBar.pending.peek() && !StandIn.rl.peek());
  // Keys on the tag are a checkbox's, as in the inspector: reached by the keys, it redlines as when pointed at;
  // Enter goes on, back to the view, overriding nothing; Space, which clicks it, makes the change on screen
  const keyTag = document.querySelector('.fx-out .tag'), v1 = App.version.peek();
  keyTag.focus(); await wait(10);
  const keyed = FormulaBar.pending.peek()?.from === 'tag' && keyTag.classList.contains('pend') && FormulaBar.pending.peek().change.records['fx-pending']?.tag === false;
  keyTag.dispatchEvent(new KeyboardEvent('keydown', { key: 'Enter', bubbles: true, cancelable: true })); await wait(10);
  check('the tag reached by the keys redlines as pointed at; Enter goes on to the view, overriding nothing', keyed && App.version.peek() === v1 && document.activeElement?.id === 'view'
    && !FormulaBar.pending.peek() && R().records[OKAFOR_GP]?.tag === true, `${keyed} ${document.activeElement?.id} ${JSON.stringify(FormulaBar.pending.peek()?.from)}`);
  keyTag.focus(); await wait(10);
  const shown = FormulaBar.pending.peek()?.change.records['fx-pending'];
  keyTag.click(); await wait(20);
  check('… and Space, which clicks it, makes the change it showed', !!shown && App.version.peek() === v1 + 1 && !FormulaBar.pending.peek()
    && Object.values(App.entered.peek()).some(r => r.tag === false && JSON.stringify(r.args) === JSON.stringify(shown.args)), JSON.stringify(shown));
  Shell.parts.peek().undo.undo(); await wait(30);
  Shell.select([]); Shell.select([OKAFOR_GP]); await wait(40);
  // A big chart waits for a pause in typing, never in hovering: each preview here made to seem slow
  const clock = performance.now, tagBox = document.querySelector('.fx-out .tag');
  let skew = 0;
  performance.now = () => clock.call(performance) + (skew += 50);
  for (const k of [1, 2]) { tagBox.dispatchEvent(new PointerEvent('pointerenter')); if (k === 1) tagBox.dispatchEvent(new PointerEvent('pointerleave')); }
  const hoveredAgain = FormulaBar.pending.peek()?.from === 'tag';
  tagBox.dispatchEvent(new PointerEvent('pointerleave')); await wait(10);
  Shell.select(['own_okfr_gp_pct']); await wait(40);
  const input = document.querySelector('.fx-value'), typed = () => FormulaBar.pending.peek()?.change.records['own_okfr_gp_pct']?.value;
  input.value = '20%'; input.dispatchEvent(new Event('input', { bubbles: true }));
  const first = typed();
  input.value = '30%'; input.dispatchEvent(new Event('input', { bubbles: true }));
  const second = typed();
  await wait(350);
  check('a big chart previews a hover again at once, and the first key; later keys wait for a pause', hoveredAgain && first === 0.2 && second === 0.2 && typed() === 0.3, `${hoveredAgain} ${first} ${second} ${typed()}`);
  performance.now = clock;
  input.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', bubbles: true })); await wait(10);

  // Typing a value
  input.value = '20%'; input.dispatchEvent(new Event('input', { bubbles: true })); await wait(10);
  p = FormulaBar.pending.peek();
  check('typing a value previews its redline: Okafor loses control of GP III, and of what he controlled through it', p?.deltas.find(d => d.name === 'Control')?.minus >= 5 && p.diff.go.includes(OKAFOR_GP) && p.diff.change.includes('own_okfr_gp_pct'), JSON.stringify(p?.deltas));
  check('and a changed value reads ~~50%~~ 20%', StandIn.rl.peek()?.changed?.own_okfr_gp_pct?.before === '50%' && StandIn.rl.peek().changed.own_okfr_gp_pct.after === '20%');
  input.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', bubbles: true })); await wait(10);
  check('Esc discards it', !FormulaBar.pending.peek() && App.entered.peek().own_okfr_gp_pct.value === 0.5);

  // Typing a formula, then Enter
  Shell.select([OKAFOR_GP]); await wait(40); await openRows();
  typeIn('r2', '> ', '6', 1); await wait(20);
  p = FormulaBar.pending.peek();
  check('typing a formula previews it: 65% rules out Okafor’s half of GP III', p?.from === 'bar' && p.deltas.find(d => d.name === 'Control')?.minus >= 5, JSON.stringify(p?.deltas));
  check('Done and Discard show while it is pending', [...document.querySelectorAll('.fxbar .fx-acts .btn')].map(b => b.textContent).join() === 'Discard,Done');
  check('the row being edited is a field, what was typed redlined', document.querySelector('.fx-row.editing .CodeMirror .add')?.textContent === '6' && document.querySelector('.fx-row.editing .CodeMirror .del')?.textContent === '2',
    document.querySelector('.fx-row.editing')?.textContent);
  const v0 = App.version.peek();
  FormulaBar.commitEdit(); await wait(30);
  const row = App.notes.peek().notes('Formula').find(n => n.note === 'def_control').value[2].formula;
  check('Enter commits it as one change', App.version.peek() === v0 + 1 && /> 65%/.test(row) && !R().records[OKAFOR_GP], row);
  Shell.parts.peek().undo.undo(); await wait(30);
  check('and Undo takes it back', /> 25%/.test(App.notes.peek().notes('Formula').find(n => n.note === 'def_control').value[2].formula) && R().records[OKAFOR_GP]);

  // Deleting a row
  Shell.select([OKAFOR_GP]); await wait(40); await openRows();
  check('every row in order', document.querySelectorAll('.fxbar .fx-row').length === 4);
  document.querySelector('.fxbar [data-key="r3"] .fx-x')?.dispatchEvent(new PointerEvent('pointerenter')); await wait(10);
  p = FormulaBar.pending.peek();
  check('hovering a row’s delete previews what goes', p?.deltas.find(d => d.name === 'Control')?.minus > 0, JSON.stringify(p?.deltas));
  document.querySelector('.fxbar [data-key="r3"] .fx-x')?.dispatchEvent(new PointerEvent('pointerleave')); await wait(10);
  check('and leaving it, nothing', !FormulaBar.pending.peek());

  // Completion and squiggles
  check('completion comes from suggest()', Formulas.suggest('← Controlled.Ow', 15, { computed: R(), def: 'def_control', at: OKAFOR_GP }).list.some(x => x.name === 'Owners'));
  typeIn('r2', '> 25%', ' AND Bogus'); await wait(250);
  check('squiggles come from check()', document.querySelector('.fxbar .CodeMirror-lint-mark-error'), document.querySelector('.fxbar .CodeMirror-lint-mark-error')?.textContent);
  FormulaBar.discard(); await wait(20);
  // An unfinished row: squiggled where it runs out, Done and Discard, and Enter says why
  typeIn('r2', '> 25%', ' AND ((( SUM('); await wait(250);
  const end = [...document.querySelectorAll('.fx-row.editing .CodeMirror-lint-mark-error')].at(-1);
  check('an unfinished row is squiggled at its end', end?.textContent === '(', end?.textContent);
  check('… with Discard and Done, though nothing can be previewed yet', [...document.querySelectorAll('.fxbar .fx-acts .btn')].map(b => b.textContent).join() === 'Discard,Done');
  FormulaBar.commitEdit(); await wait(20);
  const why2 = document.querySelector('.fx-row.editing .fx-problem')?.textContent;
  check('… and Enter says why, under the row, and makes nothing', why2 === Formulas.check(cmOf('r2').getValue()).problems[0]?.message && FormulaBar.draft.peek() && /SUM\($/.test(App.definitions.peek().find(d => d.id === 'def_control').rows[2].formula) === false, why2);
  check('while a row is edited, the panel holds just it, so the chart it points at stays in view',
    document.querySelector('.fx-panel.editing') && [...document.querySelectorAll('.fx-panel .fx-row')].filter(r => r.offsetHeight).length === 1 && !document.querySelector('.fx-said')?.offsetHeight);
  FormulaBar.discard(); await wait(20);
  check('Discard ends it, the rows all back', !document.querySelector('.fx-problem') && [...document.querySelectorAll('.fx-panel .fx-row')].filter(r => r.offsetHeight).length === 4);

  // Point mode
  typeIn('r2', '> 25%', ' AND '); await wait(20);
  FormulaBar.point('own_okfr_gp'); await wait(40);
  const reached = FormulaBar.reaching('own_okfr_gp', M());
  check('point mode: a click on a line offers the names that reach it', reached.includes('Ownership(Controller, Controlled)') && reached.some(x => /Owners|Holdings/.test(x)), reached.join(' | '));
  check('while a row is edited, the chart is in point mode, and a record clicked offers its names', StandIn.pointing === true && !!document.querySelector('.CodeMirror-hints'));
  // A real click on the chart gives the chart focus after its mousedown; the names offered stay.
  const chart = Object.assign(document.createElement('div'), { tabIndex: 0 });
  document.body.append(chart);
  FormulaBar.point('okafor'); chart.focus(); await wait(160);
  check('… even once the click has given the chart focus', !!document.querySelector('.CodeMirror-hints') && document.activeElement?.closest?.('.CodeMirror'), document.activeElement?.className);
  chart.remove();
  FormulaBar.discard(); await wait(20);
  check('Esc discards an edit', !FormulaBar.draft.peek() && !FormulaBar.pending.peek());

  // A definition in general: its own screen is the inspector's; the bar edits its rows
  Shell.select([AP_NP_CHEN]); await wait(60);
  document.querySelector('.fxbar .fx-name').click(); await wait(60); await openRows();
  const general = Shell.pattern(Shell.selection.peek()[0]);
  check('the name opens the definition in general', JSON.stringify(general) === JSON.stringify(App.notes.peek().notes('Formula').find(n => n.note === 'def_affiliated').pattern), Shell.selection.peek()[0]);
  check('… where the bar shows every row, to edit', M()?.general && document.querySelectorAll('.fxbar .fx-row').length === App.notes.peek().notes('Formula').find(n => n.note === 'def_affiliated').value.length
    && !!document.querySelector('.fxbar .fx-label[aria-label="Label"]'), document.querySelectorAll('.fxbar .fx-row').length);
  check('Used by, from the engine’s plan', /Close Affiliate/.test(document.querySelector('.fxbar .fx-used')?.textContent), document.querySelector('.fxbar .fx-used')?.textContent);
  FormulaBar.light(['bdc']); await wait(10);
  check('a clause pointed at lights what it gives', Object.keys(StandIn.hl.peek()?.colors ?? {}).join() === 'bdc');
  FormulaBar.light(null); await wait(10);

  // #CIRCULAR!
  const e = makeLoop(); await wait(30);
  Shell.select([e.id]); await wait(40); await openRows();
  m = M(); f = F();
  check('#CIRCULAR!: the loop outlined in red', m.out.error?.code === '#CIRCULAR!' && [...f.map.values()].some(x => x[0] === 'loop') && f.map.has('blocker'), [...f.map].map(([id, x]) => id + ':' + x[0]).join(' '));
  check('and the name that closes it underlined', document.querySelector('.fxbar .fx-loop'), document.querySelector('.fxbar .fx-loop')?.textContent);

  // Ctrl+Shift+U, Excel's expand: the rows closed, and open again
  const expand = () => window.dispatchEvent(new KeyboardEvent('keydown', { key: 'U', code: 'KeyU', ctrlKey: true, shiftKey: true }));
  expand(); await wait(20);
  const shut = !document.querySelector('.fx-panel');
  expand(); await wait(20);
  check('Ctrl+Shift+U collapses the rows and expands them again', shut && !!document.querySelector('.fx-panel') && tall() === 36);

  // Find's =
  const ev = Shell.parts.peek().evaluate;
  const r1 = ev('=Controlled.Owners', [OKAFOR_GP]), r2 = ev('=SUM(Controlled.Owners.Percentage)', [OKAFOR_GP]);
  check('Find’s = works a formula out at the selection', r1.items?.length >= 2 && /%$/.test(r2.value ?? ''), `${r1.items?.map(x => x.label).join(', ')} | ${r2.value}`);
}

(async () => {
  await ready();
  try {
    if (q.has('checks')) await checks();
    else if (q.get('case')) await cases[q.get('case')]?.();
  } catch (e) { results.push({ name: 'threw', ok: false, detail: e.stack }); }
  if (q.has('checks') || results.length) {
    const out = document.getElementById('out');
    out.hidden = false;
    const failed = results.filter(r => !r.ok).length;
    out.innerHTML = `${results.length - failed}/${results.length} passed\n` + results.map(r => `<span class="${r.ok ? '' : 'fail'}">${r.ok ? 'ok  ' : 'FAIL'} ${r.name}${r.detail && !r.ok ? '\n     ' + r.detail.replace(/</g, '&lt;') : ''}</span>`).join('\n');
  }
})();
</script>

<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Dendra text test</title>
<pre id="out">Running…</pre>
<script src="../core/text.js"></script>
<script>
const out = [];
const check = (name, ok) => out.push({ name, ok: !!ok });
const read = name => ({ Name: 'Alice', Title: 'Director', Empty: '', Braces: '{Title}' })[name];
const T = TextTemplate;
for (const literal of ['Name', 'Alice', 'A  B\tC\n\nD ', '{Name}', '={Name}', 'C:\\Files\\{Name}', '\\', '<script>alert(1)</' + 'script>']) {
  check(`literal round trip: ${JSON.stringify(literal)}`, T.render(T.literal(literal), read) === literal && !T.fields(T.literal(literal)).length && !T.formula(T.literal(literal)));
}
check('legacy fields still read', T.render('Hello {Name}: {Title}', read) === 'Hello Alice: Director');
check('unknown fields read as empty', T.render('A{Missing}B{Empty}C', read) === 'ABC');
check('field values are never interpreted as more fields', T.render('{Braces}', read) === '{Title}');
check('mixed literal braces and fields', T.render(T.literal('{Name}: ') + T.field('Name'), read) === '{Name}: Alice');
check('spaces and paragraphs stay as typed', T.render('  {Name}  \n\n {Title}\t', read) === '  Alice  \n\n Director\t');
check('field paths and modifiers stay intact', JSON.stringify(T.parts("{Owner's Name|initials}")) === JSON.stringify([{ field: "Owner's Name|initials" }]));
check('fields omit modifiers', T.fields('{Name|initials} {Title}').join() === 'Name,Title');
check('formula strings do not claim text fields', T.formula(' ="{Name}"') && !T.fields(' ="{Name}"').length);
check('single field ignores surrounding whitespace', T.single(' {Name|initials} ') === 'Name|initials');
check('literal braces are never a single field', T.single(T.literal('{Name}')) === null);
check('mixed text is not a single field', T.single('Hello {Name}') === null && T.single('{Name}{Title}') === null);
check('drop preserves an existing field', T.append('{Title}', 'Name') === '{Title}\n{Name}');
check('drop preserves literal text exactly', T.append('Name  ', 'Title') === 'Name  \n{Title}');
check('drop on an empty part adds one field', T.append('', 'Title') === '{Title}');
check('drop respects an existing paragraph break', T.append('Name\n', 'Title') === 'Name\n{Title}');
const same = (a, b) => JSON.stringify(a) === JSON.stringify(b), bold = [{ from: 6, to: 11, Bold: true }];
check('run offsets decode escapes but retain explicit field spellings', T.characters(T.literal('={literal}\\ ') + '{Name}') === '={literal}\\ {Name}');
check('unchanged text keeps its runs', T.editRuns('Hello world', 'Hello world', bold) === bold);
check('inserting before a styled word shifts its range', same(T.editRuns('Hello world', 'New Hello world', bold), [{ from: 10, to: 15, Bold: true }]));
check('deleting before a styled word shifts its range back', same(T.editRuns('Hello world', 'world', bold), [{ from: 0, to: 5, Bold: true }]));
check('replacement characters do not inherit stale formatting', same(T.editRuns('Hello world', 'Hello Earth', bold), []));
check('inserting inside a run leaves new text unformatted', same(T.editRuns('Hello world', 'Hello wo--rld', bold), [{ from: 6, to: 8, Bold: true }, { from: 10, to: 13, Bold: true }]));
check('deleting through a run joins its retained characters', same(T.editRuns('Hello world', 'Hello wld', bold), [{ from: 6, to: 9, Bold: true }]));
check('editing literal escapes uses character offsets', same(T.editRuns(T.literal('{A} world'), T.literal('{Long} world'), [{ from: 4, to: 9, Italic: true }]), [{ from: 7, to: 12, Italic: true }]));
check('replacing a chip shifts following literal formatting', same(T.editRuns('{Name} world', '{Department} world', [{ from: 7, to: 12, Bold: true }]), [{ from: 13, to: 18, Bold: true }]));
const first = T.editRuns('Hello world', 'New Hello world', bold), second = T.editRuns('New Hello world', 'New Hello world!', first);
check('separate edits preserve the formatted text between them', same(second, [{ from: 10, to: 15, Bold: true }]));
check('run mapping never changes its input', same(bold, [{ from: 6, to: 11, Bold: true }]));
const repeated = '{Name} echo echo  ', selected = [{ from: 12, to: 18, Bold: true }];
for (const name of ['Al', 'Alexandra the Great', 'echo', '']) {
  const shown = T.renderRuns(repeated, () => name, selected), from = name.length + 6;
  check('projection keeps the second repeated word for ' + JSON.stringify(name), shown.text === name + ' echo echo  ' && same(shown.runs, [{ from, to: from + 6, Bold: true }]));
}
check('a whole-token style covers the entire replacement', same(T.renderRuns('A{Name}Z', () => 'Long name', [{ from: 1, to: 7, Italic: true }]).runs, [{ from: 1, to: 10, Italic: true }]));
check('a partial-token style does not style replacement characters', !T.renderRuns('A{Name}Z', () => 'Long name', [{ from: 2, to: 6, Italic: true }]).runs.length);
check('a style spanning a token keeps both literals and its full value', same(T.renderRuns('A{Name}Z', () => 'Long name', [{ from: 0, to: 8, Bold: true }]).runs, [{ from: 0, to: 11, Bold: true }]));
check('empty substitutions close the gap between matching ranges', same(T.renderRuns('A{Name}Z', () => '', [{ from: 0, to: 8, Bold: true }]).runs, [{ from: 0, to: 2, Bold: true }]));
check('projection uses decoded literal offsets', same(T.renderRuns(T.literal('{literal}\\ ') + '{Name} tail', () => 'Al', [{ from: 18, to: 22, Bold: true }]).runs, [{ from: 14, to: 18, Bold: true }]));
let reads = 0;
T.renderRuns('{Name}', () => { reads++; return '{Other}'; }, [{ from: 0, to: 6, Bold: true }]);
check('a token is read once and replacement text is never parsed again', reads === 1);
check('projection leaves source runs untouched', same(selected, [{ from: 12, to: 18, Bold: true }]));
const failed = out.filter(c => !c.ok);
document.title = `text test: ${out.length - failed.length} pass, ${failed.length} fail`;
document.getElementById('out').textContent = [`${out.length - failed.length} passed, ${failed.length} failed`, ...out.map(c => `${c.ok ? 'pass' : 'FAIL'} ${c.name}`)].join('\n');
</script>
</html>

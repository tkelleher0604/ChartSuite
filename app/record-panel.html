<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rboreal</title>
<script>
// The record panel on its own has given way to the app's pages. Its addresses go where they live now: a
// record to its page, a kind to its table, the schema and definitions to the Schema, Deleted to the
// chart's panel, and everything else to Records.
(() => {
  const hash = location.hash.slice(1);
  let h = hash;
  try { h = decodeURIComponent(hash); } catch {}
  const to = !h ? 'records.html'
    : h.startsWith('kind:') ? `records.html#${encodeURIComponent(h.slice(5))}`
    : /^(schema|formulas|definition:|formula:)/.test(h) ? `schema.html#${hash}`
    : h === 'deleted' ? 'chart.html#deleted'
    : `record.html#${hash}`;
  location.replace(to);
})();
</script>
</head>
<body>
<p>The record panel is now part of each record's page. <a href="records.html">Go to Records</a>.</p>
</body>
</html>

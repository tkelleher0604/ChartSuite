<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chart · Rboreal</title>
<script src="ui/prepaint.js"></script>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/shell.css">
<link rel="stylesheet" href="css/panel.css">
<link rel="stylesheet" href="css/chart.css">
</head>
<body>
<div class="chart-page">
  <nav class="ribbon" id="ribbon" aria-label="Ribbon"></nav>
  <div class="workspace" id="workspace">
    <div class="canvas">
      <section class="stage" id="stage" aria-label="Chart">
        <div class="sheet-sizer" id="sizer">
          <div class="sheet" id="sheet">
            <svg class="wires" id="wires" xmlns="http://www.w3.org/2000/svg"></svg>
            <div class="nodes" id="nodes"></div>
            <svg class="overlay" id="overlay" xmlns="http://www.w3.org/2000/svg"></svg>
          </div>
          <div id="quick"></div>
        </div>
      </section>
      <div class="canvas-top" id="lock"></div>
      <div class="canvas-empty" id="empty"></div>
      <div class="present-caption" id="caption" aria-live="polite"></div>
      <footer class="canvas-bar" id="status"></footer>
    </div>
    <div class="resizer" id="resizer" role="separator" aria-orientation="vertical" aria-label="Resize the record panel" title="Drag to resize"></div>
    <aside class="panel side-panel" id="panel" aria-label="Record panel"></aside>
  </div>
  <div id="export"></div>
</div>

<script src="core/common.js"></script>
<script src="core/model.js"></script>
<script src="core/sample.js"></script>
<script src="core/formulas.js"></script>
<script src="core/styles.js"></script>
<script src="../vendor/msal/msal-browser.min.js"></script>
<script src="core/sharepoint.js"></script>
<script src="core/store.js"></script>
<script src="ui/shell.js"></script>
<script src="ui/parts.js"></script>
<script src="ui/panel.js"></script>
<script src="ui/relate.js"></script>
<script src="ui/ribbon.js"></script>
<script src="ui/export.js"></script>
<script src="ui/chart.js"></script>
</body>
</html>
